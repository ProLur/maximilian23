<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro • Juego del Silencio (Privado)</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <style>
    body {
      font-family: "Courier New", Courier, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100dvh;
      background-image:
        radial-gradient(circle at 25% 15%, rgba(0,255,204,0.08) 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, rgba(0,255,204,0.06) 0%, transparent 50%);
      background-attachment: fixed;
    }
    header {
      background: rgba(22,27,34,0.92);
      backdrop-filter: blur(8px);
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header img {
      height: 45px;
      border-radius: 50%;
      border: 2px solid #00ffcc88;
      box-shadow: 0 0 12px #00ffcc55;
    }
    header h1 {
      font-size: 1.7rem;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffccaa;
    }
    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .classification {
      background: rgba(30,45,61,0.35);
      border: 2px solid #00ffcc55;
      border-radius: 14px;
      padding: 1.8rem;
      backdrop-filter: blur(6px);
      overflow-x: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      margin-bottom: 2rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(13,17,23,0.85);
      border: 3px solid #00ffcc;
      border-radius: 12px;
      overflow: hidden;
      min-width: 1100px;
    }
    th {
      background: linear-gradient(#00ffcc22, transparent);
      color: #00ffcc;
      padding: 14px 10px;
      font-size: 1.15rem;
      border-bottom: 3px solid #00ffcc66;
      white-space: nowrap;
      transition: all 0.2s;
    }
    th.semana-pasada {
      color: #ff5555 !important;
      background: linear-gradient(#ff444422, transparent) !important;
      text-shadow: 0 0 7px #ff444488 !important;
    }
    td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #00ffcc33;
    }
    .team-name {
      text-align: left;
      padding-left: 2rem;
      color: #00ffcc;
      font-size: 1.35rem;
      font-weight: bold;
      min-width: 140px;
    }
    .total-cell {
      background: rgba(0,255,204,0.22) !important;
      color: #00ffcc;
      font-size: 1.5rem;
      font-weight: bold;
      border-left: 3px solid #00ffcc;
      min-width: 100px;
    }
    select {
      background: #161b22;
      color: #e6edf3;
      border: 2px solid #00ffcc66;
      border-radius: 8px;
      padding: 6px 4px;
      font-size: 1.1rem;
      width: 100%;
      text-align: center;
      min-width: 60px;
      transition: border-color 0.2s;
    }
    select.past-week {
      border-color: #ff555588;
      background: #2a1a1a;
    }
    .btn-guardar {
      display: block;
      margin: 2rem auto;
      padding: 1rem 4rem;
      background: rgba(0,255,204,0.2);
      color: #00ffcc;
      border: 3px solid #00ffcc;
      border-radius: 999px;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-guardar:hover {
      background: rgba(0,255,204,0.35);
      transform: scale(1.05);
    }
    @media (max-width: 600px) {
      th, td { padding: 8px; font-size: 0.95rem; }
      .team-name { padding-left: 1.2rem; font-size: 1.15rem; }
      select { font-size: 1rem; padding: 5px; }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Logo">
    <h1>Registro Privado • Juego del Silencio</h1>
  </header>
  <div class="container">
    <div class="classification">
      <table>
        <thead>
          <tr>
            <th>Equipo</th>
            <th class="week-header" data-week="1">S1</th>
            <th class="week-header" data-week="2">S2</th>
            <th class="week-header" data-week="3">S3</th>
            <th class="week-header" data-week="4">S4</th>
            <th class="week-header" data-week="5">S5</th>
            <th class="week-header" data-week="6">S6</th>
            <th class="week-header" data-week="7">S7</th>
            <th class="week-header" data-week="8">S8</th>
            <th class="week-header" data-week="9">S9</th>
            <th class="week-header" data-week="10">S10</th>
            <th>TOTAL</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <button class="btn-guardar" onclick="guardarDatos()">GUARDAR</button>
  </div>

  <script>
    const STORAGE_URL = 'https://api.jsonbin.io/v3/b/699588baae596e708f33e153';
    const MASTER_KEY = '$2a$10$Z4/lj4bJs4gRcw67snP9zewPYv9rbqaXFeGKdX07gqvA0ucBoTgVy';

    const teams = ["3º A", "3º B", "4º A", "4º B"];
    let scores = {
      "3º A": Array(10).fill(0),
      "3º B": Array(10).fill(0),
      "4º A": Array(10).fill(0),
      "4º B": Array(10).fill(0)
    };

    // Fecha de inicio (importante: mes 1 = febrero)
    const FECHA_INICIO = new Date(2026, 1, 16); // 16 feb 2026

    function calcularSemanaActual() {
      const hoy = new Date();
      const diffMs = hoy - FECHA_INICIO;
      const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const semanasCompletas = Math.floor(diffDias / 7);
      return Math.min(semanasCompletas + 1, 10);
    }

    async function loadData() {
      try {
        const res = await fetch(STORAGE_URL, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          const loaded = data.record.scores;
          if (loaded) {
            Object.keys(loaded).forEach(team => {
              if (teams.includes(team)) {
                scores[team] = [
                  ...loaded[team].slice(0,10),
                  ...Array(10).fill(0)
                ].slice(0,10);
              }
            });
          }
        }
      } catch (e) {
        console.error('Error al cargar:', e);
      }
    }

    function renderEditableTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      const semanaActual = calcularSemanaActual();

      // Resaltar headers de semanas pasadas
      document.querySelectorAll('.week-header').forEach(th => {
        const weekNum = parseInt(th.dataset.week);
        th.classList.toggle('semana-pasada', weekNum < semanaActual);
      });

      teams.forEach(team => {
        const row = document.createElement('tr');
        let html = `<td class="team-name">${team}</td>`;

        for (let w = 0; w < 10; w++) {
          const weekNum = w + 1;
          const isPast = weekNum < semanaActual;
          const selectHTML = `
            <select data-team="${team}" data-week="${w}" 
                    class="${isPast ? 'past-week' : ''}"
                    data-original="${scores[team][w]}">
              ${Array.from({length:11},(_,i) => 
                `<option value="${i}" ${scores[team][w]===i ? 'selected' : ''}>${i}</option>`
              ).join('')}
            </select>`;
          html += `<td>${selectHTML}</td>`;
        }

        const total = scores[team].reduce((a,b) => a + b, 0);
        html += `<td class="total-cell">${total}</td>`;
        row.innerHTML = html;
        tbody.appendChild(row);
      });

      // Listener para aviso en semanas pasadas
      document.querySelectorAll('select.past-week').forEach(sel => {
        sel.addEventListener('change', function(e) {
          const original = parseInt(this.dataset.original);
          const nuevo = parseInt(this.value);
          if (nuevo !== original) {
            const confirmed = confirm(
              `¡ATENCIÓN!\nEstás modificando la Semana ${parseInt(this.dataset.week)+1}, que YA HA PASADO.\n\n` +
              `Valor original: ${original}\nNuevo valor: ${nuevo}\n\n` +
              `¿Confirmas el cambio? (Solo hazlo si es una corrección autorizada)`
            );
            if (!confirmed) {
              this.value = original; // revierte
            } else {
              // Actualiza el original por si cambian varias veces
              this.dataset.original = nuevo;
            }
          }
        });
      });
    }

    async function guardarDatos() {
      document.querySelectorAll('select').forEach(sel => {
        const team = sel.dataset.team;
        const week = parseInt(sel.dataset.week);
        scores[team][week] = parseInt(sel.value) || 0;
      });

      try {
        const res = await fetch(STORAGE_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': MASTER_KEY
          },
          body: JSON.stringify({ 
            scores,
            lastUpdate: new Date().toISOString() 
          })
        });

        if (res.ok) {
          alert('¡Guardado correctamente!\n\nRecargando la tabla...');
          await loadData();
          renderEditableTable();
        } else {
          alert(`Error al guardar: ${res.status}\n${await res.text()}`);
        }
      } catch (e) {
        alert('Error de conexión: ' + e.message);
      }
    }

    window.onload = async () => {
      await loadData();
      renderEditableTable();
    };
  </script>
</body>
</html>
