<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro • Juego del Silencio (Privado)</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <style>
    body {
      font-family: "Courier New", Courier, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100dvh;
      background-image:
        radial-gradient(circle at 25% 15%, rgba(0,255,204,0.08) 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, rgba(0,255,204,0.06) 0%, transparent 50%);
      background-attachment: fixed;
    }
    header {
      background: rgba(22,27,34,0.92);
      backdrop-filter: blur(8px);
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header img {
      height: 45px;
      border-radius: 50%;
      border: 2px solid #00ffcc88;
      box-shadow: 0 0 12px #00ffcc55;
    }
    header h1 {
      font-size: 1.7rem;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffccaa;
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .classification {
      background: rgba(30,45,61,0.35);
      border: 2px solid #00ffcc55;
      border-radius: 14px;
      padding: 2rem;
      backdrop-filter: blur(6px);
      overflow-x: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(13,17,23,0.85);
      border: 3px solid #00ffcc;
      border-radius: 12px;
      overflow: hidden;
      min-width: 900px;
    }
    th {
      background: linear-gradient(#00ffcc22, transparent);
      color: #00ffcc;
      padding: 16px 12px;
      font-size: 1.2rem;
      border-bottom: 3px solid #00ffcc66;
    }
    td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #00ffcc33;
    }
    .team-name {
      text-align: left;
      padding-left: 2rem;
      color: #00ffcc;
      font-size: 1.35rem;
      font-weight: bold;
    }
    .total-cell {
      background: rgba(0,255,204,0.22) !important;
      color: #00ffcc;
      font-size: 1.5rem;
      font-weight: bold;
      border-left: 3px solid #00ffcc;
    }
    select {
      background: #161b22;
      color: #e6edf3;
      border: 2px solid #00ffcc66;
      border-radius: 8px;
      padding: 8px;
      font-size: 1.1rem;
      width: 100%;
      text-align: center;
    }
    .btn-guardar {
      display: block;
      margin: 2rem auto;
      padding: 1rem 4rem;
      background: rgba(0,255,204,0.2);
      color: #00ffcc;
      border: 3px solid #00ffcc;
      border-radius: 999px;
      font-size: 1.4rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-guardar:hover {
      background: rgba(0,255,204,0.35);
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Logo">
    <h1>Registro Privado • Juego del Silencio</h1>
  </header>

  <div class="container">
    <div class="classification">
      <table>
        <thead>
          <tr>
            <th>Equipo</th>
            <th>Semana 1</th>
            <th>Semana 2</th>
            <th>Semana 3</th>
            <th>Semana 4</th>
            <th>Semana 5</th>
            <th>Semana 6</th>
            <th>TOTAL</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>

    <button class="btn-guardar" onclick="guardarDatos()">GUARDAR</button>
  </div>

  <script>
    const BIN_ID = '69958674d0ea881f40c36fa0';
    const MASTER_KEY = '$2a$10$Z4/lj4bJs4gRcw67snP9zewPYv9rbqaXFeGKdX07gqvA0ucBoTgVy';
    const STORAGE_URL = `https://api.jsonbin.io/v3/b/${BIN_ID}`;

    const teams = ["3º A", "3º B", "4º A", "4º B"];
    let scores = {
      "3º A": [0,0,0,0,0,0],
      "3º B": [0,0,0,0,0,0],
      "4º A": [0,0,0,0,0,0],
      "4º B": [0,0,0,0,0,0]
    };

    async function loadData() {
      try {
        const res = await fetch(STORAGE_URL);
        if (res.ok) {
          const data = await res.json();
          scores = data.record.scores || scores;
        }
      } catch (e) {
        console.error('Error al cargar:', e);
      }
    }

    function renderEditableTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      teams.forEach(team => {
        const row = document.createElement('tr');
        row.innerHTML = `<td class="team-name">${team}</td>`;
        for (let w = 0; w < 6; w++) {
          const selectHTML = `<select data-team="${team}" data-week="${w}">
            ${Array.from({length:11},(_,i)=>`<option value="${i}" ${scores[team][w]===i?'selected':''}>${i}</option>`).join('')}
          </select>`;
          row.innerHTML += `<td>${selectHTML}</td>`;
        }
        const total = scores[team].reduce((a,b)=>a+b,0);
        row.innerHTML += `<td class="total-cell">${total}</td>`;
        tbody.appendChild(row);
      });
    }

    async function guardarDatos() {
      document.querySelectorAll('select').forEach(sel => {
        const team = sel.dataset.team;
        const week = parseInt(sel.dataset.week);
        scores[team][week] = parseInt(sel.value) || 0;
      });

      try {
        const res = await fetch(STORAGE_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': MASTER_KEY
          },
          body: JSON.stringify({ scores, lastUpdate: new Date().toISOString() })
        });

        if (res.ok) {
          alert('¡Guardado correctamente!\n\nAhora abre index.html y pulsa ACTUALIZAR.');
          renderEditableTable();
        } else {
          const errorText = await res.text();
          alert('Error al guardar:\nStatus: ' + res.status + '\n' + errorText);
        }
      } catch (e) {
        alert('Error de conexión:\n' + e.message);
      }
    }

    window.onload = async () => {
      await loadData();
      renderEditableTable();
    };
  </script>
</body>
</html>
