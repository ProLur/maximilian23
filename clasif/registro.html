  <script>
    const STORAGE_URL = 'https://api.jsonbin.io/v3/b/6aa13d37ffd5d16053f13ac9';
    const MASTER_KEY = '$2a$10$Z4/lj4bJs4gRcw67snP9zewPYv9rbqaXFeGKdX07gqvA0ucBoTgVy';

    const TOTAL_WEEKS = 36;
    const MAX_SCORE = 10;
    const teams = ["3º A", "3º B", "4º A", "4º B"];
    const TEAM_ALIASES = {
      "3º A": "3º A",
      "3Âº A": "3º A",
      "3º B": "3º B",
      "3Âº B": "3º B",
      "4º A": "4º A",
      "4Âº A": "4º A",
      "4º B": "4º B",
      "4Âº B": "4º B"
    };
    let scores = {
      "3º A": Array(TOTAL_WEEKS).fill(0),
      "3º B": Array(TOTAL_WEEKS).fill(0),
      "4º A": Array(TOTAL_WEEKS).fill(0),
      "4º B": Array(TOTAL_WEEKS).fill(0)
    };

    // Primera semana completa del curso 2026/27.
    const FECHA_INICIO = new Date(2026, 8, 14);
    const QUARANTINE_WEEKS = [];
    const TERMS = [{from:1,to:13},{from:14,to:24},{from:25,to:36}];
    let selectedTerm = 0;

    function normalizeScore(value) {
      const numericValue = Number(value);
      if (!Number.isFinite(numericValue)) return 0;
      const rounded = Math.round(numericValue * 10) / 10;
      return Math.max(0, Math.min(MAX_SCORE, rounded));
    }

    function scoreToTenths(value) {
      return Math.round(normalizeScore(value) * 10);
    }

    function sumScores(values) {
      return values.reduce((sum, value) => sum + scoreToTenths(value), 0) / 10;
    }

    function formatScore(value) {
      return normalizeScore(value).toFixed(1);
    }

    function getScoreParts(value) {
      const tenths = scoreToTenths(value);
      return {
        integer: Math.floor(tenths / 10),
        decimal: tenths % 10
      };
    }

    function syncDecimalSelectState(wrapper) {
      const integerSelect = wrapper.querySelector('select[data-part="integer"]');
      const decimalSelect = wrapper.querySelector('select[data-part="decimal"]');
      if (!integerSelect || !decimalSelect) return;

      const integerValue = parseInt(integerSelect.value, 10) || 0;
      const shouldDisableDecimal = integerValue >= MAX_SCORE;
      if (shouldDisableDecimal) {
        decimalSelect.value = '0';
      }
      decimalSelect.disabled = shouldDisableDecimal;
    }

    function calcularSemanaActual() {
      const hoy = new Date();
      const diffMs = hoy - FECHA_INICIO;
      const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const semanasCompletas = Math.floor(diffDias / 7);
      return Math.min(semanasCompletas + 1, TOTAL_WEEKS);
    }

    async function loadData() {
      try {
        const res = await fetch(STORAGE_URL, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          const loaded = data.record.scores;
          if (loaded) {
            Object.keys(loaded).forEach(team => {
              const normalizedTeam = TEAM_ALIASES[team];
              if (normalizedTeam) {
                scores[normalizedTeam] = [
                  ...loaded[team].slice(0, TOTAL_WEEKS),
                  ...Array(TOTAL_WEEKS).fill(0)
                ].slice(0, TOTAL_WEEKS).map(normalizeScore);
              }
            });
          }
        }
      } catch (e) {
        console.error('Error al cargar:', e);
      }
    }

    function renderEditableTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      const semanaActual = calcularSemanaActual();
      selectedTerm = TERMS.findIndex(t => semanaActual >= t.from && semanaActual <= t.to);
      if (selectedTerm < 0) selectedTerm = 0;
      document.querySelectorAll('.term-tab').forEach((button,index) => button.classList.toggle('active',index === selectedTerm));

      // Resaltar headers de semanas pasadas
      document.querySelectorAll('.week-header').forEach(th => {
        const weekNum = parseInt(th.dataset.week);
        th.classList.toggle('semana-pasada', weekNum < semanaActual);
        th.classList.toggle('semana-cuarentena', QUARANTINE_WEEKS.includes(weekNum));
        th.classList.toggle('mobile-hidden-week', weekNum !== semanaActual);
        th.classList.toggle('term-hidden', weekNum < TERMS[selectedTerm].from || weekNum > TERMS[selectedTerm].to);
      });

      teams.forEach(team => {
        const row = document.createElement('tr');
        let html = `<td class="team-name sticky-left">${team}</td>`;

        for (let w = 0; w < TOTAL_WEEKS; w++) {
          const weekNum = w + 1;
          const isPast = weekNum < semanaActual;
          const isQuarantine = QUARANTINE_WEEKS.includes(weekNum);
          const parts = getScoreParts(scores[team][w]);
          const selectClasses = [
            isPast ? 'past-week' : '',
            isQuarantine ? 'quarantine-week' : ''
          ].filter(Boolean).join(' ');
          const selectHTML = `
            <div class="score-inputs" data-original="${formatScore(scores[team][w])}">
              <select data-team="${team}" data-week="${w}" data-part="integer"
                      class="score-select ${selectClasses}">
                ${Array.from({length:11},(_,i) => 
                  `<option value="${i}" ${parts.integer===i ? 'selected' : ''}>${i}</option>`
                ).join('')}
              </select>
              <span class="score-decimal-separator">.</span>
              <select data-team="${team}" data-week="${w}" data-part="decimal"
                      class="score-select ${selectClasses}">
                ${Array.from({length:10},(_,i) => 
                  `<option value="${i}" ${parts.decimal===i ? 'selected' : ''}>${i}</option>`
                ).join('')}
              </select>
            </div>`;
          const cellClasses = [
            isQuarantine ? 'quarantine-cell' : '',
            weekNum !== semanaActual ? 'mobile-hidden-week' : '',
            weekNum < TERMS[selectedTerm].from || weekNum > TERMS[selectedTerm].to ? 'term-hidden' : ''
          ].filter(Boolean).join(' ');
          html += `<td class="${cellClasses}">${selectHTML}</td>`;
        }

        const total = sumScores(scores[team]);
        html += `<td class="total-cell sticky-right">${formatScore(total)}</td>`;
        row.innerHTML = html;
        tbody.appendChild(row);
      });

      // Listener para aviso en semanas pasadas
      document.querySelectorAll('.score-inputs').forEach(wrapper => {
        syncDecimalSelectState(wrapper);
      });

      document.querySelectorAll('select[data-part="integer"]').forEach(sel => {
        sel.addEventListener('change', function() {
          syncDecimalSelectState(this.closest('.score-inputs'));
        });
      });

      document.querySelectorAll('select.past-week').forEach(sel => {
        sel.addEventListener('change', function(e) {
          const wrapper = this.closest('.score-inputs');
          const integerSelect = wrapper.querySelector('select[data-part="integer"]');
          const decimalSelect = wrapper.querySelector('select[data-part="decimal"]');
          const original = normalizeScore(wrapper.dataset.original);
          const nuevo = normalizeScore(`${integerSelect.value}.${decimalSelect.value}`);
          if (nuevo !== original) {
            const confirmed = confirm(
              `¡ATENCIÓN!\nEstás modificando la Semana ${parseInt(this.dataset.week)+1}, que YA HA PASADO.\n\n` +
              `Valor original: ${formatScore(original)}\nNuevo valor: ${formatScore(nuevo)}\n\n` +
              `¿Confirmas el cambio? (Solo hazlo si es una corrección autorizada)`
            );
            if (!confirmed) {
              const originalParts = getScoreParts(original);
              integerSelect.value = originalParts.integer;
              decimalSelect.value = originalParts.decimal;
              syncDecimalSelectState(wrapper);
            } else {
              // Actualiza el original por si cambian varias veces
              wrapper.dataset.original = formatScore(nuevo);
            }
          }
        });
      });
    }

    function showTerm(index) {
      selectedTerm = index;
      document.querySelectorAll('.term-tab').forEach((button,i) => button.classList.toggle('active',i === index));
      document.querySelectorAll('.week-header').forEach(th => {
        const week = Number(th.dataset.week);
        th.classList.toggle('term-hidden',week < TERMS[index].from || week > TERMS[index].to);
      });
      document.querySelectorAll('#table-body tr').forEach(row => {
        Array.from(row.children).slice(1,-1).forEach((cell,i) => cell.classList.toggle('term-hidden',i+1 < TERMS[index].from || i+1 > TERMS[index].to));
      });
    }

    document.querySelectorAll('.term-tab').forEach((button,index) => button.addEventListener('click',() => showTerm(index)));

    async function guardarDatos() {
      document.querySelectorAll('.score-inputs').forEach(wrapper => {
        const integerSelect = wrapper.querySelector('select[data-part="integer"]');
        const decimalSelect = wrapper.querySelector('select[data-part="decimal"]');
        const team = integerSelect.dataset.team;
        const week = parseInt(integerSelect.dataset.week);
        scores[team][week] = normalizeScore(`${integerSelect.value}.${decimalSelect.value}`);
      });

      try {
        const res = await fetch(STORAGE_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': MASTER_KEY
          },
          body: JSON.stringify({ 
            scores,
            lastUpdate: new Date().toISOString() 
          })
        });

        if (res.ok) {
          alert('¡Guardado correctamente!\n\nRecargando la tabla...');
          await loadData();
          renderEditableTable();
        } else {
          alert(`Error al guardar: ${res.status}\n${await res.text()}`);
        }
      } catch (e) {
        alert('Error de conexión: ' + e.message);
      }
    }

    window.onload = async () => {
      await loadData();
      renderEditableTable();
    };
  </script>






</body></html>
