<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clasificación • Juego del Silencio</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: "Courier New", Courier, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100dvh;
      background-image:
        radial-gradient(circle at 25% 15%, rgba(0,255,204,0.08) 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, rgba(0,255,204,0.06) 0%, transparent 50%);
      background-attachment: fixed;
    }
    header {
      background: rgba(22,27,34,0.92);
      backdrop-filter: blur(8px);
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header img {
      height: 45px;
      border-radius: 50%;
      border: 2px solid #00ffcc88;
      box-shadow: 0 0 12px #00ffcc55;
    }
    header h1 {
      font-size: clamp(1.4rem, 5vw, 1.7rem);
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffccaa;
    }
    .container {
      max-width: 1400px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .classification {
      background: rgba(30,45,61,0.35);
      border: 2px solid #00ffcc55;
      border-radius: 14px;
      padding: 2rem;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      min-width: 640px;
      border-collapse: collapse;
      background: rgba(13,17,23,0.85);
      border: 3px solid #00ffcc;
      border-radius: 12px;
      overflow: hidden;
      table-layout: auto;
    }
    th, td {
      padding: clamp(12px, 2vw, 16px) clamp(8px, 1.5vw, 12px);
      text-align: center;
      border-bottom: 1px solid #00ffcc33;
      font-size: clamp(1.1rem, 2.2vw, 1.35rem);
      font-weight: bold;
    }
    th {
      background: linear-gradient(#00ffcc22, transparent);
      color: #00ffcc;
      border-bottom: 3px solid #00ffcc66;
      text-shadow: 0 0 6px #00ffcc88;
    }
    tr:hover td { background: rgba(0,255,204,0.09); }
    .team-name {
      text-align: left;
      padding-left: clamp(1.2rem, 3vw, 2.2rem);
      color: #00ffcc;
      font-size: clamp(1.2rem, 2.4vw, 1.4rem);
      min-width: 140px;
    }
    .total-cell {
      background: rgba(0,255,204,0.22) !important;
      color: #00ffcc;
      font-size: clamp(1.3rem, 2.6vw, 1.55rem);
      border-left: 3px solid #00ffcc;
      font-weight: bold;
    }
    .week-info {
      text-align: center;
      margin: 2rem 0 0.5rem;
      padding: 1rem;
      background: rgba(0,255,204,0.08);
      border: 1px solid #00ffcc33;
      border-radius: 10px;
    }
    .week-info h2 {
      color: #00ffcc;
      margin-bottom: 0.5rem;
      font-size: clamp(1.4rem, 3.5vw, 1.7rem);
    }
    .week-info p {
      color: #00ffccaa;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
    }
    @media (max-width: 768px) {
      .full-table { display: none; }
      .mobile-table { display: table; width: 100%; min-width: 100%; }
      .mobile-table th, .mobile-table td {
        font-size: clamp(1rem, 3.5vw, 1.2rem);
        padding: 14px 10px;
      }
      .classification { padding: 1.5rem 1rem; }
      .container { padding: 0 0.8rem; }
    }
    @media (min-width: 769px) {
      .mobile-table { display: none; }
      .full-table { display: table; }
      .classification {
        overflow-x: auto;
        padding: 2rem;
      }
    }
    footer {
      text-align: center;
      padding: 3rem 1rem 2rem;
      color: #00ffcc88;
      font-size: 0.95rem;
      border-top: 1px solid #00ffcc33;
      margin-top: 5rem;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Logo">
    <h1>Clasificación • Juego del Silencio</h1>
  </header>

  <div class="container">
    <div class="classification">
      <h2 style="text-align:center; color:#00ffcc; margin-bottom:1.5rem; font-size:clamp(1.5rem, 4vw, 1.8rem);">
        Tabla de Clasificación
      </h2>

      <table class="full-table">
        <thead>
          <tr>
            <th>Equipo</th>
            <th>Semana 1</th>
            <th>Semana 2</th>
            <th>Semana 3</th>
            <th>Semana 4</th>
            <th>Semana 5</th>
            <th>Semana 6</th>
            <th>TOTAL</th>
          </tr>
        </thead>
        <tbody id="table-body-full">
          <tr><td colspan="8" style="text-align:center; padding:2rem;">Cargando datos...</td></tr>
        </tbody>
      </table>

      <table class="mobile-table">
        <thead>
          <tr>
            <th>Equipo</th>
            <th class="week-cell">Puntos</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="table-body-mobile">
          <tr><td colspan="3" style="text-align:center; padding:2rem;">Cargando...</td></tr>
        </tbody>
      </table>

      <!-- Fecha movida aquí ↓ -->
      <div class="week-info">
        <h2 id="semana-actual">Semana 1</h2>
        <p id="fecha-rango"></p>
      </div>
    </div>
  </div>

  <footer>
    CEIP Juan XXIII • Zafra • Actualizado: <span id="last-update">—</span>
  </footer>

  <script>
    const STORAGE_URL = 'https://api.jsonbin.io/v3/b/699588baae596e708f33e153';
    const MAX_WEEKS = 6;
    const teams = ["3º A", "3º B", "4º A", "4º B"];
    let scores = {
      "3º A": [0,0,0,0,0,0],
      "3º B": [0,0,0,0,0,0],
      "4º A": [0,0,0,0,0,0],
      "4º B": [0,0,0,0,0,0]
    };
    let currentWeek = 1;

    function getMostRecentMonday() {
      const today = new Date();
      const day = today.getDay();
      const diff = (day === 0 ? -6 : 1 - day);
      const monday = new Date(today);
      monday.setDate(today.getDate() + diff);
      monday.setHours(0,0,0,0);
      return monday;
    }

    function getWeekRange(weekNum) {
      const baseMonday = getMostRecentMonday();
      const daysOffset = (weekNum - 1) * 7;
      const monday = new Date(baseMonday);
      monday.setDate(baseMonday.getDate() + daysOffset);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      const format = d => d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
      return {
        monday: format(monday),
        sunday: format(sunday),
        text: `lunes ${format(monday)} al domingo ${format(sunday)}`
      };
    }

    function updateCurrentWeekDisplay() {
      currentWeek = 1;
      const range = getWeekRange(1);
      document.getElementById('semana-actual').textContent = `Semana 1`;
      document.getElementById('fecha-rango').textContent = range.text;
    }

    async function loadData() {
      try {
        const res = await fetch(STORAGE_URL, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          scores = data.record.scores || scores;
          if (data.record.lastUpdate) {
            document.getElementById('last-update').textContent =
              new Date(data.record.lastUpdate).toLocaleString('es-ES');
          }
        }
      } catch (e) {
        console.error("Error cargando datos", e);
      }
    }

    function renderTables() {
      const tbodyFull = document.getElementById('table-body-full');
      const tbodyMobile = document.getElementById('table-body-mobile');
    
      tbodyFull.innerHTML = '';
      tbodyMobile.innerHTML = '';
      const rankedTeams = [...teams].sort((a,b) => {
        const totalA = scores[a].reduce((sum,p)=>sum+p,0);
        const totalB = scores[b].reduce((sum,p)=>sum+p,0);
        if (totalA !== totalB) return totalB - totalA;
        for (let i = MAX_WEEKS-1; i >= 0; i--) {
          if (scores[a][i] !== scores[b][i]) return scores[b][i] - scores[a][i];
        }
        return 0;
      });

      rankedTeams.forEach(team => {
        // Tabla completa (PC)
        const rowFull = document.createElement('tr');
        rowFull.innerHTML = `<td class="team-name">${team}</td>`;
        let total = 0;
        scores[team].forEach(points => {
          rowFull.innerHTML += `<td>${points}</td>`;
          total += points;
        });
        rowFull.innerHTML += `<td class="total-cell">${total}</td>`;
        tbodyFull.appendChild(rowFull);

        // Tabla móvil
        const rowMobile = document.createElement('tr');
        const pointsThisWeek = scores[team][currentWeek-1] ?? 0;
        rowMobile.innerHTML = `
          <td class="team-name">${team}</td>
          <td class="week-cell">${pointsThisWeek}</td>
          <td class="total-cell">${total}</td>
        `;
        tbodyMobile.appendChild(rowMobile);
      });
    }

    async function refreshTable() {
      await loadData();
      updateCurrentWeekDisplay();
      renderTables();
    }

    window.onload = async () => {
      await refreshTable();
    };
  </script>
</body>
</html>
