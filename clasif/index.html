<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clasificación • Juego del Silencio</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: "Courier New", Courier, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100dvh;
      background-image:
        radial-gradient(circle at 25% 15%, rgba(0,255,204,0.08) 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, rgba(0,255,204,0.06) 0%, transparent 50%);
      background-attachment: fixed;
    }
    header {
      background: rgba(22,27,34,0.92);
      backdrop-filter: blur(8px);
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header img {
      height: 45px;
      border-radius: 50%;
      border: 2px solid #00ffcc88;
      box-shadow: 0 0 12px #00ffcc55;
    }
    header h1 {
      font-size: 1.7rem;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffccaa;
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .intro {
      text-align: center;
      margin-bottom: 2.5rem;
      padding: 1.8rem;
      background: rgba(30,45,61,0.38);
      border: 1px solid #00ffcc44;
      border-radius: 14px;
      backdrop-filter: blur(6px);
    }
    .classification {
      background: rgba(30,45,61,0.35);
      border: 2px solid #00ffcc55;
      border-radius: 14px;
      padding: 2rem;
      backdrop-filter: blur(6px);
      overflow-x: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(13,17,23,0.85);
      border: 3px solid #00ffcc;
      border-radius: 12px;
      overflow: hidden;
      min-width: 820px;
    }
    th {
      background: linear-gradient(#00ffcc22, transparent);
      color: #00ffcc;
      padding: 16px 12px;
      font-size: 1.2rem;
      border-bottom: 3px solid #00ffcc66;
      text-shadow: 0 0 6px #00ffcc88;
      transition: all 0.3s;
    }
    td {
      padding: 16px 12px;
      text-align: center;
      border-bottom: 1px solid #00ffcc33;
      font-size: 1.35rem;
      font-weight: bold;
      transition: background 0.2s;
    }
    tr:hover td { background: rgba(0,255,204,0.09); }
    .team-name {
      text-align: left;
      padding-left: 2.2rem;
      color: #00ffcc;
      font-size: 1.4rem;
    }
    .puesto-1 { color: #ffd700; text-shadow: 0 0 10px #ffd700aa; } /* oro */
    .puesto-2 { color: #c0c0c0; text-shadow: 0 0 8px #c0c0c0aa; }  /* plata */
    .puesto-3 { color: #cd7f32; text-shadow: 0 0 6px #cd7f32aa; }  /* bronce */
    .total-cell {
      background: rgba(0,255,204,0.22) !important;
      color: #00ffcc;
      font-size: 1.55rem;
      border-left: 3px solid #00ffcc;
      font-weight: bold;
    }
    .btn-refresh {
      display: block;
      margin: 2rem auto;
      padding: 0.9rem 3rem;
      background: rgba(0,255,204,0.18);
      color: #00ffcc;
      border: 2px solid #00ffcc88;
      border-radius: 999px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-refresh:hover {
      background: rgba(0,255,204,0.35);
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0,255,204,0.4);
    }
    footer {
      text-align: center;
      padding: 3rem 1rem 2rem;
      color: #00ffcc88;
      font-size: 0.95rem;
      border-top: 1px solid #00ffcc33;
      margin-top: 5rem;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Logo">
    <h1>Clasificación • Juego del Silencio</h1>
  </header>
  <div class="container">
    <div class="intro">
      <h2 id="semana-actual" style="color:#00ffcc; margin-bottom:0.6rem;">Cargando...</h2>
    </div>
    <div class="classification">
      <h2 style="text-align:center; color:#00ffcc; margin-bottom:1.5rem; font-size:1.8rem;">
        Tabla de Clasificación – 6 Semanas
      </h2>
      <table>
        <thead>
          <tr>
            <th>Equipo</th>
            <th>Semana 1</th>
            <th>Semana 2</th>
            <th>Semana 3</th>
            <th>Semana 4</th>
            <th>Semana 5</th>
            <th>Semana 6</th>
            <th>TOTAL</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="8" style="text-align:center; padding:2rem;">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
    <button class="btn-refresh" onclick="refreshTable()">ACTUALIZAR</button>
  </div>
  <footer>
    CEIP Juan XXIII • Zafra • Actualizado: <span id="last-update">—</span>
  </footer>

  <script>
    const STORAGE_URL = 'https://api.jsonbin.io/v3/b/699588baae596e708f33e153';
    const teams = ["3º A", "3º B", "4º A", "4º B"];
    let scores = {
      "3º A": [0,0,0,0,0,0],
      "3º B": [0,0,0,0,0,0],
      "4º A": [0,0,0,0,0,0],
      "4º B": [0,0,0,0,0,0]
    };

    // ¡Cambia esta fecha por el día real de INICIO del juego!
    const FECHA_INICIO = new Date('2025-09-15');

    function calcularSemanaActual() {
      const hoy = new Date();
      const diffMs = hoy - FECHA_INICIO;
      const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const semanasCompletas = Math.floor(diffDias / 7);
      let semana = semanasCompletas + 1;
      if (semana > 7) semana = 7;
      if (semana < 1) semana = 1;
      return semana;
    }

    function getPuesto(posicion) {
      if (posicion === 1) return "1º ";
      if (posicion === 2) return "2º ";
      if (posicion === 3) return "3º ";
      return posicion + "º "; // para 4º y posibles empates
    }

    async function loadData() {
      try {
        const res = await fetch(STORAGE_URL, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          scores = data.record.scores || scores;
          if (data.record.lastUpdate) {
            document.getElementById('last-update').textContent = 
              new Date(data.record.lastUpdate).toLocaleString('es-ES');
          }
        }
      } catch (e) {
        console.error("Error al cargar datos:", e);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      const rankedTeams = [...teams].sort((a,b) => {
        const totalA = scores[a].reduce((sum,p)=>sum+p,0);
        const totalB = scores[b].reduce((sum,p)=>sum+p,0);
        if (totalA !== totalB) return totalB - totalA;
        for (let i = 5; i >= 0; i--) {
          if (scores[a][i] !== scores[b][i]) return scores[b][i] - scores[a][i];
        }
        return 0;
      });

      rankedTeams.forEach((team, index) => {
        const posicion = index + 1;
        const row = document.createElement('tr');
        
        // Nombre con puesto
        let teamCell = `<td class="team-name">${getPuesto(posicion)}${team}</td>`;
        
        // Añadimos clase especial para podio
        if (posicion === 1) teamCell = teamCell.replace('team-name', 'team-name puesto-1');
        if (posicion === 2) teamCell = teamCell.replace('team-name', 'team-name puesto-2');
        if (posicion === 3) teamCell = teamCell.replace('team-name', 'team-name puesto-3');

        row.innerHTML = teamCell;

        let total = 0;
        scores[team].forEach(points => {
          row.innerHTML += `<td>${points}</td>`;
          total += points;
        });
        row.innerHTML += `<td class="total-cell">${total}</td>`;
        tbody.appendChild(row);
      });

      // Colorear cabeceras de semanas
      const semanaActual = calcularSemanaActual();
      const headers = document.querySelectorAll('thead th');

      // Reset a verde
      for (let i = 1; i <= 6; i++) {
        const th = headers[i];
        th.style.color = '#00ffcc';
        th.style.textShadow = '0 0 6px #00ffcc88';
        th.style.background = 'linear-gradient(#00ffcc22, transparent)';
      }

      // Rojo para semanas ya terminadas
      for (let i = 1; i <= 6; i++) {
        if (i < semanaActual) {
          const th = headers[i];
          th.style.color = '#ff4444';
          th.style.textShadow = '0 0 8px #ff444488';
          th.style.background = 'linear-gradient(#ff444422, transparent)';
        }
      }

      // Título superior
      let textoSemana = `Semana actual: ${semanaActual}`;
      if (semanaActual > 6) {
        textoSemana = "Juego finalizado • Todas las semanas completadas";
      }
      document.getElementById('semana-actual').textContent = textoSemana;
    }

    async function refreshTable() {
      await loadData();
      renderTable();
    }

    window.onload = async () => {
      await refreshTable();
    };
  </script>
</body>
</html>
