<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clasificación • Juego del Silencio</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%;
      width: 100%;
      overflow-x: hidden;           /* ← bloquea scroll horizontal global */
    }
    body {
      font-family: "Courier New", Courier, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 25% 15%, rgba(0,255,204,0.08) 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, rgba(0,255,204,0.06) 0%, transparent 50%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(22,27,34,0.92);
      backdrop-filter: blur(8px);
      padding: clamp(0.8rem, 2vw, 1rem) clamp(1rem, 3vw, 1.2rem);
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-shrink: 0;
    }
    header img {
      height: clamp(36px, 8vw, 45px);
      border-radius: 50%;
      border: 2px solid #00ffcc88;
      box-shadow: 0 0 12px #00ffcc55;
    }
    header h1 {
      font-size: clamp(1.3rem, 4.5vw, 1.7rem);
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffccaa;
    }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;            /* evita scroll innecesario dentro del main */
    }
    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: clamp(0.8rem, 2vw, 1.5rem);
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: clamp(1rem, 2.5vw, 2rem);
    }
    .intro {
      text-align: center;
      padding: clamp(1rem, 3vw, 1.8rem);
      background: rgba(30,45,61,0.38);
      border: 1px solid #00ffcc44;
      border-radius: 14px;
      backdrop-filter: blur(6px);
    }
    .classification {
      background: rgba(30,45,61,0.35);
      border: 2px solid #00ffcc55;
      border-radius: 14px;
      padding: clamp(1rem, 2vw, 2rem);
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .classification h2 {
      text-align: center;
      color: #00ffcc;
      margin-bottom: clamp(1rem, 2vw, 1.5rem);
      font-size: clamp(1.4rem, 4vw, 1.8rem);
    }
    .table-wrapper {
      flex: 1;
      overflow-y: auto;            /* solo scroll vertical si hay muchas filas */
      overflow-x: auto;            /* scroll horizontal SOLO si la tabla no cabe */
      -webkit-overflow-scrolling: touch;
    }
    table {
      width: 100%;
      min-width: 600px;            /* evita que se colapse demasiado */
      border-collapse: collapse;
      background: rgba(13,17,23,0.85);
      border: 3px solid #00ffcc;
      border-radius: 12px;
      overflow: hidden;
      table-layout: auto;
    }
    th, td {
      padding: clamp(10px, 1.8vw, 16px) clamp(8px, 1.5vw, 12px);
      text-align: center;
      border-bottom: 1px solid #00ffcc33;
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: bold;
    }
    th {
      background: linear-gradient(#00ffcc22, transparent);
      color: #00ffcc;
      border-bottom: 3px solid #00ffcc66;
      text-shadow: 0 0 6px #00ffcc88;
    }
    tr:hover td { background: rgba(0,255,204,0.09); }
    .team-name {
      text-align: left;
      padding-left: clamp(1rem, 2.5vw, 2.2rem);
      color: #00ffcc;
      font-size: clamp(1.1rem, 2.3vw, 1.4rem);
      min-width: 120px;
    }
    .total-cell {
      background: rgba(0,255,204,0.22) !important;
      color: #00ffcc;
      font-size: clamp(1.2rem, 2.5vw, 1.55rem);
      border-left: 3px solid #00ffcc;
    }
    @media (max-width: 768px) {
      .full-table { display: none; }
      .mobile-table { display: table; width: 100%; min-width: 100%; }
      .table-wrapper { overflow-x: hidden; } /* en móvil casi nunca scroll horiz */
    }
    @media (min-width: 769px) {
      .mobile-table { display: none; }
      .full-table { display: table; }
    }
    .btn-refresh {
      margin: clamp(1.5rem, 4vw, 2rem) auto;
      padding: clamp(0.7rem, 2vw, 0.9rem) clamp(1.8rem, 5vw, 3rem);
      background: rgba(0,255,204,0.18);
      color: #00ffcc;
      border: 2px solid #00ffcc88;
      border-radius: 999px;
      font-size: clamp(0.95rem, 2.5vw, 1.2rem);
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .btn-refresh:hover {
      background: rgba(0,255,204,0.35);
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0,255,204,0.4);
    }
    footer {
      text-align: center;
      padding: clamp(1.5rem, 4vw, 2rem) 1rem;
      color: #00ffcc88;
      font-size: 0.95rem;
      border-top: 1px solid #00ffcc33;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Logo">
    <h1>Clasificación • Juego del Silencio</h1>
  </header>

  <div class="main-content">
    <div class="container">
      <div class="intro">
        <h2 id="semana-actual" style="color:#00ffcc; margin-bottom:0.4rem;">Semana 1</h2>
        <p id="fecha-rango" style="color:#00ffccaa; font-size:clamp(0.95rem, 2.5vw, 1.1rem);"></p>
      </div>

      <div class="classification">
        <h2>Tabla de Clasificación</h2>
        <div class="table-wrapper">
          <table class="full-table">
            <thead>
              <tr>
                <th>Equipo</th>
                <th>Semana 1</th>
                <th>Semana 2</th>
                <th>Semana 3</th>
                <th>Semana 4</th>
                <th>Semana 5</th>
                <th>Semana 6</th>
                <th>TOTAL</th>
              </tr>
            </thead>
            <tbody id="table-body-full">
              <tr><td colspan="8" style="text-align:center; padding:2rem;">Cargando datos...</td></tr>
            </tbody>
          </table>
          <table class="mobile-table">
            <thead>
              <tr>
                <th>Equipo</th>
                <th class="week-cell">Puntos</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody id="table-body-mobile">
              <tr><td colspan="3" style="text-align:center; padding:2rem;">Cargando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <button class="btn-refresh" onclick="refreshTable()">ACTUALIZAR</button>
    </div>
  </div>

  <footer>
    CEIP Juan XXIII • Zafra • Actualizado: <span id="last-update">—</span>
  </footer>

  <script>
    // El script se mantiene exactamente igual al anterior
    const STORAGE_URL = 'https://api.jsonbin.io/v3/b/699588baae596e708f33e153';
    const MAX_WEEKS = 6;
    const teams = ["3º A", "3º B", "4º A", "4º B"];
    let scores = {
      "3º A": [0,0,0,0,0,0],
      "3º B": [0,0,0,0,0,0],
      "4º A": [0,0,0,0,0,0],
      "4º B": [0,0,0,0,0,0]
    };
    let currentWeek = 1;

    function getMostRecentMonday() {
      const today = new Date();
      const day = today.getDay();
      const diff = (day === 0 ? -6 : 1 - day);
      const monday = new Date(today);
      monday.setDate(today.getDate() + diff);
      monday.setHours(0,0,0,0);
      return monday;
    }

    function getWeekRange(weekNum) {
      const baseMonday = getMostRecentMonday();
      const daysOffset = (weekNum - 1) * 7;
      const monday = new Date(baseMonday);
      monday.setDate(baseMonday.getDate() + daysOffset);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);
      const format = d => d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
      return {
        monday: format(monday),
        sunday: format(sunday),
        text: `lunes ${format(monday)} al domingo ${format(sunday)}`
      };
    }

    function updateCurrentWeekDisplay() {
      currentWeek = 1;
      const range = getWeekRange(1);
      document.getElementById('semana-actual').textContent = `Semana 1`;
      document.getElementById('fecha-rango').textContent = range.text;
    }

    async function loadData() {
      try {
        const res = await fetch(STORAGE_URL, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          scores = data.record.scores || scores;
          if (data.record.lastUpdate) {
            document.getElementById('last-update').textContent =
              new Date(data.record.lastUpdate).toLocaleString('es-ES');
          }
        }
      } catch (e) {
        console.error("Error cargando datos", e);
      }
    }

    function renderTables() {
      const tbodyFull = document.getElementById('table-body-full');
      const tbodyMobile = document.getElementById('table-body-mobile');
     
      tbodyFull.innerHTML = '';
      tbodyMobile.innerHTML = '';
      const rankedTeams = [...teams].sort((a,b) => {
        const totalA = scores[a].reduce((sum,p)=>sum+p,0);
        const totalB = scores[b].reduce((sum,p)=>sum+p,0);
        if (totalA !== totalB) return totalB - totalA;
        for (let i = MAX_WEEKS-1; i >= 0; i--) {
          if (scores[a][i] !== scores[b][i]) return scores[b][i] - scores[a][i];
        }
        return 0;
      });

      rankedTeams.forEach(team => {
        const rowFull = document.createElement('tr');
        rowFull.innerHTML = `<td class="team-name">${team}</td>`;
        let total = 0;
        scores[team].forEach(points => {
          rowFull.innerHTML += `<td>${points}</td>`;
          total += points;
        });
        rowFull.innerHTML += `<td class="total-cell">${total}</td>`;
        tbodyFull.appendChild(rowFull);

        const rowMobile = document.createElement('tr');
        const pointsThisWeek = scores[team][currentWeek-1] ?? 0;
        rowMobile.innerHTML = `
          <td class="team-name">${team}</td>
          <td class="week-cell">${pointsThisWeek}</td>
          <td class="total-cell">${total}</td>
        `;
        tbodyMobile.appendChild(rowMobile);
      });
    }

    async function refreshTable() {
      await loadData();
      updateCurrentWeekDisplay();
      renderTables();
    }

    window.onload = async () => {
      await refreshTable();
    };
  </script>
</body>
</html>
