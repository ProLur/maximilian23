<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clasificación • Juego del Silencio</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html, body {
      height: 100%;
      width: 100%;
      /* Quitamos overflow-x: hidden global para permitir scroll cuando sea necesario */
    }
    body {
      font-family: "Courier New", Courier, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 25% 15%, rgba(0,255,204,0.08) 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, rgba(0,255,204,0.06) 0%, transparent 50%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
    }
    header { /* igual que antes */ }
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .container {
      max-width: 1600px;
      margin: 0 auto;
      padding: clamp(0.8rem, 2vw, 1.5rem);
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: clamp(1rem, 2.5vw, 2rem);
    }
    .intro { /* igual */ }
    .classification {
      background: rgba(30,45,61,0.35);
      border: 2px solid #00ffcc55;
      border-radius: 14px;
      padding: clamp(1rem, 2vw, 2rem);
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .classification h2 { /* igual */ }
    .table-wrapper {
      flex: 1;
      overflow-x: auto;            /* ← SCROLL HORIZONTAL AQUÍ cuando la tabla no quepa */
      overflow-y: auto;            /* scroll vertical si hay muchas filas (futuro) */
      -webkit-overflow-scrolling: touch;
      margin: 0 -1rem;             /* compensa un poco el padding del contenedor */
      padding: 0 1rem;
    }
    table {
      width: 100%;
      min-width: 720px;            /* ← ajustado: antes 600px, ahora un poco más ancho para que se note el scroll cuando haga falta */
      border-collapse: collapse;
      background: rgba(13,17,23,0.85);
      border: 3px solid #00ffcc;
      border-radius: 12px;
      overflow: hidden;
      table-layout: auto;
    }
    th, td { /* igual, con clamp */ }
    th { /* igual */ }
    tr:hover td { /* igual */ }
    .team-name { /* igual */ }
    .total-cell { /* igual */ }

    @media (max-width: 768px) {
      .full-table { display: none; }
      .mobile-table { display: table; width: 100%; min-width: 100%; }
      .table-wrapper {
        overflow-x: hidden;        /* en móvil → sin scroll horizontal (usamos tabla reducida) */
        margin: 0;
        padding: 0;
      }
    }
    @media (min-width: 769px) {
      .mobile-table { display: none; }
      .full-table { display: table; }
    }

    .btn-refresh { /* igual */ }
    footer { /* igual */ }
  </style>
</head>
<body>
  <!-- header igual -->

  <div class="main-content">
    <div class="container">
      <div class="intro">
        <h2 id="semana-actual" style="color:#00ffcc; margin-bottom:0.4rem;">Semana 1</h2>
        <p id="fecha-rango" style="color:#00ffccaa; font-size:clamp(0.95rem, 2.5vw, 1.1rem);"></p>
      </div>

      <div class="classification">
        <h2>Tabla de Clasificación</h2>
        <div class="table-wrapper">
          <table class="full-table">
            <!-- thead y tbody igual que antes -->
          </table>
          <table class="mobile-table">
            <!-- thead y tbody igual -->
          </table>
        </div>
      </div>

      <button class="btn-refresh" onclick="refreshTable()">ACTUALIZAR</button>
    </div>
  </div>

  <!-- footer igual -->

  <!-- script exactamente igual al anterior -->
</body>
</html>
