<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clasificación · Juego del Silencio</title><link rel="icon" href="https://maximilian23.com/Cabeza.png"><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0d1117;color:#e6edf3;font-family:"Courier New",monospace;background-image:radial-gradient(circle at 20% 10%,#00ffcc12,transparent 40%),radial-gradient(circle at 80% 90%,#00ffcc0d,transparent 40%)}header{display:flex;align-items:center;justify-content:center;gap:.8rem;padding:1rem;background:#161b22ee;border-bottom:2px solid #00ffcc;position:sticky;top:0;z-index:20}header img{width:42px;height:42px}h1{font-size:clamp(1.15rem,3vw,1.7rem);color:#00ffcc;margin:0}.wrap{max-width:1300px;margin:auto;padding:1rem}.course-tabs,.term-tabs{display:flex;gap:.6rem;justify-content:center;flex-wrap:wrap;margin:1rem 0}.tab{border:1px solid #00ffcc66;background:#161b22;color:#b8c8d8;border-radius:999px;padding:.7rem 1.1rem;font:700 .95rem inherit;cursor:pointer}.tab.active{background:#00ffcc;color:#071510;box-shadow:0 0 15px #00ffcc55}.panel{background:#1e2d3d55;border:1px solid #00ffcc55;border-radius:16px;padding:clamp(.7rem,2vw,1.3rem);box-shadow:0 8px 28px #0007}.title{text-align:center;color:#00ffcc;margin:.4rem 0}.subtitle{text-align:center;color:#9fb5c8;margin:.4rem 0 1rem}.table-wrap{overflow:auto;border-radius:12px}table{width:100%;min-width:900px;border-collapse:collapse;background:#0d1117e8}th,td{padding:.8rem .55rem;text-align:center;border-bottom:1px solid #00ffcc24;font-weight:700}th{color:#00ffcc;background:#111820;white-space:nowrap}.team{text-align:left;color:#00ffcc;position:sticky;left:0;background:#0d1117;z-index:2}.total{color:#00ffcc;font-size:1.15rem;position:sticky;right:0;background:#0d1117;border-left:2px solid #00ffcc88}.current{background:#00ffcc22!important;box-shadow:inset 0 0 0 1px #00ffcc66}.future{opacity:.52}.status{text-align:center;margin:1.2rem;color:#9fb5c8}.calendar{margin:1rem auto 0;max-width:800px;text-align:center;color:#92a9bc;font-size:.85rem;line-height:1.5}.hidden{display:none}@media(max-width:650px){header{justify-content:flex-start}.wrap{padding:.65rem}.panel{padding:.6rem}table{min-width:720px}th,td{padding:.65rem .4rem;font-size:.85rem}}</style></head><body><header><img src="https://maximilian23.com/Cabeza.png" alt="Maximilian 23"><h1>Clasificación · Juego del Silencio</h1></header><main class="wrap"><nav class="course-tabs"><button class="tab active" data-course="current">Curso 2026/27</button><button class="tab" data-course="history">Histórico 2025/26</button></nav><section class="panel"><h2 class="title" id="course-title">Curso 2026/27</h2><p class="subtitle" id="course-subtitle">Clasificación reiniciada · todos los equipos comienzan con 0 puntos</p><nav class="term-tabs" id="term-tabs"><button class="tab active" data-term="0">1.º trimestre</button><button class="tab" data-term="1">2.º trimestre</button><button class="tab" data-term="2">3.º trimestre</button></nav><div class="table-wrap"><table><thead id="head"></thead><tbody id="body"><tr><td>Cargando…</td></tr></tbody></table></div><p class="status" id="status">Cargando datos…</p><p class="calendar" id="calendar-note">Calendario 26/27 adaptado al calendario escolar oficial de Extremadura: actividad lectiva de Primaria del 10 de septiembre al 18 de junio.</p></section></main><script>const CURRENT='https://api.jsonbin.io/v3/b/6aa13d37ffd5d16053f13ac9',HISTORY='https://api.jsonbin.io/v3/b/699588baae596e708f33e153',TEAMS=['3º A','3º B','4º A','4º B'],TOTAL=36,START=new Date(2026,8,14),TERMS=[{from:1,to:13},{from:14,to:24},{from:25,to:36}];let course='current',term=0,scores=empty(TOTAL),lastUpdate=null;function empty(n){return Object.fromEntries(TEAMS.map(t=>[t,Array(n).fill(0)]))}function norm(v){v=Number(v);return Number.isFinite(v)?Math.round(v*10)/10:0}function sum(a){return a.reduce((s,v)=>s+Math.round(norm(v)*10),0)/10}function fmt(v){return norm(v).toFixed(1)}function weekNow(){let d=Math.floor((new Date()-START)/604800000)+1;return Math.max(1,Math.min(TOTAL,d))}function range(w){let a=new Date(START);a.setDate(a.getDate()+(w-1)*7);let b=new Date(a);b.setDate(b.getDate()+4);let f=d=>d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});return f(a)+'–'+f(b)}async function load(){status.textContent='Cargando datos…';let url=course==='current'?CURRENT:HISTORY,total=course==='current'?TOTAL:18;scores=empty(total);try{let r=await fetch(url,{cache:'no-store'}),j=await r.json(),rec=j.record||{};for(let[k,a]of Object.entries(rec.scores||{})){let key=TEAMS.find(t=>k.replace('Âº','º')===t);if(key&&Array.isArray(a))scores[key]=[...a.slice(0,total),...Array(total).fill(0)].slice(0,total).map(norm)}lastUpdate=rec.lastUpdate||null;render()}catch(e){status.textContent='No se pudieron cargar los datos. Vuelve a intentarlo.'}}function render(){let history=course==='history',seg=history?{from:1,to:18}:TERMS[term],weeks=Array.from({length:seg.to-seg.from+1},(_,i)=>seg.from+i),now=weekNow();document.querySelector('#course-title').textContent=history?'Histórico · Curso 2025/26':'Curso 2026/27';document.querySelector('#course-subtitle').textContent=history?'Clasificación final conservada para consulta':'Clasificación reiniciada · todos los equipos comienzan con 0 puntos';document.querySelector('#term-tabs').classList.toggle('hidden',history);document.querySelector('#calendar-note').classList.toggle('hidden',history);head.innerHTML='<tr><th>Pos</th><th class="team">Equipo</th>'+weeks.map(w=>'<th class="'+(!history&&w===now?'current':'')+'" title="'+(history?'':range(w))+'">S'+w+'</th>').join('')+'<th class="total">Total</th></tr>';let ranked=[...TEAMS].sort((a,b)=>sum(scores[b])-sum(scores[a]));body.innerHTML=ranked.map((t,i)=>'<tr><td>'+(i+1)+'º</td><td class="team">'+t+'</td>'+weeks.map(w=>'<td class="'+(!history&&w===now?'current':(!history&&w>now?'future':''))+'">'+fmt(scores[t][w-1])+'</td>').join('')+'<td class="total">'+fmt(sum(scores[t]))+'</td></tr>').join('');status.textContent=lastUpdate?'Actualizado: '+new Date(lastUpdate).toLocaleString('es-ES',{dateStyle:'medium',timeStyle:'short'}):history?'Temporada archivada':'Temporada preparada'}document.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-course]').forEach(x=>x.classList.toggle('active',x===b));course=b.dataset.course;load()});document.querySelectorAll('[data-term]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-term]').forEach(x=>x.classList.toggle('active',x===b));term=+b.dataset.term;render()});load();</script></body></html>
