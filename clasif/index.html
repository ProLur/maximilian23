<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clasificación • Juego del Silencio</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: "Courier New", Courier, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100dvh;
      background-image:
        radial-gradient(circle at 25% 15%, rgba(0,255,204,0.08) 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, rgba(0,255,204,0.06) 0%, transparent 50%);
      background-attachment: fixed;
    }
    header {
      background: rgba(22,27,34,0.92);
      backdrop-filter: blur(8px);
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header img {
      height: 45px;
      border-radius: 50%;
      border: 2px solid #00ffcc88;
      box-shadow: 0 0 12px #00ffcc55;
    }
    header h1 {
      font-size: 1.7rem;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffccaa;
    }
    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .intro {
      text-align: center;
      margin: 3rem auto 2.5rem;
      max-width: 800px;
      padding: 1.8rem;
      background: rgba(30,45,61,0.38);
      border: 1px solid #00ffcc44;
      border-radius: 14px;
      backdrop-filter: blur(6px);
    }
    .semana-principal {
      font-size: 1.9rem;
      font-weight: bold;
      color: #00ffcc;
    }
    .classification {
      background: rgba(30,45,61,0.35);
      border: 2px solid #00ffcc55;
      border-radius: 14px;
      padding: 2rem;
      backdrop-filter: blur(6px);
      overflow-x: auto;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: rgba(13,17,23,0.85);
      border: 3px solid #00ffcc;
      border-radius: 12px;
      overflow: hidden;
      min-width: 820px;
    }
    th {
      background: linear-gradient(#00ffcc22, transparent);
      color: #00ffcc;
      padding: 16px 12px;
      font-size: 1.2rem;
      border-bottom: 3px solid #00ffcc66;
      text-shadow: 0 0 6px #00ffcc88;
      transition: all 0.3s;
    }
    td {
      padding: 16px 12px;
      text-align: center;
      border-bottom: 1px solid #00ffcc33;
      font-size: 1.35rem;
      font-weight: bold;
      transition: background 0.2s;
    }
    tr:hover td { background: rgba(0,255,204,0.09); }
    .team-name {
      text-align: left;
      padding-left: 2.2rem;
      color: #00ffcc;
      font-size: 1.4rem;
    }
    .posicion-cell {
      font-weight: bold;
      min-width: 80px;
      text-align: center;
      color: #00ffcc;
    }
    .total-cell {
      background: rgba(0,255,204,0.22) !important;
      color: #00ffcc;
      font-size: 1.55rem;
      border-left: 3px solid #00ffcc;
      font-weight: bold;
    }
    footer {
      text-align: center;
      padding: 3rem 1rem 2rem;
      color: #00ffcc88;
      font-size: 0.95rem;
      border-top: 1px solid #00ffcc33;
      margin-top: 5rem;
    }
    .semana-pasada {
      color: #ff4444 !important;
      text-shadow: 0 0 8px #ff444488 !important;
      background: linear-gradient(#ff444422, transparent) !important;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Logo">
    <h1>Clasificación • Juego del Silencio</h1>
  </header>
  <div class="container">

    <!-- Primero: tabla de clasificación -->
    <div class="classification">
      <h2 style="text-align:center; color:#00ffcc; margin-bottom:1.5rem; font-size:1.8rem;">
        Tabla de Clasificación
      </h2>
      <table>
        <thead>
          <tr>
            <th>Posición</th>
            <th>Equipo</th>
            <th>Semana 1</th>
            <th>Semana 2</th>
            <th>Semana 3</th>
            <th>Semana 4</th>
            <th>Semana 5</th>
            <th>Semana 6</th>
            <th>TOTAL</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="9" style="text-align:center; padding:2rem;">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>

    <!-- Después: cuadro con la semana actual y fechas -->
    <div class="intro">
      <div class="semana-principal" id="rango-fechas">Cargando fechas...</div>
    </div>

  </div>
  <footer>
    CEIP Juan XXIII • Zafra • Actualizado: <span id="last-update">—</span>
  </footer>

  <script>
    const STORAGE_URL = 'https://api.jsonbin.io/v3/b/699588baae596e708f33e153';
    const teams = ["3º A", "3º B", "4º A", "4º B"];
    let scores = {
      "3º A": [0,0,0,0,0,0],
      "3º B": [0,0,0,0,0,0],
      "4º A": [0,0,0,0,0,0],
      "4º B": [0,0,0,0,0,0]
    };

    const FECHA_INICIO = new Date(2026, 1, 16); // 16 de febrero de 2026

    function calcularSemanaActual() {
      const hoy = new Date();
      const diffMs = hoy - FECHA_INICIO;
      const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const semanasCompletas = Math.floor(diffDias / 7);
      return semanasCompletas + 1;
    }

    function getRangoSemana(semana) {
      const inicio = new Date(FECHA_INICIO);
      inicio.setDate(inicio.getDate() + (semana - 1) * 7);
      
      const fin = new Date(inicio);
      fin.setDate(fin.getDate() + 6);

      const meses = ["enero","febrero","marzo","abril","mayo","junio",
                     "julio","agosto","septiembre","octubre","noviembre","diciembre"];

      return `Semana ${semana} desde el ${inicio.getDate()} de ${meses[inicio.getMonth()]} al ${fin.getDate()} de ${meses[fin.getMonth()]}`;
    }

    function getPuesto(posicion) {
      if (posicion === 1) return "1º";
      if (posicion === 2) return "2º";
      if (posicion === 3) return "3º";
      return "4º";
    }

    async function loadData() {
      try {
        const res = await fetch(STORAGE_URL, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          scores = data.record.scores || scores;
          if (data.record.lastUpdate) {
            document.getElementById('last-update').textContent = 
              new Date(data.record.lastUpdate).toLocaleString('es-ES');
          }
        }
      } catch (e) {
        console.error("Error al cargar:", e);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      const rankedTeams = [...teams].sort((a,b) => {
        const totalA = scores[a].reduce((sum,p)=>sum+p,0);
        const totalB = scores[b].reduce((sum,p)=>sum+p,0);
        if (totalA !== totalB) return totalB - totalA;
        for (let i = 5; i >= 0; i--) {
          if (scores[a][i] !== scores[b][i]) return scores[b][i] - scores[a][i];
        }
        return 0;
      });

      rankedTeams.forEach((team, index) => {
        const posicion = index + 1;
        const puesto = getPuesto(posicion);

        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="posicion-cell">${puesto}</td>
          <td class="team-name">${team}</td>
        `;
        let total = 0;
        scores[team].forEach(points => {
          row.innerHTML += `<td>${points}</td>`;
          total += points;
        });
        row.innerHTML += `<td class="total-cell">${total}</td>`;
        tbody.appendChild(row);
      });

      const semanaActual = calcularSemanaActual();
      const headers = document.querySelectorAll('thead th');

      for (let i = 2; i <= 7; i++) {  // Desde Semana 1 (col 3) hasta Semana 6 (col 8)
        headers[i].classList.remove('semana-pasada');
      }

      for (let i = 2; i < (semanaActual + 1) && i <= 7; i++) {
        headers[i].classList.add('semana-pasada');
      }

      document.getElementById('rango-fechas').textContent = getRangoSemana(semanaActual);
    }

    window.onload = async () => {
      await loadData();
      renderTable();
    };
  </script>
</body>
</html>
