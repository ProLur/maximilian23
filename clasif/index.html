<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clasificación • Juego del Silencio</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Courier New", Courier, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100dvh;
      background-image:
        radial-gradient(circle at 25% 15%, rgba(0,255,204,0.07) 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, rgba(0,255,204,0.05) 0%, transparent 50%);
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: rgba(22,27,34,0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid #00ffcc99;
      box-shadow: 0 0 10px #00ffcc44;
      flex: 0 0 auto;
    }

    header h1 {
      min-width: 0;
      font-size: clamp(1.15rem, 4.4vw, 1.55rem);
      color: #00ffcc;
      text-shadow: 0 0 7px #00ffccaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .main-content {
      flex: 1;
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 1rem;
    }

    .classification {
      background: rgba(30,45,61,0.32);
      border: 2px solid #00ffcc55;
      border-radius: 12px;
      padding: 1.2rem;
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.45);
      margin-bottom: 2rem;
    }

    .classification h2 {
      text-align: center;
      color: #00ffcc;
      margin-bottom: 1.2rem;
      font-size: clamp(1.35rem, 4vw, 1.7rem);
      text-shadow: 0 0 7px #00ffcc66;
    }

    .table-wrapper {
      position: relative;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: #00ffcc66 rgba(13,17,23,0.35);
    }

    table {
      width: 100%;
      min-width: 980px;
      table-layout: fixed;
      border-collapse: collapse;
      background: rgba(13,17,23,0.88);
      border: 2px solid #00ffcc77;
      border-radius: 10px;
      overflow: hidden;
    }

    th,
    td {
      padding: 11px 7px;
      text-align: center;
      border-bottom: 1px solid #00ffcc2a;
      font-size: clamp(0.82rem, 1.25vw, 1rem);
      font-weight: bold;
    }

    th {
      background: rgba(13,17,23,0.96);
      color: #00ffcc;
      text-shadow: 0 0 5px #00ffcc77;
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: nowrap;
    }

    .pos-col {
      width: 58px;
      background: rgba(13,17,23,1);
      color: #00ffcc;
    }

    .team-col {
      width: 138px;
      background: rgba(13,17,23,1);
      text-align: left;
      padding-left: 1rem;
      color: #00ffcc;
      font-size: clamp(0.95rem, 1.6vw, 1.15rem);
      white-space: nowrap;
    }

    .week-col {
      width: 48px;
    }

    .sticky-left {
      position: sticky;
      left: 0;
      z-index: 4;
      box-shadow: 6px 0 10px rgba(0,0,0,0.22);
    }

    .team-col.sticky-left {
      left: 58px;
    }

    .sticky-right {
      position: sticky;
      right: 0;
      z-index: 4;
      box-shadow: -6px 0 10px rgba(0,0,0,0.22);
      background: rgba(13,17,23,1);
    }

    .total-col {
      width: 82px;
      color: #00ffcc;
      font-size: clamp(1rem, 1.8vw, 1.25rem);
      border-left: 3px solid #00ffcc99;
    }

    .mobile-toggle {
      display: none;
    }

    .quarantine-col {
      background: linear-gradient(rgba(255,85,85,0.24), rgba(255,85,85,0.08)) !important;
      color: #ff7b7b !important;
      text-shadow: 0 0 7px rgba(255,85,85,0.55) !important;
    }

    .semana-pasada {
      color: #ff5555 !important;
      background: linear-gradient(#ff444422, transparent) !important;
      text-shadow: 0 0 7px #ff444488 !important;
    }

    .semana-actual-col {
      background: linear-gradient(rgba(0,255,204,0.42), rgba(0,255,204,0.14)) !important;
      color: #b9fff0 !important;
      text-shadow: 0 0 10px rgba(0,255,204,0.75) !important;
      box-shadow: inset 0 0 0 1px rgba(0,255,204,0.26);
    }

    tr:hover td {
      background: rgba(0,255,204,0.11);
    }

    tr:hover td.pos-col,
    tr:hover td.team-col,
    tr:hover td.total-col {
      background: rgba(13,17,23,1);
    }

    .intro {
      text-align: center;
      margin: 1.8rem auto 2rem;
      padding: 1.4rem;
      background: rgba(30,45,61,0.35);
      border: 1px solid #00ffcc44;
      border-radius: 12px;
      backdrop-filter: blur(6px);
      max-width: 600px;
    }

    .semana-numero {
      font-size: clamp(1.9rem, 6vw, 2.4rem);
      font-weight: bold;
      color: #00ffcc;
      margin-bottom: 0.3rem;
    }

    .semana-rango {
      font-size: clamp(1.1rem, 4vw, 1.3rem);
      color: #00ffccaa;
    }

    footer {
      text-align: center;
      padding: 2.5rem 1rem 1.8rem;
      color: #00ffcc88;
      font-size: 0.9rem;
      border-top: 1px solid #00ffcc33;
      margin-top: auto;
    }

    @media (max-width: 700px) {
      header {
        justify-content: flex-start;
        padding: 0.8rem 0.9rem;
        gap: 0.6rem;
      }

      header img {
        width: 34px;
        height: 34px;
      }

      .main-content {
        padding: 0.75rem;
      }

      .classification {
        padding: 0.75rem;
        border-radius: 10px;
      }

      .table-wrapper {
        overflow: visible;
      }

      table,
      thead,
      tbody,
      tr,
      td {
        display: block;
        width: 100%;
      }

      table {
        min-width: 0;
        table-layout: auto;
        border: 0;
        background: transparent;
      }

      thead {
        display: none;
      }

      tr {
        margin-bottom: 0.85rem;
        padding: 0.8rem;
        border: 1px solid #00ffcc55;
        border-radius: 10px;
        background: rgba(13,17,23,0.9);
        box-shadow: 0 4px 16px rgba(0,0,0,0.28);
      }

      td {
        min-width: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.8rem;
        padding: 0.42rem 0;
        border-bottom: 1px solid #00ffcc22;
        text-align: right;
        font-size: 0.98rem;
      }

      td::before {
        content: attr(data-label);
        color: #00ffccaa;
        font-weight: normal;
        text-align: left;
      }

      tr td:last-child {
        border-bottom: 0;
      }

      .sticky-left,
      .sticky-right,
      .team-col.sticky-left {
        position: static;
        left: auto;
        right: auto;
        box-shadow: none;
      }

      .pos-col,
      .team-col,
      .week-col,
      .total-col {
        width: 100%;
        background: transparent;
      }

      .pos-col {
        color: #00ffcc;
        font-size: 1.1rem;
      }

      .team-col {
        padding-left: 0;
        color: #00ffcc;
        font-size: 1.2rem;
        flex-wrap: wrap;
      }

      .team-col::before {
        content: none;
      }

      .total-col {
        margin-top: 0.35rem;
        padding: 0.58rem 0.65rem;
        border: 1px solid #00ffcc77;
        border-left: 1px solid #00ffcc77;
        border-radius: 8px;
        background: rgba(0,255,204,0.16);
        font-size: 1.18rem;
      }

      .week-col {
        display: none;
      }

      tr.is-open .week-col {
        display: flex;
      }

      .mobile-toggle {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 32px;
        padding: 0 0.7rem;
        border: 1px solid #00ffcc66;
        border-radius: 8px;
        background: rgba(0,255,204,0.12);
        color: #00ffcc;
        font-family: inherit;
        font-size: 0.86rem;
        font-weight: bold;
        cursor: pointer;
      }

      .team-main {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
        width: 100%;
      }

      .semana-actual-col,
      .quarantine-col,
      .semana-pasada {
        border-radius: 6px;
        padding-left: 0.5rem;
        padding-right: 0.5rem;
      }

      .intro {
        margin-top: 1rem;
        padding: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Logo">
    <h1>Clasificación • Juego del Silencio</h1>
  </header>

  <main class="main-content">
    <section class="classification">
      <h2>Tabla de Clasificación</h2>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th class="pos-col sticky-left">Pos</th>
              <th class="team-col sticky-left">Equipo</th>
              <th class="week-col">S1</th>
              <th class="week-col">S2</th>
              <th class="week-col">S3</th>
              <th class="week-col">S4</th>
              <th class="week-col">S5</th>
              <th class="week-col">S6</th>
              <th class="week-col">S7</th>
              <th class="week-col">S8</th>
              <th class="week-col">S9</th>
              <th class="week-col">S10</th>
              <th class="week-col">S11</th>
              <th class="week-col">S12</th>
              <th class="week-col">S13</th>
              <th class="week-col">S14</th>
              <th class="week-col">S15</th>
              <th class="week-col">S16</th>
              <th class="week-col">S17</th>
              <th class="week-col">S18</th>
              <th class="total-col sticky-right">Total</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="21" style="padding:2.5rem; text-align:center;">Cargando datos...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="intro">
      <div class="semana-numero" id="semana-actual">Cargando...</div>
      <div class="semana-rango" id="rango-fechas">Cargando fechas...</div>
    </section>
  </main>

  <footer>
    CEIP Juan XXIII • Zafra • Actualizado: <span id="last-update">—</span>
  </footer>

  <script>
    const STORAGE_URL = 'https://api.jsonbin.io/v3/b/699588baae596e708f33e153';
    const TOTAL_WEEKS = 18;
    const teams = ["3º A", "3º B", "4º A", "4º B"];
    const TEAM_ALIASES = {
      "3º A": "3º A",
      "3Âº A": "3º A",
      "3º B": "3º B",
      "3Âº B": "3º B",
      "4º A": "4º A",
      "4Âº A": "4º A",
      "4º B": "4º B",
      "4Âº B": "4º B"
    };
    let scores = {
      "3º A": Array(TOTAL_WEEKS).fill(0),
      "3º B": Array(TOTAL_WEEKS).fill(0),
      "4º A": Array(TOTAL_WEEKS).fill(0),
      "4º B": Array(TOTAL_WEEKS).fill(0)
    };
    const FECHA_INICIO = new Date(2026, 1, 16);
    const QUARANTINE_WEEKS = [8, 9];

    function normalizeScore(value) {
      const numericValue = Number(value);
      if (!Number.isFinite(numericValue)) return 0;
      return Math.round(numericValue * 10) / 10;
    }

    function scoreToTenths(value) {
      return Math.round(normalizeScore(value) * 10);
    }

    function sumScores(values) {
      return values.reduce((sum, value) => sum + scoreToTenths(value), 0) / 10;
    }

    function formatScore(value) {
      return normalizeScore(value).toFixed(1);
    }

    function calcularSemanaActual() {
      const hoy = new Date();
      const diffMs = hoy - FECHA_INICIO;
      const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const semanas = Math.floor(diffDias / 7);
      return Math.min(semanas + 1, TOTAL_WEEKS);
    }

    function getRangoSemana(semana) {
      const inicio = new Date(FECHA_INICIO);
      inicio.setDate(inicio.getDate() + (semana - 1) * 7);
      const fin = new Date(inicio);
      fin.setDate(fin.getDate() + 6);
      const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
      return `del ${inicio.getDate()} ${meses[inicio.getMonth()]} al ${fin.getDate()} ${meses[fin.getMonth()]}`;
    }

    function getPuesto(pos) {
      return pos === 1 ? "1º" : pos === 2 ? "2º" : pos === 3 ? "3º" : "4º";
    }

    async function loadData() {
      try {
        const res = await fetch(STORAGE_URL, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          const loaded = data.record.scores;

          if (loaded) {
            Object.keys(loaded).forEach(teamKey => {
              const normalizedTeam = TEAM_ALIASES[teamKey];
              if (normalizedTeam && Array.isArray(loaded[teamKey])) {
                scores[normalizedTeam] = [
                  ...loaded[teamKey].slice(0, TOTAL_WEEKS),
                  ...Array(TOTAL_WEEKS).fill(0)
                ].slice(0, TOTAL_WEEKS).map(normalizeScore);
              }
            });
          }

          if (data.record.lastUpdate) {
            document.getElementById('last-update').textContent =
              new Date(data.record.lastUpdate).toLocaleString('es-ES', {
                dateStyle: 'medium',
                timeStyle: 'short'
              });
          }
        }
      } catch (e) {
        console.error("Error al cargar datos", e);
      }
    }

    function renderTable() {
      const tableBody = document.getElementById('table-body');
      tableBody.innerHTML = '';
      const semanaActual = calcularSemanaActual();

      const rankedTeams = [...teams].sort((a,b) => {
        const ta = scoreToTenths(sumScores(scores[a]));
        const tb = scoreToTenths(sumScores(scores[b]));
        if (ta !== tb) return tb - ta;

        for (let i = TOTAL_WEEKS - 1; i >= 0; i--) {
          const weekDiff = scoreToTenths(scores[b][i]) - scoreToTenths(scores[a][i]);
          if (weekDiff !== 0) return weekDiff;
        }

        return 0;
      });

      rankedTeams.forEach((team, i) => {
        const pos = i + 1;
        const total = sumScores(scores[team]);

        let rowHTML = `
          <tr>
            <td class="pos-col sticky-left" data-label="Pos">${getPuesto(pos)}</td>
            <td class="team-col sticky-left" data-label="Equipo">
              <span class="team-main">
                <span>${team}</span>
                <button class="mobile-toggle" type="button" aria-expanded="false">Ver puntos</button>
              </span>
            </td>
        `;

        scores[team].forEach((puntos, idx) => {
          const weekNum = idx + 1;
          const quarantineClass = QUARANTINE_WEEKS.includes(weekNum) ? ' quarantine-col' : '';
          const currentWeekClass = weekNum === semanaActual ? ' semana-actual-col' : '';
          rowHTML += `<td class="week-col${quarantineClass}${currentWeekClass}" data-label="S${weekNum}">${formatScore(puntos)}</td>`;
        });

        rowHTML += `<td class="total-col sticky-right" data-label="Total">${formatScore(total)}</td></tr>`;
        tableBody.innerHTML += rowHTML;
      });

      document.querySelectorAll('thead th.week-col').forEach((th, idx) => {
        const week = idx + 1;
        th.classList.toggle('semana-pasada', week < semanaActual);
        th.classList.toggle('quarantine-col', QUARANTINE_WEEKS.includes(week));
        th.classList.toggle('semana-actual-col', week === semanaActual);
      });

      document.getElementById('semana-actual').textContent = `Semana ${semanaActual}`;
      document.getElementById('rango-fechas').textContent = getRangoSemana(semanaActual);
    }

    document.addEventListener('click', event => {
      const button = event.target.closest('.mobile-toggle');
      if (!button) return;

      const row = button.closest('tr');
      const isOpen = row.classList.toggle('is-open');
      button.setAttribute('aria-expanded', String(isOpen));
      button.textContent = isOpen ? 'Ocultar puntos' : 'Ver puntos';
    });

    window.onload = async () => {
      await loadData();
      renderTable();
    };
  </script>
</body>
</html>
