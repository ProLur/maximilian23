<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clasificación • Juego del Silencio</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Courier New", Courier, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100dvh;
      background-image:
        radial-gradient(circle at 25% 15%, rgba(0,255,204,0.07) 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, rgba(0,255,204,0.05) 0%, transparent 50%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
    }

    header {
      background: rgba(22,27,34,0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header img {
      height: 38px;
      border-radius: 50%;
      border: 2px solid #00ffcc99;
      box-shadow: 0 0 10px #00ffcc44;
    }

    header h1 {
      font-size: clamp(1.25rem, 5vw, 1.55rem);
      color: #00ffcc;
      text-shadow: 0 0 7px #00ffccaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .container {
      padding: 1rem;
      max-width: 1000px;
      margin: 0 auto;
    }

    .intro {
      text-align: center;
      margin: 1.8rem auto 2rem;
      padding: 1.4rem;
      background: rgba(30,45,61,0.35);
      border: 1px solid #00ffcc44;
      border-radius: 12px;
      backdrop-filter: blur(6px);
    }

    .semana-numero {
      font-size: clamp(1.9rem, 6vw, 2.4rem);
      font-weight: bold;
      color: #00ffcc;
      margin-bottom: 0.3rem;
    }

    .semana-rango {
      font-size: clamp(1.1rem, 4vw, 1.3rem);
      color: #00ffccaa;
    }

    .classification {
      background: rgba(30,45,61,0.32);
      border: 2px solid #00ffcc55;
      border-radius: 12px;
      padding: 1.4rem;
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.45);
      margin-bottom: 2rem;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 720px;          /* fuerza scroll horizontal en móviles */
      border-collapse: collapse;
      background: rgba(13,17,23,0.88);
      border: 2px solid #00ffcc77;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 12px 10px;
      text-align: center;
      border-bottom: 1px solid #00ffcc2a;
    }

    th {
      background: linear-gradient(#00ffcc18, transparent);
      color: #00ffcc;
      font-size: clamp(0.95rem, 3.5vw, 1.1rem);
      text-shadow: 0 0 5px #00ffcc77;
      white-space: nowrap;
    }

    td {
      font-size: clamp(1.05rem, 4vw, 1.25rem);
      font-weight: bold;
    }

    .team-name {
      text-align: left;
      padding-left: 1.6rem;
      color: #00ffcc;
      font-size: clamp(1.1rem, 4.2vw, 1.3rem);
    }

    .posicion-cell {
      min-width: 60px;
      font-weight: bold;
      color: #00ffcc;
    }

    .total-cell {
      background: rgba(0,255,204,0.24) !important;
      color: #00ffcc;
      font-size: clamp(1.2rem, 4.5vw, 1.45rem);
      border-left: 3px solid #00ffcc99;
      font-weight: bold;
    }

    tr:hover td {
      background: rgba(0,255,204,0.11);
    }

    footer {
      text-align: center;
      padding: 2.5rem 1rem 1.8rem;
      color: #00ffcc88;
      font-size: 0.9rem;
      border-top: 1px solid #00ffcc33;
    }

    .semana-pasada {
      color: #ff5555 !important;
      background: linear-gradient(#ff444422, transparent) !important;
      text-shadow: 0 0 7px #ff444488 !important;
    }

    /* Mejora legibilidad en pantallas muy pequeñas */
    @media (max-width: 480px) {
      header {
        padding: 0.8rem 0.9rem;
        gap: 0.6rem;
      }
      header img {
        height: 34px;
      }
      .classification {
        padding: 1rem;
      }
      th, td {
        padding: 10px 8px;
      }
      .team-name {
        padding-left: 1.2rem;
      }
      thead th:first-child,
      tbody td:first-child {
        position: sticky;
        left: 0;
        z-index: 3;
        min-width: 52px;
        background: #0d1117;
        box-shadow: 2px 0 0 #00ffcc44;
      }
      thead th:nth-child(2),
      .team-name {
        position: sticky;
        left: 52px;
        z-index: 3;
        min-width: 105px;
        background: #0d1117;
        box-shadow: 2px 0 0 #00ffcc44;
      }
      thead th:first-child,
      thead th:nth-child(2) {
        z-index: 4;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Logo">
    <h1>Clasificación • Juego del Silencio</h1>
  </header>

  <div class="container">

    <div class="classification">
      <h2 style="text-align:center; color:#00ffcc; margin-bottom:1.3rem; font-size: clamp(1.4rem, 5vw, 1.7rem);">
        Tabla de Clasificación
      </h2>
      <table>
        <thead>
          <tr>
            <th>Pos</th>
            <th>Equipo</th>
            <th>S1</th>
            <th>S2</th>
            <th>S3</th>
            <th>S4</th>
            <th>S5</th>
            <th>S6</th>
            <th>Total</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="9" style="padding:2.5rem; text-align:center;">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>

    <div class="intro">
      <div class="semana-numero" id="semana-actual">Cargando...</div>
      <div class="semana-rango" id="rango-fechas">Cargando fechas...</div>
    </div>

  </div>

  <footer>
    CEIP Juan XXIII • Zafra • Actualizado: <span id="last-update">—</span>
  </footer>

  <script>
    const STORAGE_URL = 'https://api.jsonbin.io/v3/b/699588baae596e708f33e153';
    const teams = ["3º A", "3º B", "4º A", "4º B"];
    let scores = {
      "3º A": [0,0,0,0,0,0],
      "3º B": [0,0,0,0,0,0],
      "4º A": [0,0,0,0,0,0],
      "4º B": [0,0,0,0,0,0]
    };
    const FECHA_INICIO = new Date(2026, 1, 16); // febrero 16, 2026

    function calcularSemanaActual() {
      const hoy = new Date();
      const diffMs = hoy - FECHA_INICIO;
      const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
      const semanasCompletas = Math.floor(diffDias / 7);
      return semanasCompletas + 1;
    }

    function getRangoSemana(semana) {
      const inicio = new Date(FECHA_INICIO);
      inicio.setDate(inicio.getDate() + (semana - 1) * 7);
      const fin = new Date(inicio);
      fin.setDate(fin.getDate() + 6);

      const meses = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
      return `del ${inicio.getDate()} ${meses[inicio.getMonth()]} al ${fin.getDate()} ${meses[fin.getMonth()]}`;
    }

    function getPuesto(pos) {
      return pos === 1 ? "1º" : pos === 2 ? "2º" : pos === 3 ? "3º" : "4º";
    }

    async function loadData() {
      try {
        const res = await fetch(STORAGE_URL, { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          scores = data.record.scores || scores;
          if (data.record.lastUpdate) {
            document.getElementById('last-update').textContent =
              new Date(data.record.lastUpdate).toLocaleString('es-ES', {
                dateStyle: 'medium', timeStyle: 'short'
              });
          }
        }
      } catch (e) {
        console.error("Error al cargar datos", e);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      const rankedTeams = [...teams].sort((a,b) => {
        const totalA = scores[a].reduce((s,p)=>s+p,0);
        const totalB = scores[b].reduce((s,p)=>s+p,0);
        if (totalA !== totalB) return totalB - totalA;
        for (let i = 5; i >= 0; i--) {
          if (scores[a][i] !== scores[b][i]) return scores[b][i] - scores[a][i];
        }
        return 0;
      });

      rankedTeams.forEach((team, i) => {
        const pos = i + 1;
        const total = scores[team].reduce((s,p)=>s+p,0);
        let rowHTML = `
          <tr>
            <td class="posicion-cell">${getPuesto(pos)}</td>
            <td class="team-name">${team}</td>
        `;
        scores[team].forEach(puntos => {
          rowHTML += `<td>${puntos}</td>`;
        });
        rowHTML += `<td class="total-cell">${total}</td></tr>`;
        tbody.innerHTML += rowHTML;
      });

      const semanaActual = calcularSemanaActual();
      const headers = document.querySelectorAll('thead th');
      for (let i = 2; i <= 7; i++) {
        headers[i].classList.remove('semana-pasada');
      }
      for (let i = 2; i < semanaActual + 1 && i <= 7; i++) {
        headers[i].classList.add('semana-pasada');
      }

      document.getElementById('semana-actual').textContent = `Semana ${semanaActual}`;
      document.getElementById('rango-fechas').textContent = getRangoSemana(semanaActual);
    }

    window.onload = async () => {
      await loadData();
      renderTable();
    };
  </script>
</body>
</html>
