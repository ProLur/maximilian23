<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meteo • Zafra • Maximilian23</title>
  <link rel="icon" href="https://maximilian23.com/Cabeza.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Courier New", Courier, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100dvh;
      background-image:
        radial-gradient(circle at 25% 15%, rgba(0,255,204,0.07) 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, rgba(0,255,204,0.05) 0%, transparent 50%);
      background-attachment: fixed;
    }
    header {
      background: rgba(22,27,34,0.94);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.7rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header img {
      height: 42px;
      border-radius: 50%;
      border: 2px solid #00ffcc99;
      box-shadow: 0 0 12px #00ffcc44;
    }
    header h1 {
      font-size: clamp(1.3rem, 5vw, 1.65rem);
      color: #00ffcc;
      text-shadow: 0 0 7px #00ffccaa;
    }
    .container {
      padding: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }
    .table-box {
      background: rgba(30,45,61,0.32);
      border: 2px solid #00ffcc55;
      border-radius: 12px;
      padding: 1.4rem;
      backdrop-filter: blur(6px);
      box-shadow: 0 6px 24px rgba(0,0,0,0.45);
      overflow-x: auto; /* Responsive scroll horizontal en mobile */
    }
    table {
      width: 100%;
      min-width: 900px; /* Fuerza scroll en pantallas pequeñas */
      border-collapse: collapse;
      background: rgba(13,17,23,0.88);
      border: 2px solid #00ffcc77;
      border-radius: 10px;
      overflow: hidden;
    }
    th, td {
      padding: 12px 10px;
      text-align: center;
      border-bottom: 1px solid #00ffcc2a;
    }
    th {
      background: linear-gradient(#00ffcc18, transparent);
      color: #00ffcc;
      text-shadow: 0 0 5px #00ffcc77;
      font-size: clamp(0.95rem, 3vw, 1.05rem);
    }
    td {
      font-size: clamp(1rem, 3.5vw, 1.15rem);
    }
    tr:hover td {
      background: rgba(0,255,204,0.11);
    }
    .loading {
      padding: 3rem;
      text-align: center;
      color: #00ffccaa;
      font-size: 1.2rem;
    }
    @media (min-width: 768px) {
      th, td {
        padding: 14px 16px; /* Más espacio en desktop */
      }
      table {
        min-width: auto; /* No fuerza scroll en desktop */
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Logo">
    <h1>Estación Meteorológica • Zafra</h1>
  </header>

  <div class="container">
    <div class="table-box">
      <h2 style="text-align:center; color:#00ffcc; margin-bottom:1.2rem; font-size: clamp(1.5rem, 5vw, 1.8rem);">
        Registro Meteorológico
      </h2>
      <table>
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Temp Indoor (°C)</th>
            <th>Hum Indoor (%)</th>
            <th>Temp Outdoor (°C)</th>
            <th>Hum Outdoor (%)</th>
            <th>Wind Speed (km/h)</th>
            <th>Wind Chill (°C)</th>
            <th>Wind Direction</th>
          </tr>
        </thead>
        <tbody id="tabla">
          <tr><td colspan="8" class="loading">Cargando datos...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const BIN_ID = "69aaa6b0d0ea881f40f4bc92";
    const KEY    = "$2a$10$Z4/lj4bJs4gRcw67snP9zewPYv9rbqaXFeGKdX07gqvA0ucBoTgVy";

    async function cargar() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          headers: { "X-Master-Key": KEY },
          cache: "no-store"
        });
        if (!res.ok) throw new Error("No se pudo cargar");
        const data = await res.json();
        const meteo = data.record.meteo || [];

        const tabla = document.getElementById("tabla");
        tabla.innerHTML = "";

        meteo.reverse().forEach(d => {
          tabla.innerHTML += `
            <tr>
              <td>${d.fecha || "?"}</td>
              <td>${d.temp_indoor || "?"}</td>
              <td>${d.hum_indoor || "?"}</td>
              <td>${d.temp_outdoor || "?"}</td>
              <td>${d.hum_outdoor || "?"}</td>
              <td>${d.wind_speed || "?"}</td>
              <td>${d.wind_chill || "?"}</td>
              <td>${d.wind_direction || "?"}</td>
            </tr>
          `;
        });

        if (meteo.length === 0) {
          tabla.innerHTML = `<tr><td colspan="8" class="loading">Aún no hay registros</td></tr>`;
        }
      } catch (err) {
        document.getElementById("tabla").innerHTML = 
          `<tr><td colspan="8" class="loading">Error al cargar: ${err.message}</td></tr>`;
      }
    }

    cargar();
  </script>
</body>
</html>
