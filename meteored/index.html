<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>Meteo • Zafra • Maximilian23</title>

<link rel="icon" href="https://maximilian23.com/Cabeza.png">
<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<header>
<img src="https://maximilian23.com/Cabeza.png">
<h1>Estación Meteorológica Maximilian 23</h1>
</header>

<div class="main-container">
<div class="content-wrapper">

<div class="charts-grid">

<div class="chart-card" data-type="temp_indoor" onclick="openModalChart(this)">
<h3>Temperatura interior (°C)</h3>
<div class="chart-container">
<canvas id="chart-temp-indoor"></canvas>
</div>
</div>

<div class="chart-card" data-type="temp_outdoor" onclick="openModalChart(this)">
<h3>Temperatura exterior (°C)</h3>
<div class="chart-container">
<canvas id="chart-temp-outdoor"></canvas>
</div>
</div>

<div class="chart-card" data-type="hum_indoor" onclick="openModalChart(this)">
<h3>Humedad interior (%)</h3>
<div class="chart-container">
<canvas id="chart-hum-indoor"></canvas>
</div>
</div>

<div class="chart-card" data-type="hum_outdoor" onclick="openModalChart(this)">
<h3>Humedad exterior (%)</h3>
<div class="chart-container">
<canvas id="chart-hum-outdoor"></canvas>
</div>
</div>

<div class="chart-card" data-type="wind_speed" onclick="openModalChart(this)">
<h3>Velocidad del viento (km/h)</h3>
<div class="chart-container">
<canvas id="chart-wind-speed"></canvas>
</div>
</div>

</div>

<div class="calendar-box">
<div class="month-title" id="monthYear"></div>
<div class="calendar" id="calendar"></div>
</div>

</div>
</div>


<div class="modal" id="dayModal">
<div class="modal-content" style="max-width:420px;height:auto;">
<span class="close-btn" onclick="document.getElementById('dayModal').style.display='none'">×</span>
<h3 id="modalTitle">Datos del día</h3>
<table id="dayDataTable"><tbody></tbody></table>
</div>
</div>


<div class="modal" id="chartModal">
<div class="modal-content">
<span class="close-btn" onclick="document.getElementById('chartModal').style.display='none'">×</span>
<div class="modal-title" id="modalChartTitle"></div>
<div class="modal-chart-container">
<canvas id="modalChartCanvas"></canvas>
</div>
</div>
</div>



<script>

const BIN_ID="69aaa6b0d0ea881f40f4bc92";
const KEY="$2a$10$Z4/lj4bJs4gRcw67snP9zewPYv9rbqaXFeGKdX07gqvA0ucBoTgVy";

let allData=[];
let smallCharts={};
let modalChart=null;

const hoy=new Date();
const año=hoy.getFullYear();
const mes=hoy.getMonth();

const meses=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

document.getElementById("monthYear").textContent=`${meses[mes]} ${año}`;


const chartConfigs={
temp_indoor:{label:"Temperatura interior",color:"#00ffcc",unit:"°C"},
temp_outdoor:{label:"Temperatura exterior",color:"#ffaa00",unit:"°C"},
hum_indoor:{label:"Humedad interior",color:"#88ddff",unit:"%"},
hum_outdoor:{label:"Humedad exterior",color:"#aaff88",unit:"%"},
wind_speed:{label:"Velocidad del viento",color:"#ff66aa",unit:"km/h"}
};


function crearCalendario(datos){

const cal=document.getElementById("calendar");
cal.innerHTML="";

const diasConDatos=new Set(datos.map(d=>d.fecha));

const primerDia=new Date(año,mes,1).getDay()||7;
const diasMes=new Date(año,mes+1,0).getDate();

for(let i=1;i<primerDia;i++){

const vacio=document.createElement("div");
vacio.className="day";
cal.appendChild(vacio);

}

for(let i=1;i<=diasMes;i++){

const fecha=`${año}-${(mes+1).toString().padStart(2,"0")}-${i.toString().padStart(2,"0")}`;

const d=document.createElement("div");

d.className="day";
d.textContent=i;

if(diasConDatos.has(fecha))
d.classList.add("hasdata");

if(i===hoy.getDate())
d.classList.add("today");

d.onclick=()=>mostrarDatosDia(fecha,datos);

cal.appendChild(d);

}

}


function mostrarDatosDia(fecha,datos){

const dato=datos.find(d=>d.fecha===fecha);

const tbody=document.getElementById("dayDataTable").querySelector("tbody");

tbody.innerHTML="";

document.getElementById("modalTitle").textContent=`Datos: ${fecha}`;

if(dato){

const campos=[

["Temperatura interior",dato.temp_indoor,"°C"],
["Humedad interior",dato.hum_indoor,"%"],
["Temperatura exterior",dato.temp_outdoor,"°C"],
["Humedad exterior",dato.hum_outdoor,"%"],
["Velocidad viento",dato.wind_speed,"km/h"],
["Ráfaga",dato.wind_gust,"km/h"],
["Dirección viento",dato.wind_direction,"°"],
["Sensación térmica",dato.wind_chill,"°C"],
["Lluvia",dato.rain,"mm"],
["Presión",dato.pressure,"hPa"]

];

campos.forEach(([label,value,unit])=>{

if(value!==undefined&&value!==""&&value!==null){

const tr=document.createElement("tr");

tr.innerHTML=`<td style="font-weight:bold;color:#00ffccaa;">${label}:</td><td>${value} ${unit}</td>`;

tbody.appendChild(tr);

}

});

}

else{

tbody.innerHTML='<tr><td colspan="2" style="text-align:center;padding:1.8rem;">Sin datos</td></tr>';

}

document.getElementById("dayModal").style.display="flex";

}



async function cargar(){

try{

const url=`https://api.jsonbin.io/v3/b/${BIN_ID}/latest?t=${Date.now()}`;

const res=await fetch(url,{
cache:"no-store",
headers:{"X-Master-Key":KEY}
});

const json=await res.json();

allData=json?.record?.meteo || json?.record || [];

crearCalendario(allData);

Object.keys(chartConfigs).forEach(type=>{

const canvasId=`chart-${type.replace(/_/g,'-')}`;

smallCharts[type]=createSmallChart(canvasId,type);

});

}

catch(e){

console.error(e);

document.querySelector(".main-container").innerHTML+=
"<p style='text-align:center;padding:3rem;color:#ff6666;font-size:1.3rem;'>Error al cargar datos meteorológicos</p>";

}

}

cargar();

</script>

</body>
</html>
