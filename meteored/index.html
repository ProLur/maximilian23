<!DOCTYPE html>
<html lang="es"> 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Meteo • Zafra • Maximilian23</title>
  <link rel="icon" href="https://maximilian23.com/Cabeza.png">
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: "Courier New", monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 25% 15%, rgba(0,255,204,0.07) 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, rgba(0,255,204,0.05) 0%, transparent 50%);
    }
    header {
      background: rgba(22,27,34,0.94);
      backdrop-filter: blur(10px);
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header img {
      height: clamp(38px, 9vw, 48px);
      border-radius: 50%;
      border: 2px solid #00ffccaa;
      box-shadow: 0 0 10px #00ffcc55;
    }
    header h1 {
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffccbb;
      font-size: clamp(1.3rem, 5.5vw, 1.7rem);
    }
    .main-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .content-wrapper {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }
    .chart-box, .calendar-box {
      background: rgba(30,45,61,0.35);
      border: 2px solid #00ffcc55;
      border-radius: 12px;
      padding: 1.4rem;
      backdrop-filter: blur(6px);
    }
    .chart-box {
      min-height: 380px;
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }
    .day {
      padding: clamp(14px, 4vw, 20px);
      font-size: clamp(0.95rem, 4vw, 1.2rem);
      text-align: center;
      border: 1px solid #00ffcc44;
      border-radius: 8px;
      background: #161b22;
      cursor: pointer;
      transition: all 0.18s;
    }
    .day:hover {
      background: rgba(0,255,204,0.15);
      transform: scale(1.04);
    }
    .today {
      border: 3px solid #00ffcc;
      background: rgba(0,255,204,0.25);
      font-weight: bold;
    }
    .hasdata {
      background: #00ffcc22;
      color: #00ffcc;
    }
    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-content {
      background: rgba(30,45,61,0.95);
      border: 2px solid #00ffcc88;
      border-radius: 12px;
      padding: 1.8rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,255,204,0.35);
    }
    .modal h3 {
      color: #00ffcc;
      margin-bottom: 1.2rem;
      text-align: center;
    }
    .modal table {
      width: 100%;
      border-collapse: collapse;
    }
    .modal td {
      padding: 8px;
      border-bottom: 1px solid #00ffcc33;
    }
    .close-btn {
      float: right;
      font-size: 2rem;
      color: #00ffccaa;
      cursor: pointer;
    }
    @media (min-width: 900px) {
      .content-wrapper {
        flex-direction: row;
        gap: 2.5rem;
      }
      .chart-box { flex: 2; }
      .calendar-box { flex: 1; max-width: 420px; }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Logo">
    <h1>Estación Meteorológica • Zafra</h1>
  </header>

  <div class="main-container">
    <div class="content-wrapper">
      <div class="chart-box">
        <canvas id="meteoChart"></canvas>
      </div>
      <div class="calendar-box">
        <div class="calendar" id="calendar"></div>
      </div>
    </div>
  </div>

  <!-- Modal con datos del día -->
  <div class="modal" id="dayModal">
    <div class="modal-content">
      <span class="close-btn" onclick="document.getElementById('dayModal').style.display='none'">×</span>
      <h3 id="modalTitle">Datos del día</h3>
      <table id="dayDataTable">
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script>
    const BIN_ID = "69aaa6b0d0ea881f40f4bc92";
    const KEY = "$2a$10$Z4/lj4bJs4gRcw67snP9zewPYv9rbqaXFeGKdX07gqvA0ucBoTgVy";

    let chart;
    let allData = [];

    const hoy = new Date();
    const año = hoy.getFullYear();
    const mes = hoy.getMonth();

    function crearCalendario(datos) {
      const cal = document.getElementById("calendar");
      cal.innerHTML = "";
      const diasConDatos = new Set(datos.map(d => d.fecha));
      const primerDia = new Date(año, mes, 1).getDay() || 7;
      const diasMes = new Date(año, mes + 1, 0).getDate();

      for (let i = 1; i < primerDia; i++) {
        const vacio = document.createElement("div");
        vacio.className = "day";
        cal.appendChild(vacio);
      }

      for (let i = 1; i <= diasMes; i++) {
        const fecha = `${año}-${(mes+1).toString().padStart(2,"0")}-${i.toString().padStart(2,"0")}`;
        const d = document.createElement("div");
        d.className = "day";
        d.textContent = i;
        if (diasConDatos.has(fecha)) d.classList.add("hasdata");
        if (i === hoy.getDate()) d.classList.add("today");

        d.onclick = () => mostrarDatosDia(fecha, datos);
        cal.appendChild(d);
      }
    }

    function mostrarDatosDia(fecha, datos) {
      const dato = datos.find(d => d.fecha === fecha);
      const tbody = document.getElementById("dayDataTable").querySelector("tbody");
      tbody.innerHTML = "";
      const title = document.getElementById("modalTitle");
      title.textContent = `Datos: ${fecha}`;

      if (dato) {
        const campos = [
          ["Temp Indoor", dato.temp_indoor],
          ["Hum Indoor", dato.hum_indoor],
          ["Temp Outdoor", dato.temp_outdoor],
          ["Hum Outdoor", dato.hum_outdoor],
          ["Viento", dato.wind_speed],
          ["Ráfaga", dato.wind_gust],
          ["Dirección", dato.wind_direction],
          ["Sensación", dato.wind_chill],
          ["Lluvia", dato.rain],
          ["Presión", dato.pressure]
        ];
        campos.forEach(([label, value]) => {
          if (value !== undefined && value !== "") {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td style="font-weight:bold;color:#00ffccaa;">${label}:</td><td>${value}</td>`;
            tbody.appendChild(tr);
          }
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;padding:1.5rem;">Sin datos para este día</td></tr>';
      }

      document.getElementById("dayModal").style.display = "flex";
    }

    function initChart(datos) {
      const ctx = document.getElementById("meteoChart").getContext("2d");
      if (chart) chart.destroy();

      const labels = datos.map(d => d.fecha.slice(5)); // MM-DD

      const datasets = [
        { label: "Temp Indoor °C", data: datos.map(d => parseFloat(d.temp_indoor)), borderColor: "#00ffcc", tension: 0.3, yAxisID: "y" },
        { label: "Temp Outdoor °C", data: datos.map(d => parseFloat(d.temp_outdoor)), borderColor: "#ffaa00", tension: 0.3, yAxisID: "y" },
        { label: "Humedad Indoor %", data: datos.map(d => parseFloat(d.hum_indoor)), borderColor: "#88ddff", tension: 0.3, yAxisID: "y1" },
        { label: "Humedad Outdoor %", data: datos.map(d => parseFloat(d.hum_outdoor)), borderColor: "#aaff88", tension: 0.3, yAxisID: "y1" },
        { label: "Viento km/h", data: datos.map(d => parseFloat(d.wind_speed)), borderColor: "#ff66aa", tension: 0.3, yAxisID: "y" }
      ].filter(ds => ds.data.some(v => !isNaN(v)));

      chart = new Chart(ctx, {
        type: "line",
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { position: "left", title: { display: true, text: "Temperatura / Viento" } },
            y1: { position: "right", title: { display: true, text: "Humedad %" }, grid: { drawOnChartArea: false } },
            x: { title: { display: true, text: "Fecha" } }
          },
          plugins: { legend: { position: "top", labels: { color: "#e6edf3" } } }
        }
      });
    }

    async function cargar() {
      try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
          cache: "no-store",
          headers: { "X-Master-Key": KEY }
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        allData = data?.record?.meteo || [];

        crearCalendario(allData);
        initChart(allData);
      } catch (e) {
        console.error(e);
        document.querySelector(".chart-box").innerHTML = "<p style='text-align:center;padding:3rem;color:#ff6666;'>Error al cargar datos</p>";
      }
    }

    cargar();
  </script>
</body>
</html>
