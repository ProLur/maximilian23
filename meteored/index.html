<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meteo • Zafra • Maximilian23</title>
<link rel="icon" href="https://maximilian23.com/Cabeza.png">

<style>

*{margin:0;padding:0;box-sizing:border-box}

body{
font-family:"Courier New",monospace;
background:#0d1117;
color:#e6edf3;
min-height:100vh;
background-image:
radial-gradient(circle at 25% 15%, rgba(0,255,204,0.07) 0%, transparent 50%),
radial-gradient(circle at 75% 85%, rgba(0,255,204,0.05) 0%, transparent 50%);
}

header{
background:rgba(22,27,34,0.94);
padding:0.8rem 1rem;
display:flex;
align-items:center;
gap:0.7rem;
border-bottom:2px solid #00ffcc;
}

header img{
height:38px;
border-radius:50%;
border:2px solid #00ffcc99;
}

header h1{
color:#00ffcc;
font-size:1.3rem;
text-shadow:0 0 6px #00ffccaa;
}

.container{
max-width:1100px;
margin:auto;
padding:1rem;
display:flex;
flex-direction:column;
gap:1rem;
}

.table-box{
background:rgba(30,45,61,0.32);
border:2px solid #00ffcc55;
border-radius:10px;
padding:1rem;
overflow-x:auto;
}

table{
width:100%;
border-collapse:collapse;
font-size:0.85rem;
font-variant-numeric:tabular-nums;
}

th,td{
padding:6px 8px;
border-bottom:1px solid #00ffcc2a;
}

th{
color:#00ffcc;
text-align:center;
background:linear-gradient(#00ffcc18, transparent);
}

td{
text-align:right;
}

.graph{
width:120px;
}

.bar{
height:12px;
border-radius:4px;
}

.temp{background:#ff8844}
.hum{background:#44aaff}
.wind{background:#88ff88}
.rain{background:#aaaaff}

.legend{
margin-top:12px;
font-size:0.8rem;
color:#00ffccaa;
display:flex;
gap:20px;
flex-wrap:wrap;
}

.legend div{
display:flex;
align-items:center;
gap:6px;
}

.legend span{
width:16px;
height:8px;
display:inline-block;
border-radius:4px;
}

</style>
</head>
<body>

<header>
<img src="https://maximilian23.com/Cabeza.png">
<h1>Estación Meteorológica • Zafra</h1>
</header>

<div class="container">

<div class="table-box">

<table>

<thead>
<tr>
<th>Fecha</th>
<th>Gráfico</th>
<th>Temp</th>
<th>Hum</th>
<th>Wind</th>
<th>Rain</th>
</tr>
</thead>

<tbody id="tabla">
<tr>
<td colspan="6">Cargando...</td>
</tr>
</tbody>

</table>

<div class="legend">

<div><span style="background:#ff8844"></span> Temperatura</div>
<div><span style="background:#44aaff"></span> Humedad</div>
<div><span style="background:#88ff88"></span> Viento</div>
<div><span style="background:#aaaaff"></span> Lluvia</div>

</div>

</div>

</div>

<script>

const BIN_ID="69aaa6b0d0ea881f40f4bc92"
const KEY="$2a$10$Z4/lj4bJs4gRcw67snP9zewPYv9rbqaXFeGKdX07gqvA0ucBoTgVy"

function bar(valor,max,clase){

const w=Math.min((valor/max)*100,100)

return `<div class="bar ${clase}" style="width:${w}%"></div>`

}

async function cargar(){

const res=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{
headers:{"X-Master-Key":KEY},
cache:"no-store"
})

const data=await res.json()
const meteo=data.record.meteo||[]

const tabla=document.getElementById("tabla")

let html=""

[...meteo].reverse().forEach(d=>{

const temp=d.temp_outdoor||0
const hum=d.hum_outdoor||0
const wind=d.wind_speed||0
const rain=d.rain||0

html+=`
<tr>

<td style="text-align:left">${d.fecha}</td>

<td class="graph">

${bar(temp,40,"temp")}
${bar(hum,100,"hum")}
${bar(wind,100,"wind")}
${bar(rain,50,"rain")}

</td>

<td>${temp}</td>
<td>${hum}</td>
<td>${wind}</td>
<td>${rain}</td>

</tr>
`

})

tabla.innerHTML=html

}

cargar()

</script>

</body>
</html>
