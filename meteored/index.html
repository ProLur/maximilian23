<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Meteo • Zafra</title>

<link rel="icon" href="https://maximilian23.com/Cabeza.png">

<style>

body{
font-family:"Courier New", monospace;
background:#0d1117;
color:#e6edf3;
min-height:100vh;
background-image:
radial-gradient(circle at 25% 15%, rgba(0,255,204,0.07) 0%, transparent 50%),
radial-gradient(circle at 75% 85%, rgba(0,255,204,0.05) 0%, transparent 50%);
}

header{
background:rgba(22,27,34,0.94);
padding:12px;
display:flex;
align-items:center;
gap:10px;
border-bottom:2px solid #00ffcc;
}

header img{
height:36px;
border-radius:50%;
border:2px solid #00ffcc88;
}

header h1{
color:#00ffcc;
text-shadow:0 0 7px #00ffccaa;
font-size:1.4rem;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.table-box{
background:rgba(30,45,61,0.35);
border:2px solid #00ffcc44;
border-radius:12px;
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
background:#0d1117;
border:2px solid #00ffcc77;
}

th,td{
padding:12px;
text-align:center;
border-bottom:1px solid #00ffcc22;
}

th{
color:#00ffcc;
background:linear-gradient(#00ffcc18, transparent);
}

tr:hover td{
background:rgba(0,255,204,0.1);
}

</style>
</head>

<body>

<header>
<img src="https://maximilian23.com/Cabeza.png">
<h1>Estación meteorológica • Zafra</h1>
</header>

<div class="container">

<div class="table-box">

<table>

<thead>
<tr>
<th>Fecha</th>
<th>Temp</th>
<th>Humedad</th>
<th>Viento</th>
<th>Dirección</th>
<th>Lluvia</th>
<th>Cielo</th>
</tr>
</thead>

<tbody id="tabla">
<tr>
<td colspan="7">Cargando datos...</td>
</tr>
</tbody>

</table>

</div>

</div>

<script>

const BIN_ID="69aaa6b0d0ea881f40f4bc92"
const KEY="$2a$10$Z4/lj4bJs4gRcw67snP9zewPYv9rbqaXFeGKdX07gqvA0ucBoTgVy"

async function cargar(){

const res=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{
headers:{"X-Master-Key":KEY}
})

const data=await res.json()
const meteo=data.record.meteo || []

const tabla=document.getElementById("tabla")
tabla.innerHTML=""

meteo.reverse().forEach(d=>{

tabla.innerHTML+=`
<tr>
<td>${d.fecha}</td>
<td>${d.temperatura}°</td>
<td>${d.humedad}%</td>
<td>${d.viento}</td>
<td>${d.direccion}</td>
<td>${d.lluvia}</td>
<td>${d.cielo}</td>
</tr>
`

})

}

cargar()

</script>

</body>
</html>
