<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Meteo • Zafra • Maximilian23</title>
  <link rel="icon" href="https://maximilian23.com/Cabeza.png">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: "Courier New", monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      background-image:
        radial-gradient(circle at 25% 15%, rgba(0,255,204,0.07) 0%, transparent 50%),
        radial-gradient(circle at 75% 85%, rgba(0,255,204,0.05) 0%, transparent 50%);
    }
    header {
      background: rgba(22,27,34,0.94);
      backdrop-filter: blur(10px);
      padding: 0.9rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    header img {
      height: clamp(38px, 9vw, 48px);
      border-radius: 50%;
      border: 2px solid #00ffccaa;
      box-shadow: 0 0 10px #00ffcc55;
    }
    header h1 {
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffccbb;
      font-size: clamp(1.3rem, 5.5vw, 1.7rem);
    }
    .main-container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 1rem;
    }
    .content-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .chart-box, .calendar-box {
      background: rgba(30,45,61,0.35);
      border: 2px solid #00ffcc55;
      border-radius: 12px;
      padding: 1.2rem;
      backdrop-filter: blur(6px);
    }
    .chart-box {
      height: 320px;
      max-height: 45vh;
    }
    .calendar-box {
      padding: 1rem;
      overflow: hidden; /* evita desborde */
    }
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      max-width: 100%; /* no más ancho que el contenedor */
    }
    .day {
      padding: 10px 4px;
      font-size: clamp(0.85rem, 3.5vw, 1rem);
      text-align: center;
      border: 1px solid #00ffcc44;
      border-radius: 6px;
      background: #161b22;
      cursor: pointer;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }
    .day:hover { background: rgba(0,255,204,0.15); transform: scale(1.03); }
    .today { border: 2.5px solid #00ffcc; background: rgba(0,255,204,0.22); font-weight: bold; }
    .hasdata { background: #00ffcc18; color: #00ffcc; }
    .legend {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.9rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .color-box {
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-content {
      background: rgba(30,45,61,0.95);
      border: 2px solid #00ffcc88;
      border-radius: 12px;
      padding: 1.6rem;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(0,255,204,0.35);
    }
    .modal h3 { color: #00ffcc; margin-bottom: 1rem; text-align: center; }
    .modal table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    .modal td { padding: 6px 8px; border-bottom: 1px solid #00ffcc33; }
    .close-btn { float: right; font-size: 1.8rem; color: #00ffccaa; cursor: pointer; }
    @media (min-width: 900px) {
      .content-wrapper { flex-direction: row; gap: 2rem; }
      .chart-box { flex: 3; height: 400px; max-height: 55vh; }
      .calendar-box { flex: 1; max-width: 380px; }
      .calendar { gap: 8px; }
      .day {
        padding: 12px 6px;
        font-size: 1.05rem;
        min-height: 60px;
      }
    }
    @media (min-width: 1200px) {
      .calendar-box { max-width: 420px; }
      .day { font-size: 1.15rem; padding: 16px 8px; }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Logo">
    <h1>Estación Meteorológica • Zafra</h1>
  </header>

  <div class="main-container">
    <div class="content-wrapper">
      <div class="chart-box">
        <canvas id="meteoChart"></canvas>
        <div class="legend">
          <div class="legend-item"><div class="color-box" style="background:#00ffcc"></div>Temp Indoor</div>
          <div class="legend-item"><div class="color-box" style="background:#ffaa00"></div>Temp Outdoor</div>
          <div class="legend-item"><div class="color-box" style="background:#88ddff"></div>Hum Indoor</div>
          <div class="legend-item"><div class="color-box" style="background:#aaff88"></div>Hum Outdoor</div>
          <div class="legend-item"><div class="color-box" style="background:#ff66aa"></div>Viento</div>
        </div>
      </div>

      <div class="calendar-box">
        <div class="calendar" id="calendar"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="dayModal">
    <div class="modal-content">
      <span class="close-btn" onclick="document.getElementById('dayModal').style.display='none'">×</span>
      <h3 id="modalTitle">Datos del día</h3>
      <table id="dayDataTable"><tbody></tbody></table>
    </div>
  </div>

  <script>
    const BIN_ID = "69aaa6b0d0ea881f40f4bc92";
    const KEY = "$2a$10$Z4/lj4bJs4gRcw67snP9zewPYv9rbqaXFeGKdX07gqvA0ucBoTgVy";
    let chart;
    let allData = [];

    const hoy = new Date();
    const año = hoy.getFullYear();
    const mes = hoy.getMonth();

    function crearCalendario(datos) {
      const cal = document.getElementById("calendar");
      cal.innerHTML = "";
      const diasConDatos = new Set(datos.map(d => d.fecha));
      const primerDia = new Date(año, mes, 1).getDay() || 7;
      const diasMes = new Date(año, mes + 1, 0).getDate();

      for (let i = 1; i < primerDia; i++) {
        const vacio = document.createElement("div");
        vacio.className = "day";
        cal.appendChild(vacio);
      }

      for (let i = 1; i <= diasMes; i++) {
        const fecha = `${año}-${(mes+1).toString().padStart(2,"0")}-${i.toString().padStart(2,"0")}`;
        const d = document.createElement("div");
        d.className = "day";
        d.textContent = i;
        if (diasConDatos.has(fecha)) d.classList.add("hasdata");
        if (i === hoy.getDate()) d.classList.add("today");
        d.onclick = () => mostrarDatosDia(fecha, datos);
        cal.appendChild(d);
      }
    }

    function mostrarDatosDia(fecha, datos) {
      const dato = datos.find(d => d.fecha === fecha);
      const tbody = document.getElementById("dayDataTable").querySelector("tbody");
      tbody.innerHTML = "";
      document.getElementById("modalTitle").textContent = `Datos: ${fecha}`;

      if (dato) {
        const campos = [
          ["Temp Indoor", dato.temp_indoor],
          ["Hum Indoor", dato.hum_indoor],
          ["Temp Outdoor", dato.temp_outdoor],
          ["Hum Outdoor", dato.hum_outdoor],
          ["Viento", dato.wind_speed],
          ["Ráfaga", dato.wind_gust],
          ["Dirección", dato.wind_direction],
          ["Sensación", dato.wind_chill],
          ["Lluvia", dato.rain],
          ["Presión", dato.pressure]
        ];
        campos.forEach(([label, value]) => {
          if (value !== undefined && value !== "") {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td style="font-weight:bold;color:#00ffccaa;">${label}:</td><td>${value}</td>`;
            tbody.appendChild(tr);
          }
        });
      } else {
        tbody.innerHTML = '<tr><td colspan="2" style="text-align:center;padding:1.2rem;">Sin datos para este día</td></tr>';
      }
      document.getElementById("dayModal").style.display = "flex";
    }

    function initChart(datos) {
      const ctx = document.getElementById("meteoChart").getContext("2d");
      if (chart) chart.destroy();

      const labels = datos.map(d => d.fecha.slice(5));
      const datasets = [
        { label: "Temp Indoor °C", data: datos.map(d => parseFloat(d.temp_indoor)), borderColor: "#00ffcc", tension: 0.3, yAxisID: "y" },
        { label: "Temp Outdoor °C", data: datos.map(d => parseFloat(d.temp_outdoor)), borderColor: "#ffaa00", tension: 0.3, yAxisID: "y" },
        { label: "Humedad Indoor %", data: datos.map(d => parseFloat(d.hum_indoor)), borderColor: "#88ddff", tension: 0.3, yAxisID: "y1" },
        { label: "Humedad Outdoor %", data: datos.map(d => parseFloat(d.hum_outdoor)), borderColor: "#aaff88", tension: 0.3, yAxisID: "y1" },
        { label: "Viento km/h", data: datos.map(d => parseFloat(d.wind_speed)), borderColor: "#ff66aa", tension: 0.3, yAxisID: "y" }
      ].filter(ds => ds.data.some(v => !isNaN(v)));

      chart = new Chart(ctx, {
        type: "line",
        data: { labels, datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: { position: "left", title: { display: true, text: "Temp / Viento" } },
            y1: { position: "right", title: { display: true, text: "Humedad %" }, grid: { drawOnChartArea: false } },
            x: { title: { display: true, text: "Fecha" } }
          },
          plugins: { legend: { display: false } }
        }
      });
    }

    async function cargar() {
      try {
        const timestamp = Date.now();
        const url = `https://api.jsonbin.io/v3/b/${BIN_ID}/latest?t=${timestamp}`;

        const res = await fetch(url, {
          cache: "no-store",
          headers: {
            "X-Master-Key": KEY,
            "Cache-Control": "no-cache, no-store, must-revalidate",
            "Pragma": "no-cache"
          }
        });

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const data = await res.json();
        allData = data?.record?.meteo || [];

        crearCalendario(allData);
        initChart(allData);
      } catch (e) {
        console.error("Error al cargar:", e);
        document.querySelector(".chart-box").innerHTML = 
          "<p style='text-align:center;padding:3rem;color:#ff6666;'>Error al cargar datos</p>";
      }
    }

    cargar();
  </script>
</body>
</html>
