<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>

<title>Admin • Maximilian 23 Weather</title>

<link rel="icon" href="https://maximilian23.com/Cabeza.png">
<link rel="stylesheet" href="styles.css">

<style>

.admin-container{
max-width:900px;
margin:auto;
padding:2rem;
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:1rem;
margin-top:1.5rem;
}

input{
padding:1rem;
font-size:1.2rem;
background:#161b22;
border:2px solid #00ffcc55;
border-radius:10px;
color:#e6edf3;
}

button{
margin-top:1.5rem;
padding:1.2rem;
font-size:1.3rem;
background:#00ffcc;
border:none;
border-radius:10px;
cursor:pointer;
}

button:hover{
background:#00ddaa;
}

.message{
margin-top:1rem;
font-size:1.2rem;
}

</style>

</head>

<body>

<header>
<img src="https://maximilian23.com/Cabeza.png">
<h1>Weather Station Admin</h1>
</header>

<div class="admin-container">

<form id="form">

<div class="form-grid">

<input id="fecha" type="date">

<input id="temp_indoor" placeholder="Temp Indoor °C" type="number" step="0.1">
<input id="hum_indoor" placeholder="Hum Indoor %" type="number" step="1">

<input id="temp_outdoor" placeholder="Temp Outdoor °C" type="number" step="0.1">
<input id="hum_outdoor" placeholder="Hum Outdoor %" type="number" step="1">

<input id="pressure" placeholder="Pressure hPa" type="number" step="0.1">

<input id="wind_speed" placeholder="Wind Speed km/h" type="number" step="0.1">
<input id="wind_gust" placeholder="Wind Gust km/h" type="number" step="0.1">

<input id="wind_direction" placeholder="Wind Direction °">

<input id="wind_chill" placeholder="Wind Chill °C" type="number" step="0.1">

<input id="rain" placeholder="Rain mm" type="number" step="0.1">

</div>

<button type="submit">Save Data</button>

</form>

<div id="message" class="message"></div>

</div>


<script>

const BIN_ID="69aaa6b0d0ea881f40f4bc92";
const KEY="$2a$10$Z4/lj4bJs4gRcw67snP9zewPYv9rbqaXFeGKdX07gqvA0ucBoTgVy";

document.getElementById("form").onsubmit=async e=>{

e.preventDefault();

const nuevo={

fecha:document.getElementById("fecha").value,

temp_indoor:document.getElementById("temp_indoor").value,
hum_indoor:document.getElementById("hum_indoor").value,

temp_outdoor:document.getElementById("temp_outdoor").value,
hum_outdoor:document.getElementById("hum_outdoor").value,

pressure:document.getElementById("pressure").value,

wind_speed:document.getElementById("wind_speed").value,
wind_gust:document.getElementById("wind_gust").value,

wind_direction:document.getElementById("wind_direction").value,

wind_chill:document.getElementById("wind_chill").value,

rain:document.getElementById("rain").value

};

try{

const res=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{
headers:{
"X-Master-Key":KEY
}
});

const data=await res.json();

let meteo=data.record.meteo || [];

const idx=meteo.findIndex(d=>d.fecha===nuevo.fecha);

if(idx!==-1){
meteo[idx]={...meteo[idx],...nuevo};
}else{
meteo.push(nuevo);
}

await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
method:"PUT",
headers:{
"Content-Type":"application/json",
"X-Master-Key":KEY
},
body:JSON.stringify({meteo})
});

document.getElementById("message").innerText="Saved";

}catch(err){

document.getElementById("message").innerText="Error saving data";

}

}

</script>

</body>
</html>
