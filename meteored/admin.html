<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel Meteo</title>

<style>

body{
font-family:"Courier New", monospace;
background:#0d1117;
color:#e6edf3;
text-align:center;
}

h1{
color:#00ffcc;
text-shadow:0 0 7px #00ffccaa;
}

.calendar{
display:grid;
grid-template-columns:repeat(7,1fr);
gap:6px;
max-width:420px;
margin:auto;
}

.day{
padding:14px;
background:#161b22;
border:1px solid #00ffcc33;
cursor:pointer;
}

.day:hover{
background:#00ffcc22;
}

.today{
border:2px solid #00ffcc;
}

form{
margin-top:20px;
background:#161b22;
padding:20px;
display:inline-block;
border-radius:10px;
}

input{
display:block;
margin:8px auto;
padding:6px;
}

button{
padding:8px 20px;
background:#00ffcc;
border:none;
cursor:pointer;
}

</style>
</head>

<body>

<h1>Panel meteorológico</h1>

<div class="calendar" id="calendar"></div>

<form id="form" style="display:none">

<h3 id="selected"></h3>

<input id="temp" placeholder="Temperatura">
<input id="hum" placeholder="Humedad">
<input id="viento" placeholder="Viento">
<input id="dir" placeholder="Dirección">
<input id="lluvia" placeholder="Lluvia">
<input id="cielo" placeholder="Cielo">

<button>Guardar</button>

</form>

<script>

const BIN_ID="69aaa6b0d0ea881f40f4bc92"
const KEY="$2a$10$Z4/lj4bJs4gRcw67snP9zewPYv9rbqaXFeGKdX07gqvA0ucBoTgVy"

let fechaSeleccionada=""

function crearCalendario(){

const hoy=new Date()
const año=hoy.getFullYear()
const mes=hoy.getMonth()

const dias=new Date(año,mes+1,0).getDate()

const cal=document.getElementById("calendar")

for(let i=1;i<=dias;i++){

const d=document.createElement("div")
d.className="day"
d.innerText=i

if(i===hoy.getDate())
d.classList.add("today")

d.onclick=()=>{

fechaSeleccionada=`${año}-${(mes+1).toString().padStart(2,"0")}-${i.toString().padStart(2,"0")}`

document.getElementById("selected").innerText=fechaSeleccionada
document.getElementById("form").style.display="block"

}

cal.appendChild(d)

}

}

document.getElementById("form").onsubmit=async e=>{

e.preventDefault()

const nuevo={
fecha:fechaSeleccionada,
temperatura:temp.value,
humedad:hum.value,
viento:viento.value,
direccion:dir.value,
lluvia:lluvia.value,
cielo:cielo.value
}

const res=await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`,{
headers:{"X-Master-Key":KEY}
})

const data=await res.json()

const meteo=data.record.meteo || []

meteo.push(nuevo)

await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`,{
method:"PUT",
headers:{
"Content-Type":"application/json",
"X-Master-Key":KEY
},
body:JSON.stringify({meteo})
})

alert("Guardado")

}

crearCalendario()

</script>

</body>
</html>
