<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Personaje estilo Ghibli - Dibujado paso a paso</title>
<style>
  body {
    background:#faf7ef;
    font-family: sans-serif;
    text-align: center;
    padding-top: 20px;
    user-select: none;
    touch-action: manipulation;
  }

  svg {
    width: 60vw;
    max-width: 380px;
    margin-top: 25px;
  }

  p {
    font-size: 18px;
    margin-top: 10px;
  }
</style>
</head>
<body>

<h2>Personaje estilo Studio Ghibli</h2>
<p>Toca la pantalla para dibujar paso a paso.</p>

<svg id="gibli" viewBox="0 0 300 300" stroke="black" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

  <path d="M150 80 C125 80, 110 100, 110 125 C110 160, 125 180, 150 180 C175 180, 190 160, 190 125 C190 100, 175 80, 150 80Z" style="display:none"/>
  <path d="M120 105 C135 90, 165 90, 180 105" style="display:none"/>
  <path d="M120 105 C110 120, 115 135, 125 140" style="display:none"/>
  <path d="M180 105 C190 120, 185 135, 175 140" style="display:none"/>
  <path d="M135 125 C138 130, 138 130, 135 135" style="display:none"/>
  <path d="M165 125 C162 130, 162 130, 165 135" style="display:none"/>
  <path d="M142 150 Q150 158, 158 150" style="display:none"/>
  <path d="M145 180 L145 205 M155 180 L155 205" style="display:none"/>
  <path d="M120 210 C135 195, 165 195, 180 210" style="display:none"/>
  <path d="M120 210 C115 230, 115 245, 125 255 M180 210 C185 230, 185 245, 175 255" style="display:none"/>
  <path d="M125 255 C140 270, 160 270, 175 255" style="display:none"/>

</svg>

<script>
  let trazos = Array.from(document.querySelectorAll("#gibli path"));
  let paso = 0;

  function mostrarSiguiente() {
    if (paso < trazos.length) {
      trazos[paso].style.display = "block";
      paso++;
    }
  }

  // Click / Tap en toda la pantalla
  document.addEventListener("click", mostrarSiguiente);
  document.addEventListener("touchstart", mostrarSiguiente);
</script>

</body>
</html>
