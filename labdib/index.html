<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cobaya Bombero - Dibujo Paso a Paso</title>
<style>
  body {
    background:#faf7ef;
    font-family: sans-serif;
    text-align:center;
    padding-top:15px;
    touch-action: manipulation;
    user-select: none;
  }
  svg {
    width: 60vw;
    max-width: 420px;
    margin-top:20px;
  }
  p {
    font-size:18px;
  }
</style>
</head>
<body>

<h2>Cobaya Bombero</h2>
<p>Toca la pantalla para dibujar el personaje poco a poco.</p>

<svg id="coba" viewBox="0 0 300 300" stroke="black" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

  <!-- 1 cabeza -->

  <!-- 2 oreja izq -->

  <!-- 3 oreja der -->

  <!-- 4 hocico -->
  <path d="M140 135 C140 150 160 150 160 135 C160 125 140 125 140 135Z" style="display:none"/>

  <!-- 5 nariz -->
  <circle cx="150" cy="135" r="3" style="display:none"/>

  <!-- 6 boca -->
  <path d="M145 145 Q150 150 155 145" style="display:none"/>

  <!-- 7 ojo izq -->
  <circle cx="135" cy="120" r="7" style="display:none"/>

  <!-- 8 pupila izq -->
  <circle cx="135" cy="120" r="3" style="display:none"/>

  <!-- 9 ojo der -->
  <circle cx="165" cy="120" r="7" style="display:none"/>

  <!-- 10 pupila der -->
  <circle cx="165" cy="120" r="3" style="display:none"/>

  <!-- 11 casco contorno -->

  <!-- 12 casco parte superior -->

  <!-- 13 visera -->
  <path d="M115 90 L185 90" style="display:none"/>

  <!-- 14 placa casco -->
  <path d="M145 80 L155 80 L155 90 L145 90Z" style="display:none"/>

  <!-- 15 detalle llama -->
  <path d="M150 80 C152 83 148 85 150 88" style="display:none"/>

  <!-- 16 cuerpo contorno -->
  <path d="M115 195 C110 230 110 255 150 260 C190 255 190 230 185 195Z" style="display:none"/>

  <!-- 17 chaqueta frontal izq -->
  <path d="M135 195 L135 245" style="display:none"/>

  <!-- 18 chaqueta frontal der -->
  <path d="M165 195 L165 245" style="display:none"/>

  <!-- 19 línea media chaqueta -->
  <path d="M150 195 L150 245" style="display:none"/>

  <!-- 20 solapa izq -->
  <path d="M135 205 L120 210" style="display:none"/>

  <!-- 21 solapa der -->
  <path d="M165 205 L180 210" style="display:none"/>

  <!-- 22 brazo izq parte superior -->
  <path d="M115 200 C100 220 105 245 120 250" style="display:none"/>

  <!-- 23 brazo izq parte inferior -->
  <path d="M120 250 C125 255 135 255 140 250" style="display:none"/>

  <!-- 24 mano izq -->
  <circle cx="138" cy="250" r="4" style="display:none"/>

  <!-- 25 brazo der parte superior -->
  <path d="M185 200 C200 220 195 245 180 250" style="display:none"/>

  <!-- 26 brazo der parte inferior -->
  <path d="M180 250 C175 255 165 255 160 250" style="display:none"/>

  <!-- 27 mano der -->
  <circle cx="162" cy="250" r="4" style="display:none"/>

  <!-- 28 pierna izq -->

  <!-- 29 pie izq -->
  <path d="M130 280 L150 280" style="display:none"/>

  <!-- 30 pierna der -->
  <path d="M160 260 L160 280" style="display:none"/>

  <!-- 31 pie der -->
  <path d="M150 280 L170 280" style="display:none"/>

  <!-- 32 bolsillo chaqueta -->

  <!-- 33 colita -->
  <path d="M110 230 C100 240 100 255 110 260" style="display:none"/>

</svg>

<script>
  let pasos = Array.from(document.querySelectorAll("#coba path, #coba circle"));
  let i = 0;
  function siguiente() {
    if (i < pasos.length) {
      pasos[i].style.display = "block";
      i++;
    }
  }
  document.addEventListener("click", siguiente);
  document.addEventListener("touchstart", siguiente);
</script>

</body>
  </html>
