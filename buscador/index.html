<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buscador | Maximilian 23</title>

  <meta
    name="description"
    content="Acceso a Google desde Maximilian 23."
  >

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at top,
          #ffffff 0%,
          #f7f6f2 45%,
          #efeee9 100%
        );

      font-family: "Segoe UI", Arial, Helvetica, sans-serif;
      color: #17212b;
    }


    /* =====================================================
       CONTENEDOR PRINCIPAL
       ===================================================== */

    .buscador {
      width: 92%;
      max-width: 780px;
      text-align: center;
      padding: 35px 10px 90px;
    }


    /* =====================================================
       MAXIMILIAN
       ===================================================== */

    .maximilian {
      width: 175px;
      max-width: 45vw;
      height: auto;
      display: block;
      margin: 0 auto 16px;

      filter:
        drop-shadow(
          0 8px 10px rgba(0, 0, 0, 0.13)
        );

      user-select: none;
    }


    /* =====================================================
       MARCA
       ===================================================== */

    .marca {
      margin-top: 3px;
      margin-bottom: 10px;

      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;

      color: #0088a9;
    }


    /* =====================================================
       TÍTULOS
       ===================================================== */

    h1 {
      margin: 0;

      font-size: clamp(28px, 5vw, 42px);
      font-weight: 700;
      letter-spacing: -1px;
    }

    .subtitulo {
      margin: 9px auto 30px;

      color: #69727c;
      font-size: 17px;
      line-height: 1.5;
    }


    /* =====================================================
       FORMULARIO DE GOOGLE
       ===================================================== */

    .formulario {
      display: flex;
      align-items: center;

      width: 100%;
      min-height: 66px;

      background: #ffffff;

      border: 1px solid #d9dde1;
      border-radius: 36px;

      padding: 6px;

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.08),
        0 1px 3px rgba(0, 0, 0, 0.05);

      transition:
        box-shadow 0.2s,
        border-color 0.2s,
        transform 0.2s;
    }

    .formulario:focus-within {
      border-color: #9ebfc7;

      box-shadow:
        0 8px 25px rgba(0, 0, 0, 0.12),
        0 0 0 3px rgba(0, 136, 169, 0.08);

      transform: translateY(-1px);
    }


    /* =====================================================
       CAMPO DE BÚSQUEDA
       ===================================================== */

    .formulario input {
      flex: 1;
      min-width: 0;

      border: 0;
      outline: 0;

      background: transparent;

      padding: 13px 15px;

      font-family: inherit;
      font-size: 18px;

      color: #17212b;
    }

    .formulario input::placeholder {
      color: #9ba1a6;
    }


    /* =====================================================
       BOTÓN BUSCAR
       ===================================================== */

    .formulario button {
      min-height: 50px;

      border: 0;
      border-radius: 27px;

      padding: 0 30px;

      background: #17212b;
      color: #ffffff;

      font-family: inherit;
      font-size: 16px;
      font-weight: 650;

      cursor: pointer;

      transition:
        transform 0.15s,
        box-shadow 0.15s,
        background 0.15s;
    }

    .formulario button:hover {
      background: #0088a9;

      transform: translateY(-1px);

      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .formulario button:active {
      transform: translateY(0);
    }


    /* =====================================================
       INFORMACIÓN GOOGLE
       ===================================================== */

    .google-info {
      margin-top: 17px;

      color: #7b8288;
      font-size: 14px;
    }

    .google {
      display: inline-flex;

      margin-left: 4px;

      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .g1 { color: #4285F4; }
    .g2 { color: #EA4335; }
    .g3 { color: #FBBC05; }
    .g4 { color: #4285F4; }
    .g5 { color: #34A853; }
    .g6 { color: #EA4335; }


    /* =====================================================
       ACCESOS RÁPIDOS
       ===================================================== */

    .titulo-accesos {
      margin-top: 43px;
      margin-bottom: 15px;

      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;

      color: #969ca1;
    }

    .accesos {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;

      gap: 10px;
    }

    .accesos a {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 40px;

      padding: 9px 17px;

      background:
        rgba(255, 255, 255, 0.88);

      border:
        1px solid #dfe1e3;

      border-radius: 22px;

      color: #27323b;

      text-decoration: none;

      font-size: 14px;
      font-weight: 500;

      box-shadow:
        0 2px 5px rgba(0, 0, 0, 0.03);

      transition:
        transform 0.18s,
        box-shadow 0.18s,
        background 0.18s;
    }

    .accesos a:hover {
      transform: translateY(-2px);

      background: #ffffff;

      box-shadow:
        0 5px 13px rgba(0, 0, 0, 0.09);
    }


    /* =====================================================
       VOLVER A MAXIMILIAN
       ===================================================== */

    .volver {
      margin-top: 36px;
    }

    .volver a {
      color: #0088a9;

      text-decoration: none;

      font-size: 14px;
      font-weight: 600;
    }

    .volver a:hover {
      text-decoration: underline;
    }


    /* =====================================================
       PIE
       ===================================================== */

    footer {
      position: fixed;

      left: 0;
      right: 0;
      bottom: 17px;

      width: 100%;

      padding: 0 20px;

      text-align: center;

      color: #a0a4a8;

      font-size: 12px;
    }


    /* =====================================================
       RESPONSIVE
       ===================================================== */

    @media (max-width: 600px) {

      body {
        justify-content: flex-start;
      }

      .buscador {
        padding-top: 45px;
        padding-bottom: 100px;
      }

      .maximilian {
        width: 145px;
      }

      .subtitulo {
        font-size: 15px;
        margin-bottom: 24px;
      }

      .formulario {
        min-height: 59px;
      }

      .formulario input {
        font-size: 16px;

        padding-left: 15px;
      }

      .formulario button {
        min-height: 45px;

        padding: 0 18px;

        font-size: 15px;
      }

      footer {
        position: relative;

        bottom: auto;

        margin-top: -60px;

        padding-bottom: 20px;
      }
    }


    @media (max-width: 420px) {

      .formulario {
        padding: 5px;
      }

      .formulario input {
        padding-left: 15px;
      }

      .formulario button {
        padding: 0 15px;
      }

      .accesos {
        gap: 8px;
      }

      .accesos a {
        padding: 8px 14px;
      }
    }

  </style>
</head>


<body>


  <main class="buscador">


    <!-- ===================================================
         MAXIMILIAN 23
         =================================================== -->

    <img
      src="https://maximilian23.com/Cabeza.png"
      alt="Maximilian 23"
      class="maximilian"
    >


    <div class="marca">
      Maximilian 23
    </div>


    <h1>
      ¿Qué quieres buscar?
    </h1>


    <p class="subtitulo">
      Busca en Internet desde Maximilian 23.
    </p>



    <!-- ===================================================
         BUSCADOR GOOGLE
         =================================================== -->

    <form
      class="formulario"
      action="https://www.google.com/search"
      method="get"
    >


      <!-- CAMPO DE BÚSQUEDA -->

      <input
        type="search"
        name="q"
        placeholder="Buscar en Google..."
        aria-label="Buscar en Google"
        autocomplete="off"
        autofocus
        required
      >


      <!-- BOTÓN -->

      <button type="submit">
        Buscar
      </button>


    </form>



    <!-- ===================================================
         IDENTIFICACIÓN DEL MOTOR
         =================================================== -->

    <div class="google-info">

      Búsqueda realizada mediante

      <span
        class="google"
        aria-label="Google"
      >
        <span class="g1">G</span>
        <span class="g2">o</span>
        <span class="g3">o</span>
        <span class="g4">g</span>
        <span class="g5">l</span>
        <span class="g6">e</span>
      </span>

    </div>



    <!-- ===================================================
         ACCESOS RÁPIDOS
         =================================================== -->

    <div class="titulo-accesos">
      Accesos rápidos
    </div>


    <nav
      class="accesos"
      aria-label="Accesos rápidos"
    >


      <a
        href="https://www.educarex.es/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Educarex
      </a>


      <a
        href="https://rayuela.educarex.es/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Rayuela
      </a>


      <a
        href="https://dle.rae.es/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Diccionario RAE
      </a>


      <a
        href="https://es.wikipedia.org/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Wikipedia
      </a>

      <a
        href="https://cpjuanxxiiizafra.educarex.es/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Web del colegio
      </a>

    </nav>



    <!-- ===================================================
         VOLVER
         =================================================== -->

    <div class="volver">

      <a href="https://maximilian23.com/">
        Ir a Maximilian 23
      </a>

    </div>


  </main>



  <!-- =====================================================
       PIE
       ===================================================== -->

  <footer>
    Maximilian 23 · CEIP Juan XXIII · Zafra
  </footer>


</body>
</html>
