<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Maximilian 23</title>
  <meta name="description" content="Maximilian 23, la mascota virtual del CEIP Juan XXIII de Zafra.">
  <meta name="theme-color" content="#0b161c">
  <meta property="og:title" content="Maximilian 23">
  <meta property="og:description" content="La mascota virtual del CEIP Juan XXIII de Zafra.">
  <meta property="og:image" content="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="models/maximilian23.glb" as="fetch" crossorigin>
  <link rel="stylesheet" href="css/maximilian.css?v=ilustrados1">
  <link rel="stylesheet" href="css/cuentos.css?v=ilustrados1">
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three/build/three.module.js",
        "three/addons/": "./vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="escena" aria-label="Maximilian 23, cabeza robótica animada"></canvas>
  <div class="vineta" aria-hidden="true"></div>

  <div id="carga" role="status">Despertando a Maximilian…</div>

  <button id="pantalla-completa" class="boton-pantalla" type="button"
          title="Pantalla completa (F)" aria-label="Pantalla completa" aria-pressed="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button id="activar" class="boton-activar" type="button" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
      <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round"/>
    </svg>
    Activar voz y cuentos
  </button>

  <p id="subtitulo" class="subtitulo" aria-live="polite"></p>
  <section id="cuento" class="libro-cuento" hidden aria-labelledby="cuento-titulo">
    <div class="cuento-cabecera"><span class="cuento-etiqueta">LA HORA DEL CUENTO</span><span id="cuento-icono" aria-hidden="true"></span></div>
    <h1 id="cuento-titulo"></h1>
    <div class="cuento-lectura"><span id="cuento-ilustracion" class="cuento-ilustracion" role="img" hidden></span><p id="cuento-texto" aria-live="polite"></p></div>
    <div class="cuento-pie"><span id="cuento-pagina"></span><button id="pausa-cuento" type="button" disabled aria-pressed="false">⏸ Pausa</button></div>
    <div class="cuento-raíl" aria-hidden="true"><div id="cuento-progreso"></div></div>
    <p id="cuento-aviso" role="status"></p>
  </section>

  <form id="vincular" class="vincular" hidden>
    <label for="codigo-visor">Código de sesión de ADMIN</label>
    <div><input id="codigo-visor" name="codigo" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" autocomplete="off" placeholder="58458" required aria-describedby="conexion-estado"><button type="submit">Conectar</button></div>
    <p id="conexion-estado" role="status" aria-live="polite">Introduce las cinco cifras que aparecen en tu panel.</p>
  </form>

  <script>
    // Si main.js no llega a arrancar, explicar el motivo en vez de quedarse en "Despertando…"
    (function () {
      var errores = [];
      window.addEventListener('error', function (e) {
        errores.push((e.message || 'error') + (e.filename ? ' — ' + e.filename : ''));
      }, true);
      window.__maxFallo = function (motivo) {
        if (window.__maxArrancado) return;
        var el = document.getElementById('carga');
        var msg;
        if (location.protocol === 'file:') {
          msg = 'Esta página no funciona abierta con doble clic. Ábrela desde su dirección web (https://…).';
        } else {
          msg = 'No se ha podido cargar el motor 3D (' + motivo + '). ' +
                'Comprueba que se subió la carpeta vendor/ y que el servidor no modifica los scripts ' +
                '(en Cloudflare, desactiva Rocket Loader).';
        }
        el.textContent = msg;
        el.classList.add('error');
        if (errores.length) {
          var d = document.createElement('small');
          d.className = 'detalle';
          d.textContent = errores.slice(-3).join(' · ');
          el.appendChild(d);
        }
      };
      setTimeout(function () { window.__maxFallo('tiempo agotado'); }, 15000);
    })();
  </script>
  <script type="module" src="js/main.js?v=ilustrados1" onerror="__maxFallo('main.js')"></script>
</body>
</html>
