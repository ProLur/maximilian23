<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de Silencio • Maximilian 23</title>

<style>
body{
  margin:0;
  font-family:"Courier New", monospace;
  background:#0d1117;
  color:#00ffcc;
  display:flex;
  flex-direction:column;
  align-items:center;
}

/* CABECERA */
header{
  width:100%;
  background:#161b22;
  border-bottom:2px solid #00ffcc;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:10px;
}

header img{
  height:50px;
  border-radius:50%;
  box-shadow:0 0 10px #00ffcc;
}

header h1{
  margin:0;
  font-size:1.6rem;
  text-shadow:0 0 10px #00ffcc;
}

/* CONTENIDO */
.container{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-top:20px;
}

canvas{
  background:#020606;
  border:2px solid #00ffcc55;
  border-radius:50%;
  box-shadow:0 0 20px #00ffcc33;
}

/* BARRA */
.barra{
  width:300px;
  height:14px;
  border:1px solid #00ffcc;
  margin-top:20px;
  border-radius:10px;
  overflow:hidden;
}

.barra-inner{
  height:100%;
  width:0%;
  background:#00ffcc;
  transition:width 0.1s;
}

/* TEXTO */
.estado{
  margin-top:15px;
  font-size:1.2rem;
}

.puntos{
  margin-top:10px;
  font-size:1.3rem;
  color:#00ffcc;
}

.record{
  font-size:0.9rem;
  color:#00ffcc88;
}

/* BOTON */
button{
  margin-top:20px;
  padding:10px 20px;
  background:#00ffcc22;
  border:1px solid #00ffcc;
  color:#00ffcc;
  cursor:pointer;
  border-radius:8px;
}
button:hover{
  background:#00ffcc44;
}
</style>
</head>

<body>

<header>
  <img src="https://maximilian23.com/Cabeza.png">
  <h1>RADAR DE SILENCIO</h1>
</header>

<div class="container">

<canvas id="radar" width="300" height="300"></canvas>

<div class="barra">
  <div class="barra-inner" id="barra"></div>
</div>

<div class="estado" id="estado">Pulsa iniciar</div>

<div class="puntos" id="puntos">Puntos: 0</div>
<div class="record" id="record">Récord: 0</div>

<button onclick="iniciar()">INICIAR</button>

</div>

<script>
let audioContext, analyser, dataArray;
let running = false;
let angle = 0;

let puntos = 0;
let record = localStorage.getItem("recordRuido") || 0;

document.getElementById("record").textContent = "Récord: " + record;

async function iniciar(){
  if(running) return;

  puntos = 0;

  const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioContext.createAnalyser();

  const source = audioContext.createMediaStreamSource(stream);
  source.connect(analyser);

  analyser.fftSize = 256;
  dataArray = new Uint8Array(analyser.frequencyBinCount);

  running = true;
  loop();
}

function loop(){
  if(!running) return;

  analyser.getByteFrequencyData(dataArray);

  let sum = 0;
  for(let i=0;i<dataArray.length;i++){
    sum += dataArray[i];
  }
  let volumen = sum / dataArray.length;

  dibujarRadar(volumen);
  actualizarBarra(volumen);
  actualizarEstado(volumen);
  actualizarPuntos(volumen);

  requestAnimationFrame(loop);
}

function actualizarPuntos(volumen){
  if(volumen < 30){
    puntos += 1; // silencio suma
  } else if(volumen > 60){
    puntos -= 2; // ruido resta fuerte
  }

  if(puntos < 0) puntos = 0;

  document.getElementById("puntos").textContent = "Puntos: " + puntos;

  if(puntos > record){
    record = puntos;
    localStorage.setItem("recordRuido", record);
    document.getElementById("record").textContent = "Récord: " + record;
  }
}

function dibujarRadar(volumen){
  const canvas = document.getElementById("radar");
  const ctx = canvas.getContext("2d");

  ctx.clearRect(0,0,300,300);

  const cx = 150;
  const cy = 150;

  ctx.beginPath();
  ctx.arc(cx,cy,120,0,Math.PI*2);
  ctx.strokeStyle="#00ffcc33";
  ctx.stroke();

  const radio = 40 + volumen;

  ctx.beginPath();
  ctx.arc(cx,cy,radio,0,Math.PI*2);

  if(volumen < 30) ctx.strokeStyle="#00ffcc";
  else if(volumen < 60) ctx.strokeStyle="#ffff00";
  else ctx.strokeStyle="#ff4444";

  ctx.shadowBlur = 20;
  ctx.shadowColor = ctx.strokeStyle;
  ctx.stroke();

  angle += 0.03;
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.lineTo(cx + Math.cos(angle)*120, cy + Math.sin(angle)*120);
  ctx.strokeStyle="#00ffcc";
  ctx.shadowBlur = 0;
  ctx.stroke();
}

function actualizarBarra(volumen){
  const barra = document.getElementById("barra");
  let porcentaje = Math.min(volumen*1.5,100);
  barra.style.width = porcentaje + "%";

  if(volumen < 30) barra.style.background="#00ffcc";
  else if(volumen < 60) barra.style.background="#ffff00";
  else barra.style.background="#ff4444";
}

function actualizarEstado(volumen){
  const estado = document.getElementById("estado");

  if(volumen < 30){
    estado.textContent = "Silencio óptimo";
    estado.style.color="#00ffcc";
  }
  else if(volumen < 60){
    estado.textContent = "Nivel normal";
    estado.style.color="#ffff00";
  }
  else{
    estado.textContent = "Demasiado ruido";
    estado.style.color="#ff4444";
  }
}
</script>

</body>
</html>
