<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Carrusel Maximilian23</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #000; }
    body { cursor: default; }
    .slide {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
      transform: translateX(0);
      opacity: 1;
      transition: transform 800ms cubic-bezier(.55, 0, .75, .35), opacity 800ms ease;
      will-change: transform, opacity;
    }
    .slide.saliendo {
      transform: translateX(105vw);
      opacity: 0;
    }
    #foto {
      display: none;
      object-fit: contain;
      object-position: center;
    }
    .slide.saliendo-izquierda { transform: translateX(-105vw); opacity: 0; }
    #juez { display: none; pointer-events: auto; }
    #pantalla-completa {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 10;
      display: grid;
      width: 44px;
      height: 44px;
      padding: 0;
      place-items: center;
      color: #fff;
      background: rgb(0 0 0 / 45%);
      border: 1px solid rgb(255 255 255 / 35%);
      border-radius: 10px;
      font: 24px/1 system-ui, sans-serif;
      cursor: pointer;
      opacity: .72;
    }
    #pantalla-completa:hover,
    #pantalla-completa:focus-visible {
      opacity: 1;
      background: rgb(0 0 0 / 70%);
      outline: 2px solid #fff;
      outline-offset: 2px;
    }
    #estado {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: #aaa;
      background: #000;
      font: 500 clamp(18px, 2.5vw, 32px)/1.4 system-ui, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <img id="foto" class="slide" alt="">
  <iframe
    id="juez"
    class="slide"
    title="Tiempo y veredicto del partido"
    tabindex="-1"
    src="about:blank"
    allow="autoplay; fullscreen"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
  <div id="estado">Cargando imágenes…</div>
  <button
    id="pantalla-completa"
    type="button"
    aria-label="Entrar en pantalla completa"
    title="Entrar en pantalla completa">⛶</button>

  <script>
    'use strict';

    // Se usan cuando la web está en un dominio propio (maximilian23.com).
    // Si se copia este archivo a otro repositorio, solo hay que cambiar estos valores.
    const GITHUB_OWNER = 'ProLur';
    const GITHUB_REPO = 'maximilian23';
    const FOTOS_PATH = 'carrusel/fotos';
    const JUEZ_URL = 'https://www.maximilian23.com/juez';
    const FOTO_MS = 10_000;
    const JUEZ_MS = 15_000;
    const TRANSICION_MS = 800;
    const ACTUALIZAR_LISTA_MS = 5 * 60_000;
    const EXTENSIONES = /\.(?:avif|gif|jpe?g|png|webp)$/i;

    const foto = document.querySelector('#foto');
    const juez = document.querySelector('#juez');
    const estado = document.querySelector('#estado');
    const botonPantallaCompleta = document.querySelector('#pantalla-completa');
    let imagenes = [];
    let ultimaActualizacion = 0;
    let avanzarDiapositiva = null;
    let pausarDiapositiva = null;
    let reanudarDiapositiva = null;

    document.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.key !== 'ArrowRight' && event.key !== 'ArrowLeft') return;
      event.preventDefault();
      if (!event.repeat && avanzarDiapositiva) {
        avanzarDiapositiva(event.key === 'ArrowRight' ? 1 : -1);
      }
    });

    window.addEventListener('message', event => {
      if (event.origin !== new URL(JUEZ_URL).origin || event.source !== juez.contentWindow) return;
      if (event.data?.type === 'juez-admin-open') pausarDiapositiva?.();
      if (event.data?.type === 'juez-admin-close') reanudarDiapositiva?.();
      if (event.data?.type === 'carrusel-navigate' && avanzarDiapositiva) {
        avanzarDiapositiva(event.data.direction === -1 ? -1 : 1);
      }
    });

    function actualizarBotonPantallaCompleta() {
      const activa = Boolean(document.fullscreenElement);
      botonPantallaCompleta.textContent = activa ? '✕' : '⛶';
      botonPantallaCompleta.setAttribute(
        'aria-label',
        activa ? 'Salir de pantalla completa' : 'Entrar en pantalla completa'
      );
      botonPantallaCompleta.title = botonPantallaCompleta.getAttribute('aria-label');
      botonPantallaCompleta.setAttribute('aria-pressed', String(activa));
    }

    async function alternarPantallaCompleta() {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await document.documentElement.requestFullscreen();
      } catch (error) {
        console.error('No se pudo cambiar el modo de pantalla completa:', error);
      }
    }

    botonPantallaCompleta.addEventListener('click', alternarPantallaCompleta);
    document.addEventListener('fullscreenchange', actualizarBotonPantallaCompleta);
    actualizarBotonPantallaCompleta();

    function repositorio() {
      const host = location.hostname.toLowerCase();
      if (host.endsWith('.github.io')) {
        const owner = host.slice(0, -'.github.io'.length);
        const repo = location.pathname.split('/').filter(Boolean)[0];
        if (owner && repo && repo !== 'carrusel') return { owner, repo };
      }
      return { owner: GITHUB_OWNER, repo: GITHUB_REPO };
    }

    function pausa(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function salirHaciaLaDerecha(elemento, direccion = 1) {
      const clase = direccion === -1 ? 'saliendo-izquierda' : 'saliendo';
      elemento.classList.add(clase);
      await pausa(TRANSICION_MS);
      elemento.style.display = 'none';
      elemento.style.transition = 'none';
      elemento.classList.remove(clase);
      elemento.style.transform = 'translateX(0)';
      elemento.style.opacity = '1';
    }

    function mostrarSinRebote(elemento) {
      elemento.style.transition = 'none';
      elemento.classList.remove('saliendo', 'saliendo-izquierda');
      elemento.style.transform = 'translateX(0)';
      elemento.style.opacity = '1';
      elemento.style.display = 'block';
      // Fija el estado inicial antes de volver a habilitar la animación de salida.
      void elemento.offsetWidth;
      elemento.style.transform = '';
      elemento.style.opacity = '';
      elemento.style.transition = '';
    }

    async function obtenerImagenes() {
      const { owner, repo } = repositorio();
      const url = `https://api.github.com/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents/${FOTOS_PATH}`;
      const respuesta = await fetch(url, {
        headers: { Accept: 'application/vnd.github+json' },
        cache: 'no-store'
      });
      if (!respuesta.ok) throw new Error(`GitHub respondió ${respuesta.status}`);

      const contenido = await respuesta.json();
      if (!Array.isArray(contenido)) throw new Error('La ruta de fotos no es una carpeta');

      return contenido
        .filter(archivo => archivo.type === 'file' && EXTENSIONES.test(archivo.name) && archivo.download_url)
        .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }))
        .map(archivo => ({ nombre: archivo.name, url: archivo.download_url }));
    }

    async function actualizarImagenes() {
      ultimaActualizacion = Date.now();
      try {
        const nuevas = await obtenerImagenes();
        imagenes = nuevas;
        ultimaActualizacion = Date.now();
        estado.textContent = nuevas.length
          ? ''
          : 'No hay imágenes en carrusel/fotos. Mostrando el juez.';
      } catch (error) {
        console.error('No se pudo actualizar la lista de fotos:', error);
        if (!imagenes.length) estado.textContent = 'No se pudo cargar la lista de imágenes. Reintentando…';
      }
    }

    function mostrarDiapositiva(imagen) {
      return new Promise(resolve => {
        const elemento = imagen ? foto : juez;
        let terminado = false;
        let visible = false;
        let temporizador;
        let tiempoRestante = 0;
        let venceEn = 0;
        const programarFin = duracion => {
          tiempoRestante = duracion;
          venceEn = Date.now() + duracion;
          temporizador = setTimeout(() => finalizar(), duracion);
        };
        const finalizar = async (direccion = 1, animar = true) => {
          if (terminado) return;
          terminado = true;
          clearTimeout(temporizador);
          avanzarDiapositiva = null;
          pausarDiapositiva = null;
          reanudarDiapositiva = null;
          foto.onload = null;
          foto.onerror = null;
          juez.onload = null;
          juez.onerror = null;
          if (animar && visible) await salirHaciaLaDerecha(elemento, direccion);
          else elemento.style.display = 'none';
          resolve(direccion);
        };
        avanzarDiapositiva = direccion => finalizar(direccion);
        pausarDiapositiva = () => {
          if (terminado || !visible || !temporizador) return;
          tiempoRestante = Math.max(1000, venceEn - Date.now());
          clearTimeout(temporizador);
          temporizador = null;
        };
        reanudarDiapositiva = () => {
          if (terminado || !visible || temporizador) return;
          programarFin(tiempoRestante || JUEZ_MS);
        };
        foto.style.display = 'none';
        juez.style.display = 'none';
        estado.style.display = 'none';
        const listo = duracion => {
          if (terminado || visible) return;
          visible = true;
          clearTimeout(temporizador);
          mostrarSinRebote(elemento);
          programarFin(duracion);
        };
        // Límite de carga; no deja el carrusel bloqueado por un recurso caído.
        temporizador = setTimeout(() => finalizar(1, false), 15_000);
        if (imagen) {
          foto.alt = imagen.nombre;
          foto.onload = () => listo(FOTO_MS);
          foto.onerror = () => finalizar(1, false);
          foto.src = imagen.url;
        } else {
          juez.onload = () => listo(JUEZ_MS);
          juez.onerror = () => finalizar(1, false);
          juez.src = `${JUEZ_URL}${JUEZ_URL.includes('?') ? '&' : '?'}carrusel=${Date.now()}`;
        }
      });
    }

    function crearSecuencia() {
      const secuencia = [];
      for (let i = 0; i < imagenes.length; i += 3) {
        secuencia.push(...imagenes.slice(i, i + 3), null);
      }
      return secuencia.length ? secuencia : [null];
    }

    async function iniciar() {
      await actualizarImagenes();
      let secuencia = crearSecuencia();
      let indice = 0;
      while (true) {
        // Adelanta la descarga de la próxima foto, también durante el juez.
        const siguienteFoto = secuencia[(indice + 1) % secuencia.length];
        if (siguienteFoto) {
          const precarga = new Image();
          precarga.src = siguienteFoto.url;
        }
        const direccion = await mostrarDiapositiva(secuencia[indice]);
        indice = (indice + direccion + secuencia.length) % secuencia.length;
        if (indice === 0 && Date.now() - ultimaActualizacion >= ACTUALIZAR_LISTA_MS) {
          await actualizarImagenes();
          secuencia = crearSecuencia();
        }
      }
    }

    iniciar();
  </script>
</body>
</html>
