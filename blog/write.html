<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redacción · Cuaderno CITE</title><link rel="stylesheet" href="styles.css"></head><body class="editor-page"><header class="mini-header"><div><span class="kicker">REDACCIÓN</span><h1>Cuaderno CITE</h1></div><a href="./" target="_blank">Ver blog ↗</a></header><main class="editor-shell"><section id="loginPanel" class="login-card"><h2>Acceso a la redacción</h2><p>Entra con la cuenta educativa autorizada.</p><button id="googleLogin" class="primary">Entrar con Google</button><p id="loginError" class="error"></p></section><section id="editorPanel" class="editor-workspace hidden"><div class="editor-topline"><span id="sessionUser"></span><button id="newBtn">+ Nueva entrada</button></div><div class="editor-columns"><aside class="drafts-panel"><h2>Entradas y borradores</h2><div id="draftList"></div></aside><form id="postForm" class="post-form"><input id="docId" type="hidden"><label>Título<input id="title" required></label><div class="form-grid"><label>Autor o grupo<input id="author" required></label><label>Fecha<input id="eventDate" type="date" required></label></div><label>Entradilla<textarea id="summary" rows="3" required></textarea></label><label>Etiquetas<input id="tagInput" placeholder="Ej.: Manuel25, Robótica, Radio"><small>Sepáralas con comas. Si una etiqueta no existe, se creará al publicar.</small></label><label>Imagen principal<input id="image" type="file" accept="image/jpeg,image/png,image/webp"></label><div id="imagePreview" class="image-preview hidden"></div><fieldset><legend>Contenido</legend><div class="toolbar"><button type="button" data-command="bold"><b>N</b></button><button type="button" data-command="italic"><i>C</i></button><button type="button" data-command="formatBlock" data-value="h2">Subtítulo</button><button type="button" data-command="insertUnorderedList">• Lista</button></div><div id="bodyEditor" class="rich-editor" contenteditable="true"></div></fieldset><div class="publish-row"><p id="saveMessage"></p><button id="unpublishBtn" class="hidden" type="button">Despublicar</button><button id="deleteBtn" class="danger hidden" type="button">Eliminar</button><button id="draftBtn" type="button">Guardar borrador</button><button class="primary" type="submit">Publicar</button></div></form></div></section></main><script type="module" src="write.js"></script></body></html>
