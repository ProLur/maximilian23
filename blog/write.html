<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Redacción · Cuaderno CITE</title><link rel="stylesheet" href="styles.css?v=3"></head><body class="editor-page"><header class="mini-header"><div><span class="kicker">REDACCIÓN</span><h1>Cuaderno CITE</h1></div><a href="./" target="_blank" rel="noopener">Ver blog ↗</a></header><main class="editor-shell"><section id="loginPanel" class="login-card"><h2>Acceso a la redacción</h2><p>Entra con la cuenta educativa autorizada.</p><button id="googleLogin" class="primary">Entrar con Google</button><p id="loginError" class="form-message error"></p></section><section id="editorPanel" class="editor-workspace hidden"><div class="editor-topline"><div><span id="sessionUser"></span> <button id="logoutBtn" class="text-button">Cerrar sesión</button></div><button id="newBtn" class="secondary">+ Nueva entrada</button></div><div class="editor-columns"><aside class="drafts-panel"><h2>Entradas y borradores</h2><div id="draftList"></div></aside><form id="postForm" class="post-form"><input id="docId" type="hidden"><label>Título<input id="title" maxlength="140" required placeholder="Título de la entrada"></label><div class="form-grid"><label>Autor o grupo<input id="author" maxlength="70" required></label><label>Fecha<input id="eventDate" type="date" required></label></div><label>Entradilla<textarea id="summary" maxlength="320" rows="3" required placeholder="Un resumen breve…"></textarea></label><label>Etiquetas<input id="tagInput" placeholder="Ej.: Manuel25, Robótica, Radio"><small>Sepáralas con comas. Cada etiqueta creará su propio filtro.</small></label><label>Imágenes de la entrada<input id="images" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>Puedes subir hasta 4 imágenes. La primera será la portada y todas aparecerán en la galería del artículo.</small></label><div id="imagePreview" class="image-preview-grid hidden"></div><fieldset class="body-field"><legend>Contenido</legend><div class="toolbar"><button type="button" data-command="bold"><b>N</b></button><button type="button" data-command="italic"><i>C</i></button><button type="button" data-command="formatBlock" data-value="h2">Subtítulo</button><button type="button" data-command="formatBlock" data-value="p">Párrafo</button><button type="button" data-command="insertUnorderedList">• Lista</button><button type="button" id="linkBtn">Enlace</button><button type="button" data-command="removeFormat">Limpiar</button></div><div id="bodyEditor" class="rich-editor" contenteditable="true" data-placeholder="Escribe aquí la entrada…"></div></fieldset><div class="publish-row"><p id="saveMessage" class="form-message"></p><button id="unpublishBtn" class="secondary hidden" type="button">Despublicar</button><button id="deleteBtn" class="danger hidden" type="button">Eliminar</button><button id="draftBtn" class="secondary" type="button">Guardar borrador</button><button class="primary" type="submit">Publicar</button></div></form></div></section></main><script type="module" src="write.js?v=3"></script></body></html>
