<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Registro • Juego del Silencio (Privado)</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <style>
    body { 
      font-family: "Courier New", Courier, monospace; 
      background: #0d1117; 
      color: #e6edf3; 
      min-height: 100dvh;
      background-image: radial-gradient(circle at 25% 15%, rgba(0,255,204,0.08) 0%, transparent 50%),
                        radial-gradient(circle at 75% 85%, rgba(0,255,204,0.06) 0%, transparent 50%);
      background-attachment: fixed; 
    }
    header { 
      background: rgba(22,27,34,0.92); 
      backdrop-filter: blur(8px); 
      padding: 1rem 1.2rem; 
      display: flex; 
      align-items: center; 
      gap: 0.8rem;
      border-bottom: 2px solid #00ffcc; 
      position: sticky; 
      top: 0; 
      z-index: 100; 
    }
    header img { 
      height: 45px; 
      border-radius: 50%; 
      border: 2px solid #00ffcc88; 
      box-shadow: 0 0 12px #00ffcc55; 
    }
    header h1 { 
      font-size: 1.7rem; 
      color: #00ffcc; 
      text-shadow: 0 0 8px #00ffccaa; 
    }
    .container { 
      max-width: 1200px; 
      margin: 2rem auto; 
      padding: 0 1rem; 
    }
    .debug-info { 
      background: rgba(255,0,0,0.15); 
      border: 1px solid #ff4444; 
      color: #ffdddd; 
      padding: 1rem; 
      margin: 1rem 0; 
      border-radius: 8px; 
      font-size: 0.95rem; 
      white-space: pre-wrap; 
    }
    .classification { 
      background: rgba(30,45,61,0.35); 
      border: 2px solid #00ffcc55; 
      border-radius: 14px; 
      padding: 2rem; 
      backdrop-filter: blur(6px); 
      overflow-x: auto; 
      box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      background: rgba(13,17,23,0.85); 
      border: 3px solid #00ffcc; 
      border-radius: 12px; 
      overflow: hidden; 
      min-width: 900px; 
    }
    th { 
      background: linear-gradient(#00ffcc22, transparent); 
      color: #00ffcc; 
      padding: 16px 12px; 
      font-size: 1.2rem; 
      border-bottom: 3px solid #00ffcc66; 
      text-align: center; 
    }
    td { 
      padding: 12px; 
      text-align: center; 
      border-bottom: 1px solid #00ffcc33; 
    }
    .participant-name { 
      text-align: left; 
      padding-left: 1.8rem; 
      color: #00ffcc; 
      font-size: 1.35rem; 
      font-weight: bold; 
    }
    .total-cell { 
      background: rgba(0,255,204,0.22) !important; 
      color: #00ffcc; 
      font-size: 1.5rem; 
      font-weight: bold; 
      border-left: 3px solid #00ffcc; 
    }
    select { 
      background: #161b22; 
      color: #e6edf3; 
      border: 2px solid #00ffcc66; 
      border-radius: 8px; 
      padding: 8px 4px; 
      font-size: 1.1rem; 
      width: 100%; 
      max-width: 80px; 
      text-align: center; 
      cursor: pointer; 
    }
    .btn-guardar, .btn-reload { 
      display: inline-block; 
      margin: 1rem 1rem; 
      padding: 0.9rem 2.5rem; 
      background: rgba(0,255,204,0.2); 
      color: #00ffcc; 
      border: 3px solid #00ffcc; 
      border-radius: 999px; 
      font-size: 1.2rem; 
      font-weight: bold; 
      cursor: pointer; 
      transition: all 0.2s; 
    }
    .btn-guardar:hover, .btn-reload:hover { 
      background: rgba(0,255,204,0.35); 
      transform: scale(1.05); 
    }
    .status-ok {
      color: #00ffcc;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Logo">
    <h1>Registro Privado • Juego del Silencio</h1>
  </header>

  <div class="container">
    <div id="debug-info" class="debug-info">Estado: esperando carga...</div>

    <div style="text-align:center; margin:1.5rem 0;">
      <button class="btn-reload" onclick="cargarDatos()">CARGAR / RECARGAR DATOS</button>
    </div>

    <div class="classification">
      <table>
        <thead>
          <tr>
            <th>Participante</th>
            <th>Semana 1</th>
            <th>Semana 2</th>
            <th>Semana 3</th>
            <th>Semana 4</th>
            <th>Semana 5</th>
            <th>Semana 6</th>
            <th>TOTAL</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <tr><td colspan="8" style="padding:3rem; color:#888;">Cargando...</td></tr>
        </tbody>
      </table>
    </div>

    <div style="text-align:center;">
      <button class="btn-guardar" onclick="guardarDatos()">GUARDAR CAMBIOS</button>
    </div>
  </div>

  <script>
    const STORAGE_URL = 'https://api.jsonbin.io/v3/b/6995e8d9ae596e708f34c912';
    const MASTER_KEY = '$2a$10$Z4/lj4bJs4gRcw67snP9zewPYv9rbqaXFeGKdX07gqvA0ucBoTgVy';

    let participantsData = [];  // Array de {name, scores}
    let scoresMap = {};         // Para acceso rápido name → scores

    const debug = document.getElementById('debug-info');

    function log(msg, error = false) {
      debug.innerHTML += (error ? '<strong style="color:#ff6666;">ERROR: </strong>' : '') + msg + '<br>';
      console.log(msg);
    }

    async function cargarDatos() {
      debug.innerHTML = 'Cargando datos...<br>';
      log('Fetch iniciado');

      try {
        const res = await fetch(STORAGE_URL, { cache: 'no-store' });
        log(`Status: ${res.status}`);

        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const json = await res.json();
        const record = json.record || {};

        if (record.participants && Array.isArray(record.participants)) {
          participantsData = record.participants;
          scoresMap = {};
          participantsData.forEach(p => {
            if (p.name && Array.isArray(p.scores)) {
              scoresMap[p.name] = p.scores;
            }
          });

          log(`<span class="status-ok">Cargados ${participantsData.length} participantes</span>`);
          renderTable();
        } else {
          log('No se encontró "participants" como array en el bin', true);
          debug.innerHTML += '<br><strong>El bin no tiene el formato esperado. Debe tener: "participants": [ {name: "...", scores: [0,0,...]} , ... ]</strong>';
        }
      } catch (err) {
        log(`Error: ${err.message}`, true);
        debug.innerHTML += '<br>Verifica: ¿existe el bin? ¿tienes conexión? ¿la URL es correcta?';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';

      if (participantsData.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8">No hay datos de participantes</td></tr>';
        return;
      }

      // Ordenar por total descendente
      const sorted = [...participantsData].sort((a,b) => {
        const ta = a.scores.reduce((s,p)=>s+p,0);
        const tb = b.scores.reduce((s,p)=>s+p,0);
        return tb - ta;
      });

      sorted.forEach(p => {
        const row = document.createElement('tr');
        let rowHTML = `<td class="participant-name">${p.name}</td>`;
        let total = 0;

        for (let w = 0; w < 6; w++) {
          const val = Number(p.scores[w]) || 0;
          total += val;
          rowHTML += `
            <td>
              <select data-name="${p.name}" data-week="${w}">
                ${Array.from({length: 11}, (_, i) => 
                  `<option value="${i}" ${val === i ? 'selected' : ''}>${i}</option>`
                ).join('')}
              </select>
            </td>`;
        }

        rowHTML += `<td class="total-cell">${total}</td>`;
        row.innerHTML = rowHTML;
        tbody.appendChild(row);
      });

      log('Tabla renderizada correctamente');
    }

    async function guardarDatos() {
      log('Guardando cambios...');

      // Actualizamos el array original con los valores de los selects
      document.querySelectorAll('select').forEach(sel => {
        const name = sel.dataset.name;
        const week = parseInt(sel.dataset.week);
        const val = parseInt(sel.value) || 0;

        const participant = participantsData.find(p => p.name === name);
        if (participant && participant.scores) {
          participant.scores[week] = val;
        }
      });

      try {
        const res = await fetch(STORAGE_URL, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'X-Master-Key': MASTER_KEY
          },
          body: JSON.stringify({ 
            participants: participantsData, 
            lastUpdate: new Date().toISOString() 
          })
        });

        if (res.ok) {
          log('<span class="status-ok">¡Guardado correctamente!</span>');
          alert('Datos guardados con éxito');
          await cargarDatos(); // recargamos para confirmar
        } else {
          const errText = await res.text();
          log(`Error al guardar: ${res.status} - ${errText}`, true);
          alert('Error al guardar: ' + res.status);
        }
      } catch (e) {
        log(`Error de conexión: ${e.message}`, true);
        alert('No se pudo conectar. Revisa tu internet.');
      }
    }

    window.onload = () => {
      cargarDatos();
    };
  </script>
</body>
</html>
