<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Maximilian 23</title>
  <style>
    :root {
      --glow: #00ff72;
      --bg: #001400;
      --dark: #001f00;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--glow);
      font-family: "Courier New", monospace;
      text-align: center;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 50%; left: 50%;
      width: 200vmax; height: 200vmax;
      background: radial-gradient(circle, rgba(0,255,114,0.25) 2%, transparent 60%);
      transform: translate(-50%, -50%);
      animation: radar 12s linear infinite;
      opacity: 0.08;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes radar {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .logo {
      width: 38vw;
      max-width: 150px;
      height: auto;
      margin: 0 auto 12px;
      display: block;
      filter: drop-shadow(0 0 10px var(--glow));
    }

    h1 {
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      margin: 0 0 18px 0;
      text-shadow: 0 0 6px var(--glow);
      line-height: 1.2;
    }

    .terminal-box {
      border: 1px solid var(--glow);
      padding: 16px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 0 12px var(--glow), inset 0 0 8px rgba(0,255,114,0.1);
      background: rgba(0, 20, 0, 0.7);
      backdrop-filter: blur(2px);
    }

    #oscilograma {
      width: 100%;
      height: 60px;
      display: block;
      margin-bottom: 14px;
      image-rendering: pixelated;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    button {
      flex: 1;
      max-width: 130px;
      background: var(--dark);
      border: 1px solid var(--glow);
      color: var(--glow);
      padding: 12px 0;
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    button:hover {
      background: rgba(0, 255, 114, 0.1);
      box-shadow: 0 0 8px var(--glow);
    }

    button:active {
      background: var(--glow);
      color: var(--bg);
      transform: scale(0.98);
    }

    #player {
      width: 1px;
      height: 1px;
      opacity: 0;
      position: absolute;
      pointer-events: none;
    }

    .note {
      margin-top: 20px;
      font-size: 0.75rem;
      opacity: 0.7;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.4;
    }

    .status {
      font-size: 0.8rem;
      margin-top: 8px;
      opacity: 0.8;
      min-height: 1.2em;
    }

    .voice-line {
      font-size: 0.85rem;
      margin: 6px 0;
      opacity: 0.9;
      font-style: italic;
      min-height: 1.2em;
      transition: opacity 0.5s;
    }

    @media (max-width: 480px) {
      .terminal-box { padding: 14px; }
      button { font-size: 0.9rem; padding: 10px 0; }
      .btn-group { gap: 6px; }
    }
  </style>
</head>
<body>

  <audio id="beep" preload="auto">
    <source src="beep.mp3" type="audio/mpeg">
  </audio>

  <img src="max2.png" class="logo" alt="Logo Maximilian" onerror="this.style.display='none'">

  <h1>RADIO MAXIMILIAN 23</h1>

  <div class="terminal-box">
    <canvas id="oscilograma"></canvas>
    <div class="status" id="status">Inicializando frecuencia...</div>
    <div id="voiceOutput" class="voice-line"></div>
    <button id="startBtn">Iniciar Emisión</button>
    <div class="btn-group" id="controls" style="display:none;">
      <button id="nextBtn">Siguiente</button>
      <button id="stopBtn">STOP</button>
    </div>
    <iframe id="player" allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>

  <p class="note">
    Emisión 24/7 • Soporte videos individuales • Voz masculina
  </p>

  <script>
    // === CONFIGURACIÓN ===
    const CONFIG = {
      voiceRate: 0.95,
      voicePitch: 0.7,
      voiceVolume: 1.0,
      announcementInterval: 4,
      hourAnnounce: true,
      beepBeforeVoice: true
    };

    // === ELEMENTOS ===
    const els = {
      startBtn: document.getElementById('startBtn'),
      nextBtn: document.getElementById('nextBtn'),
      stopBtn: document.getElementById('stopBtn'),
      controls: document.getElementById('controls'),
      player: document.getElementById('player'),
      status: document.getElementById('status'),
      voiceOutput: document.getElementById('voiceOutput'),
      beep: document.getElementById('beep'),
      canvas: document.getElementById('oscilograma')
    };

    let playlists = [], currentIndex = 0, songCount = 0;
    let isPlaying = false, voiceEnabled = false;
    let audioContext = null, lastHour = -1;
    let checkInterval = null;

    // === CARGAR PLAYLISTS (MEJORADO: SOPORTE PARA VIDEOS INDIVIDUALES) ===
    async function loadPlaylists() {
      try {
        const res = await fetch('playlists.txt?t=' + Date.now());
        if (!res.ok) throw new Error('Archivo no encontrado');
        const text = await res.text();
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);

        playlists = lines.map(line => {
          try {
            const url = new URL(line);
            let id = null;

            // Si es playlist (tiene list=)
            const listId = url.searchParams.get('list');
            if (listId) {
              console.log(`Cargando playlist: ${listId}`);
              return { type: 'playlist', id: listId, original: line };
            }

            // Si es video individual (tiene v=)
            const videoId = url.searchParams.get('v');
            if (videoId) {
              console.log(`Cargando video individual: ${videoId}`);
              return { type: 'video', id: videoId, original: line };
            }

            return null;
          } catch {
            console.warn(`URL inválida: ${line}`);
            return null;
          }
        }).filter(p => p);

        if (playlists.length === 0) throw new Error('No hay URLs válidas');

        console.log(`Cargadas ${playlists.length} entradas:`, playlists.map(p => `${p.type}: ${p.id}`));
        els.status.textContent = `Frecuencia activa: ${playlists.length} bloques (${playlists.filter(p => p.type === 'playlist').length} playlists, ${playlists.filter(p => p.type === 'video').length} videos)`;
      } catch (err) {
        console.error('Error cargando playlists:', err);
        els.status.textContent = 'Señal de emergencia';
        playlists = [{ type: 'playlist', id: 'PL4fGSI1pDJn69On1f-8NAvX_CYlx7QyZc', original: '' }];
      }
    }

    // === GENERAR EMBED URL (MEJORADO PARA VIDEOS INDIVIDUALES) ===
    function generateEmbedUrl(entry) {
      if (!entry) return '';
      const t = Date.now(); // Evita caché
      let baseUrl;

      if (entry.type === 'playlist') {
        baseUrl = `https://www.youtube.com/embed/videoseries?list=${entry.id}`;
      } else { // video individual → playlist de 1 video
        baseUrl = `https://www.youtube.com/embed/videoseries?list=${entry.id}`;
        // Nota: Para un solo video, se puede usar /embed/{videoId}, pero videoseries funciona igual
      }

      const index = Math.floor(Math.random() * 50); // Aleatorio si aplica
      return `${baseUrl}&autoplay=1&loop=1&playlist=${entry.id}&index=${index}&mute=0&rel=0&modestbranding=1&t=${t}`;
    }

    // === ESTIMAR GRAVEDAD DE VOZ ===
    function getVoicePitchScore(voice) {
      const name = voice.name.toLowerCase();
      let score = 0;
      if (name.includes('male') || name.includes('hombre') || name.includes('man')) score += 10;
      if (name.includes('deep') || name.includes('bass') || name.includes('grave')) score += 8;
      if (name.includes('jorge') || name.includes('enrique') || name.includes('carlos')) score += 5;
      return score;
    }

    // === SINTETIZAR VOZ MASCULINA ===
    function speak(text, callback) {
      if (!voiceEnabled || !('speechSynthesis' in window)) {
        if (callback) callback();
        return;
      }

      els.voiceOutput.textContent = `"...${text}..."`;
      els.voiceOutput.style.opacity = 1;

      const utter = new SpeechSynthesisUtterance(text);
      let voices = speechSynthesis.getVoices();
      if (voices.length === 0) voices = speechSynthesis.getVoices();

      let candidates = voices
        .filter(v => v.lang.startsWith('es'))
        .map(v => ({ voice: v, score: getVoicePitchScore(v) }))
        .sort((a, b) => b.score - a.score);

      let selectedVoice = candidates[0]?.voice;
      if (!selectedVoice) {
        candidates = voices.map(v => ({ voice: v, score: getVoicePitchScore(v) })).sort((a, b) => b.score - a.score);
        selectedVoice = candidates[0]?.voice || voices[0];
      }

      utter.voice = selectedVoice;
      utter.rate = CONFIG.voiceRate;
      utter.pitch = CONFIG.voicePitch;
      utter.volume = CONFIG.voiceVolume;

      utter.onstart = () => {
        if (CONFIG.beepBeforeVoice) {
          els.beep.currentTime = 0;
          els.beep.play().catch(() => {});
        }
      };

      utter.onend = () => {
        setTimeout(() => {
          els.voiceOutput.style.opacity = 0.6;
          setTimeout(() => { els.voiceOutput.textContent = ''; }, 1000);
        }, 500);
        if (callback) callback();
      };

      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }

    // === ANUNCIOS ===
    function playAnnouncement() {
      const now = new Date();
      const hour = now.getHours();
      const mins = now.getMinutes();
      const isNewHour = hour !== lastHour && mins < 5;

      let msg = '';
      if (isNewHour && CONFIG.hourAnnounce) {
        lastHour = hour;
        msg = `Son las ${hour} ${mins > 0 ? `y ${mins}` : ''}. Estás en Radio Maximilian 23, la frecuencia del futuro.`;
      } else if (songCount % CONFIG.announcementInterval === 0 && songCount > 0) {
        const frases = [
          "Transmisión en directo desde el ciberespacio.",
          "Sintoniza la señal verde. Radio Maximilian 23.",
          "Frecuencia activa. No cambies de canal.",
          "Aquí solo suena lo que importa.",
          "Conectado. Escuchando. Transmitiendo.",
          "Señal clara. Volumen máximo."
        ];
        msg = frases[Math.floor(Math.random() * frases.length)];
      }

      if (msg) setTimeout(() => speak(msg), 800);
    }

    // === CARGAR NUEVA ENTRADA (FORZAR RECARGA) ===
    function loadNewEntry() {
      if (!isPlaying || !playlists.length) return;

      const url = generateEmbedUrl(playlists[currentIndex]);
      if (!url) return;

      // Forzar recarga del iframe (vaciar y recargar)
      els.player.src = '';
      setTimeout(() => {
        els.player.src = url;
      }, 150);

      songCount++;
      playAnnouncement();
      els.status.textContent = `${playlists[currentIndex].type === 'playlist' ? 'Playlist' : 'Video'} #${currentIndex + 1} | Canción ${songCount}`;
    }

    // === INICIAR RADIO (ALEATORIO) ===
    function startRadio() {
      if (!playlists.length) return;

      // Elegir entrada aleatoria
      currentIndex = Math.floor(Math.random() * playlists.length);
      songCount = 0;

      // Mostrar controles INMEDIATAMENTE
      els.startBtn.style.display = 'none';
      els.controls.style.display = 'flex';

      // Iniciar voz + reproducción
      speak("Estás escuchando Radio Maximilian 23. Emisión continua iniciada.", () => {
        loadNewEntry();
      });

      // Iniciar detección de canciones (aprox. cada 3-5 min)
      if (checkInterval) clearInterval(checkInterval);
      checkInterval = setInterval(() => {
        if (Math.random() < 0.03 && isPlaying) {
          songCount++;
          playAnnouncement();
          els.status.textContent = `${playlists[currentIndex].type === 'playlist' ? 'Playlist' : 'Video'} #${currentIndex + 1} | Canción ${songCount}`;
        }
      }, 60000);

      isPlaying = true;
    }

    // === DETENER TODO ===
    function stopRadio() {
      isPlaying = false;
      voiceEnabled = false;
      speechSynthesis.cancel();
      els.player.src = '';
      if (checkInterval) clearInterval(checkInterval);
      checkInterval = null;

      els.status.textContent = 'Emisión detenida.';
      els.voiceOutput.textContent = '';
      els.controls.style.display = 'none';
      els.startBtn.style.display = 'block';
    }

    // === BOTONES ===
    els.startBtn.addEventListener('click', () => {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        audioContext.resume();
      }

      voiceEnabled = true;
      startRadio();
    });

    els.nextBtn.addEventListener('click', () => {
      // Cambiar a siguiente (cíclico)
      currentIndex = (currentIndex + 1) % playlists.length;
      loadNewEntry();
    });

    els.stopBtn.addEventListener('click', () => {
      speak("Emisión pausada. Volveremos pronto.", () => {
        stopRadio();
      });
    });

    // === OSCILOGRAMA ===
    function initOscilloscope() {
      const canvas = els.canvas;
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = canvas.offsetWidth * window.devicePixelRatio;
        canvas.height = 60 * window.devicePixelRatio;
        canvas.style.height = '60px';
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }
      resize();
      window.addEventListener('resize', resize);

      let t = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'var(--glow)';
        ctx.lineWidth = 2;
        ctx.beginPath();

        const w = canvas.offsetWidth;
        const h = 60;

        t += 0.8;
        for (let x = 0; x <= w; x += 2) {
          const phase = (x / w) * Math.PI * 4 + t * 0.02;
          const amp = Math.sin(phase) * 18 + Math.sin(phase * 1.7) * 10 + Math.sin(t * 0.05) * 5;
          const y = h / 2 + amp;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
        requestAnimationFrame(draw);
      }
      draw();
    }

    // === INICIALIZAR ===
    window.addEventListener('load', async () => {
      if ('speechSynthesis' in window) {
        speechSynthesis.onvoiceschanged = () => {};
        speechSynthesis.getVoices();
      }

      await loadPlaylists();
      initOscilloscope();
      els.startBtn.disabled = false;
    });
  </script>
</body>
</html>
