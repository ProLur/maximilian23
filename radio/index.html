<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Maximilian 23</title>
  <style>
    :root {
      --glow: #00ff72;
      --bg: #001400;
      --dark: #001f00;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--glow);
      font-family: "Courier New", monospace;
      text-align: center;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 50%; left: 50%;
      width: 200vmax; height: 200vmax;
      background: radial-gradient(circle, rgba(0,255,114,0.25) 2%, transparent 60%);
      transform: translate(-50%, -50%);
      animation: radar 12s linear infinite;
      opacity: 0.08;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes radar {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .logo {
      width: 38vw;
      max-width: 150px;
      height: auto;
      margin: 0 auto 12px;
      display: block;
      filter: drop-shadow(0 0 10px var(--glow));
    }

    h1 {
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      margin: 0 0 18px 0;
      text-shadow: 0 0 6px var(--glow);
      line-height: 1.2;
    }

    .terminal-box {
      border: 1px solid var(--glow);
      padding: 16px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 0 12px var(--glow), inset 0 0 8px rgba(0,255,114,0.1);
      background: rgba(0, 20, 0, 0.7);
      backdrop-filter: blur(2px);
    }

    #oscilograma {
      width: 100%;
      height: 60px;
      display: block;
      margin-bottom: 14px;
      image-rendering: pixelated;
    }

    button {
      width: 100%;
      max-width: 260px;
      background: var(--dark);
      border: 1px solid var(--glow);
      color: var(--glow);
      padding: 12px 0;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      margin: 8px auto;
      display: block;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    button:hover {
      background: rgba(0, 255, 114, 0.1);
      box-shadow: 0 0 8px var(--glow);
    }

    button:active {
      background: var(--glow);
      color: var(--bg);
      transform: scale(0.98);
    }

    #player {
      width: 1px;
      height: 1px;
      opacity: 0;
      position: absolute;
      pointer-events: none;
    }

    .note {
      margin-top: 20px;
      font-size: 0.75rem;
      opacity: 0.7;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.4;
    }

    .status {
      font-size: 0.8rem;
      margin-top: 8px;
      opacity: 0.8;
      min-height: 1.2em;
    }

    .voice-line {
      font-size: 0.85rem;
      margin: 6px 0;
      opacity: 0.9;
      font-style: italic;
      min-height: 1.2em;
      transition: opacity 0.5s;
    }

    @media (max-width: 480px) {
      .terminal-box { padding: 14px; }
      button { font-size: 0.95rem; padding: 11px 0; }
    }
  </style>
</head>
<body>

  <audio id="beep" preload="auto">
    <source src="beep.mp3" type="audio/mpeg">
  </audio>

  <img src="max2.png" class="logo" alt="Logo Maximilian" onerror="this.style.display='none'">

  <h1>RADIO MAXIMILIAN 23</h1>

  <div class="terminal-box">
    <canvas id="oscilograma"></canvas>
    <div class="status" id="status">Inicializando frecuencia...</div>
    <div id="voiceOutput" class="voice-line"></div>
    <button id="startBtn">Iniciar Emisión</button>
    <button id="nextBtn" style="display:none;">Siguiente</button>
    <iframe id="player" allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>

  <p class="note">
    Emisión 24/7 • Locución masculina • YouTube oficial
  </p>

  <script>
    // === CONFIGURACIÓN ===
    const CONFIG = {
      voiceRate: 0.95,     // Más lento = más grave y profesional
      voicePitch: 0.7,     // 0.7 = voz grave (másculina)
      voiceVolume: 1.0,
      announcementInterval: 4,
      hourAnnounce: true,
      beepBeforeVoice: true
    };

    // === ELEMENTOS ===
    const els = {
      startBtn: document.getElementById('startBtn'),
      nextBtn: document.getElementById('nextBtn'),
      player: document.getElementById('player'),
      status: document.getElementById('status'),
      voiceOutput: document.getElementById('voiceOutput'),
      beep: document.getElementById('beep'),
      canvas: document.getElementById('oscilograma')
    };

    let playlists = [], currentIndex = 0, songCount = 0;
    let isPlaying = false, voiceEnabled = false;
    let audioContext = null, lastHour = -1;

    // === CARGAR PLAYLISTS ===
    async function loadPlaylists() {
      try {
        const res = await fetch('playlists.txt?t=' + Date.now());
        if (!res.ok) throw new Error();
        const text = await res.text();
        playlists = text.split('\n').map(l => l.trim()).filter(l => l && l.includes('list='));
        if (playlists.length === 0) throw new Error();
        els.status.textContent = `Frecuencia activa: ${playlists.length} bloques`;
      } catch {
        els.status.textContent = 'Señal de emergencia';
        playlists = ['https://www.youtube.com/playlist?list=PL4fGSI1pDJn69On1f-8NAvX_CYlx7QyZc'];
      }
    }

    // === CONVERTIR A EMBED ===
    function toEmbed(url) {
      try {
        const list = new URL(url).searchParams.get('list');
        return `https://www.youtube.com/embed/videoseries?list=${list}&autoplay=1&loop=1&playlist=${list}&mute=0&rel=0&modestbranding=1`;
      } catch { return ''; }
    }

    // === FUNCIÓN PARA ESTIMAR GRAVEDAD DE VOZ ===
    function getVoicePitchScore(voice) {
      const name = voice.name.toLowerCase();
      let score = 0;
      if (name.includes('male') || name.includes('hombre') || name.includes('man')) score += 10;
      if (name.includes('deep') || name.includes('bass') || name.includes('grave')) score += 8;
      if (name.includes('jorge') || name.includes('enrique') || name.includes('carlos')) score += 5;
      return score;
    }

    // === SINTETIZAR VOZ (MASCULINA Y PROFESIONAL) ===
    function speak(text, callback) {
      if (!voiceEnabled || !('speechSynthesis' in window)) {
        if (callback) callback();
        return;
      }

      els.voiceOutput.textContent = `"...${text}..."`;
      els.voiceOutput.style.opacity = 1;

      const utter = new SpeechSynthesisUtterance(text);
      let voices = speechSynthesis.getVoices();

      if (voices.length === 0) {
        speechSynthesis.getVoices();
        voices = speechSynthesis.getVoices();
      }

      // === BUSCAR VOZ MASCULINA EN ESPAÑOL ===
      let candidates = voices
        .filter(v => v.lang.startsWith('es'))
        .map(v => ({ voice: v, score: getVoicePitchScore(v) }))
        .sort((a, b) => b.score - a.score);

      let selectedVoice = candidates[0]?.voice;

      // === SI NO HAY ESPAÑOL, USAR CUALQUIER VOZ MASCULINA GRAVE ===
      if (!selectedVoice) {
        candidates = voices
          .map(v => ({ voice: v, score: getVoicePitchScore(v) }))
          .sort((a, b) => b.score - a.score);
        selectedVoice = candidates[0]?.voice || voices[0];
      }

      utter.voice = selectedVoice;
      utter.rate = CONFIG.voiceRate;
      utter.pitch = CONFIG.voicePitch;
      utter.volume = CONFIG.voiceVolume;

      utter.onstart = () => {
        if (CONFIG.beepBeforeVoice) {
          els.beep.currentTime = 0;
          els.beep.play().catch(() => {});
        }
      };

      utter.onend = () => {
        setTimeout(() => {
          els.voiceOutput.style.opacity = 0.6;
          setTimeout(() => { els.voiceOutput.textContent = ''; }, 1000);
        }, 500);
        if (callback) callback();
      };

      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }

    // === ANUNCIOS ===
    function playAnnouncement() {
      const now = new Date();
      const hour = now.getHours();
      const mins = now.getMinutes();
      const isNewHour = hour !== lastHour && mins < 5;

      let msg = '';

      if (isNewHour && CONFIG.hourAnnounce) {
        lastHour = hour;
        msg = `Son las ${hour} ${mins > 0 ? `y ${mins}` : ''}. Estás en Radio Maximilian 23, la frecuencia del futuro.`;
      } else if (songCount % CONFIG.announcementInterval === 0) {
        const frases = [
          "Transmisión en directo desde el ciberespacio.",
          "Sintoniza la señal verde. Radio Maximilian 23.",
          "Frecuencia activa. No cambies de canal.",
          "Aquí solo suena lo que importa.",
          "Conectado. Escuchando. Transmitiendo.",
          "Señal clara. Volumen máximo."
        ];
        msg = frases[Math.floor(Math.random() * frases.length)];
      }

      if (msg) {
        setTimeout(() => speak(msg), 800);
      }
    }

    // === INICIAR RADIO ===
    function startRadio() {
      if (!playlists.length) return;
      const url = toEmbed(playlists[currentIndex]);
      if (!url) return;

      els.player.src = url;
      songCount++;
      playAnnouncement();
      els.status.textContent = `Bloque #${currentIndex + 1} | Canción ${songCount}`;
      isPlaying = true;
    }

    // === BOTÓN INICIAR ===
    els.startBtn.addEventListener('click', () => {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        audioContext.resume();
      }

      voiceEnabled = true;
      speak("Estás escuchando Radio Maximilian 23. Emisión continua iniciada.", () => {
        startRadio();
        els.startBtn.style.display = 'none';
        els.nextBtn.style.display = 'block';
      });
    });

    // === SIGUIENTE ===
    els.nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % playlists.length;
      startRadio();
    });

    // === OSCILOGRAMA ===
    function initOscilloscope() {
      const canvas = els.canvas;
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = canvas.offsetWidth * window.devicePixelRatio;
        canvas.height = 60 * window.devicePixelRatio;
        canvas.style.height = '60px';
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }
      resize();
      window.addEventListener('resize', resize);

      let t = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'var(--glow)';
        ctx.lineWidth = 2;
        ctx.beginPath();

        const w = canvas.offsetWidth;
        const h = 60;

        t += 0.8;
        for (let x = 0; x <= w; x += 2) {
          const phase = (x / w) * Math.PI * 4 + t * 0.02;
          const amp = Math.sin(phase) * 18 + Math.sin(phase * 1.7) * 10 + Math.sin(t * 0.05) * 5;
          const y = h / 2 + amp;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
        requestAnimationFrame(draw);
      }
      draw();
    }

    // === DETECCIÓN APROXIMADA DE CANCIÓN ===
    let checkInterval;
    els.player.addEventListener('load', () => {
      if (isPlaying && !checkInterval) {
        checkInterval = setInterval(() => {
          if (Math.random() < 0.03) {
            songCount++;
            playAnnouncement();
            els.status.textContent = `Bloque #${currentIndex + 1} | Canción ${songCount}`;
          }
        }, 60000);
      }
    });

    // === INICIALIZAR ===
    window.addEventListener('load', async () => {
      if ('speechSynthesis' in window) {
        speechSynthesis.onvoiceschanged = () => {};
        speechSynthesis.getVoices();
      }

      await loadPlaylists();
      initOscilloscope();
      els.startBtn.disabled = false;
    });
  </script>
</body>
</html>
