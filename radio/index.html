<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Maximilian 23</title>

<style>
  body {
    background: #001400;
    color: #00ff72;
    font-family: "Courier New", monospace;
    text-align: center;
    margin: 0;
    padding: 16px;
    overflow-x: hidden;
  }

  body:before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 200vw; height: 200vw;
    background: radial-gradient(circle, rgba(0,255,114,0.25) 2%, transparent 60%);
    animation: radar 8s linear infinite;
    opacity: 0.09;
    z-index: -1;
  }
  @keyframes radar { 100% { transform: rotate(360deg); } }

  .logo {
    width: 38vw;
    max-width: 150px;
    height: auto;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 10px #00ff72);
  }

  h1 {
    font-size: 6vw;
    max-width: 300px;
    margin: 0 auto 18px auto;
    text-shadow: 0 0 6px #00ff72;
  }

  .terminal-box {
    border: 1px solid #00ff72;
    padding: 14px;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    border-radius: 8px;
    box-shadow: 0 0 10px #00ff72;
    background: rgba(0,18,0,0.6);
  }

  #oscilograma {
    width: 100%;
    height: 60px;
    display: block;
    margin-bottom: 12px;
  }

  button {
    width: 100%;
    max-width: 260px;
    background: #001f00;
    border: 1px solid #00ff72;
    color: #00ff72;
    padding: 10px 0;
    border-radius: 6px;
    font-size: 16px;
    margin: 6px auto;
    display: block;
  }
  button:active {
    background: #00ff72;
    color: #001400;
  }

  #player {
    width: 1px;
    height: 1px;
    opacity: 0;
    position: absolute;
  }

  .note {
    margin-top: 18px;
    font-size: 11px;
    opacity: 0.7;
  }
</style>
</head>

<body>

<audio id="beep" src="beep.mp3" preload="auto"></audio>

<img src="max2.png" class="logo" alt="Maximilian">
<h1>RADIO MAXIMILIAN 23</h1>

<div class="terminal-box">
  <canvas id="oscilograma"></canvas>

  <button id="startBtn">▶ Iniciar Radio</button>
  <button id="nextBtn" style="display:none;">Siguiente playlist</button>

  <iframe id="player" allow="autoplay; encrypted-media"></iframe>
</div>

<p class="note">
  La música proviene de YouTube y se reproduce mediante su reproductor oficial.
</p>

<script>
let playlists = [];
let index = 0;
let started = false;

async function loadPlaylists() {
  const res = await fetch('playlists.txt');
  const text = await res.text();
  playlists = text.split('\n').map(l => l.trim()).filter(l => l);
}

function playlistToEmbed(url) {
  const match = url.match(/list=([^&]+)/);
  const listID = match ? match[1] : null;
  return `https://www.youtube.com/embed/videoseries?list=${listID}&autoplay=1&loop=1&mute=0`;
}

function startRadio() {
  document.getElementById('player').src = playlistToEmbed(playlists[index]);
  document.getElementById('beep').play();
}

/* El botón ahora garantiza el user-gesture */
document.getElementById('startBtn').addEventListener('click', () => {
  started = true;
  startRadio();
  document.getElementById('startBtn').style.display = "none";
  document.getElementById('nextBtn').style.display = "block";
});

/* Cambiar playlist */
document.getElementById('nextBtn').addEventListener('click', () => {
  index = (index + 1) % playlists.length;
  startRadio();
});

/* Oscilograma */
const canvas = document.getElementById('oscilograma');
const ctx = canvas.getContext('2d');

function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = '#00ff72';
  ctx.beginPath();
  let t = Date.now() / 120;
  for (let x = 0; x < canvas.width; x++) {
    let y = canvas.height/2 + Math.sin((x+t)/7)*20;
    ctx.lineTo(x, y);
  }
  ctx.stroke();
  requestAnimationFrame(draw);
}
draw();

(async () => { await loadPlaylists(); })();
</script>

</body>
</html>
