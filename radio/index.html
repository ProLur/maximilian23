<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Maximilian 23</title>
  <style>
    :root { --glow: #00ff72; --bg: #001400; --dark: #001f00; }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--glow); font-family: "Courier New", monospace;
      text-align: center; margin: 0; padding: 16px; min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center;
      overflow-x: hidden; position: relative;
    }
    body::before {
      content: ""; position: fixed; top: 50%; left: 50%;
      width: 200vmax; height: 200vmax;
      background: radial-gradient(circle, rgba(0,255,114,0.25) 2%, transparent 60%);
      transform: translate(-50%, -50%); animation: radar 12s linear infinite;
      opacity: 0.08; z-index: -1; pointer-events: none;
    }
    @keyframes radar { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }

    .logo-container { position: relative; display: inline-block; margin: 0 auto 12px; }
    .logo {
      width: 38vw; max-width: 150px; height: auto; display: block;
      filter: drop-shadow(0 0 10px var(--glow)); cursor: pointer;
      transition: transform 0.2s; position: relative; z-index: 1;
    }
    .logo:hover { transform: scale(1.05); }

    h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); margin: 0 0 18px 0; text-shadow: 0 0 6px var(--glow); line-height: 1.2; }

    .terminal-box {
      border: 1px solid var(--glow); padding: 16px; width: 100%; max-width: 420px; margin: 0 auto;
      border-radius: 8px; box-shadow: 0 0 12px var(--glow), inset 0 0 8px rgba(0,255,114,0.1);
      background: rgba(0, 20, 0, 0.7); backdrop-filter: blur(2px);
    }
    #oscilograma { width: 100%; height: 60px; display: block; margin-bottom: 14px; image-rendering: pixelated; }
    .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
    button {
      flex: 1; max-width: 130px; background: var(--dark); border: 1px solid var(--glow); color: var(--glow);
      padding: 12px 0; border-radius: 6px; font-size: 0.95rem; font-family: inherit; cursor: pointer;
      transition: all 0.2s ease; font-weight: bold;
    }
    button:hover { background: rgba(0, 255, 114, 0.1); box-shadow: 0 0 8px var(--glow); }
    #player { width: 1px; height: 1px; opacity: 0; position: absolute; pointer-events: none; }

    .listener-counter, .now-playing, .status { margin-top: 8px; }
  </style>
</head>
<body>
  <audio id="beep" preload="auto"><source src="beep.mp3" type="audio/mpeg"></audio>

  <div class="logo-container">
    <img src="max2.png" class="logo" id="radioLogo" alt="Logo Maximilian">
  </div>

  <h1>RADIO MAXIMILIAN 23</h1>
  <div class="terminal-box">
    <canvas id="oscilograma"></canvas>
    <div class="listener-counter">Oyentes online: <span id="listenerCount">0</span></div>
    <div id="nowPlaying" class="now-playing">Cargando señal...</div>
    <div id="status" class="status">Inicializando frecuencia...</div>
    <button id="startBtn" disabled>Iniciar Emisión</button>
    <div class="btn-group" id="controls" style="display:none;">
      <button id="nextBtn">Siguiente</button>
      <button id="stopBtn">STOP</button>
    </div>
    <iframe id="player" allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>

<script>
let playlists = [], currentIndex = 0, songCount = 0;
let isPlaying = false;

// === Carga playlists.txt ===
async function loadPlaylists() {
  const res = await fetch('playlists.txt?t=' + Date.now(), { cache:'no-cache' });
  const text = await res.text();
  const lines = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));

  playlists = lines.map(line => {
    try {
      const url = new URL(line);
      const vid = url.searchParams.get('v');
      return { type:'video', id: vid };
    } catch { return null; }
  }).filter(x => x);

  startBtn.disabled = false;
}

// === Generar URL de vídeo INDIVIDUAL (sin loop) ===
function generateEmbedUrl(entry) {
  const t = Date.now();
  return `https://www.youtube.com/embed/${entry.id}?autoplay=1&rel=0&modestbranding=1&t=${t}`;
}

// === Cargar canción aleatoria ===
function loadNewEntry() {
  if (!isPlaying || !playlists.length) return;
  currentIndex = Math.floor(Math.random() * playlists.length);
  const url = generateEmbedUrl(playlists[currentIndex]);

  player.src = '';
  setTimeout(() => { player.src = url; }, 120);

  songCount++;
  status.textContent = `Canción ${songCount}`;
  nowPlaying.textContent = "Conectando...";
}

// === Iniciar ===
function startRadio() {
  if (isPlaying) return;
  isPlaying = true;
  startBtn.style.display = "none";
  controls.style.display = "flex";
  loadNewEntry();
}

// === Detener ===
function stopRadio() {
  isPlaying = false;
  player.src = '';
  controls.style.display = "none";
  startBtn.style.display = "block";
  nowPlaying.textContent = "Silencio...";
}

// === Eventos ===
startBtn.addEventListener('click', startRadio);
nextBtn.addEventListener('click', loadNewEntry);
stopBtn.addEventListener('click', stopRadio);

// === Inicio ===
window.addEventListener('load', loadPlaylists);
</script>

</body>
</html>
