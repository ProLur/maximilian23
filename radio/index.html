<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Maximilian 23</title>
  <style>
    :root { --glow: #00ff72; --bg: #001400; --dark: #001f00; }
    * { box-sizing: border-box; }
    body { background: var(--bg); color: var(--glow); font-family: "Courier New", monospace; text-align: center; margin: 0; padding: 16px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; overflow-x: hidden; position: relative; }
    body::before { content: ""; position: fixed; top: 50%; left: 50%; width: 200vmax; height: 200vmax; background: radial-gradient(circle, rgba(0,255,114,0.25) 2%, transparent 60%); transform: translate(-50%, -50%); animation: radar 12s linear infinite; opacity: 0.08; z-index: -1; pointer-events: none; }
    @keyframes radar { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    .logo { width: 38vw; max-width: 150px; height: auto; margin: 0 auto 12px; display: block; filter: drop-shadow(0 0 10px var(--glow)); }
    h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); margin: 0 0 18px 0; text-shadow: 0 0 6px var(--glow); line-height: 1.2; }
    .terminal-box { border: 1px solid var(--glow); padding: 16px; width: 100%; max-width: 420px; margin: 0 auto; border-radius: 8px; box-shadow: 0 0 12px var(--glow), inset 0 0 8px rgba(0,255,114,0.1); background: rgba(0, 20, 0, 0.7); backdrop-filter: blur(2px); }
    #oscilograma { width: 100%; height: 60px; display: block; margin-bottom: 14px; image-rendering: pixelated; }
    .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
    button { flex: 1; max-width: 130px; background: var(--dark); border: 1px solid var(--glow); color: var(--glow); padding: 12px 0; border-radius: 6px; font-size: 0.95rem; font-family: inherit; cursor: pointer; transition: all 0.2s ease; font-weight: bold; }
    button:hover { background: rgba(0, 255, 114, 0.1); box-shadow: 0 0 8px var(--glow); }
    button:active { background: var(--glow); color: var(--bg); transform: scale(0.98); }
    #player { width: 1px; height: 1px; opacity: 0; position: absolute; pointer-events: none; }
    .note { margin-top: 20px; font-size: 0.75rem; opacity: 0.7; max-width: 420px; margin-left: auto; margin-right: auto; line-height: 1.4; }
    .status { font-size: 0.8rem; margin-top: 8px; opacity: 0.8; min-height: 1.2em; }
    .voice-line { font-size: 0.85rem; margin: 6px 0; opacity: 0; min-height: 1.2em; transition: opacity 0.3s; }
    .listener-counter { 
      font-size: 0.9rem; 
      margin: 8px 0; 
      padding: 8px; 
      background: rgba(0, 255, 114, 0.1); 
      border: 1px solid var(--glow); 
      border-radius: 4px; 
      text-shadow: 0 0 4px var(--glow); 
      animation: pulse 2s infinite; 
    }
    @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }
    @media (max-width: 480px) { .terminal-box { padding: 14px; } button { font-size: 0.9rem; padding: 10px 0; } .btn-group { gap: 6px; } }
  </style>
</head>
<body>

  <audio id="beep" preload="auto"><source src="beep.mp3" type="audio/mpeg"></audio>
  <img src="max2.png" class="logo" alt="Logo Maximilian" onerror="this.style.display='none'">
  <h1>RADIO MAXIMILIAN 23</h1>

  <div class="terminal-box">
    <canvas id="oscilograma"></canvas>
    <div id="listenerCounter" class="listener-counter">Oyentes online: <span id="listenerCount">73</span></div>
    <div class="status" id="status">Inicializando frecuencia...</div>
    <div id="voiceOutput" class="voice-line"></div>
    <button id="startBtn">Iniciar Emisión</button>
    <div class="btn-group" id="controls" style="display:none;">
      <button id="nextBtn">Siguiente</button>
      <button id="stopBtn">STOP</button>
    </div>
    <iframe id="player" allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>

  <p class="note">Emisión 24/7 • Voz metálica • <span style="color: #00ff72;">Oyentes en vivo simulados</span></p>

  <script>
    // === FRASES FONÉTICAS ===
    const PHRASES = {
      start: "Estás es-cu-chan-do Radio Max-i-mi-lian veintitrés. Emisión continua iniciada.",
      pause: "Emisión pausada. Volveremos pronto.",
      hour: (h, m) => `Son las ${h} ${m > 0 ? `y ${m}` : ''}. Estás en Radio Max-i-mi-lian veintitrés, la frecuencia del futuro.`,
      ads: [
        "Transmisión en directo desde el ciberespacio.",
        "Sintoniza la señal verde. Radio Max-i-mi-lian veintitrés.",
        "Frecuencia activa. No cambies de canal.",
        "Aquí solo suena lo que importa.",
        "Conectado. Escuchando. Transmitiendo.",
        "Señal clara. Volumen máximo."
      ]
    };

    const CONFIG = { 
      voiceRate: 0.8,     
      voicePitch: 0.5,    
      voiceVolume: 1.0, 
      announcementInterval: 4, 
      hourAnnounce: true, 
      beepBeforeVoice: true 
    };

    const els = {
      startBtn: document.getElementById('startBtn'), nextBtn: document.getElementById('nextBtn'), stopBtn: document.getElementById('stopBtn'),
      controls: document.getElementById('controls'), player: document.getElementById('player'), status: document.getElementById('status'),
      voiceOutput: document.getElementById('voiceOutput'), beep: document.getElementById('beep'), canvas: document.getElementById('oscilograma'),
      listenerCount: document.getElementById('listenerCount'), listenerCounter: document.getElementById('listenerCounter')
    };

    let playlists = [], currentIndex = 0, songCount = 0;
    let isPlaying = false, voiceEnabled = false;
    let audioContext = null, lastHour = -1, checkInterval = null;
    let listenerInterval = null;

    // === CONTADOR DE OYENTES SIMULADO ===
    function updateListeners() {
      const count = Math.floor(Math.random() * (127 - 47 + 1)) + 47; // Entre 47 y 127
      els.listenerCount.textContent = count;
      // Efecto de "señal viva"
      els.listenerCounter.style.boxShadow = `0 0 8px var(--glow)`;
      setTimeout(() => { els.listenerCounter.style.boxShadow = 'none'; }, 200);
    }

    // === EFECTO METÁLICO (SIMPLIFICADO POR COMPATIBILIDAD) ===
    function speak(text, callback) {
      if (!voiceEnabled || !('speechSynthesis' in window)) {
        if (callback) callback();
        return;
      }

      els.voiceOutput.textContent = '';
      els.voiceOutput.style.opacity = 0;

      const utter = new SpeechSynthesisUtterance(text);
      let voices = speechSynthesis.getVoices();
      if (voices.length === 0) voices = speechSynthesis.getVoices();

      let selectedVoice = voices.find(v => v.lang.startsWith('es')) || voices[0];
      utter.voice = selectedVoice;
      utter.rate = CONFIG.voiceRate;
      utter.pitch = CONFIG.voicePitch;
      utter.volume = CONFIG.voiceVolume;

      utter.onend = () => {
        if (callback) callback();
      };

      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }

    // === CARGAR PLAYLISTS ===
    async function loadPlaylists() {
      try {
        const res = await fetch('playlists.txt?t=' + Date.now());
        if (!res.ok) throw new Error();
        const text = await res.text();
        const lines = text.split('\n').map(l => l.trim()).filter(l => l);
        playlists = lines.map(line => {
          try {
            const url = new URL(line);
            const listId = url.searchParams.get('list');
            if (listId) return { type: 'playlist', id: listId };
            const videoId = url.searchParams.get('v');
            if (videoId) return { type: 'video', id: videoId };
            return null;
          } catch { return null; }
        }).filter(p => p);
        if (playlists.length === 0) throw new Error();
        els.status.textContent = `Frecuencia activa: ${playlists.length} bloques`;
      } catch {
        els.status.textContent = 'Señal de emergencia';
        playlists = [{ type: 'playlist', id: 'PL4fGSI1pDJn69On1f-8NAvX_CYlx7QyZc' }];
      }
    }

    // === GENERAR EMBED ===
    function generateEmbedUrl(entry) {
      if (!entry) return '';
      const t = Date.now();
      if (entry.type === 'playlist') {
        const index = Math.floor(Math.random() * 50);
        return `https://www.youtube.com/embed/videoseries?list=${entry.id}&autoplay=1&loop=1&playlist=${entry.id}&index=${index}&mute=0&rel=0&modestbranding=1&t=${t}`;
      }
      return `https://www.youtube.com/embed/${entry.id}?autoplay=1&loop=1&playlist=${entry.id}&mute=0&rel=0&modestbranding=1&t=${t}`;
    }

    // === ANUNCIOS ===
    function playAnnouncement() {
      const now = new Date();
      const hour = now.getHours();
      const mins = now.getMinutes();
      const isNewHour = hour !== lastHour && mins < 5;

      let msg = '';
      if (isNewHour && CONFIG.hourAnnounce) {
        lastHour = hour;
        msg = PHRASES.hour(hour, mins);
      } else if (songCount % CONFIG.announcementInterval === 0 && songCount > 0) {
        msg = PHRASES.ads[Math.floor(Math.random() * PHRASES.ads.length)];
      }

      if (msg) setTimeout(() => speak(msg), 800);
    }

    // === CARGAR NUEVA ENTRADA ===
    function loadNewEntry() {
      if (!isPlaying || !playlists.length) return;
      const url = generateEmbedUrl(playlists[currentIndex]);
      if (!url) return;

      els.player.src = '';
      setTimeout(() => { els.player.src = url; }, 150);

      songCount++;
      playAnnouncement();
      els.status.textContent = `${playlists[currentIndex].type === 'playlist' ? 'Playlist' : 'Video'} #${currentIndex + 1} | Canción ${songCount}`;
    }

    // === INICIAR ===
    function startRadio() {
      if (!playlists.length) return;
      currentIndex = Math.floor(Math.random() * playlists.length);
      songCount = 0;

      els.startBtn.style.display = 'none';
      els.controls.style.display = 'flex';

      speak(PHRASES.start, () => {
        loadNewEntry();
      });

      if (checkInterval) clearInterval(checkInterval);
      checkInterval = setInterval(() => {
        if (Math.random() < 0.03 && isPlaying) {
          songCount++;
          playAnnouncement();
          els.status.textContent = `${playlists[currentIndex].type === 'playlist' ? 'Playlist' : 'Video'} #${currentIndex + 1} | Canción ${songCount}`;
        }
      }, 60000);

      // Iniciar contador de oyentes
      if (listenerInterval) clearInterval(listenerInterval);
      listenerInterval = setInterval(updateListeners, 30000); // Cada 30s
      updateListeners();

      isPlaying = true;
    }

    // === DETENER ===
    function stopRadio() {
      isPlaying = false;
      voiceEnabled = false;
      speechSynthesis.cancel();
      els.player.src = '';
      if (checkInterval) clearInterval(checkInterval);
      if (listenerInterval) clearInterval(listenerInterval);
      checkInterval = null;
      listenerInterval = null;

      els.status.textContent = 'Emisión detenida.';
      els.controls.style.display = 'none';
      els.startBtn.style.display = 'block';
      els.listenerCount.textContent = '0';
    }

    // === BOTONES ===
    els.startBtn.addEventListener('click', () => {
      if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
      audioContext.resume();
      voiceEnabled = true;
      startRadio();
    });

    els.nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % playlists.length;
      loadNewEntry();
    });

    els.stopBtn.addEventListener('click', () => {
      speak(PHRASES.pause, () => { stopRadio(); });
    });

    // === OSCILOGRAMA ===
    function initOscilloscope() {
      const canvas = els.canvas;
      const ctx = canvas.getContext('2d');
      function resize() {
        canvas.width = canvas.offsetWidth * window.devicePixelRatio;
        canvas.height = 60 * window.devicePixelRatio;
        canvas.style.height = '60px';
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }
      resize();
      window.addEventListener('resize', resize);

      let t = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'var(--glow)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        const w = canvas.offsetWidth;
        const h = 60;
        t += 0.8;
        for (let x = 0; x <= w; x += 2) {
          const phase = (x / w) * Math.PI * 4 + t * 0.02;
          const amp = Math.sin(phase) * 18 + Math.sin(phase * 1.7) * 10 + Math.sin(t * 0.05) * 5;
          const y = h / 2 + amp;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
        requestAnimationFrame(draw);
      }
      draw();
    }

    // === INICIALIZAR ===
    window.addEventListener('load', async () => {
      if ('speechSynthesis' in window) {
        speechSynthesis.onvoiceschanged = () => {};
        speechSynthesis.getVoices();
      }
      await loadPlaylists();
      initOscilloscope();
      els.startBtn.disabled = false;
    });
  </script>
</body>
</html>
