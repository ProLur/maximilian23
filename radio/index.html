<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Radio Maximilian 23 - CEIP Juan XXIII</title>
  <meta name="description" content="Radio Maximilian 23 es la emisora del colegio CEIP Juan XXIII. Emisión 24/7 con MP3 locales." />
  <style>
    :root { --glow: #00ff72; --bg: #001400; --dark: #001f00; --leather: #0f2a0f; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: "Courier New", monospace; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; overscroll-behavior-y: contain; overflow-x: hidden; }
    body { background: var(--bg); color: var(--glow); text-align: center; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding: 8px 12px; gap: 8px; min-height: 100vh; overflow-y: auto; position: relative; touch-action: pan-y pinch-zoom; }
    body::before { content: ""; position: fixed; top: 50%; left: 50%; width: 200vmax; height: 200vmax; background: radial-gradient(circle, rgba(0,255,114,0.25) 2%, transparent 60%); transform: translate(-50%, -50%); animation: radar 12s linear infinite; opacity: 0.08; z-index: -1; pointer-events: none; }
    @keyframes radar { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    .pull-refresh { position: fixed; top: 0; left: 0; width: 100%; height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--glow); font-size: 0.9rem; opacity: 0; pointer-events: none; z-index: 1000; transition: opacity 0.3s ease, transform 0.3s ease; transform: translateY(-100%); background: rgba(0, 20, 0, 0.6); backdrop-filter: blur(4px); }
    .pull-refresh.active { opacity: 1; transform: translateY(0); }
    .pull-arrow { width: 24px; height: 24px; border: 3px solid var(--glow); border-top: none; border-left: none; transform: rotate(45deg) translateY(-6px); margin-bottom: 6px; animation: bounce 1.5s infinite; box-shadow: 0 0 12px var(--glow); }
    @keyframes bounce { 0%,100%{transform:rotate(45deg) translateY(-6px);} 50%{transform:rotate(45deg) translateY(-12px);} }
    .logo-container { margin: 8px 0 4px; width: 100%; display: flex; justify-content: center; flex-shrink: 0; }
    .logo { width: 38vw; max-width: 120px; height: auto; filter: drop-shadow(0 0 12px var(--glow)); cursor: pointer; transition: transform 0.2s; }
    .logo:hover, .logo:active { transform: scale(1.08); }
    .glow-normal { filter: drop-shadow(0 0 12px var(--glow)) drop-shadow(0 0 24px var(--glow)); animation: pulse-normal 3s ease-in-out infinite; }
    .glow-intenso { filter: drop-shadow(0 0 24px var(--glow)) drop-shadow(0 0 48px var(--glow)) drop-shadow(0 0 72px #00ffcc); animation: pulse-intenso 1.2s ease-in-out infinite; }
    @keyframes pulse-normal { 0%,100%{filter:drop-shadow(0 0 12px var(--glow)) drop-shadow(0 0 24px var(--glow));} 50%{filter:drop-shadow(0 0 18px var(--glow)) drop-shadow(0 0 36px var(--glow));} }
    @keyframes pulse-intenso { 0%,100%{filter:drop-shadow(0 0 24px var(--glow)) drop-shadow(0 0 48px var(--glow)) drop-shadow(0 0 72px #00ffcc);} 50%{filter:drop-shadow(0 0 36px var(--glow)) drop-shadow(0 0 72px var(--glow)) drop-shadow(0 0 108px #00ffcc);} }
    h1 { font-size: clamp(1.7rem, 6.5vw, 2.3rem); margin: 4px 0 8px; text-shadow: 0 0 8px var(--glow); line-height: 1.1; flex-shrink: 0; }
    .terminal-box { width: 100%; max-width: 360px; margin: 0 auto; padding: 14px; border: 2px solid var(--glow); border-radius: 12px; box-shadow: 0 0 16px var(--glow), inset 0 0 8px rgba(0,255,114,0.15); background: rgba(0, 20, 0, 0.8); backdrop-filter: blur(4px); display: flex; flex-direction: column; gap: 10px; }
    #oscilograma { width: 100%; height: 60px; background: var(--bg); border-radius: 6px; }
    .volume-horizontal { width: 100%; max-width: 320px; height: 46px; display: flex; align-items: center; justify-content: center; padding: 0 10px; position: relative; margin: 0 auto; }
    .volume-track-h { width: 100%; height: 18px; background: var(--leather); border: 2px solid #0a3d0a; border-radius: 9px; position: relative; overflow: visible; cursor: pointer; box-shadow: inset 0 0 8px rgba(0,0,0,0.6), 0 0 12px rgba(0,255,114,0.3); }
    .volume-fill-h { height: 100%; background: linear-gradient(90deg, #004d00, #00ff72, #004d00); position: absolute; left: 0; top: 0; border-radius: 7px; box-shadow: 0 0 15px var(--glow); transition: width 0.15s ease; }
    .volume-knob-h { width: 32px; height: 32px; background: radial-gradient(circle at 30% 30%, #0f5f0f, #001f00); border: 3px solid #00ff72; border-radius: 50%; position: absolute; top: 50%; transform: translate(-50%, -50%); left: 100%; box-shadow: 0 0 20px var(--glow), 0 0 30px #00ffcc, inset 0 0 8px rgba(0,0,0,0.8); cursor: grab; }
    .volume-knob-h::before { content: ''; position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: #001400; border: 2px solid #004d00; border-radius: 50%; transform: translate(-50%, -50%); }
    .volume-knob-h:active { cursor: grabbing; transform: translate(-50%, -50%) scale(1.2); }
    .now-playing { background: rgba(0, 20, 0, 0.9); border: 1.5px dashed var(--glow); min-height: 2.2em; padding: 8px 12px; border-radius: 8px; font-size: 0.88rem; max-width: 320px; width: 100%; margin: 0 auto; }
    .now-playing strong { color: #00ff72; text-shadow: 0 0 6px; }
    .listener-status, .status { width: 100%; max-width: 320px; padding: 8px 12px; border-radius: 8px; font-size: 0.88rem; margin: 0 auto; }
    .listener-status { background: rgba(0, 255, 114, 0.15); border: 1.5px solid var(--glow); animation: pulse 2s infinite; }
    .status { opacity: 0.9; min-height: 1.2em; font-size: 0.8rem; }
    @keyframes pulse { 0%,100%{opacity:0.85;} 50%{opacity:1;} }
    button { background: var(--dark); border: 1.5px solid var(--glow); color: var(--glow); padding: 12px 14px; border-radius: 10px; font-size: 0.95rem; font-weight: bold; cursor: pointer; transition: all 0.2s ease; flex: 1; min-height: 46px; touch-action: manipulation; }
    button:hover, button:active { background: rgba(0, 255, 114, 0.15); box-shadow: 0 0 10px var(--glow); }
    button:active { background: var(--glow); color: var(--bg); transform: scale(0.96); }
    #startBtn { display: block; margin: 6px auto 0; padding: 12px 18px; font-size: 1rem; width: 100%; max-width: 240px; min-height: 48px; }
    .btn-group { display: flex; gap: 10px; width: 100%; max-width: 320px; margin: 0 auto; opacity: 0; height: 0; overflow: hidden; transition: opacity 0.3s ease, height 0.3s ease; }
    .btn-group.visible { opacity: 1; height: auto; margin-top: 6px; }
    .note { margin: 0; padding: 8px 0 4px; font-size: 0.75rem; opacity: 0.8; max-width: 360px; }
    @media (max-width: 480px) { .logo { width: 36vw; max-width: 110px; } }
  </style>
</head>
<body>
  <div class="pull-refresh" id="pullRefresh"><div class="pull-arrow"></div><span>Desliza para recargar</span></div>
  <audio id="audioPlayer" preload="metadata"></audio>
  <div class="logo-container">
    <img src="max2.png" class="logo glow-normal" id="radioLogo" alt="Logo Maximilian" onerror="this.style.display='none'">
  </div>
  <h1>RADIO MAXIMILIAN 23</h1>
  <div class="terminal-box">
    <canvas id="oscilograma"></canvas>
    <div class="volume-horizontal">
      <div class="volume-track-h" id="volumeTrack">
        <div class="volume-fill-h" id="volumeFill"></div>
        <div class="volume-knob-h" id="volumeKnob"></div>
      </div>
    </div>
    <div class="listener-status">Estado de la emisora: Correcto</div>
    <div id="nowPlaying" class="now-playing">Cargando señal...</div>
    <div class="status" id="status">¡Pulsa Iniciar Emisión!</div>
    <button id="startBtn" disabled>Iniciar Emisión</button>
    <div class="btn-group" id="controls">
      <button id="nextBtn">Siguiente</button>
      <button id="pauseBtn">Pausar</button>
      <button id="muteBtn">Mute</button>
    </div>
  </div>
  <p class="note">Emisión 24/7 • MP3 locales • Creado por Manuel</p>

  <script>
    const CONFIG = { mp3Folder: 'canciones/' };
    const els = {
      startBtn: document.getElementById('startBtn'), nextBtn: document.getElementById('nextBtn'),
      pauseBtn: document.getElementById('pauseBtn'), muteBtn: document.getElementById('muteBtn'),
      controls: document.getElementById('controls'), audio: document.getElementById('audioPlayer'),
      status: document.getElementById('status'), canvas: document.getElementById('oscilograma'),
      nowPlaying: document.getElementById('nowPlaying'), radioLogo: document.getElementById('radioLogo'),
      volumeTrack: document.getElementById('volumeTrack'), volumeFill: document.getElementById('volumeFill'),
      volumeKnob: document.getElementById('volumeKnob'), pullRefresh: document.getElementById('pullRefresh')
    };

    let items = [], currentIndex = 0, isPlaying = false, isPaused = false, isMuted = false, currentVolume = 1.0;
    let audioContext = null, analyser = null, source = null;

    // ==== FUNCIÓN MÁGICA QUE FUNCIONA EN MÓVIL ====
    function playSongAt(index) {
      if (!items.length) return;
      currentIndex = index;
      updateNowPlaying();
      const song = items[currentIndex];
      els.audio.src = CONFIG.mp3Folder + song.file;
      els.audio.volume = isMuted ? 0 : currentVolume;

      const playPromise = els.audio.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => { connectAudioToOscilloscope(); isPaused = false; els.pauseBtn.textContent = 'Pausar'; })
          .catch(() => { els.status.textContent = "Toca Siguiente otra vez"; });
      }
    }

    function playNext() {
      playSongAt((currentIndex + 1) % items.length);
    }

    // ==== CARGA DE PLAYLIST ====
    async function loadPlaylists() {
      try {
        const res = await fetch('playlists.txt?t=' + Date.now(), { cache: 'no-cache' });
        if (!res.ok) throw 1;
        const text = await res.text();
        items = text.split('\n')
          .map(l => l.trim()).filter(l => l && !l.startsWith('#'))
          .map(line => {
            const parts = line.split(' - ');
            const file = parts[0].trim();
            const title = parts.slice(1).join(' - ').trim() || file;
            return { file, title };
          }).filter(i => i.file.endsWith('.mp3'));
        if (!items.length) throw 1;
      } catch { items = [{ file: 'test.mp3', title: 'Canción de prueba' }]; }
      currentIndex = Math.floor(Math.random() * items.length);
      updateNowPlaying();
      els.startBtn.disabled = false;
      els.status.textContent = "¡Pulsa Iniciar Emisión!";
    }

    function updateNowPlaying() { els.nowPlaying.innerHTML = `<strong>${items[currentIndex].title}</strong>`; }

    // ==== INICIO ====
    function startPlayback() {
      if (isPlaying) return;
      els.startBtn.style.display = 'none';
      els.controls.classList.add('visible');
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 2048;
      }
      audioContext.resume().then(() => {
        isPlaying = true;
        playSongAt(currentIndex);
        els.status.textContent = "Emisión en directo";
      });
    }

    // ==== EVENTOS FIN DE CANCIÓN Y SIGUIENTE ====
    els.audio.addEventListener('ended', playNext);
    els.nextBtn.addEventListener('click', playNext);
    els.startBtn.addEventListener('click', startPlayback);

    // ==== OSCILOSCOPIO ====
    function connectAudioToOscilloscope() {
      if (source) source.disconnect();
      source = audioContext.createMediaElementSource(els.audio);
      source.connect(analyser);
      analyser.connect(audioContext.destination);
      drawOscilloscope();
    }
    function drawOscilloscope() {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      const ctx = els.canvas.getContext('2d');
      let w = els.canvas.width = els.canvas.offsetWidth;
      const h = 60;
      function draw() {
        requestAnimationFrame(draw);
        analyser.getByteTimeDomainData(dataArray);
        ctx.fillStyle = '#001400'; ctx.fillRect(0, 0, w, h);
        ctx.lineWidth = 2.5; ctx.strokeStyle = '#00ff72'; ctx.shadowBlur = 16; ctx.shadowColor = '#00ff72';
        ctx.beginPath();
        let x = 0; const sliceWidth = w / bufferLength;
        for (let i = 0; i < bufferLength; i++) {
          const y = (dataArray[i] / 128.0) * h / 2;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          x += sliceWidth;
        }
        ctx.lineTo(w, h / 2); ctx.stroke(); ctx.shadowBlur = 0;
      }
      draw();
    }

    // ==== VOLUMEN, PAUSA, MUTE ====
    function updateVolumeUI() {
      const percent = (isMuted ? 0 : currentVolume) * 100;
      els.volumeFill.style.width = percent + '%';
      els.volumeKnob.style.left = percent + '%';
    }
    function setVolume(v) { currentVolume = v; if (!isMuted) els.audio.volume = v; updateVolumeUI(); }
    els.volumeTrack.addEventListener('click', e => {
      const rect = els.volumeTrack.getBoundingClientRect();
      setVolume((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) / rect.width);
    });
    let dragging = false;
    els.volumeKnob.addEventListener('mousedown', () => dragging = true);
    els.volumeKnob.addEventListener('touchstart', e => { e.preventDefault(); dragging = true; });
    document.addEventListener('mousemove', e => dragging && setVolume((e.clientX - els.volumeTrack.getBoundingClientRect().left) / els.volumeTrack.offsetWidth)));
    document.addEventListener('touchmove', e => dragging && setVolume((e.touches[0].clientX - els.volumeTrack.getBoundingClientRect().left) / els.volumeTrack.offsetWidth)));
    document.addEventListener('mouseup', () => dragging = false);
    document.addEventListener('touchend', () => dragging = false);

    els.pauseBtn.addEventListener('click', () => {
      if (isPaused) { els.audio.play(); isPaused = false; els.pauseBtn.textContent = 'Pausar'; }
      else { els.audio.pause(); isPaused = true; els.pauseBtn.textContent = 'Play'; }
    });
    els.muteBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      els.audio.volume = isMuted ? 0 : currentVolume;
      els.muteBtn.textContent = isMuted ? 'Unmute' : 'Mute';
      updateVolumeUI();
    });

    els.radioLogo.addEventListener('click', () => {
      els.radioLogo.classList.replace('glow-normal', 'glow-intenso');
      setTimeout(() => els.radioLogo.classList.replace('glow-intenso', 'glow-normal'), 3000);
    });

    // ==== PULL TO REFRESH ====
    let startY = 0, pulling = false;
    window.addEventListener('touchstart', e => { if (window.scrollY === 0) { startY = e.touches[0].clientY; pulling = true; } });
    window.addEventListener('touchmove', e => {
      if (!pulling || window.scrollY !== 0) return;
      const dist = e.touches[0].clientY - startY;
      if (dist > 0) { e.preventDefault(); els.pullRefresh.style.transform = `translateY(${Math.min(dist - 80, 0)}px)`; els.pullRefresh.classList.toggle('active', dist > 120); }
    });
    window.addEventListener('touchend', () => {
      if (pulling && els.pullRefresh.classList.contains('active')) location.reload();
      els.pullRefresh.style.transform = 'translateY(-100%)'; els.pullRefresh.classList.remove('active');
      pulling = false;
    });

    window.addEventListener('load', () => { loadPlaylists(); updateVolumeUI(); });
  </script>
</body>
</html>
