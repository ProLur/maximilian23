<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Radio Maximilian 23 - CEIP Juan XXIII</title>
  <!-- SEO -->
  <meta name="description" content="Radio Maximilian 23 es la emisora del colegio CEIP Juan XXIII. Emisión 24/7 con MP3 locales." />
  <meta name="keywords" content="radio escolar, CEIP Juan XXIII, Radio Maximilian 23, música alumnos, radio online 24/7" />
  <meta name="author" content="Manuel - CEIP Juan XXIII" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://tudominio.com/radio-maximilian-23" />
  <!-- Open Graph -->
  <meta property="og:title" content="Radio Maximilian 23 - Emisora del CEIP Juan XXIII" />
  <meta property="og:description" content="Escucha las audiciones de música del colegio CEIP Juan XXIII en Radio Maximilian 23. Emisión continua 24/7." />
  <meta property="og:image" content="https://tudominio.com/max2.png" />
  <meta property="og:url" content="https://tudominio.com/radio-maximilian-23" />
  <meta property="og:type" content="website" />
  <style>
    :root {
      --glow: #00ff72;
      --bg: #001400;
      --dark: #001f00;
      --metal: #0a3d0a;
      --leather: #0f2a0f;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      font-family: "Courier New", monospace;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior-y: contain;
      overflow-x: hidden;
    }
    body {
      background: var(--bg);
      color: var(--glow);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 8px 12px;
      gap: 8px;
      min-height: 100vh;
      overflow-y: auto;
      position: relative;
      touch-action: pan-y pinch-zoom;
    }
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      width: 200vmax;
      height: 200vmax;
      background: radial-gradient(circle, rgba(0,255,114,0.25) 2%, transparent 60%);
      transform: translate(-50%, -50%);
      animation: radar 12s linear infinite;
      opacity: 0.08;
      z-index: -1;
      pointer-events: none;
    }
    @keyframes radar {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* === PULL TO REFRESH ANIMADO (SIN MOVER BODY) === */
    .pull-refresh {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--glow);
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateY(-100%);
      background: rgba(0, 20, 0, 0.6);
      backdrop-filter: blur(4px);
    }
    .pull-refresh.active {
      opacity: 1;
      transform: translateY(0);
    }
    .pull-arrow {
      width: 24px;
      height: 24px;
      border: 3px solid var(--glow);
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-6px);
      margin-bottom: 6px;
      animation: bounce 1.5s infinite;
      box-shadow: 0 0 12px var(--glow);
    }
    @keyframes bounce {
      0%, 100% { transform: rotate(45deg) translateY(-6px); }
      50% { transform: rotate(45deg) translateY(-12px); }
    }

    .logo-container {
      margin: 8px 0 4px;
      width: 100%;
      display: flex;
      justify-content: center;
      flex-shrink: 0;
    }
    .logo {
      width: 38vw;
      max-width: 120px;
      height: auto;
      display: block;
      filter: drop-shadow(0 0 12px var(--glow));
      cursor: pointer;
      transition: transform 0.2s;
      position: relative;
      z-index: 1;
    }
    .logo:hover, .logo:active {
      transform: scale(1.08);
    }
    .glow-normal {
      filter: drop-shadow(0 0 12px var(--glow)) drop-shadow(0 0 24px var(--glow));
      animation: pulse-normal 3s ease-in-out infinite;
    }
    .glow-intenso {
      filter: drop-shadow(0 0 24px var(--glow)) drop-shadow(0 0 48px var(--glow)) drop-shadow(0 0 72px #00ffcc);
      animation: pulse-intenso 1.2s ease-in-out infinite;
    }
    @keyframes pulse-normal {
      0%, 100% { filter: drop-shadow(0 0 12px var(--glow)) drop-shadow(0 0 24px var(--glow)); }
      50% { filter: drop-shadow(0 0 18px var(--glow)) drop-shadow(0 0 36px var(--glow)); }
    }
    @keyframes pulse-intenso {
      0%, 100% { filter: drop-shadow(0 0 24px var(--glow)) drop-shadow(0 0 48px var(--glow)) drop-shadow(0 0 72px #00ffcc); }
      50% { filter: drop-shadow(0 0 36px var(--glow)) drop-shadow(0 0 72px var(--glow)) drop-shadow(0 0 108px #00ffcc); }
    }
    h1 {
      font-size: clamp(1.7rem, 6.5vw, 2.3rem);
      margin: 4px 0 8px;
      text-shadow: 0 0 8px var(--glow);
      line-height: 1.1;
      flex-shrink: 0;
    }
    .terminal-box {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      padding: 14px;
      border: 2px solid var(--glow);
      border-radius: 12px;
      box-shadow: 0 0 16px var(--glow), inset 0 0 8px rgba(0,255,114,0.15);
      background: rgba(0, 20, 0, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      flex-direction: column;
      gap: 10px;
      justify-content: flex-start;
      flex-grow: 0;
    }
    #oscilograma {
      width: 100%;
      height: 60px;
      display: block;
      image-rendering: pixelated;
      background: rgba(0,20,0,0.7);
      border-radius: 6px;
      flex-shrink: 0;
    }
    .volume-horizontal {
      width: 100%;
      max-width: 300px;
      height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
      position: relative;
      flex-shrink: 0;
    }
    .volume-track-h {
      width: 100%;
      height: 18px;
      background: var(--leather);
      border: 2px solid #0a3d0a;
      border-radius: 9px;
      position: relative;
      overflow: visible;
      cursor: pointer;
      box-shadow:
        inset 0 0 8px rgba(0,0,0,0.6),
        0 0 12px rgba(0,255,114,0.3);
      background-image:
        repeating-linear-gradient(90deg,
          transparent, transparent 8px,
          rgba(255,255,255,0.05) 8px, rgba(255,255,255,0.05) 16px
        );
    }
    .volume-fill-h {
      height: 100%;
      background: linear-gradient(90deg, #004d00, #00ff72, #004d00);
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 7px;
      box-shadow: 0 0 15px var(--glow);
      transition: width 0.15s ease;
    }
    .volume-knob-h {
      width: 32px;
      height: 32px;
      background: radial-gradient(circle at 30% 30%, #0f5f0f, #001f00);
      border: 3px solid #00ff72;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      left: 100%;
      box-shadow:
        0 0 20px var(--glow),
        0 0 30px #00ffcc,
        inset 0 0 8px rgba(0,0,0,0.8);
      cursor: grab;
      transition: transform 0.15s ease, box-shadow 0.2s;
      z-index: 10;
    }
    .volume-knob-h::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      background: #001400;
      border: 2px solid #004d00;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: inset 0 0 6px rgba(0,0,0,0.8);
    }
    .volume-knob-h:active {
      cursor: grabbing;
      transform: translate(-50%, -50%) scale(1.2);
      box-shadow: 0 0 30px #00ffcc, 0 0 40px #00ff72;
    }

    /* === NOW PLAYING – SIN MARQUEE, CON ... === */
    .now-playing {
      background: rgba(0, 20, 0, 0.9);
      border: 1.5px dashed var(--glow);
      min-height: 2.2em;
      line-height: 1.3;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 320px;
      width: 100%;
      flex-shrink: 0;
    }
    .now-playing strong {
      color: #00ff72;
      text-shadow: 0 0 6px;
    }

    .listener-status, .status {
      width: 100%;
      max-width: 320px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.88rem;
      flex-shrink: 0;
    }
    .listener-status {
      background: rgba(0, 255, 114, 0.15);
      border: 1.5px solid var(--glow);
      text-shadow: 0 0 5px var(--glow);
      animation: pulse 2s infinite;
    }
    .status {
      opacity: 0.9;
      min-height: 1.2em;
      font-size: 0.8rem;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    button {
      background: var(--dark);
      border: 1.5px solid var(--glow);
      color: var(--glow);
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1;
      min-height: 46px;
      touch-action: manipulation;
    }
    button:hover, button:active {
      background: rgba(0, 255, 114, 0.15);
      box-shadow: 0 0 10px var(--glow);
    }
    button:active {
      background: var(--glow);
      color: var(--bg);
      transform: scale(0.96);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #startBtn {
      display: block;
      margin: 6px auto 0;
      padding: 12px 18px;
      font-size: 1rem;
      width: 100%;
      max-width: 240px;
      min-height: 48px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 300px;
      opacity: 0;
      height: 0;
      overflow: hidden;
      transition: opacity 0.3s ease, height 0.3s ease, margin-top 0.3s ease;
    }
    .btn-group.visible {
      opacity: 1;
      height: auto;
      margin-top: 6px;
    }
    .note {
      margin: 0;
      padding: 8px 0 4px;
      font-size: 0.75rem;
      opacity: 0.8;
      width: 100%;
      max-width: 360px;
      text-align: center;
      flex-shrink: 0;
      line-height: 1.3;
    }

    @media (max-width: 480px) {
      body { padding: 6px 10px; gap: 6px; }
      .logo-container { margin: 6px 0 4px; }
      .logo { width: 36vw; max-width: 110px; }
      h1 { font-size: clamp(1.6rem, 6vw, 2.1rem); margin: 4px 0 6px; }
      .terminal-box { padding: 12px; gap: 8px; }
      #oscilograma { height: 55px; }
      .volume-horizontal { max-width: 280px; height: 44px; }
      .volume-knob-h { width: 30px; height: 30px; }
      .volume-knob-h::before { width: 9px; height: 9px; }
      button { font-size: 0.9rem; padding: 11px 13px; }
      .btn-group { gap: 8px; max-width: 280px; }
      #startBtn { max-width: 220px; font-size: 0.95rem; }
      .listener-status, .now-playing { max-width: 280px; font-size: 0.84rem; padding: 7px 10px; }
      .status { font-size: 0.76rem; }
      .note { font-size: 0.72rem; padding: 6px 0; }
    }
  </style>
</head>
<body>

  <!-- PULL TO REFRESH ANIMADO -->
  <div class="pull-refresh" id="pullRefresh">
    <div class="pull-arrow"></div>
    <span>Desliza para recargar</span>
  </div>

  <audio id="audioPlayer" preload="metadata"></audio>
  <div class="logo-container">
    <img src="max2.png" class="logo glow-normal" id="radioLogo" alt="Logo Maximilian" onerror="this.style.display='none'">
  </div>
  <h1>RADIO MAXIMILIAN 23</h1>
  <div class="terminal-box">
    <canvas id="oscilograma"></canvas>
    <div class="volume-horizontal">
      <div class="volume-track-h" id="volumeTrack">
        <div class="volume-fill-h" id="volumeFill"></div>
        <div class="volume-knob-h" id="volumeKnob"></div>
      </div>
    </div>
    <div class="listener-status">Estado de la emisora: Correcto</div>
    <div id="nowPlaying" class="now-playing">Cargando señal...</div>
    <div class="status" id="status">¡Pulsa Iniciar Emisión!</div>
    <button id="startBtn" disabled>Iniciar Emisión</button>
    <div class="btn-group" id="controls">
      <button id="nextBtn">Siguiente</button>
      <button id="pauseBtn">Pausar</button>
      <button id="muteBtn">Mute</button>
    </div>
  </div>
  <p class="note">Emisión 24/7 • MP3 locales • Creado por Manuel</p>

  <script>
    const CONFIG = { mp3Folder: 'canciones/' };
    const els = {
      startBtn: document.getElementById('startBtn'),
      nextBtn: document.getElementById('nextBtn'),
      pauseBtn: document.getElementById('pauseBtn'),
      muteBtn: document.getElementById('muteBtn'),
      controls: document.getElementById('controls'),
      audio: document.getElementById('audioPlayer'),
      status: document.getElementById('status'),
      canvas: document.getElementById('oscilograma'),
      nowPlaying: document.getElementById('nowPlaying'),
      radioLogo: document.getElementById('radioLogo'),
      volumeTrack: document.getElementById('volumeTrack'),
      volumeFill: document.getElementById('volumeFill'),
      volumeKnob: document.getElementById('volumeKnob'),
      pullRefresh: document.getElementById('pullRefresh')
    };
    let items = [], currentIndex = 0;
    let isPlaying = false;
    let audioContext = null, analyser = null, source = null;
    let isPaused = false, isMuted = false;
    let currentVolume = 1.0;
    let touchStartY = 0, isPulling = false;

    // === PULL TO REFRESH + DESLIZAR HACIA ABAJO PARA RECARGAR ===
    window.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0) {
        touchStartY = e.touches[0].clientY;
        isPulling = true;
      }
    });
    window.addEventListener('touchmove', (e) => {
      if (!isPulling) return;
      const touchY = e.touches[0].clientY;
      const pullDistance = touchY - touchStartY;

      if (pullDistance > 0 && window.scrollY === 0) {
        e.preventDefault();
        const progress = Math.min(pullDistance / 120, 1);
        els.pullRefresh.style.transform = `translateY(${Math.min(pullDistance - 80, 0)}px)`;
        els.pullRefresh.classList.toggle('active', progress > 0.3);
      }
    });
    window.addEventListener('touchend', () => {
      if (isPulling && els.pullRefresh.classList.contains('active')) {
        els.pullRefresh.style.transition = 'transform 0.4s ease, opacity 0.4s ease';
        els.pullRefresh.style.transform = 'translateY(-100%)';
        els.pullRefresh.classList.remove('active');
        setTimeout(() => location.reload(), 500);
      } else if (isPulling) {
        els.pullRefresh.style.transition = 'transform 0.3s ease';
        els.pullRefresh.style.transform = 'translateY(-100%)';
        els.pullRefresh.classList.remove('active');
      }
      isPulling = false;
      setTimeout(() => { els.pullRefresh.style.transition = ''; }, 500);
    });

    // === DESLIZAR HACIA ABAJO EN CUALQUIER PARTE = RECARGAR ===
    let lastY = 0;
    window.addEventListener('touchstart', (e) => {
      lastY = e.touches[0].clientY;
    });
    window.addEventListener('touchmove', (e) => {
      const currentY = e.touches[0].clientY;
      if (currentY < lastY - 80) {
        location.reload();
      }
      lastY = currentY;
    });

    // === CARGAR PLAYLIST ===
    async function loadPlaylists() {
      try {
        const res = await fetch('playlists.txt?t=' + Date.now(), { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const lines = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
        items = lines.map(line => {
          const parts = line.split(' - ');
          const file = parts[0].trim();
          const title = parts.slice(1).join(' - ').trim() || file;
          return { file, title };
        }).filter(i => i.file.endsWith('.mp3'));
        if (items.length === 0) throw new Error('No hay MP3 válidos');
      } catch (err) {
        console.error(err);
        items = [{ file: 'test.mp3', title: 'Canción de prueba' }];
      }
      preloadFirstSong();
    }
    function preloadFirstSong() {
      if (!items.length) {
        els.status.textContent = "Error: No hay canciones";
        return;
      }
      currentIndex = Math.floor(Math.random() * items.length);
      updateNowPlaying();
      els.status.textContent = "¡Pulsa Iniciar Emisión!";
      els.startBtn.disabled = false;
      els.startBtn.style.opacity = '1';
      els.startBtn.style.cursor = 'pointer';
    }
    async function safePlay() {
      if (!audioContext) return;
      if (audioContext.state === 'suspended') await audioContext.resume();
      const playPromise = els.audio.play();
      if (playPromise !== undefined) {
        await playPromise.catch(err => {
          console.warn("Autoplay bloqueado:", err);
          els.status.textContent = "Toca para activar sonido";
        });
      }
    }
    function playCurrent() {
      const song = items[currentIndex];
      const path = CONFIG.mp3Folder + song.file;
      els.audio.src = path;
      els.audio.load();
      els.audio.volume = isMuted ? 0 : currentVolume;
      safePlay().then(() => {
        els.status.textContent = isMuted ? "Silenciado" : "Emisión en directo";
        isPlaying = true;
        isPaused = false;
        els.pauseBtn.textContent = 'Pausar';
        connectAudioToOscilloscope();
      });
    }
    function loadAndPlayNext() {
      if (!items.length || !isPlaying) return;
      currentIndex = (currentIndex + 1) % items.length;
      updateNowPlaying();
      playCurrent();
    }
    function updateNowPlaying() {
      const song = items[currentIndex];
      els.nowPlaying.innerHTML = `<strong>${song.title}</strong>`;
    }
    function startPlayback() {
      if (isPlaying) return;
      els.startBtn.style.display = 'none';
      els.controls.classList.add('visible');
      els.status.textContent = "Iniciando emisión...";
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
      }
      audioContext.resume().then(() => {
        playCurrent();
        updateVolumeUI();
      });
    }

    // === VOLUMEN ===
    function updateVolumeUI() {
      const percent = (isMuted ? 0 : currentVolume) * 100;
      els.volumeFill.style.width = percent + '%';
      els.volumeKnob.style.left = percent + '%';
      const baseGlow = 20;
      const extraGlow = Math.round(currentVolume * 40);
      const baseInner = 30;
      const extraInner = Math.round(currentVolume * 30);
      const glowColor = currentVolume > 0.7 ? '#00ffcc' : '#00ff72';
      els.volumeKnob.style.boxShadow = `
        0 0 ${baseGlow + extraGlow}px var(--glow),
        0 0 ${baseInner + extraInner}px ${glowColor},
        inset 0 0 8px rgba(0,0,0,0.8)
      `.replace(/\s+/g, ' ').trim();
    }
    function setVolume(value) {
      currentVolume = value;
      if (!isMuted) els.audio.volume = value;
      updateVolumeUI();
    }
    function getVolumeFromEvent(e) {
      const rect = els.volumeTrack.getBoundingClientRect();
      const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
      const width = rect.width;
      return Math.max(0, Math.min(1, x / width));
    }
    els.volumeTrack.addEventListener('click', (e) => {
      const percent = getVolumeFromEvent(e);
      setVolume(percent);
    });
    let isDragging = false;
    els.volumeKnob.addEventListener('mousedown', (e) => { e.preventDefault(); isDragging = true; });
    els.volumeKnob.addEventListener('touchstart', (e) => { e.preventDefault(); isDragging = true; });
    const moveHandler = (e) => {
      if (!isDragging) return;
      const percent = getVolumeFromEvent(e);
      setVolume(percent);
    };
    document.addEventListener('mousemove', moveHandler);
    document.addEventListener('touchmove', moveHandler);
    const endHandler = () => { isDragging = false; };
    document.addEventListener('mouseup', endHandler);
    document.addEventListener('touchend', endHandler);

    els.pauseBtn.addEventListener('click', () => {
      if (!isPlaying) return;
      if (isPaused) {
        safePlay();
        els.pauseBtn.textContent = 'Pausar';
        isPaused = false;
        els.status.textContent = isMuted ? "Silenciado" : "Emisión en directo";
      } else {
        els.audio.pause();
        els.pauseBtn.textContent = 'Play';
        isPaused = true;
        els.status.textContent = "Pausado";
      }
    });
    els.muteBtn.addEventListener('click', () => {
      if (!isPlaying) return;
      if (isMuted) {
        els.audio.volume = currentVolume;
        els.muteBtn.textContent = 'Mute';
        isMuted = false;
        els.status.textContent = isPaused ? "Pausado" : "Emisión en directo";
      } else {
        els.audio.volume = 0;
        els.muteBtn.textContent = 'Unmute';
        isMuted = true;
        els.status.textContent = "Silenciado";
      }
      updateVolumeUI();
    });

    function connectAudioToOscilloscope() {
      if (source) source.disconnect();
      try {
        source = audioContext.createMediaElementSource(els.audio);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
        drawOscilloscope();
      } catch (e) {
        console.warn("Oscilograma no conectado");
      }
    }
    function drawOscilloscope() {
      if (!analyser) return;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      const canvas = els.canvas;
      const ctx = canvas.getContext('2d');
      const w = canvas.offsetWidth;
      const h = 60;
      function draw() {
        requestAnimationFrame(draw);
        analyser.getByteTimeDomainData(dataArray);
        ctx.fillStyle = 'rgba(0, 20, 0, 0.7)';
        ctx.fillRect(0, 0, w, h);
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'var(--glow)';
        ctx.shadowBlur = 12;
        ctx.shadowColor = '#00ff72';
        ctx.beginPath();
        const sliceWidth = w / bufferLength;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128.0;
          const y = v * h / 2;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          x += sliceWidth;
        }
        ctx.lineTo(w, h / 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      draw();
    }

    els.audio.addEventListener('ended', loadAndPlayNext);
    els.startBtn.addEventListener('click', startPlayback);
    els.nextBtn.addEventListener('click', loadAndPlayNext);
    els.radioLogo.addEventListener('click', () => {
      const logo = els.radioLogo;
      logo.classList.remove('glow-normal');
      logo.classList.add('glow-intenso');
      setTimeout(() => {
        logo.classList.remove('glow-intenso');
        logo.classList.add('glow-normal');
      }, 3000);
    });

    window.addEventListener('load', async () => {
      await loadPlaylists();
      updateVolumeUI();
    });
  </script>
</body>
</html>
