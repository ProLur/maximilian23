<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Maximilian 23 - CEIP Juan XXIII</title>
  <style>
    :root { --glow: #00ff72; --bg: #001400; }
    * { box-sizing: border-box; margin:0; padding:0; }
    body {
      background: var(--bg); color: var(--glow); font-family: "Courier New", monospace;
      text-align: center; min-height: 100vh; display: flex; flex-direction: column; justify-content: center;
      padding: 16px; position: relative; overflow-x: hidden;
    }
    body::before {
      content: ""; position: fixed; top: 50%; left: 50%; width: 200vmax; height: 200vmax;
      background: radial-gradient(circle, rgba(0,255,114,0.25) 2%, transparent 60%);
      transform: translate(-50%, -50%); animation: radar 12s linear infinite; opacity: 0.08; z-index: -1;
    }
    @keyframes radar { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    .logo { width: 38vw; max-width: 150px; filter: drop-shadow(0 0 10px var(--glow)); cursor: pointer; transition: 0.2s; }
    .logo:hover { transform: scale(1.05); }
    .glow-normal { animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { filter: drop-shadow(0 0 10px var(--glow)); } 50% { filter: drop-shadow(0 0 20px var(--glow)); } }
    h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); margin: 0 0 18px; text-shadow: 0 0 6px var(--glow); }
    .terminal-box {
      border: 1px solid var(--glow); padding: 16px; max-width: 420px; margin: 0 auto; border-radius: 8px;
      box-shadow: 0 0 12px var(--glow); background: rgba(0,20,0,0.7); backdrop-filter: blur(2px);
    }
    #oscilograma { width: 100%; height: 60px; margin-bottom: 14px; }
    button {
      background: #001f00; border: 1px solid var(--glow); color: var(--glow); padding: 12px; border-radius: 6px;
      font: bold 0.95rem inherit; cursor: pointer; transition: 0.2s; margin: 4px;
    }
    button:hover { background: rgba(0,255,114,0.1); }
    button:active { background: var(--glow); color: var(--bg); }
    #player { width: 1px; height: 1px; opacity: 0; position: absolute; }
    .listener-counter { padding: 8px; background: rgba(0,255,114,0.1); border: 1px solid var(--glow); border-radius: 4px; margin: 8px 0; }
    .now-playing { padding: 6px; background: rgba(0,20,0,0.8); border: 1px dashed var(--glow); border-radius: 4px; margin: 10px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>
  <img src="max2.png" class="logo glow-normal" id="logo" alt="Logo" onerror="this.style.display='none'">
  <h1>RADIO MAXIMILIAN 23</h1>
  <div class="terminal-box">
    <canvas id="oscilograma"></canvas>
    <div class="listener-counter">Oyentes: <span id="count">0</span></div>
    <div class="now-playing" id="now">Cargando...</div>
    <div id="status">Cargando frecuencia...</div>
    <button id="start" disabled>Iniciar Emisión</button>
    <div style="display:none; margin-top:8px;" id="controls">
      <button id="next">Siguiente</button>
      <button id="mute">Mute</button>
    </div>
    <iframe id="player" allow="autoplay" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>
  <p style="margin-top:20px; font-size:0.75rem; opacity:0.7;">Emisión 24/7 • Creado por Manuel</p>

  <script>
    const PHP_URL = 'https://tuproyecto.000webhostapp.com/listeners.php'; // <--- CAMBIA ESTO
    const els = {
      start: document.getElementById('start'), next: document.getElementById('next'),
      mute: document.getElementById('mute'), controls: document.getElementById('controls'),
      player: document.getElementById('player'), status: document.getElementById('status'),
      count: document.getElementById('count'), now: document.getElementById('now'),
      logo: document.getElementById('logo'), canvas: document.getElementById('oscilograma')
    };

    let items = [], idx = 0, isPlaying = false, isMuted = false;

    // === CARGAR PLAYLIST ===
    async function loadPlaylist() {
      try {
        const res = await fetch('playlists.txt?t=' + Date.now());
        const text = await res.text();
        items = text.split('\n')
          .map(l => l.trim())
          .filter(l => l && !l.startsWith('#'))
          .map(l => {
            const [url, ...title] = l.split(' - ');
            const id = url.match(/(?:v=|youtu\.be\/)([^?&"'>]+)/)?.[1];
            return id ? { id, title: title.join(' - ') || 'Sin título' } : null;
          })
          .filter(Boolean);
        if (!items.length) throw 1;
      } catch {
        items = [
          { id: 'k1-TrAvp_xs', title: 'Mozart - Lacrimosa' },
          { id: 'RdUyf6FLLTQ', title: 'Mozart - Pequeña Serenata Nocturna' }
        ];
      }
      idx = Math.floor(Math.random() * items.length);
      loadVideo(idx);
      els.start.disabled = false;
      els.status.textContent = "Pulsa Iniciar Emisión";
    }

    // === CARGAR VIDEO ===
    function loadVideo(i) {
      const { id, title } = items[i];
      els.player.src = `https://www.youtube.com/embed/${id}?enablejsapi=1&autoplay=1&rel=0&modestbranding=1`;
      els.now.innerHTML = `<strong>${title}</strong>`;
    }

    // === INICIAR EMISIÓN (SUMA +1 SI IP NUEVA) ===
    els.start.onclick = async () => {
      if (isPlaying) return;
      isPlaying = true;
      els.start.style.display = 'none';
      els.controls.style.display = 'flex';
      els.status.textContent = "Conectando...";

      try {
        const res = await fetch(PHP_URL, { method: 'POST' });
        const data = await res.json();
        els.count.textContent = data.count;
        if (data.new) els.status.textContent = "¡Nuevo oyente conectado!";
      } catch (e) {
        console.warn("PHP no responde, contador simulado");
        els.count.textContent = (parseInt(els.count.textContent) || 0) + 1;
      }

      setTimeout(() => {
        els.status.textContent = "Emisión en directo";
      }, 1500);

      // Actualizar cada 30s
      setInterval(updateCount, 30000);
    };

    // === ACTUALIZAR CONTADOR (sin cambios raros) ===
    async function updateCount() {
      try {
        const res = await fetch(PHP_URL + '?t=' + Date.now());
        const data = await res.json();
        els.count.textContent = data.count;
      } catch {}
    }

    // === SIGUIENTE CANCIÓN ===
    els.next.onclick = () => {
      idx = (idx + 1) % items.length;
      loadVideo(idx);
    };

    // === MUTE ===
    els.mute.onclick = () => {
      isMuted = !isMuted;
      els.mute.textContent = isMuted ? 'Unmute' : 'Mute';
      els.player.contentWindow?.postMessage(JSON.stringify({
        event: 'command', func: 'setVolume', args: [isMuted ? 0 : 100]
      }), '*');
    };

    // === DETECTAR FIN DE CANCIÓN ===
    window.addEventListener('message', e => {
      if (e.origin !== 'https://www.youtube.com') return;
      try {
        const d = JSON.parse(e.data);
        if (d.event === 'onStateChange' && d.info === 0) {
          els.next.click();
        }
      } catch {}
    });

    // === OSCILOSCOPIO ===
    const ctx = els.canvas.getContext('2d');
    let t = 0;
    function draw() {
      const w = els.canvas.offsetWidth, h = 60;
      ctx.fillStyle = 'rgba(0,20,0,0.6)'; ctx.fillRect(0,0,w,h);
      ctx.strokeStyle = '#00ff72'; ctx.lineWidth = 2.5; ctx.shadowBlur = 10; ctx.shadowColor = '#00ff72';
      ctx.beginPath(); t += 0.8;
      for (let x = 0; x <= w; x += 2) {
        const amp = Math.sin((x/w)*Math.PI*4 + t*0.02)*18 + Math.sin((x/w)*Math.PI*5.7 + t*0.03)*10;
        ctx.lineTo(x, h/2 + amp);
      }
      ctx.stroke(); ctx.shadowBlur = 0;
      requestAnimationFrame(draw);
    }
    draw();

    // === INICIO ===
    window.onload = () => {
      loadPlaylist();
      updateCount();
    };
  </script>
</body>
</html>
