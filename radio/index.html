<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Maximilian 23 - Emisora escolar CEIP Juan XXIII</title>
  <!-- SEO -->
  <meta name="description" content="Radio Maximilian 23 es la emisora del colegio CEIP Juan XXIII. Emisión 24/7 con MP3 locales." />
  <meta name="keywords" content="radio escolar, CEIP Juan XXIII, Radio Maximilian 23, música alumnos, radio online 24/7" />
  <meta name="author" content="Manuel - CEIP Juan XXIII" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://tudominio.com/radio-maximilian-23" />
  <!-- Open Graph -->
  <meta property="og:title" content="Radio Maximilian 23 - Emisora del CEIP Juan XXIII" />
  <meta property="og:description" content="Escucha las audiciones de música del colegio CEIP Juan XXIII en Radio Maximilian 23. Emisión continua 24/7." />
  <meta property="og:image" content="https://tudominio.com/max2.png" />
  <meta property="og:url" content="https://tudominio.com/radio-maximilian-23" />
  <meta property="og:type" content="website" />
  <style>
    :root { --glow: #00ff72; --bg: #001400; --dark: #001f00; }
    * { box-sizing: border-box; }
    body {
      background: var(--bg); color: var(--glow); font-family: "Courier New", monospace;
      text-align: center; margin: 0; padding: 16px; min-height: 100vh;
      display: flex; flex-direction: column; justify-content: center;
      overflow-x: hidden; position: relative;
    }
    body::before {
      content: ""; position: fixed; top: 50%; left: 50%;
      width: 200vmax; height: 200vmax;
      background: radial-gradient(circle, rgba(0,255,114,0.25) 2%, transparent 60%);
      transform: translate(-50%, -50%); animation: radar 12s linear infinite;
      opacity: 0.08; z-index: -1; pointer-events: none;
    }
    @keyframes radar { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    .logo-container { position: relative; display: inline-block; margin: 0 auto 12px; }
    .logo {
      width: 38vw; max-width: 150px; height: auto; display: block;
      filter: drop-shadow(0 0 10px var(--glow)); cursor: pointer;
      transition: transform 0.2s; position: relative; z-index: 1;
    }
    .logo:hover { transform: scale(1.05); }
    .glow-normal {
      filter: drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 20px var(--glow));
      animation: pulse-normal 3s ease-in-out infinite;
    }
    .glow-intenso {
      filter: drop-shadow(0 0 20px var(--glow)) drop-shadow(0 0 40px var(--glow)) drop-shadow(0 0 60px #00ffcc);
      animation: pulse-intenso 1.2s ease-in-out infinite;
    }
    @keyframes pulse-normal {
      0%, 100% { filter: drop-shadow(0 0 10px var(--glow)) drop-shadow(0 0 20px var(--glow)); }
      50% { filter: drop-shadow(0 0 15px var(--glow)) drop-shadow(0 0 30px var(--glow)); }
    }
    @keyframes pulse-intenso {
      0%, 100% { filter: drop-shadow(0 0 20px var(--glow)) drop-shadow(0 0 40px var(--glow)) drop-shadow(0 0 60px #00ffcc); }
      50% { filter: drop-shadow(0 0 30px var(--glow)) drop-shadow(0 0 60px var(--glow)) drop-shadow(0 0 90px #00ffcc); }
    }
    h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); margin: 0 0 18px 0; text-shadow: 0 0 6px var(--glow); line-height: 1.2; }
    .terminal-box {
      border: 1px solid var(--glow); padding: 16px; width: 100%; max-width: 420px; margin: 0 auto;
      border-radius: 8px; box-shadow: 0 0 12px var(--glow), inset 0 0 8px rgba(0,255,114,0.1);
      background: rgba(0, 20, 0, 0.7); backdrop-filter: blur(2px);
      display: flex; flex-direction: column; align-items: center;
    }
    #oscilograma { width: 100%; height: 60px; display: block; margin-bottom: 12px; image-rendering: pixelated; background: rgba(0,20,0,0.6); }
    .btn-group { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
    button {
      flex: 1; max-width: 130px; background: var(--dark); border: 1px solid var(--glow); color: var(--glow);
      padding: 12px 0; border-radius: 6px; font-size: 0.95rem; font-family: inherit; cursor: pointer;
      transition: all 0.2s ease; font-weight: bold;
    }
    button:hover { background: rgba(0, 255, 114, 0.1); box-shadow: 0 0 8px var(--glow); }
    button:active { background: var(--glow); color: var(--bg); transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #startBtn { margin-top: 12px; }
    .note { margin-top: 20px; font-size: 0.75rem; opacity: 0.7; max-width: 420px; margin-left: auto; margin-right: auto; line-height: 1.4; }
    .status { font-size: 0.8rem; margin-top: 8px; opacity: 0.8; min-height: 1.2em; }
    .listener-status { font-size: 0.9rem; margin: 8px 0; padding: 8px; background: rgba(0, 255, 114, 0.1); border: 1px solid var(--glow); border-radius: 4px; text-shadow: 0 0 4px var(--glow); animation: pulse 2s infinite; }
    .now-playing { font-size: 0.85rem; margin: 10px 0; padding: 6px; background: rgba(0, 20, 0, 0.8); border: 1px dashed var(--glow); border-radius: 4px; min-height: 2.4em; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .now-playing strong { color: #00ff72; text-shadow: 0 0 6px; }
    @keyframes pulse { 0%, 100% { opacity: 0.8; } 50% { opacity: 1; } }

    /* === VOLUMEN HORIZONTAL === */
    .volume-horizontal {
      width: 100%; max-width: 300px; height: 30px; margin: 8px 0; display: flex; align-items: center; justify-content: center;
    }
    .volume-track-h {
      width: 100%; height: 6px; background: rgba(0,255,114,0.2); border-radius: 3px; position: relative; overflow: hidden; cursor: pointer;
    }
    .volume-fill-h {
      height: 100%; background: var(--glow); position: absolute; left: 0; top: 0;
      border-radius: 3px; box-shadow: 0 0 8px var(--glow); transition: width 0.1s ease;
    }
    .volume-knob-h {
      width: 18px; height: 18px; background: var(--glow); border: 2px solid #001400;
      border-radius: 50%; position: absolute; top: 50%; transform: translateY(-50%);
      left: 100%; margin-left: -9px; box-shadow: 0 0 12px var(--glow), 0 0 20px #00ffcc;
      cursor: grab; transition: transform 0.1s ease;
    }
    .volume-knob-h:active { cursor: grabbing; transform: translateY(-50%) scale(1.2); }
    .volume-label-h {
      position: absolute; right: -40px; top: 50%; transform: translateY(-50%);
      font-size: 0.75rem; opacity: 0.8; white-space: nowrap;
    }

    @media (max-width: 480px) {
      .terminal-box { padding: 14px; }
      button { font-size: 0.9rem; padding: 10px 0; }
      .btn-group { gap: 6px; }
      .now-playing { font-size: 0.8rem; }
      .volume-horizontal { max-width: 260px; }
      .volume-label-h { right: -35px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>
  <audio id="beep" preload="auto"><source src="beep.mp3" type="audio/mpeg"></audio>
  <audio id="audioPlayer" preload="auto"></audio>

  <div class="logo-container">
    <img src="max2.png" class="logo glow-normal" id="radioLogo" alt="Logo Maximilian" onerror="this.style.display='none'">
  </div>
  <h1>RADIO MAXIMILIAN 23</h1>
  <div class="terminal-box">
    <canvas id="oscilograma"></canvas>

    <!-- BARRA DE VOLUMEN HORIZONTAL -->
    <div class="volume-horizontal">
      <div class="volume-track-h" id="volumeTrack">
        <div class="volume-fill-h" id="volumeFill"></div>
        <div class="volume-knob-h" id="volumeKnob"></div>
      </div>
      <div class="volume-label-h" id="volumeLabel">100%</div>
    </div>

    <div class="listener-status">Estado de la emisora: Correcto</div>
    <div id="nowPlaying" class="now-playing">Cargando señal...</div>
    <div class="status" id="status">Cargando frecuencia...</div>
    <div id="voiceOutput" class="voice-line"></div>
    <button id="startBtn" disabled>Iniciar Emisión</button>
    
    <div class="btn-group" id="controls" style="display:none;">
      <button id="nextBtn">Siguiente</button>
      <button id="pauseBtn">Pausar</button>
      <button id="muteBtn">Mute</button>
    </div>
  </div>
  <p class="note">Emisión 24/7 • MP3 locales • Creado por Manuel</p>

  <script>
    const PHRASES = {
      start: "Estás escuchando Radio Max-i-mi-lian veintitrés. Emisión continua iniciada.",
      mute: "Sonido silenciado.",
      unmute: "Volumen restaurado.",
      hour: (h, m) => `Son las ${h} ${m > 0 ? `y ${m}` : ''}. Estás en Radio Max-i-mi-lian veintitrés, la frecuencia del futuro.`,
      ads: [
        "Transmisión en directo desde el ciberespacio.",
        "Sintoniza la señal verde. Radio Max-i-mi-lian veintitrés.",
        "Frecuencia activa. No cambies de canal.",
        "Aquí solo suena lo que importa.",
        "Conectado. Escuchando. Transmitiendo.",
        "Señal clara. Volumen máximo."
      ]
    };

    const CONFIG = {
      voiceRate: 0.75, voicePitch: 0.3, voiceVolume: 1.0,
      announcementInterval: 4, hourAnnounce: true, beepBeforeVoice: true,
      mp3Folder: 'canciones/'
    };

    const els = {
      startBtn: document.getElementById('startBtn'),
      nextBtn: document.getElementById('nextBtn'),
      pauseBtn: document.getElementById('pauseBtn'),
      muteBtn: document.getElementById('muteBtn'),
      controls: document.getElementById('controls'),
      audio: document.getElementById('audioPlayer'),
      status: document.getElementById('status'),
      voiceOutput: document.getElementById('voiceOutput'),
      beep: document.getElementById('beep'),
      canvas: document.getElementById('oscilograma'),
      nowPlaying: document.getElementById('nowPlaying'),
      radioLogo: document.getElementById('radioLogo'),
      volumeTrack: document.getElementById('volumeTrack'),
      volumeFill: document.getElementById('volumeFill'),
      volumeKnob: document.getElementById('volumeKnob'),
      volumeLabel: document.getElementById('volumeLabel')
    };

    let items = [], currentIndex = 0, songCount = 0;
    let isPlaying = false, voiceEnabled = false, isSpeaking = false;
    let audioContext = null, analyser = null, source = null, lastHour = -1;
    let isPaused = false, isMuted = false;
    let currentVolume = 1.0;

    // === CARGAR PLAYLIST ===
    async function loadPlaylists() {
      try {
        const res = await fetch('playlists.txt?t=' + Date.now(), { cache: 'no-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const lines = text.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
        items = lines.map(line => {
          const parts = line.split(' - ');
          const file = parts[0].trim();
          const title = parts.slice(1).join(' - ').trim() || file;
          return { file, title };
        }).filter(i => i.file.endsWith('.mp3'));
        if (items.length === 0) throw new Error('No hay MP3 válidos');
      } catch (err) {
        console.error(err);
        items = [{ file: 'test.mp3', title: 'Canción de prueba' }];
      }
      preloadFirstSong();
    }

    function preloadFirstSong() {
      if (!items.length) {
        els.status.textContent = "Error: No hay canciones";
        return;
      }
      currentIndex = Math.floor(Math.random() * items.length);
      updateNowPlaying();
      els.status.textContent = "Frecuencia lista. ¡Pulsa Iniciar Emisión!";
      els.startBtn.disabled = false;
      els.startBtn.style.opacity = '1';
      els.startBtn.style.cursor = 'pointer';
    }

    function playCurrent() {
      const song = items[currentIndex];
      const path = CONFIG.mp3Folder + song.file;
      els.audio.src = path;
      els.audio.load();
      els.audio.volume = isMuted ? 0 : currentVolume;

      const playPromise = els.audio.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            els.status.textContent = isMuted ? "Silenciado" : "Emisión en directo";
            isPlaying = true;
            isPaused = false;
            els.pauseBtn.textContent = 'Pausar';
            connectAudioToOscilloscope();
          })
          .catch(err => {
            els.status.textContent = "Pulsa 'Iniciar Emisión' para activar sonido";
            console.warn("Autoplay bloqueado:", err);
          });
      }
    }

    function loadAndPlayNext() {
      currentIndex = (currentIndex + 1) % items.length;
      updateNowPlaying();
      playCurrent();
      songCount++;
      setTimeout(playAnnouncement, 1000);
    }

    function updateNowPlaying() {
      const song = items[currentIndex];
      els.nowPlaying.innerHTML = `<strong>${song.title}</strong>`;
    }

    // === INICIAR EMISIÓN ===
    function startPlayback() {
      if (isPlaying) return;
      els.startBtn.style.display = 'none';
      els.controls.style.display = 'flex';
      els.status.textContent = "Iniciando emisión...";

      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 256;
      }

      audioContext.resume().then(() => {
        playCurrent();
        speak(PHRASES.start);
        updateVolumeUI();
      });

      setInterval(() => {
        if (Math.random() < 0.03) { songCount++; playAnnouncement(); }
      }, 60000);
    }

    // === VOLUMEN HORIZONTAL ===
    function updateVolumeUI() {
      const percent = isMuted ? 0 : currentVolume * 100;
      els.volumeFill.style.width = percent + '%';
      els.volumeKnob.style.left = percent + '%';
      els.volumeLabel.textContent = Math.round(percent) + '%';
    }

    function setVolume(value) {
      currentVolume = value;
      if (!isMuted) {
        els.audio.volume = value;
      }
      updateVolumeUI();
    }

    els.volumeTrack.addEventListener('click', (e) => {
      const rect = els.volumeTrack.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const width = rect.width;
      const percent = Math.max(0, Math.min(1, x / width));
      setVolume(percent);
    });

    let isDragging = false;
    els.volumeKnob.addEventListener('mousedown', () => { isDragging = true; });
    document.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const rect = els.volumeTrack.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const width = rect.width;
      const percent = Math.max(0, Math.min(1, x / width));
      setVolume(percent);
    });
    document.addEventListener('mouseup', () => { isDragging = false; });

    // Soporte táctil
    els.volumeTrack.addEventListener('touchstart', (e) => { e.preventDefault(); isDragging = true; });
    document.addEventListener('touchmove', (e) => {
      if (!isDragging) return;
      const touch = e.touches[0];
      const rect = els.volumeTrack.getBoundingClientRect();
      const x = touch.clientX - rect.left;
      const width = rect.width;
      const percent = Math.max(0, Math.min(1, x / width));
      setVolume(percent);
    });
    document.addEventListener('touchend', () => { isDragging = false; });

    // === PAUSE / PLAY ===
    els.pauseBtn.addEventListener('click', () => {
      if (!isPlaying) return;
      if (isPaused) {
        els.audio.play();
        els.pauseBtn.textContent = 'Pausar';
        isPaused = false;
        els.status.textContent = isMuted ? "Silenciado" : "Emisión en directo";
      } else {
        els.audio.pause();
        els.pauseBtn.textContent = 'Play';
        isPaused = true;
        els.status.textContent = "Pausado";
      }
    });

    // === MUTE / UNMUTE ===
    els.muteBtn.addEventListener('click', () => {
      if (!isPlaying) return;
      if (isMuted) {
        els.audio.volume = currentVolume;
        els.muteBtn.textContent = 'Mute';
        isMuted = false;
        els.status.textContent = isPaused ? "Pausado" : "Emisión en directo";
        speak(PHRASES.unmute);
      } else {
        els.audio.volume = 0;
        els.muteBtn.textContent = 'Unmute';
        isMuted = true;
        els.status.textContent = "Silenciado";
        speak(PHRASES.mute);
      }
      updateVolumeUI();
    });

    // === OSCILOGRAMA REAL ===
    function connectAudioToOscilloscope() {
      if (source) source.disconnect();
      try {
        source = audioContext.createMediaElementSource(els.audio);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
        drawOscilloscope();
      } catch (e) { console.warn("Oscilograma no conectado"); }
    }

    function drawOscilloscope() {
      if (!analyser) return;
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      const canvas = els.canvas;
      const ctx = canvas.getContext('2d');
      const w = canvas.offsetWidth;
      const h = 60;

      function draw() {
        requestAnimationFrame(draw);
        analyser.getByteTimeDomainData(dataArray);
        ctx.fillStyle = 'rgba(0, 20, 0, 0.6)';
        ctx.fillRect(0, 0, w, h);
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = 'var(--glow)';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#00ff72';
        ctx.beginPath();

        const sliceWidth = w / bufferLength;
        let x = 0;
        for (let i = 0; i < bufferLength; i++) {
          const v = dataArray[i] / 128.0;
          const y = v * h / 2;
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
          x += sliceWidth;
        }
        ctx.lineTo(w, h / 2);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      draw();
    }

    // === VOZ ===
    function speak(text, cb) {
      if (!voiceEnabled || !('speechSynthesis' in window)) return cb?.();
      isSpeaking = true;
      const utter = new SpeechSynthesisUtterance(text);
      const voice = speechSynthesis.getVoices().find(v => v.lang.startsWith('es')) || speechSynthesis.getVoices()[0];
      utter.voice = voice;
      utter.rate = CONFIG.voiceRate;
      utter.pitch = CONFIG.voicePitch;
      utter.volume = CONFIG.voiceVolume;
      if (CONFIG.beepBeforeVoice) {
        els.beep.currentTime = 0;
        els.beep.play().catch(() => {});
      }
      utter.onend = () => {
        isSpeaking = false;
        cb?.();
      };
      speechSynthesis.cancel();
      speechSynthesis.speak(utter);
    }

    function playAnnouncement() {
      const now = new Date();
      const h = now.getHours(), m = now.getMinutes();
      let msg = '';
      if (h !== lastHour && m < 5 && CONFIG.hourAnnounce) {
        lastHour = h;
        msg = PHRASES.hour(h, m);
      } else if (songCount % CONFIG.announcementInterval === 0 && songCount > 0) {
        msg = PHRASES.ads[Math.floor(Math.random() * PHRASES.ads.length)];
      }
      if (msg) setTimeout(() => speak(msg), 800);
    }

    // === EVENTOS ===
    els.audio.addEventListener('ended', loadAndPlayNext);

    els.startBtn.addEventListener('click', () => {
      voiceEnabled = true;
      startPlayback();
    });

    els.nextBtn.addEventListener('click', loadAndPlayNext);

    els.radioLogo.addEventListener('click', () => {
      const logo = els.radioLogo;
      logo.classList.remove('glow-normal');
      logo.classList.add('glow-intenso');
      setTimeout(() => {
        logo.classList.remove('glow-intenso');
        logo.classList.add('glow-normal');
      }, 3000);
    });

    // === INICIO ===
    window.addEventListener('load', async () => {
      if ('speechSynthesis' in window) speechSynthesis.getVoices();
      await loadPlaylists();
    });
  </script>
</body>
</html>
