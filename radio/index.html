  <style>
    :root {
      --glow: #00ff72;
      --bg: #001400;
      --dark: #001f00;
      --metal: #0a3d0a;
      --leather: #0f2a0f;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      height: 100%;
      font-family: "Courier New", monospace;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      overscroll-behavior-y: contain;
      overflow-x: hidden;
    }
    body {
      background: var(--bg);
      color: var(--glow);
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      padding: 8px 12px;
      gap: 8px;
      min-height: 100vh;
      overflow-y: auto;
      position: relative;
      touch-action: pan-y pinch-zoom;
    }
    body::before {
      content: "";
      position: fixed;
      top: 50%;
      left: 50%;
      width: 200vmax;
      height: 200vmax;
      background: radial-gradient(circle, rgba(0,255,114,0.25) 2%, transparent 60%);
      transform: translate(-50%, -50%);
      animation: radar 12s linear infinite;
      opacity: 0.08;
      z-index: -1;
      pointer-events: none;
    }
    @keyframes radar {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* === PULL TO REFRESH ANIMADO (SIN MOVER BODY) === */
    .pull-refresh {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--glow);
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
      transition: opacity 0.3s ease, transform 0.3s ease;
      transform: translateY(-100%);
      background: rgba(0, 20, 0, 0.6);
      backdrop-filter: blur(4px);
    }
    .pull-refresh.active {
      opacity: 1;
      transform: translateY(0);
    }
    .pull-arrow {
      width: 24px;
      height: 24px;
      border: 3px solid var(--glow);
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translateY(-6px);
      margin-bottom: 6px;
      animation: bounce 1.5s infinite;
      box-shadow: 0 0 12px var(--glow);
    }
    @keyframes bounce {
      0%, 100% { transform: rotate(45deg) translateY(-6px); }
      50% { transform: rotate(45deg) translateY(-12px); }
    }

      margin: 8px 0 4px;

      justify-content: center;
      flex-shrink: 0;

      display: block;
      filter: drop-shadow(0 0 12px var(--glow));
      cursor: pointer;
      transition: transform 0.2s;
      position: relative;
      z-index: 1;

    .logo:hover, .logo:active {

    }

    }

      filter: drop-shadow(0 0 24px var(--glow)) drop-shadow(0 0 48px var(--glow)) drop-shadow(0 0 72px #00ffcc);

    }
    @keyframes pulse-intenso {
