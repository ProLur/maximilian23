<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Radio Maximilian 23</title>
  <style>
    :root {
      --glow: #00ff72;
      --bg: #001400;
      --dark: #001f00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background: var(--bg);
      color: var(--glow);
      font-family: "Courier New", monospace;
      text-align: center;
      margin: 0;
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 50%; left: 50%;
      width: 200vmax; height: 200vmax;
      background: radial-gradient(circle, rgba(0,255,114,0.25) 2%, transparent 60%);
      transform: translate(-50%, -50%);
      animation: radar 12s linear infinite;
      opacity: 0.08;
      z-index: -1;
      pointer-events: none;
    }

    @keyframes radar {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    .logo {
      width: 38vw;
      max-width: 150px;
      height: auto;
      margin: 0 auto 12px;
      display: block;
      filter: drop-shadow(0 0 10px var(--glow));
    }

    h1 {
      font-size: clamp(1.8rem, 6vw, 2.5rem);
      margin: 0 0 18px 0;
      text-shadow: 0 0 6px var(--glow);
      line-height: 1.2;
    }

    .terminal-box {
      border: 1px solid var(--glow);
      padding: 16px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 0 12px var(--glow), inset 0 0 8px rgba(0,255,114,0.1);
      background: rgba(0, 20, 0, 0.7);
      backdrop-filter: blur(2px);
    }

    #oscilograma {
      width: 100%;
      height: 60px;
      display: block;
      margin-bottom: 14px;
      image-rendering: pixelated;
    }

    button {
      width: 100%;
      max-width: 260px;
      background: var(--dark);
      border: 1px solid var(--glow);
      color: var(--glow);
      padding: 12px 0;
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      margin: 8px auto;
      display: block;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }

    button:hover {
      background: rgba(0, 255, 114, 0.1);
      box-shadow: 0 0 8px var(--glow);
    }

    button:active {
      background: var(--glow);
      color: var(--bg);
      transform: scale(0.98);
    }

    #player {
      width: 1px;
      height: 1px;
      opacity: 0;
      position: absolute;
      pointer-events: none;
    }

    .note {
      margin-top: 20px;
      font-size: 0.75rem;
      opacity: 0.7;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.4;
    }

    .status {
      font-size: 0.8rem;
      margin-top: 8px;
      opacity: 0.8;
      min-height: 1.2em;
    }

    @media (max-width: 480px) {
      .terminal-box {
        padding: 14px;
      }
      button {
        font-size: 0.95rem;
        padding: 11px 0;
      }
    }
  </style>
</head>
<body>

  <audio id="beep" preload="auto">
    <source src="beep.mp3" type="audio/mpeg">
    <!-- Fallback silencioso si no hay beep -->
  </audio>

  <img src="max2.png" class="logo" alt="Logo Maximilian" onerror="this.style.display='none'">

  <h1>RADIO MAXIMILIAN 23</h1>

  <div class="terminal-box">
    <canvas id="oscilograma"></canvas>
    <div class="status" id="status">Cargando playlists...</div>
    <button id="startBtn">▶ Iniciar Radio</button>
    <button id="nextBtn" style="display:none;">⏭ Siguiente Playlist</button>
    <iframe id="player" allow="autoplay; encrypted-media" sandbox="allow-scripts allow-same-origin"></iframe>
  </div>

  <p class="note">
    La música proviene de YouTube y se reproduce mediante su reproductor oficial.<br>
    Requiere interacción para iniciar (política de navegadores).
  </p>

  <script>
    // === Variables globales ===
    let playlists = [];
    let currentIndex = 0;
    let isPlaying = false;
    let audioContext = null;

    const elements = {
      startBtn: document.getElementById('startBtn'),
      nextBtn: document.getElementById('nextBtn'),
      player: document.getElementById('player'),
      status: document.getElementById('status'),
      beep: document.getElementById('beep'),
      canvas: document.getElementById('oscilograma'),
      ctx: null
    };

    // === Cargar playlists con fallback ===
    async function loadPlaylists() {
      try {
        const res = await fetch('playlists.txt?t=' + Date.now());
        if (!res.ok) throw new Error('No se pudo cargar playlists.txt');
        const text = await res.text();
        playlists = text
          .split('\n')
          .map(l => l.trim())
          .filter(l => l && l.startsWith('http'));
        
        if (playlists.length === 0) throw new Error('No hay playlists válidas');
        
        elements.status.textContent = `Listo: ${playlists.length} playlist${playlists.length > 1 ? 's' : ''} cargadas.`;
        elements.startBtn.disabled = false;
      } catch (err) {
        console.warn('Error cargando playlists:', err);
        elements.status.textContent = '⚠️ Usando playlist de emergencia...';
        // Playlist de respaldo (puedes cambiarla)
        playlists = ['https://www.youtube.com/playlist?list=PL4fGSI1pDJn69On1f-8NAvX_CYlx7QyZc'];
      }
    }

    // === Convertir URL a embed ===
    function playlistToEmbed(url) {
      try {
        const urlObj = new URL(url);
        const listId = urlObj.searchParams.get('list');
        if (!listId) throw new Error('No list ID');
        return `https://www.youtube.com/embed/videoseries?list=${listId}&autoplay=1&loop=1&playlist=${listId}&mute=0&rel=0&modestbranding=1`;
      } catch {
        return '';
      }
    }

    // === Iniciar radio ===
    function startRadio() {
      if (!playlists.length) return;

      const embedUrl = playlistToEmbed(playlists[currentIndex]);
      if (!embedUrl) {
        elements.status.textContent = 'Error: URL inválida';
        return;
      }

      elements.player.src = embedUrl;
      elements.beep.currentTime = 0;
      elements.beep.play().catch(() => {}); // Silenciar error si no hay beep

      elements.status.textContent = `Reproduciendo #${currentIndex + 1}`;
      isPlaying = true;
    }

    // === Botón Iniciar ===
    elements.startBtn.addEventListener('click', () => {
      // Desbloquear audio en móviles
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        audioContext.resume();
      }

      startRadio();
      elements.startBtn.style.display = 'none';
      elements.nextBtn.style.display = 'block';
    });

    // === Botón Siguiente ===
    elements.nextBtn.addEventListener('click', () => {
      currentIndex = (currentIndex + 1) % playlists.length;
      startRadio();
    });

    // === Oscilograma animado (mejorado) ===
    function initOscilloscope() {
      const canvas = elements.canvas;
      const ctx = canvas.getContext('2d');
      elements.ctx = ctx;

      function resizeCanvas() {
        canvas.width = canvas.offsetWidth * window.devicePixelRatio;
        canvas.height = 60 * window.devicePixelRatio;
        canvas.style.height = '60px';
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
      }

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      let time = 0;
      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'var(--glow)';
        ctx.lineWidth = 2;
        ctx.beginPath();

        const w = canvas.offsetWidth;
        const h = canvas.height / window.devicePixelRatio;

        time += 0.8;
        for (let x = 0; x <= w; x += 2) {
          const phase = (x / w) * Math.PI * 4 + time * 0.02;
          const amp = Math.sin(phase) * 18 + Math.sin(phase * 1.7) * 10;
          const y = h / 2 + amp;
          ctx.lineTo(x, y);
        }
        ctx.stroke();
        requestAnimationFrame(draw);
      }
      draw();
    }

    // === Inicialización ===
    window.addEventListener('load', async () => {
      elements.startBtn.disabled = true;
      await loadPlaylists();
      initOscilloscope();
    });

    // === Manejo de errores de iframe ===
    elements.player.addEventListener('load', () => {
      if (isPlaying) {
        elements.status.textContent = `En vivo: Playlist #${currentIndex + 1}`;
      }
    });
  </script>
</body>
</html>
