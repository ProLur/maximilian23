<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Radio Maximilian 23 - CEIP Juan XXIII</title>

<meta name="description" content="Radio Maximilian 23 es la emisora del colegio CEIP Juan XXIII. Emisión 24/7 con MP3 locales." />
<meta name="keywords" content="radio escolar, CEIP Juan XXIII, Radio Maximilian 23, música alumnos, radio online 24/7" />
<meta name="author" content="Manuel - CEIP Juan XXIII" />
<meta name="robots" content="index, follow" />

<meta property="og:title" content="Radio Maximilian 23 - Emisora del CEIP Juan XXIII" />
<meta property="og:description" content="Escucha las audiciones de música del colegio CEIP Juan XXIII en Radio Maximilian 23. Emisión continua 24/7." />
<meta property="og:image" content="https://tudominio.com/max2.png" />

<style>

:root{
--glow:#00ffcc;
--bg:#0d1117;
--dark:#161b22;
--metal:#1e2d3d;
--leather:#243b4a;
}

*{box-sizing:border-box;margin:0;padding:0;}

html,body{
height:100%;
font-family:"Courier New",monospace;
background:var(--bg);
color:#e6edf3;
}

body{
text-align:center;
display:flex;
flex-direction:column;
align-items:center;
padding:10px;
gap:10px;
min-height:100vh;
}

body::before{
content:"";
position:fixed;
top:50%;
left:50%;
width:200vmax;
height:200vmax;
background:radial-gradient(circle, rgba(0,255,204,0.15) 2%, transparent 60%);
transform:translate(-50%,-50%);
animation:radar 12s linear infinite;
opacity:.12;
z-index:-1;
}

@keyframes radar{
from{transform:translate(-50%,-50%) rotate(0deg);}
to{transform:translate(-50%,-50%) rotate(360deg);}
}

.logo{
width:110px;
filter:drop-shadow(0 0 12px var(--glow));
cursor:pointer;
}

h1{
font-size:2rem;
color:var(--glow);
text-shadow:0 0 10px var(--glow);
}

.terminal-box{
width:100%;
max-width:360px;
padding:16px;
border-radius:12px;
border:2px solid var(--glow);
background:rgba(22,27,34,.9);
box-shadow:0 0 16px rgba(0,255,204,.3);
display:flex;
flex-direction:column;
gap:12px;
}

#oscilograma{
width:100%;
height:60px;
background:var(--bg);
border-radius:6px;
}

.volume-track-h{
height:18px;
background:var(--leather);
border:2px solid var(--metal);
border-radius:9px;
position:relative;
cursor:pointer;
}

.volume-fill-h{
height:100%;
background:linear-gradient(90deg,#1e2d3d,#00ffcc,#1e2d3d);
position:absolute;
left:0;
top:0;
border-radius:9px;
box-shadow:0 0 10px var(--glow);
}

.volume-knob-h{
width:30px;
height:30px;
background:radial-gradient(circle at 30% 30%,#243b4a,#161b22);
border:3px solid var(--glow);
border-radius:50%;
position:absolute;
top:50%;
transform:translate(-50%,-50%);
left:100%;
box-shadow:0 0 14px var(--glow);
cursor:pointer;
}

.now-playing{
background:#1e2d3d;
border:1px solid var(--glow);
border-radius:8px;
padding:8px;
font-size:.9rem;
}

.listener-status{
background:rgba(0,255,204,.08);
border:1px solid var(--glow);
padding:8px;
border-radius:8px;
font-size:.85rem;
}

.status{
font-size:.85rem;
opacity:.9;
}

button{
background:#161b22;
border:1px solid var(--glow);
color:var(--glow);
padding:12px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
transition:.2s;
}

button:hover{
background:rgba(0,255,204,.12);
box-shadow:0 0 8px var(--glow);
}

.btn-group{
display:flex;
gap:10px;
justify-content:center;
}

.note{
font-size:.75rem;
opacity:.7;
}

</style>
</head>

<body>

<img src="max2.png" class="logo" id="radioLogo">
<h1>RADIO MAXIMILIAN 23</h1>

<div class="terminal-box">

<canvas id="oscilograma"></canvas>

<div class="volume-track-h" id="volumeTrack">
<div class="volume-fill-h" id="volumeFill"></div>
<div class="volume-knob-h" id="volumeKnob"></div>
</div>

<div class="listener-status">Estado de la emisora: Correcto</div>

<div id="nowPlaying" class="now-playing">
Cargando señal...
</div>

<div class="status" id="status">
¡Pulsa Iniciar Emisión!
</div>

<button id="startBtn">Iniciar Emisión</button>

<div class="btn-group" id="controls">
<button id="nextBtn">Siguiente</button>
<button id="pauseBtn">Pausar</button>
<button id="muteBtn">Mute</button>
</div>

</div>

<p class="note">
Emisión 24/7 • MP3 locales • Creado por Manuel
</p>

<audio id="audioPlayer"></audio>

<script>

const CONFIG={mp3Folder:'canciones/'};

const els={
audio:document.getElementById('audioPlayer'),
startBtn:document.getElementById('startBtn'),
nextBtn:document.getElementById('nextBtn'),
pauseBtn:document.getElementById('pauseBtn'),
muteBtn:document.getElementById('muteBtn'),
nowPlaying:document.getElementById('nowPlaying'),
status:document.getElementById('status'),
canvas:document.getElementById('oscilograma'),
volumeTrack:document.getElementById('volumeTrack'),
volumeFill:document.getElementById('volumeFill'),
volumeKnob:document.getElementById('volumeKnob')
};

let items=[];
let currentIndex=0;
let isPlaying=false;
let isPaused=false;
let isMuted=false;
let currentVolume=1;

let audioContext=null;
let analyser=null;
let source=null;

async function loadPlaylists(){

try{

const res=await fetch('playlists.txt?t='+Date.now());
const text=await res.text();

items=text.split('\n')
.map(l=>l.trim())
.filter(l=>l&&l.endsWith('.mp3'))
.map(f=>({file:f,title:f}));

if(items.length===0)throw 'sin canciones';

updateNowPlaying();

}catch{

items=[{file:'test.mp3',title:'Canción de prueba'}];

}

}

function updateNowPlaying(){
if(!items.length)return;
els.nowPlaying.innerHTML='<strong>'+items[currentIndex].title+'</strong>';
}

function playCurrentSong(){

const song=items[currentIndex];

els.audio.src=CONFIG.mp3Folder+song.file;

els.audio.volume=isMuted?0:currentVolume;

els.audio.play();

els.status.textContent="Emisión en directo";

connectOscilloscope();

}

function nextSong(){

currentIndex=(currentIndex+1)%items.length;

updateNowPlaying();

playCurrentSong();

}

els.audio.addEventListener('ended',nextSong);

els.startBtn.onclick=()=>{

if(!audioContext){

audioContext=new AudioContext();

analyser=audioContext.createAnalyser();

}

audioContext.resume();

playCurrentSong();

};

els.nextBtn.onclick=nextSong;

els.pauseBtn.onclick=()=>{

if(isPaused){

els.audio.play();
els.pauseBtn.textContent='Pausar';
isPaused=false;

}else{

els.audio.pause();
els.pauseBtn.textContent='Play';
isPaused=true;

}

};

els.muteBtn.onclick=()=>{

isMuted=!isMuted;

els.audio.volume=isMuted?0:currentVolume;

};

function connectOscilloscope(){

if(source)return;

source=audioContext.createMediaElementSource(els.audio);

source.connect(analyser);

analyser.connect(audioContext.destination);

draw();

}

function draw(){

const canvas=els.canvas;
const ctx=canvas.getContext('2d');

const bufferLength=analyser.frequencyBinCount;
const dataArray=new Uint8Array(bufferLength);

function loop(){

requestAnimationFrame(loop);

analyser.getByteTimeDomainData(dataArray);

ctx.fillStyle='#0d1117';
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.lineWidth=2;
ctx.strokeStyle='#00ffcc';
ctx.shadowBlur=10;
ctx.shadowColor='#00ffcc';

ctx.beginPath();

let x=0;
const slice=canvas.width/bufferLength;

for(let i=0;i<bufferLength;i++){

const v=dataArray[i]/128;
const y=v*canvas.height/2;

if(i===0)ctx.moveTo(x,y);
else ctx.lineTo(x,y);

x+=slice;

}

ctx.stroke();

}

loop();

}

loadPlaylists();

</script>

</body>
</html>
