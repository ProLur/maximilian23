<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MaxHorarios</title>
<link rel="stylesheet" href="styles.css?v=e22d918bc4cc">
</head>
<body>
<aside id="side">
  <div id="logo"><span class="b"><img src="https://maximilian23.com/Cabeza.png" alt="Maximilian 23"></span><div class="t">MaxHorarios<small>Horarios · Maximilian 23</small></div></div>
  <nav id="nav"></nav>
  <div id="sidefoot">Guardado automático en este navegador. Usa «Guardar» para tener una copia en archivo.</div>
</aside>
<div id="main">
  <header id="top">
    <h1 id="title">MaxHorarios</h1>
    <button class="btn" onclick="newProject()" title="Empezar un proyecto vacío">Nuevo</button>
    <button class="btn alt" onclick="templateModal()" title="Crear docentes, clases y materias de partida">Plantilla</button>
    <button class="btn" onclick="undo()" title="Deshacer (Ctrl+Z)">↶ Deshacer</button>
    <button class="btn" onclick="redo()" title="Rehacer (Ctrl+Y)">↷</button>
    <button class="btn" onclick="exportJSON()" title="Guardar el proyecto en un archivo">Guardar</button>
    <button class="btn" onclick="$('#fileIn').click()" title="Abrir un proyecto guardado">Abrir</button>
    <button class="btn" onclick="exportCSV()" title="Exportar a Excel (CSV)">Excel</button>
    <input type="file" id="fileIn" accept=".json,.maxh" hidden onchange="importJSON(this)">
    <button class="btn" onclick="showHelp()" title="Recuperar las ayudas cerradas">Ayuda</button><span id="cloud"></span>
  </header>
  <section id="view"></section>
</div>
<div id="printArea"></div>
<div id="modal" onmousedown="if(event.target===this)closeModal()"><div class="box" id="mbox" role="dialog" aria-modal="true" aria-label="Ventana de MaxHorarios"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="app.js?v=3181139577c3"></script>
<script src="validation.js?v=772d4d5b1ac2"></script>
<script src="scheduler.js?v=7a8363e86c23"></script>
<script src="persistence.js?v=454a4f7fe2bf"></script>
<script src="curriculum.js?v=7ee0746ebe5b"></script>
<script src="setup.js?v=1311d0ebe7fb"></script>
<script src="interface.js?v=789bdd3aa32e"></script>
<script>initialize();</script>
</body>
</html>
