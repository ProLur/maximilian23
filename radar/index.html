<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de Silencio • Maximilian 23</title>
<style>
    body {
        margin: 0;
        padding: 20px;
        font-family: "Courier New", monospace;
        background: #0d1117;
        color: #00ffcc;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
        gap: 45px;
        min-height: 100vh;
        box-sizing: border-box;
    }

    /* ====================== IZQUIERDA ====================== */
    .left {
        display: flex;
        flex-direction: column;
        gap: 18px;
        min-width: 210px;
    }

    .card {
        width: 210px;
        padding: 19px 15px;
        border: 2px solid #00ffcc55;
        border-radius: 12px;
        background: #161b22;
        text-align: center;
        font-size: 1.32rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
    }

    .card.activo {
        border-color: #00ffcc;
        background: #00ffcc22;
        box-shadow: 0 0 25px #00ffcc88;
    }

    .contador {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
        background: #161b22;
        border: 2px solid #00ffcc55;
        border-radius: 12px;
        padding: 14px;
        width: 210px;
    }

    .contador button {
        width: 48px;
        height: 48px;
        font-size: 1.9rem;
        background: #00ffcc22;
        border: 2px solid #00ffcc;
        color: #00ffcc;
        border-radius: 10px;
        cursor: pointer;
    }

    .contador span {
        font-size: 2.1rem;
        font-weight: bold;
        min-width: 45px;
        text-align: center;
    }

    /* ====================== CENTRO ====================== */
    .center {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-width: 340px;
    }

    header {
        width: 100%;
        background: #161b22;
        border-bottom: 2px solid #00ffcc;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 10px 15px;
        margin-bottom: 22px;
        border-radius: 10px;
    }

    header img {
        height: 48px;           /* Reducido para que no quede grande */
        border-radius: 50%;
        box-shadow: 0 0 12px #00ffcc;
    }

    header h2 {
        margin: 0;
        font-size: 1.55rem;
    }

    canvas {
        background: #020606;
        border: 3px solid #00ffcc55;
        border-radius: 50%;
        margin-bottom: 10px;
    }

    .barra {
        width: 300px;
        height: 16px;
        border: 2px solid #00ffcc;
        margin-top: 20px;
        border-radius: 10px;
        overflow: hidden;
    }

    .barra-inner {
        height: 100%;
        width: 0%;
        background: #00ffcc;
        transition: width 0.1s;
    }

    .estado { 
        margin-top: 16px; 
        font-size: 1.35rem; 
        min-height: 30px; 
    }

    .nota { 
        margin-top: 6px; 
        font-size: 2.35rem; 
        font-weight: bold; 
        min-height: 65px; 
    }

    #btn {
        margin-top: 28px;
        padding: 14px 50px;
        background: #00ffcc22;
        border: 2px solid #00ffcc;
        color: #00ffcc;
        cursor: pointer;
        border-radius: 10px;
        font-size: 1.22rem;
        font-weight: bold;
    }

    /* ====================== DERECHA ====================== */
    .right {
        display: flex;
        flex-direction: column;
        gap: 15px;
        min-width: 225px;
    }

    .pizarra-btn {
        padding: 17px 20px;
        background: #161b22;
        border: 2px solid #00ffcc55;
        color: #00ffcc;
        cursor: pointer;
        border-radius: 12px;
        font-size: 1.23rem;
        font-weight: bold;
        transition: all 0.3s;
        text-align: center;
    }

    .pizarra-btn:hover {
        background: #00ffcc22;
        border-color: #00ffcc;
        transform: translateX(8px);
    }

    /* ====================== PIZARRAS ====================== */
    .pizarra {
        display: none;
        position: fixed;
        top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.96);
        z-index: 1000;
        align-items: center;
        justify-content: center;
    }

    .pizarra.activa {
        display: flex;
    }

    .pizarra-content {
        width: 94%;
        max-width: 1180px;
        height: 88vh;
        border: 4px solid #00ffcc;
        position: relative;
        box-shadow: 0 0 40px #00ffcc88;
    }

    .cerrar {
        position: absolute;
        top: 15px;
        right: 25px;
        font-size: 3.2rem;
        color: #ff5555;
        cursor: pointer;
        z-index: 1010;
    }

    /* Pentagrama realista */
    #pizarra-pentagrama .pizarra-content {
        background: #f9f6eb;
    }

    .pentagrama {
        position: absolute;
        left: 8%;
        right: 8%;
        height: 130px;
    }

    .linea {
        position: absolute;
        left: 0;
        right: 0;
        height: 2px;
        background: #222;
    }
</style>
</head>
<body>

    <!-- IZQUIERDA -->
    <div class="left">
        <div class="card" id="card-explicacion" onclick="setModo(0)">📖 Explicación</div>
        <div class="card" id="card-trabajo" onclick="setModo(1)">✍️ Trabajo</div>
        <div class="card" id="card-preguntas" onclick="setModo(2)">❓ Turno de preguntas</div>
        
        <div class="contador">
            <button onclick="cambiarIntervenciones(-1)">−</button>
            <span id="intervenciones">0</span>
            <button onclick="cambiarIntervenciones(1)">+</button>
        </div>
    </div>

    <!-- CENTRO -->
    <div class="center">
        <header>
            <img src="https://maximilian23.com/Cabeza.png">
            <h2>RADAR DE SILENCIO</h2>
        </header>
        
        <canvas id="radar" width="300" height="300"></canvas>
        
        <div class="barra">
            <div class="barra-inner" id="barra"></div>
        </div>
        
        <div class="estado" id="estado">Pulsa iniciar</div>
        <div class="nota" id="nota"></div>
        
        <button id="btn" onclick="toggle()">INICIAR</button>
    </div>

    <!-- DERECHA -->
    <div class="right">
        <div class="pizarra-btn" onclick="abrirPizarra('blanca')">📄 Pizarra Blanca</div>
        <div class="pizarra-btn" onclick="abrirPizarra('negra')">⬛ Pizarra Negra</div>
        <div class="pizarra-btn" onclick="abrirPizarra('cuadros')">📐 Pizarra Cuadriculada</div>
        <div class="pizarra-btn" onclick="abrirPizarra('pentagrama')">🎵 Pentagrama</div>
    </div>

    <!-- PIZARRAS (mismo que antes) -->
    <div id="pizarra-blanca" class="pizarra">
        <div class="pizarra-content"><span class="cerrar" onclick="cerrarPizarra()">×</span></div>
    </div>

    <div id="pizarra-negra" class="pizarra">
        <div class="pizarra-content"><span class="cerrar" onclick="cerrarPizarra()">×</span></div>
    </div>

    <div id="pizarra-cuadros" class="pizarra">
        <div class="pizarra-content"><span class="cerrar" onclick="cerrarPizarra()">×</span></div>
    </div>

    <div id="pizarra-pentagrama" class="pizarra">
        <div class="pizarra-content">
            <span class="cerrar" onclick="cerrarPizarra()">×</span>
            
            <div class="pentagrama" style="top: 12%;">
                <div class="linea" style="top: 0%;"></div>
                <div class="linea" style="top: 25%;"></div>
                <div class="linea" style="top: 50%;"></div>
                <div class="linea" style="top: 75%;"></div>
                <div class="linea" style="top: 100%;"></div>
                <div style="position:absolute; left:25px; top:-22px; font-size:92px; color:#222;">𝄞</div>
            </div>

            <div class="pentagrama" style="top: 39%;">
                <div class="linea" style="top: 0%;"></div>
                <div class="linea" style="top: 25%;"></div>
                <div class="linea" style="top: 50%;"></div>
                <div class="linea" style="top: 75%;"></div>
                <div class="linea" style="top: 100%;"></div>
                <div style="position:absolute; left:25px; top:-22px; font-size:92px; color:#222;">𝄞</div>
            </div>

            <div class="pentagrama" style="top: 66%;">
                <div class="linea" style="top: 0%;"></div>
                <div class="linea" style="top: 25%;"></div>
                <div class="linea" style="top: 50%;"></div>
                <div class="linea" style="top: 75%;"></div>
                <div class="linea" style="top: 100%;"></div>
                <div style="position:absolute; left:25px; top:-22px; font-size:92px; color:#222;">𝄞</div>
            </div>
        </div>
    </div>

<script>
// (El script es exactamente el mismo que te di en el mensaje anterior - sin cambios)
let audioContext, analyser, dataArray;
let running = false;
let angle = 0;
let sumaVolumen = 0;
let muestras = 0;
let modoActual = 1;
let intervenciones = 0;

const modos = [
    { nombre: "Explicación", afectaPenalizacion: true },
    { nombre: "Trabajo", afectaPenalizacion: false },
    { nombre: "Turno de preguntas", afectaPenalizacion: true }
];

function setModo(modo) {
    modoActual = modo;
    document.querySelectorAll('.card').forEach((card, i) => card.classList.toggle('activo', i === modo));
}

function cambiarIntervenciones(cambio) {
    intervenciones = Math.max(0, intervenciones + cambio);
    document.getElementById("intervenciones").textContent = intervenciones;
}

async function toggle() {
    if (!running) iniciar();
    else parar();
}

async function iniciar() {
    sumaVolumen = 0; muestras = 0; intervenciones = 0;
    document.getElementById("intervenciones").textContent = "0";
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    const source = audioContext.createMediaStreamSource(stream);
    source.connect(analyser);
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    
    running = true;
    document.getElementById("btn").textContent = "STOP";
    document.getElementById("nota").textContent = "";
    loop();
}

function parar() {
    running = false;
    const media = sumaVolumen / muestras || 0;
    let nota = 10 - (media / 10);
    nota = Math.max(1, Math.min(10, nota));

    if (modos[modoActual].afectaPenalizacion) {
        nota -= intervenciones * 0.10;
    }

    nota = Math.max(1, Math.min(10, nota)).toFixed(1);
    document.getElementById("nota").textContent = `Nota: ${nota}`;
    document.getElementById("btn").textContent = "INICIAR";
}

function loop() {
    if (!running) return;
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
    let volumen = sum / dataArray.length;

    sumaVolumen += volumen;
    muestras++;

    dibujarRadar(volumen);
    actualizarBarra(volumen);
    actualizarEstado(volumen);
    requestAnimationFrame(loop);
}

function dibujarRadar(volumen) {
    const canvas = document.getElementById("radar");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0,0,300,300);
    const cx = 150, cy = 150;
    ctx.beginPath(); ctx.arc(cx,cy,120,0,Math.PI*2); ctx.strokeStyle="#00ffcc33"; ctx.stroke();
    const radio = 40 + volumen;
    ctx.beginPath(); ctx.arc(cx,cy,radio,0,Math.PI*2);
    ctx.strokeStyle = volumen < 30 ? "#00ffcc" : volumen < 60 ? "#ffff00" : "#ff4444";
    ctx.stroke();
    angle += 0.03;
    ctx.beginPath(); ctx.moveTo(cx,cy);
    ctx.lineTo(cx + Math.cos(angle)*120, cy + Math.sin(angle)*120);
    ctx.strokeStyle="#00ffcc"; ctx.stroke();
}

function actualizarBarra(volumen) {
    const barra = document.getElementById("barra");
    let porcentaje = Math.min(volumen * 1.5, 100);
    barra.style.width = porcentaje + "%";
    barra.style.background = volumen < 30 ? "#00ffcc" : volumen < 60 ? "#ffff00" : "#ff4444";
}

function actualizarEstado(volumen) {
    const estado = document.getElementById("estado");
    if (volumen < 30) { estado.textContent = "Silencio óptimo"; estado.style.color = "#00ffcc"; }
    else if (volumen < 60) { estado.textContent = "Nivel regular"; estado.style.color = "#ffff00"; }
    else { estado.textContent = "Demasiado ruido"; estado.style.color = "#ff4444"; }
}

function abrirPizarra(tipo) {
    document.querySelectorAll('.pizarra').forEach(p => p.classList.remove('activa'));
    document.getElementById(`pizarra-${tipo}`).classList.add('activa');
}

function cerrarPizarra() {
    document.querySelectorAll('.pizarra').forEach(p => p.classList.remove('activa'));
}

setModo(1);
</script>
</body>
</html>
