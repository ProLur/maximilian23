<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de Silencio • Maximilian 23</title>

<style>
body {
    margin: 0;
    padding: 20px;
    font-family: "Courier New", monospace;
    background: #0d1117;
    color: #00ffcc;
    display: flex;
    gap: 40px;
    justify-content: center;
}

/* IZQUIERDA */
.left {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.card {
    width: 210px;
    padding: 18px;
    border: 2px solid #00ffcc55;
    border-radius: 12px;
    background: #161b22;
    text-align: center;
    font-weight: bold;
    cursor: pointer;
}

.card.activo {
    border-color: #00ffcc;
    background: #00ffcc22;
}

/* CENTRO */
.center {
    text-align: center;
}

canvas {
    background: #020606;
    border-radius: 50%;
    border: 3px solid #00ffcc55;
}

.barra {
    width: 300px;
    height: 16px;
    border: 2px solid #00ffcc;
    margin-top: 15px;
}

.barra-inner {
    height: 100%;
    width: 0%;
    background: #00ffcc;
}

.estado { margin-top: 10px; }
.nota { font-size: 2rem; margin-top: 10px; }

#btn {
    margin-top: 20px;
    padding: 10px 30px;
    border: 2px solid #00ffcc;
    background: #00ffcc22;
    color: #00ffcc;
    cursor: pointer;
}

/* PIZARRAS */
.pizarra {
    display: none;
    position: fixed;
    inset: 0;
    background: black;
    align-items: center;
    justify-content: center;
}

.pizarra.activa {
    display: flex;
}

.pizarra-content {
    width: 90%;
    height: 90%;
    border: 4px solid #00ffcc;
    position: relative;
}

.cerrar {
    position: absolute;
    right: 20px;
    top: 10px;
    font-size: 40px;
    color: red;
    cursor: pointer;
}

/* FONDOS */
#pizarra-blanca .pizarra-content { background: white; }
#pizarra-negra .pizarra-content { background: #111; }

#pizarra-cuadros .pizarra-content {
    background: white;
    background-image:
        linear-gradient(#ccc 1px, transparent 1px),
        linear-gradient(90deg, #ccc 1px, transparent 1px);
    background-size: 25px 25px;
}

/* CUADERNILLO */
#pizarra-cuadernillo .pizarra-content {
    background: #fffdf7;
    background-image:
        repeating-linear-gradient(
            to bottom,
            transparent 0px,
            transparent 34px,
            #6aa6ff 34px,
            #6aa6ff 36px,
            transparent 36px,
            transparent 52px,
            #6aa6ff 52px,
            #6aa6ff 54px
        );
}

#pizarra-cuadernillo .pizarra-content::before {
    content: "";
    position: absolute;
    left: 70px;
    top: 0;
    bottom: 0;
    width: 2px;
    background: red;
}

/* PENTAGRAMA */
#pizarra-pentagrama .pizarra-content { background: #f9f6eb; }

.pentagrama {
    position: absolute;
    left: 10%;
    right: 10%;
    height: 100px;
}

.linea {
    position: absolute;
    width: 100%;
    height: 2px;
    background: black;
}
</style>
</head>

<body>

<div class="left">
    <div class="card" onclick="setModo(0)">Explicación</div>
    <div class="card" onclick="setModo(1)">Trabajo</div>
    <div class="card" onclick="setModo(2)">Turno preguntas</div>
</div>

<div class="center">
    <canvas id="radar" width="300" height="300"></canvas>

    <div class="barra">
        <div id="barra" class="barra-inner"></div>
    </div>

    <div id="estado">Pulsa iniciar</div>
    <div id="nota"></div>

    <button id="btn" onclick="toggle()">INICIAR</button>
</div>

<div class="left">
    <div onclick="abrirPizarra('blanca')">Blanca</div>
    <div onclick="abrirPizarra('negra')">Negra</div>
    <div onclick="abrirPizarra('cuadros')">Cuadriculada</div>
    <div onclick="abrirPizarra('cuadernillo')">Cuadernillo</div>
</div>

<!-- PIZARRAS -->
<div id="pizarra-blanca" class="pizarra"><div class="pizarra-content"><span class="cerrar" onclick="cerrar()">×</span></div></div>
<div id="pizarra-negra" class="pizarra"><div class="pizarra-content"><span class="cerrar" onclick="cerrar()">×</span></div></div>
<div id="pizarra-cuadros" class="pizarra"><div class="pizarra-content"><span class="cerrar" onclick="cerrar()">×</span></div></div>
<div id="pizarra-cuadernillo" class="pizarra"><div class="pizarra-content"><span class="cerrar" onclick="cerrar()">×</span></div></div>

<script>
let running=false;
let sumaVolumen=0;
let muestras=0;
let modoActual=1;

const modos=[
    {nombre:"Explicación", cuenta:false},
    {nombre:"Trabajo", cuenta:true},
    {nombre:"Turno preguntas", cuenta:false}
];

function setModo(m){
    modoActual=m;
}

async function toggle(){
    if(!running) iniciar();
    else parar();
}

async function iniciar(){
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const ctx=new AudioContext();
    const analyser=ctx.createAnalyser();
    const source=ctx.createMediaStreamSource(stream);
    source.connect(analyser);

    const data=new Uint8Array(analyser.frequencyBinCount);

    running=true;
    loop();

    function loop(){
        if(!running) return;

        analyser.getByteFrequencyData(data);
        let sum=0;
        for(let i=0;i<data.length;i++) sum+=data[i];
        let volumen=sum/data.length;

        /* 🔥 SOLO CUENTA EN MODO TRABAJO */
        if(modos[modoActual].cuenta){
            sumaVolumen+=volumen;
            muestras++;
        }

        document.getElementById("barra").style.width=Math.min(volumen*1.5,100)+"%";

        requestAnimationFrame(loop);
    }
}

function parar(){
    running=false;

    let media=sumaVolumen/muestras||0;
    let nota=10-(media/10);
    nota=Math.max(1,Math.min(10,nota)).toFixed(1);

    document.getElementById("nota").textContent="Nota: "+nota;
}

function abrirPizarra(t){
    document.querySelectorAll('.pizarra').forEach(p=>p.classList.remove('activa'));
    document.getElementById("pizarra-"+t).classList.add('activa');
}

function cerrar(){
    document.querySelectorAll('.pizarra').forEach(p=>p.classList.remove('activa'));
}
</script>

</body>
</html>
