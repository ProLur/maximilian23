<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar de Silencio • Maximilian 23</title>

<style>
body{
  margin:0;
  font-family:"Courier New", monospace;
  background:#0d1117;
  color:#00ffcc;
  height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-between;
  overflow:hidden;
}

header{
  width:100%;
  background:#161b22;
  border-bottom:2px solid #00ffcc;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:8px;
}

header img{
  height:40px;
  border-radius:50%;
  box-shadow:0 0 10px #00ffcc;
}

header h2{
  margin:0;
  font-size:1.1rem;
}

.main{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
}

/* radar */
canvas{
  width:260px;
  height:260px;
  background:#020606;
  border:2px solid #00ffcc55;
  border-radius:50%;
}

/* barra */
.barra{
  width:260px;
  height:12px;
  border:1px solid #00ffcc;
  border-radius:10px;
  overflow:hidden;
}

.barra-inner{
  height:100%;
  width:0%;
  background:#00ffcc;
}

/* textos */
.estado{
  height:20px;
  font-size:1rem;
  text-align:center;
}

.nota{
  height:30px;
  font-size:1.6rem;
  font-weight:bold;
}

/* botones */
.controles{
  display:flex;
  gap:10px;
}

button{
  width:120px;
  height:45px;
  background:#00ffcc22;
  border:1px solid #00ffcc;
  color:#00ffcc;
  cursor:pointer;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* micro */
.mute-btn svg{
  width:24px;
  height:24px;
}

.mute-btn.active{
  border-color:#ff4444;
  background:#ff444422;
}

.mute-btn .mic-slash{
  opacity:0;
}

.mute-btn.active .mic-slash{
  opacity:1;
}

/* slider */
.slider{
  width:260px;
  font-size:0.9rem;
  text-align:center;
}

input[type=range]{
  width:100%;
}
</style>
</head>

<body>

<header>
  <img src="https://maximilian23.com/Cabeza.png">
  <h2>RADAR DE SILENCIO</h2>
</header>

<div class="main">

<canvas id="radar" width="300" height="300"></canvas>

<div class="barra">
  <div class="barra-inner" id="barra"></div>
</div>

<div class="estado" id="estado">Pulsa iniciar</div>
<div class="nota" id="nota"></div>

<div class="controles">
  <button id="btn" onclick="toggle()">INICIAR</button>

  <button onclick="toggleMute()" id="muteBtn" class="mute-btn">
    <svg viewBox="0 0 64 64">
      <rect x="22" y="10" width="20" height="28" rx="10" fill="none" stroke="#00ffcc" stroke-width="3"/>
      <line x1="32" y1="38" x2="32" y2="49" stroke="#00ffcc" stroke-width="3"/>
      <line x1="22" y1="54" x2="42" y2="54" stroke="#00ffcc" stroke-width="3"/>
      <path d="M16 28c0 9 7 16 16 16s16-7 16-16" fill="none" stroke="#00ffcc" stroke-width="3"/>
      <line class="mic-slash" x1="14" y1="50" x2="50" y2="14" stroke="#ff4444" stroke-width="4"/>
    </svg>
  </button>
</div>

<div class="slider">
  Sensibilidad
  <input type="range" min="0.5" max="3" step="0.1" value="1.4" id="sensibilidad">
</div>

</div>

<script>
let audioContext, analyser, dataArray, streamGlobal;
let running = false;
let mute = false;
let angle = 0;

let sumaVolumen = 0;
let muestras = 0;
let volumenSuave = 0;
let sensibilidad = 1.4;

document.getElementById("sensibilidad").addEventListener("input", (e)=>{
  sensibilidad = parseFloat(e.target.value);
});

async function toggle(){
  if(!running){
    iniciar();
  }else{
    parar();
  }
}

async function iniciar(){
  sumaVolumen = 0;
  muestras = 0;
  volumenSuave = 0;

  streamGlobal = await navigator.mediaDevices.getUserMedia({ audio:true });

  audioContext = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioContext.createAnalyser();

  const source = audioContext.createMediaStreamSource(streamGlobal);
  source.connect(analyser);

  analyser.fftSize = 256;
  dataArray = new Uint8Array(analyser.frequencyBinCount);

  running = true;
  document.getElementById("btn").textContent = "STOP";

  loop();
}

function parar(){
  running = false;

  if(streamGlobal){
    streamGlobal.getTracks().forEach(t => t.stop());
  }

  if(audioContext){
    audioContext.close();
  }

  const media = muestras > 0 ? sumaVolumen / muestras : 0;

  // fórmula continua (ajustada)
  let nota = 10 - (media / 6);
  nota = Math.max(1, Math.min(10, nota));
  nota = nota.toFixed(1);

  document.getElementById("nota").textContent = "Nota: " + nota;
  document.getElementById("btn").textContent = "INICIAR";
}

function toggleMute(){
  mute = !mute;
  document.getElementById("muteBtn").classList.toggle("active", mute);
}

function loop(){
  if(!running) return;

  analyser.getByteTimeDomainData(dataArray);

  let sum = 0;
  for(let i=0;i<dataArray.length;i++){
    let v = (dataArray[i]-128)/128;
    sum += v*v;
  }

  let volumen = Math.sqrt(sum/dataArray.length)*100*sensibilidad;
  volumen = Math.min(volumen,100);

  volumenSuave = volumenSuave*0.8 + volumen*0.2;

  if(!mute){
    sumaVolumen += volumenSuave;
    muestras++;
  }

  dibujarRadar(mute ? 0 : volumenSuave);
  actualizarBarra(mute ? 0 : volumenSuave);
  actualizarEstado(mute ? 0 : volumenSuave);

  requestAnimationFrame(loop);
}

function dibujarRadar(vol){
  const c = document.getElementById("radar");
  const ctx = c.getContext("2d");

  ctx.fillStyle="rgba(2,6,6,0.2)";
  ctx.fillRect(0,0,300,300);

  const cx=150, cy=150;

  for(let i=1;i<=3;i++){
    ctx.beginPath();
    ctx.arc(cx,cy,40*i,0,Math.PI*2);
    ctx.strokeStyle="#00ffcc22";
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(cx,cy,40+vol,0,Math.PI*2);
  ctx.strokeStyle=vol<30?"#00ffcc":vol<60?"#ffff00":"#ff4444";
  ctx.stroke();

  angle+=0.03;
  ctx.beginPath();
  ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.cos(angle)*120, cy+Math.sin(angle)*120);
  ctx.strokeStyle="#00ffcc";
  ctx.stroke();
}

function actualizarBarra(vol){
  const b=document.getElementById("barra");
  b.style.width=Math.min(vol*1.5,100)+"%";
  b.style.background=vol<30?"#00ffcc":vol<60?"#ffff00":"#ff4444";
}

function actualizarEstado(vol){
  const e=document.getElementById("estado");
  if(mute){
    e.textContent="Micrófono en pausa";
    return;
  }
  e.textContent=vol<30?"Silencio óptimo":vol<60?"Nivel regular":"Demasiado ruido";
}
</script>

</body>
</html>
