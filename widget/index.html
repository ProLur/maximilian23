<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Habla con Maximilian 23</title><style>:root{color-scheme:dark;--c:#20ead4}*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#071219;color:#eefcff;overflow:hidden}.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;background:linear-gradient(155deg,#102b35,#071219 55%)}header{display:flex;align-items:center;gap:11px;padding:13px 15px;background:#08171e;border-bottom:1px solid #1f5360}header img{width:45px;height:45px;object-fit:contain;filter:drop-shadow(0 0 7px #20ead477)}.title strong{display:block;color:var(--c);font-size:16px}.title span{font-size:12px;color:#b9d6dc}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#53e38c;box-shadow:0 0 7px #53e38c}#chat{overflow:auto;padding:16px 13px 20px;scroll-behavior:smooth}.bot,.user{max-width:88%;margin:0 0 11px;padding:10px 12px;border-radius:16px;line-height:1.42;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.bot{background:#17313c;border:1px solid #285363;border-bottom-left-radius:5px}.user{margin-left:auto;background:#00bca9;color:#041412;border-bottom-right-radius:5px}.bot a{color:#73f5e7}footer{padding:10px;background:#08171e;border-top:1px solid #1f5360}form{display:flex;gap:8px}input{min-width:0;flex:1;border:1px solid #2c6170;border-radius:12px;background:#102832;color:#fff;padding:11px 12px;font-size:16px;outline:none}input:focus{border-color:var(--c)}button{border:0;border-radius:12px;background:var(--c);color:#02100f;font-weight:800;padding:0 14px;cursor:pointer}.legal{display:block;margin-top:7px;text-align:center;color:#7fa8b0;font-size:10px}.legal a{color:#9bcbd1}</style></head><body><main class="app"><header><img src="../Cabeza.png" alt=""><div class="title"><strong>Maximilian 23</strong><span><i class="dot"></i> Agente del colegio</span></div></header><section id="chat" aria-live="polite"></section><footer><form id="form"><input id="message" autocomplete="off" placeholder="Escribe tu mensaje…" aria-label="Mensaje"><button id="send">Enviar</button></form><small class="legal">Al conversar aceptas las <a href="../politica.html" target="_blank" rel="noopener">políticas de uso</a>.</small></footer></main><script>const A='https://max23.onrender.com/chat',c=document.querySelector('#chat'),m=document.querySelector('#message'),s=document.querySelector('#send');const esc=x=>String(x??'').replace(/[&<>"']/g,y=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[y]));function add(k,t,h=false){const e=document.createElement('div');e.className=k;h?e.innerHTML=t:e.textContent=t;c.append(e);c.scrollTop=c.scrollHeight;return e}add('bot','Hola, soy Maximilian 23. Estoy aquí para ayudarte con la información del colegio. ¿Qué quieres saber?');form.onsubmit=async e=>{e.preventDefault();const q=m.value.trim();if(!q)return;add('user',q);m.value='';m.disabled=s.disabled=true;const w=add('bot','Pensando…');try{const r=await fetch(A,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:q})});if(!r.ok)throw 0;const d=await r.json();w.innerHTML=esc(d.reply||'No he podido responder.').replace(/[*][*]([^*]+)[*][*]/g,'<strong>$1</strong>').replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}catch{w.textContent='No he podido conectar. Inténtalo de nuevo en unos segundos.'}finally{m.disabled=s.disabled=false;m.focus();c.scrollTop=c.scrollHeight}};</script></body></html>
