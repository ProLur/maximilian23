<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maximilian 23</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <meta name="description" content="Maximilian 23 es el asistente de inteligencia artificial del CEIP Juan XXIII de Zafra.">
  <meta name="theme-color" content="#00ffcc">
  <style>
    #pull-indicator {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%) translateY(-100%);
      background: rgba(0,255,204,0.15);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: "Courier New", monospace;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 0 0 12px 12px;
      z-index: 2000;
      transition: transform 0.2s ease, opacity 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }
    #pull-indicator.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    :root {
      --accent: #00ffcc;
      --bg-dark: #0d1117;
      --bg-panel: rgba(13,17,23,0.92);
    }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg-dark);
      color: #e6edf3;
      margin: 0;
      padding: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: rgba(22,27,34,0.95);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 22px;
      font-weight: bold;
      color: var(--accent);
      font-family: "Courier New", monospace;
      position: relative;
      flex-shrink: 0;
    }
    header img { height: 44px; width: auto; }
    #hamburger {
      display: none;
      position: absolute;
      left: 16px;
      font-size: 22px;
      color: var(--accent);
      cursor: pointer;
      background: none;
      border: none;
      padding: 4px 8px;
      line-height: 1;
      transition: transform 0.2s;
      top: 50%;
      transform: translateY(-50%);
    }
    #hamburger:hover { transform: translateY(-50%) scale(1.15); }
    @media (max-width: 767px) {
      #hamburger { display: block; }
    }
    #drawer-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 1000;
    }
    #drawer-overlay.open { display: block; }
    .left-panel.drawer-open {
      display: flex !important;
      position: fixed;
      top: 0; left: 0;
      height: 100dvh;
      z-index: 1001;
      width: clamp(260px, 75vw, 320px);
      overflow-y: auto;
      flex-direction: column;
      animation: slideIn 0.25s ease;
    }
    @keyframes slideIn {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }
    .container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .left-panel {
      display: none;
      width: clamp(280px, 30vw, 360px);
      background: var(--bg-panel);
      border-right: 2px solid var(--accent);
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 20px 0 100px 0;
      scrollbar-width: none;
    }
    .left-panel::-webkit-scrollbar {
      display: none;
    }
    .buttons-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 12px 15px;
      width: 100%;
    }
    .floating-btn {
      width: 90%;
      max-width: 240px;
      background: rgba(0,255,204,0.1);
      color: var(--accent);
      font-family: "Courier New", monospace;
      font-size: 13.5px;
      border: 1px solid rgba(0,255,204,0.6);
      border-radius: 20px;
      padding: 9px 16px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 10px rgba(0,255,204,0.5);
      backdrop-filter: blur(4px);
      text-align: center;
      animation: float 4s ease-in-out infinite;
    }
    .floating-btn:hover {
      background: rgba(0,255,204,0.25);
      box-shadow: 0 0 18px var(--accent);
      transform: scale(1.04);
    }
    .floating-btn:nth-child(1) { animation-delay: 0s; }
    .floating-btn:nth-child(2) { animation-delay: 0.4s; }
    .floating-btn:nth-child(3) { animation-delay: 0.8s; }
    .floating-btn:nth-child(4) { animation-delay: 1.2s; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    .image-container {
      margin: 30px auto 40px;
      text-align: center;
      width: 70%;
      max-width: 180px;
      flex-shrink: 0;
    }
    .left-panel img {
      width: 100%;
      border-radius: 12px;
      border: 2px solid var(--accent);
      box-shadow: 0 0 16px rgba(0,255,204,0.35);
      transition: transform 0.25s;
      cursor: pointer;
    }
    .left-panel img:hover { transform: scale(1.04); }
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
      min-width: 0;
    }
    @media (min-width: 768px) {
      .left-panel { display: flex; flex-direction: column; }
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scroll-behavior: smooth;
    }
    .user, .bot {
      padding: 12px 16px;
      margin: 12px 8px;
      border-radius: 10px;
      max-width: 80%;
      font-family: "Courier New", monospace;
      white-space: pre-wrap;
      font-size: 17px;
      line-height: 1.55;
      word-break: break-word;
    }
    .user {
      background: #243b4a;
      color: var(--accent);
      margin-left: auto;
      border: 1px solid var(--accent);
    }
    .bot {
      background: #1e2d3d;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .typing span {
      display: inline-block;
      width: 7px; height: 7px;
      margin: 0 3px;
      background: var(--accent);
      border-radius: 50%;
      animation: blink 1.4s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,100% {opacity:0.25} 20% {opacity:1} }
    footer {
      display: flex;
      padding: 10px 12px;
      background: rgba(22,27,34,0.95);
      border-top: 2px solid var(--accent);
      flex-shrink: 0;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      outline: none;
      background: #f8f9fa;
      color: #000;
      min-width: 0;
    }
    button {
      background: var(--accent);
      border: none;
      padding: 12px 20px;
      margin-left: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      color: #000;
      flex-shrink: 0;
    }
    #policyButton {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: rgba(0,255,204,0.12);
      border: 1px solid rgba(0,255,204,0.5);
      color: var(--accent);
      padding: 8px 18px;
      border-radius: 8px;
      font-family: "Courier New", monospace;
      font-size: 14px;
      transition: all 0.3s;
      backdrop-filter: blur(6px);
      z-index: 900;
      cursor: pointer;
      white-space: nowrap;
      min-width: 160px;
      text-align: center;
      display: none;
    }
    @media (min-width: 768px) {
      #policyButton { display: block; }
    }
    #policyButton:hover {
      background: rgba(0,255,204,0.25);
      box-shadow: 0 0 12px rgba(0,255,204,0.6);
    }
    @media (max-width: 600px) { #policyButton { display: none; } }
    #policyBanner {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(13,17,23,0.97);
      color: var(--accent);
      text-align: center;
      padding: 18px 12px;
      border-top: 2px solid var(--accent);
      font-family: "Courier New", monospace;
      font-size: 14px;
      transform: translateY(100%);
      transition: transform 0.6s ease;
      z-index: 999;
    }
    #policyBanner.show { transform: translateY(0); }
    #policyBanner a { color: var(--accent); text-decoration: underline; font-weight: bold; }
    #acceptPolicies {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 14px;
      margin-left: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <button id="hamburger" title="Menú">☰</button>
    <img src="https://maximilian23.com/Cabeza.png" alt="Maximilian">
    Maximilian 23
    <div id="policyIcon" title="Ver políticas de uso">🛡️</div>
  </header>
  <div id="drawer-overlay"></div>
  <div id="pull-indicator">↓ Suelta para actualizar</div>
  <div class="container">
    <div class="left-panel">
      <div class="buttons-top">
        <div class="floating-btn" onclick="window.open('https://maximilian23.com/lab23/', '_blank')">Laboratorio Musical</div>
        <div class="floating-btn" onclick="window.open('https://maximilian23.com/radio/', '_blank')">Radio Maximilian 23</div>
        <div class="floating-btn" onclick="window.open('https://maximilian23.com/arte', '_blank')">Plástica</div>
        <div class="floating-btn" onclick="window.open('http://maximilian23.com/meteored/', '_blank')">Meteored</div>
      </div>
      <div class="image-container">
        <img id="maxImage" src="https://maximilian23.com/max.png" alt="Maximilian grande">
      </div>
    </div>
    <div class="chat-panel">
      <div id="chat"></div>
      <footer>
        <input type="text" id="message" placeholder="Escribe tu mensaje..."
               onkeydown="if(event.key==='Enter'&&!this.disabled){sendMessage(); event.preventDefault()}">
        <button onclick="sendMessage()" id="sendButton">Enviar</button>
      </footer>
    </div>
  </div>
  <div id="policyButton" title="Ver políticas de uso">⚙️ Políticas</div>
  <div id="policyBanner">
    Este sitio utiliza cookies y almacena datos de sesión para ofrecer un mejor servicio.
    Al continuar, aceptas nuestras <a href="https://maximilian23.com/politica.html" target="_blank">políticas de uso</a>.
    <button id="acceptPolicies">Aceptar</button>
  </div>

  <script>
    const API_URL = "https://max23.onrender.com/chat";

    function scrollBottom() {
      const chat = document.getElementById("chat");
      chat.scrollTop = chat.scrollHeight;
    }

    function linkify(text) {
      // Mejora ligera: mejor detección de URLs (incluye más caracteres comunes)
      const urlRegex = /(https?:\/\/[^\s<>"']+[\w\/#?=&+%~.,\-])/gi;
      return text.replace(urlRegex, url => 
        `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`
      );
    }

    function typeWriterEffect(el, text, delay = 28, done = null) {
      let i = 0;
      el.innerHTML = "";  // Limpiamos con innerHTML para permitir HTML desde el principio

      function step() {
        if (i < text.length) {
          i++;
          // Durante la escritura mostramos el HTML progresivamente
          el.innerHTML = text.substring(0, i);
          if (i % 4 === 0) scrollBottom();
          setTimeout(step, delay);
        } else {
          // Al finalizar, aseguramos que todo el HTML esté renderizado
          el.innerHTML = text;
          scrollBottom();
          if (done) done();
        }
      }
      step();
    }

    async function sendMessage() {
      const input = document.getElementById("message");
      const btn = document.getElementById("sendButton");
      const chat = document.getElementById("chat");
      const msg = input.value.trim();
      if (!msg) return;

      input.disabled = btn.disabled = true;

      // Mensaje del usuario
      const userMsg = document.createElement("div");
      userMsg.className = "user";
      userMsg.textContent = msg;
      chat.appendChild(userMsg);

      // Mensaje del bot (con typing)
      const botMsg = document.createElement("div");
      botMsg.className = "bot";
      botMsg.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      chat.appendChild(botMsg);
      scrollBottom();

      input.value = "";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });

        if (!res.ok) throw new Error("Error en la respuesta del servidor");

        const data = await res.json();
        const replyText = data.reply || "Sin respuesta";

        // Aplicamos linkify ANTES del efecto de escritura
        const linkedText = linkify(replyText);

        // Limpiamos el typing y empezamos a escribir
        botMsg.innerHTML = "";
        typeWriterEffect(botMsg, linkedText, 28, () => {
          input.disabled = btn.disabled = false;
          input.focus();
        });

      } catch (err) {
        botMsg.textContent = "⚠️ Error de conexión. Intenta otra vez.";
        input.disabled = btn.disabled = false;
        scrollBottom();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const chat = document.getElementById("chat");
      const welcome = document.createElement("div");
      welcome.className = "bot";
      chat.appendChild(welcome);
      typeWriterEffect(welcome, 
        "🤖 Hola, soy Maximilian 23. Estoy aquí para ayudarte con la información del colegio. ¿Qué quieres saber?"
      );

      if (!localStorage.getItem("policiesAccepted")) {
        document.getElementById("policyBanner").classList.add("show");
      }
    });

    // Pull to refresh
    (function() {
      let startY = 0, pulling = false;
      const indicator = document.getElementById("pull-indicator");
      const THRESHOLD = 80;

      document.addEventListener("touchstart", e => {
        const chat = document.getElementById("chat");
        if (chat.scrollTop === 0) {
          startY = e.touches[0].clientY;
          pulling = true;
        }
      }, { passive: true });

      document.addEventListener("touchmove", e => {
        if (!pulling) return;
        const dy = e.touches[0].clientY - startY;
        if (dy > 20) {
          indicator.textContent = dy > THRESHOLD ? "↑ Suelta para actualizar" : "↓ Desliza para actualizar";
          indicator.classList.add("visible");
        }
      }, { passive: true });

      document.addEventListener("touchend", e => {
        if (!pulling) return;
        pulling = false;
        const dy = e.changedTouches[0].clientY - startY;
        if (dy > THRESHOLD) {
          indicator.textContent = "🔄 Actualizando...";
          setTimeout(() => location.reload(), 400);
        } else {
          indicator.classList.remove("visible");
        }
      });
    })();

    document.getElementById("hamburger")?.addEventListener("click", () => {
      document.querySelector(".left-panel").classList.add("drawer-open");
      document.getElementById("drawer-overlay").classList.add("open");
    });

    document.getElementById("drawer-overlay")?.addEventListener("click", () => {
      document.querySelector(".left-panel").classList.remove("drawer-open");
      document.getElementById("drawer-overlay").classList.remove("open");
    });

    document.getElementById("policyIcon")?.addEventListener("click", () => {
      window.open("https://maximilian23.com/politica.html", "_blank");
    });

    document.getElementById("policyButton")?.addEventListener("click", () => {
      window.open("https://maximilian23.com/politica.html", "_blank");
    });

    document.getElementById("acceptPolicies")?.addEventListener("click", () => {
      localStorage.setItem("policiesAccepted", "true");
      document.getElementById("policyBanner").classList.remove("show");
    });

    document.getElementById("maxImage")?.addEventListener("click", function() {
      const original = this.src;
      this.src = "https://raw.githubusercontent.com/ProLur/maximilian23/refs/heads/main/2.gif";
      this.addEventListener("load", () => setTimeout(() => this.src = original, 3000), { once: true });
    });
  </script>
</body>
</html>
