<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maximilian 23</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <meta name="description" content="Maximilian 23 es el asistente de inteligencia artificial del CEIP Juan XXIII de Zafra.">
  <meta name="theme-color" content="#00ffcc">
  <style>
    :root {
      --accent: #00ffcc;
      --bg-dark: #0d1117;
      --bg-panel: rgba(13,17,23,0.92);
    }
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: var(--bg-dark);
      color: #e6edf3;
      margin: 0;
      padding: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: rgba(22,27,34,0.95);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-size: 22px;
      font-weight: bold;
      color: var(--accent);
      font-family: "Courier New", monospace;
      position: relative;
      flex-shrink: 0;
    }
    header img { height: 44px; width: auto; }
    #policyIcon {
      position: absolute;
      right: 16px;
      font-size: 24px;
      color: var(--accent);
      cursor: pointer;
      transition: transform 0.3s;
    }
    #policyIcon:hover { transform: rotate(30deg); }
    .container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }
    .left-panel {
      display: none;
      width: clamp(280px, 30vw, 360px);
      background: var(--bg-panel);
      border-right: 2px solid var(--accent);
      position: relative;
      overflow-y: auto; /* permite scroll si la pantalla es muy pequeña */
      padding: 20px 0 140px 0; /* espacio abajo para que no tape la imagen */
    }
    /* Contenedor superior para los 4 botones */
    .buttons-top {
      position: sticky;
      top: 20px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 0 10px 20px;
    }
    .floating-btn {
      width: 85%;
      max-width: 240px;
      background: rgba(0,255,204,0.1);
      color: var(--accent);
      font-family: "Courier New", monospace;
      font-size: 14px;
      border: 1px solid rgba(0,255,204,0.6);
      border-radius: 20px;
      padding: 10px 18px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 12px rgba(0,255,204,0.5);
      backdrop-filter: blur(4px);
      text-align: center;
      animation: float 3.8s ease-in-out infinite;
    }
    .floating-btn:hover {
      background: rgba(0,255,204,0.25);
      box-shadow: 0 0 20px var(--accent);
      transform: scale(1.05);
    }
    .floating-btn:nth-child(1) { animation-delay: 0s; }
    .floating-btn:nth-child(2) { animation-delay: 0.4s; }
    .floating-btn:nth-child(3) { animation-delay: 0.8s; }
    .floating-btn:nth-child(4) { animation-delay: 1.2s; }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    /* Imagen abajo, separada */
    .image-container {
      margin: 40px auto 60px;
      text-align: center;
      width: 80%;
      max-width: 240px;
    }
    .left-panel img {
      width: 100%;
      border-radius: 12px;
      border: 3px solid var(--accent);
      box-shadow: 0 0 20px rgba(0,255,204,0.4);
      transition: transform 0.25s;
      cursor: pointer;
    }
    .left-panel img:hover { transform: scale(1.03); }
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: var(--bg-panel);
    }
    @media (min-width: 768px) {
      .left-panel { display: flex; flex-direction: column; }
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      scroll-behavior: smooth;
    }
    .user, .bot {
      padding: 12px 16px;
      margin: 12px 8px;
      border-radius: 10px;
      max-width: 80%;
      font-family: "Courier New", monospace;
      white-space: pre-wrap;
      font-size: 17px;
      line-height: 1.55;
      word-break: break-word;
    }
    .user {
      background: #243b4a;
      color: var(--accent);
      margin-left: auto;
      border: 1px solid var(--accent);
    }
    .bot {
      background: #1e2d3d;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    .typing span {
      display: inline-block;
      width: 7px; height: 7px;
      margin: 0 3px;
      background: var(--accent);
      border-radius: 50%;
      animation: blink 1.4s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,100% {opacity:0.25} 20% {opacity:1} }
    footer {
      display: flex;
      padding: 10px 12px;
      background: rgba(22,27,34,0.95);
      border-top: 2px solid var(--accent);
      flex-shrink: 0;
    }
    input {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      outline: none;
      background: #f8f9fa;
      color: #000;
    }
    button {
      background: var(--accent);
      border: none;
      padding: 12px 20px;
      margin-left: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 15px;
      color: #000;
    }
    #policyButton {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: rgba(0,255,204,0.12);
      border: 1px solid rgba(0,255,204,0.5);
      color: var(--accent);
      padding: 8px 18px;
      border-radius: 8px;
      font-family: "Courier New", monospace;
      font-size: 14px;
      transition: all 0.3s;
      backdrop-filter: blur(6px);
      z-index: 900;
      cursor: pointer;
      white-space: nowrap;
      min-width: 160px;
      text-align: center;
    }
    #policyButton:hover {
      background: rgba(0,255,204,0.25);
      box-shadow: 0 0 12px rgba(0,255,204,0.6);
    }
    @media (max-width: 600px) { #policyButton { display: none; } }
    #policyBanner {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(13,17,23,0.97);
      color: var(--accent);
      text-align: center;
      padding: 18px 12px;
      border-top: 2px solid var(--accent);
      font-family: "Courier New", monospace;
      font-size: 14px;
      transform: translateY(100%);
      transition: transform 0.6s ease;
      z-index: 999;
    }
    #policyBanner.show { transform: translateY(0); }
    #policyBanner a { color: var(--accent); text-decoration: underline; font-weight: bold; }
    #acceptPolicies {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 8px 14px;
      margin-left: 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Maximilian">
    Maximilian 23
    <div id="policyIcon" title="Ver políticas de uso">⚙️</div>
  </header>

  <div class="container">
    <div class="left-panel">
      <div class="buttons-top">
        <div class="floating-btn" onclick="window.open('https://maximilian23.com/lab23/', '_blank')">Laboratorio Musical</div>
        <div class="floating-btn" onclick="window.open('https://maximilian23.com/radio/', '_blank')">Radio Maximilian 23</div>
        <div class="floating-btn" onclick="window.open('https://maximilian23.com/arte', '_blank')">Plástica</div>
        <div class="floating-btn" onclick="window.open('http://maximilian23.com/meteored/', '_blank')">Meteored</div>
      </div>

      <div class="image-container">
        <img id="maxImage" src="https://maximilian23.com/max.png" alt="Maximilian grande">
      </div>
    </div>

    <div class="chat-panel">
      <div id="chat"></div>
      <footer>
        <input type="text" id="message" placeholder="Escribe tu mensaje..." 
               onkeydown="if(event.key==='Enter'&&!this.disabled){sendMessage(); event.preventDefault()}">
        <button onclick="sendMessage()" id="sendButton">Enviar</button>
      </footer>
    </div>
  </div>

  <div id="policyButton" title="Ver políticas de uso">⚙️ Políticas</div>

  <div id="policyBanner">
    Este sitio utiliza cookies y almacena datos de sesión para ofrecer un mejor servicio.
    Al continuar, aceptas nuestras <a href="https://maximilian23.com/politica.html" target="_blank">políticas de uso</a>.
    <button id="acceptPolicies">Aceptar</button>
  </div>

  <script>
    // El script se mantiene igual al de la versión anterior que te gustaba
    const API_URL = "https://max23.onrender.com/chat";

    function scrollBottom() {
      const chat = document.getElementById("chat");
      chat.scrollTop = chat.scrollHeight;
    }

    function linkify(t) {
      return t.replace(/(https?:\/\/[^\s"']+[a-zA-Z0-9\/#?=&_%~\-])/g,
        u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
    }

    function typeWriterEffect(el, text, delay = 28, done = null) {
      let i = 0; el.innerHTML = "";
      function step() {
        if (i < text.length) {
          el.innerHTML = text.substring(0, ++i);
          if (i % 4 === 0) scrollBottom();
          setTimeout(step, delay);
        } else {
          scrollBottom();
          if (done) done();
        }
      }
      step();
    }

    async function sendMessage() {
      const input = document.getElementById("message");
      const btn = document.getElementById("sendButton");
      const chat = document.getElementById("chat");
      const msg = input.value.trim();
      if (!msg) return;

      input.disabled = btn.disabled = true;
      const userMsg = document.createElement("div");
      userMsg.className = "user";
      userMsg.textContent = msg;
      chat.appendChild(userMsg);

      const botMsg = document.createElement("div");
      botMsg.className = "bot";
      botMsg.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      chat.appendChild(botMsg);
      scrollBottom();

      input.value = "";

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });
        const data = await res.json();
        botMsg.innerHTML = "";
        typeWriterEffect(botMsg, linkify(data.reply || "Sin respuesta"), 28, () => {
          input.disabled = btn.disabled = false;
          input.focus();
        });
      } catch (err) {
        botMsg.textContent = "⚠️ Error de conexión. Intenta otra vez.";
        input.disabled = btn.disabled = false;
        scrollBottom();
      }
    }

    window.addEventListener("DOMContentLoaded", () => {
      const chat = document.getElementById("chat");
      const welcome = document.createElement("div");
      welcome.className = "bot";
      chat.appendChild(welcome);
      typeWriterEffect(welcome, "🤖 Hola, soy Maximilian 23. Estoy aquí para ayudarte con la información del colegio. ¿Qué quieres saber?");

      if (!localStorage.getItem("policiesAccepted")) {
        document.getElementById("policyBanner").classList.add("show");
      }
    });

    [document.getElementById("policyButton"), document.getElementById("policyIcon") || {}]
      .forEach(el => el.addEventListener?.("click", () => window.open("https://maximilian23.com/politica.html", "_blank")));

    document.getElementById("acceptPolicies")?.addEventListener("click", () => {
      localStorage.setItem("policiesAccepted", "true");
      document.getElementById("policyBanner").classList.remove("show");
    });

    document.getElementById("maxImage")?.addEventListener("click", function() {
      const original = this.src;
      this.src = "https://raw.githubusercontent.com/ProLur/maximilian23/refs/heads/main/2.gif";
      this.addEventListener("load", () => setTimeout(() => this.src = original, 3000), { once: true });
    });
  </script>
</body>
</html>
