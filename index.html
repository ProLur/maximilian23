<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maximilian 23</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <meta name="description" content="Maximilian 23 es el asistente de inteligencia artificial del CEIP Juan XXIII de Zafra.">
  <meta name="theme-color" content="#00ffcc">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(22,27,34,0.95);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
      color: #00ffcc;
      font-family: "Courier New", monospace;
      position: relative;
      min-height: 56px;
    }
    header img { height: 40px; width: auto; }
    #menuIcon {
      display: none;
      position: absolute;
      left: 12px;
      font-size: 28px;
      color: #00ffcc;
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.3s ease;
      user-select: none;
      line-height: 1;
    }
    #menuIcon:hover { transform: scale(1.1); }

    @media (max-width: 600px) {
      #menuIcon { display: block; }
      .left-panel { display: none !important; }
    }

    #mobileMenu {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100vh;
      background: rgba(13,17,23,0.98);
      border-right: none;
      padding: 70px 20px 20px;
      transition: left 0.4s ease;
      z-index: 999;
      backdrop-filter: blur(8px);
      box-sizing: border-box;
      overflow: hidden;
      border-radius: 0 16px 16px 0;
    }
    #mobileMenu.open {
      left: 0;
      border-right: 2px solid #00ffcc;
    }
    #mobileMenu .menu-item {
      display: block;
      width: calc(100% - 16px);
      margin: 0 8px 12px;
      background: rgba(0,255,204,0.08);
      color: #00ffcc;
      font-family: "Courier New", monospace;
      font-size: 16px;
      border: 1px solid #00ffcc88;
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 0 6px #00ffcc;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px #00ffcc55;
    }
    #mobileMenu .menu-item:hover {
      background: rgba(0,255,204,0.2);
      box-shadow: inset 0 0 15px rgba(0,255,204,0.3), 0 0 15px #00ffcc;
      transform: translateY(-2px);
    }

    #overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
      z-index: 998;
    }
    #overlay.show { opacity: 1; visibility: visible; }

    @media (min-width: 601px) {
      #mobileMenu, #overlay { display: none !important; }
    }

    .container { flex: 1; display: flex; overflow: hidden; }
    .left-panel {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      background: rgba(13,17,23,0.9);
      border-right: 2px solid #00ffcc;
      position: relative;
      flex-direction: column;
    }
    .image-container { margin-top: 180px; text-align: center; } /* espacio para 4 botones flotantes */
    .left-panel img {
      max-width: 220px; height: auto; border-radius: 10px; border: 2px solid #00ffcc;
      box-shadow: 0 0 15px #00ffcc88; cursor: pointer; transition: transform 0.2s;
    }
    .left-panel img:hover { transform: scale(1.05); }

    #labButton, #radioButton, #plasticaButton, #meteoredButton {
      position: absolute; left: 50%; transform: translateX(-50%);
      background: rgba(0,255,204,0.08); color: #00ffcc; font-family: "Courier New", monospace;
      font-size: 14px; border: 1px solid #00ffcc88; border-radius: 20px; padding: 6px 14px;
      cursor: pointer; transition: all 0.3s ease; text-shadow: 0 0 6px #00ffcc;
      backdrop-filter: blur(4px); box-shadow: 0 0 10px #00ffcc55; z-index: 10;
      animation: float 3s ease-in-out infinite;
    }
    #labButton     { top: 15px; }
    #radioButton   { top: 65px;  animation-delay: 0.4s; }
    #plasticaButton{ top: 115px; animation-delay: 0.8s; }
    #meteoredButton{ top: 165px; animation-delay: 1.2s; }

    #labButton:hover, #radioButton:hover, #plasticaButton:hover, #meteoredButton:hover {
      background: rgba(0,255,204,0.2);
      box-shadow: 0 0 12px #00ffcc;
      transform: translateX(-50%) scale(1.05);
    }

    @keyframes float {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(-4px); }
    }

    .chat-panel { flex: 2; display: flex; flex-direction: column; background: rgba(13,17,23,0.9); height: 100%; }
    @media (min-width:768px) { .left-panel { display: flex; } }

    #chat { flex: 1; overflow-y: auto; padding: 15px; scroll-behavior: smooth; }
    .user, .bot {
      padding: 12px; margin: 10px 12px; border-radius: 10px; max-width: 80%;
      font-family: "Courier New", monospace; white-space: pre-wrap; font-size: 17px; line-height: 1.5; word-break: break-word;
    }
    .user { background: #243b4a; color: #00ffcc; margin-left: auto; border: 1px solid #00ffcc; }
    .bot  { background: #1e2d3d; color: #00ffcc; border: 1px solid #00ffcc; }

    footer {
      display: flex; padding: 8px; background: rgba(22,27,34,0.95); border-top: 2px solid #00ffcc;
    }
    input {
      flex: 1; padding: 10px; border: none; border-radius: 5px; font-size: 16px; outline: none; background: #fff; color: #000;
    }
    button {
      background: #00ffcc; border: none; padding: 10px 14px; margin-left: 8px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <div id="menuIcon">☰</div>
    <img src="https://maximilian23.com/Cabeza.png" alt="Maximilian">
    Maximilian 23
  </header>

  <div id="mobileMenu">
    <div class="menu-item" onclick="openLab()">Laboratorio Musical</div>
    <div class="menu-item" onclick="openRadio()">Radio Maximilian 23</div>
    <div class="menu-item" onclick="openArte()">Plástica</div>
    <div class="menu-item" onclick="openMeteored()">Meteored</div>
  </div>

  <div id="overlay"></div>

  <div class="container">
    <div class="left-panel">
      <div id="labButton" onclick="openLab()" title="Ir al Laboratorio Musical">Laboratorio Musical</div>
      <div id="radioButton" onclick="openRadio()" title="Escuchar Radio Maximilian 23">Radio Maximilian 23</div>
      <div id="plasticaButton" onclick="openArte()" title="Ir a Plástica / Arte">Plástica</div>
      <div id="meteoredButton" onclick="openMeteored()" title="Ir a Meteored">Meteored</div>
      <div class="image-container">
        <img src="https://maximilian23.com/max.png" alt="Maximilian">
      </div>
    </div>

    <div class="chat-panel">
      <div id="chat"></div>
      <footer>
        <input type="text" id="message" placeholder="Escribe tu mensaje..." onkeydown="if(event.key==='Enter') sendMessage();">
        <button onclick="sendMessage()">Enviar</button>
      </footer>
    </div>
  </div>

  <script>
    function openLab() {
      window.open('https://maximilian23.com/lab23/', '_blank');
      closeMobileMenu();
    }
    function openRadio() {
      window.open('https://maximilian23.com/radio/', '_blank');
      closeMobileMenu();
    }
    function openArte() {
      window.open('https://maximilian23.com/arte', '_blank');
      closeMobileMenu();
    }
    function openMeteored() {
      window.open('http://maximilian23.com/meteored/', '_blank');
      closeMobileMenu();
    }

    const menuIcon = document.getElementById('menuIcon');
    const mobileMenu = document.getElementById('mobileMenu');
    const overlay = document.getElementById('overlay');

    function toggleMobileMenu() {
      mobileMenu.classList.toggle('open');
      overlay.classList.toggle('show');
    }
    function closeMobileMenu() {
      mobileMenu.classList.remove('open');
      overlay.classList.remove('show');
    }

    menuIcon.addEventListener('click', toggleMobileMenu);
    overlay.addEventListener('click', closeMobileMenu);

    // Aquí puedes añadir el resto del script del chat si lo tienes (sendMessage, typeWriterEffect, etc.)
    // Por ahora dejo solo lo básico del menú y los botones
  </script>
</body>
</html>
