<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maximilian 23</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <meta name="description" content="Maximilian 23 es el asistente de inteligencia artificial del CEIP Juan XXIII de Zafra.">
  <meta name="theme-color" content="#00ffcc">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(22,27,34,0.95);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
      color: #00ffcc;
      font-family: "Courier New", monospace;
      position: relative;
      min-height: 56px;
    }
    header img { height: 40px; width: auto; }
    #menuIcon {
      display: none;
      position: absolute;
      left: 12px;
      font-size: 28px;
      color: #00ffcc;
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.3s ease;
      user-select: none;
      line-height: 1;
    }
    #menuIcon:hover { transform: scale(1.1); }
    #policyIcon {
      display: none;
      position: absolute;
      right: 12px;
      font-size: 24px;
      color: #00ffcc;
      cursor: pointer;
      transition: transform .3s ease;
      line-height: 1;
    }
    #policyIcon:hover { transform: rotate(90deg); }
    #policyIcon:active { transform: rotate(90deg) scale(0.9); }
    @media (max-width: 600px) {
      #menuIcon, #policyIcon { display: block; }
      .left-panel { display: none !important; }
    }
    #mobileMenu {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100vh;
      background: rgba(13,17,23,0.98);
      border-right: none;
      padding: 70px 20px 20px;
      transition: left 0.4s ease;
      z-index: 999;
      backdrop-filter: blur(8px);
      box-sizing: border-box;
      overflow: hidden;
      border-radius: 0 16px 16px 0;
    }
    #mobileMenu.open {
      left: 0;
      border-right: 2px solid #00ffcc;
    }
    #mobileMenu .menu-item {
      display: block;
      width: calc(100% - 16px);
      margin-left: 8px;
      margin-right: 8px;
      margin-bottom: 12px;
      background: rgba(0,255,204,0.08);
      color: #00ffcc;
      font-family: "Courier New", monospace;
      font-size: 16px;
      border: 1px solid #00ffcc88;
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 0 6px #00ffcc;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px #00ffcc55;
      box-sizing: border-box;
      overflow: hidden;
      position: relative;
    }
    #mobileMenu .menu-item:hover {
      background: rgba(0,255,204,0.2);
      box-shadow: inset 0 0 15px rgba(0,255,204,0.3), 0 0 15px #00ffcc;
      transform: translateY(-2px);
    }
    #mobileMenu .menu-image {
      margin-top: 40px;
      display: flex;
      justify-content: center;
      width: 100%;
      flex-grow: 1;
      align-items: center;
    }
    #mobileMenu .menu-image img {
      width: 140px;
      height: auto;
      border-radius: 10px;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 15px #00ffcc88;
      animation: floatMobile 3s ease-in-out infinite;
      cursor: pointer;
      transition: transform .3s ease;
    }
    #mobileMenu .menu-image img:hover {
      transform: scale(1.08);
    }
    @keyframes floatMobile {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    #overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
      z-index: 998;
    }
    #overlay.show { opacity: 1; visibility: visible; }
    @media (min-width: 601px) {
      #mobileMenu, #overlay { display: none !important; }
    }
    .container { flex: 1; display: flex; overflow: hidden; }
    .left-panel {
      display: none;
      flex: 1;
      align-items: center;
      justify-content: center;
      background: rgba(13,17,23,0.9);
      border-right: 2px solid #00ffcc;
      position: relative;
      flex-direction: column;
    }
    .image-container { margin-top: 100px; text-align: center; }
    .left-panel img {
      max-width: 220px; height: auto; border-radius: 10px; border: 2px solid #00ffcc;
      box-shadow: 0 0 15px #00ffcc88; cursor: pointer; transition: transform 0.2s;
    }
    .left-panel img:hover { transform: scale(1.05); }
    #labButton, #radioButton {
      position: absolute; left: 50%; transform: translateX(-50%);
      background: rgba(0,255,204,0.08); color: #00ffcc; font-family: "Courier New", monospace;
      font-size: 14px; border: 1px solid #00ffcc88; border-radius: 20px; padding: 6px 14px;
      cursor: pointer; transition: all 0.3s ease; text-shadow: 0 0 6px #00ffcc;
      backdrop-filter: blur(4px); box-shadow: 0 0 10px #00ffcc55; z-index: 10;
      animation: float 3s ease-in-out infinite;
    }
    #labButton { top: 15px; }
    #radioButton { top: 65px; animation-delay: 0.5s; }
    #labButton:hover, #radioButton:hover {
      background: rgba(0,255,204,0.2); box-shadow: 0 0 12px #00ffcc;
      transform: translateX(-50%) scale(1.05);
    }
    @keyframes float { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-3px); } }
    .chat-panel { flex: 2; display: flex; flex-direction: column; background: rgba(13,17,23,0.9); height: 100%; }
    @media (min-width:768px) { .left-panel { display: flex; } }
    #chat { flex: 1; overflow-y: auto; padding: 15px; scroll-behavior: smooth; }
    .user, .bot { padding: 12px; margin: 10px 12px; border-radius: 10px; max-width: 80%; font-family: "Courier New", monospace; white-space: pre-wrap; font-size: 17px; line-height: 1.5; word-break: break-word; }
    .user { background: #243b4a; color: #00ffcc; margin-left: auto; border: 1px solid #00ffcc; }
    .bot { background: #1e2d3d; color: #00ffcc; border: 1px solid #00ffcc; }
    .bot a { color: #00ffcc; text-decoration: underline; text-shadow: 0 0 6px #00ffccaa; font-weight: bold; transition: all 0.2s ease-in-out; }
    .bot a:hover { color: #33ffee; text-shadow: 0 0 10px #00fff0, 0 0 20px #00fff066; }
    .typing { display: inline-block; }
    .typing span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; background: #00ffcc; border-radius: 50%; animation: blink 1.4s infinite both; }
    .typing span:nth-child(2){animation-delay:.2s;}
    .typing span:nth-child(3){animation-delay:.4s;}
    @keyframes blink{0%{opacity:.2;}20%{opacity:1;}100%{opacity:.2;}}
    footer { display: flex; padding: 8px; background: rgba(22,27,34,0.95); border-top: 2px solid #00ffcc; gap: 8px; }
    input { flex: 1; padding: 10px; border: none; border-radius: 5px; font-size: 16px; outline: none; background: #fff; color: #000; }
    button { background: #00ffcc; border: none; padding: 10px 14px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 14px; }
    #clearHistory {
      background: #ff4444; color: white; padding: 10px 12px; font-size: 12px;
      border: none; border-radius: 5px; cursor: pointer;
    }
    #clearHistory:hover { background: #cc0000; }
    #policyButton { position: fixed; bottom: 12px; left: 12px; background: rgba(0,255,204,.08); border: 1px solid #00ffcc88; color: #00ffcc; padding: 6px 12px; border-radius: 6px; font-family: "Courier New", monospace; font-size: 13px; transition: all .3s ease; backdrop-filter: blur(4px); z-index: 900; cursor: pointer; }
    #policyButton:hover { background: rgba(0,255,204,.2); border-color: #00ffcc; box-shadow: 0 0 6px #00ffcc88; }
    @media (max-width: 767px) { #policyButton { display: none; } }
    #policyBanner { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(13,17,23,0.97); color: #00ffcc; text-align: center; padding: 18px 10px; border-top: 2px solid #00ffcc; font-family: "Courier New", monospace; font-size: 14px; transform: translateY(100%); transition: transform 0.6s ease; z-index: 999; }
    #policyBanner.show { transform: translateY(0); }
    #policyBanner a { color: #00ffcc; text-decoration: underline; font-weight: bold; }
    #policyBanner a:hover { color: #33ffe6; }
    #acceptPolicies { background: #00ffcc; color: #000; border: none; padding: 6px 12px; margin-left: 8px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
    html, body { height: 100%; min-height: 100%; }
    .container, .chat-panel { height: 100%; }
    @media (min-width:601px) and (max-height:650px) { footer { padding-bottom: 50px; } }
  </style>
</head>
<body>
  <header>
    <div id="menuIcon">Menu</div>
    <img src="https://maximilian23.com/Cabeza.png" alt="Maximilian">
    Maximilian 23
    <div id="policyIcon">Shield</div>
  </header>

  <div id="mobileMenu">
    <div id="closeMenu" style="position: absolute; top: 12px; right: 12px; font-size: 28px; color: #00ffcc; cursor: pointer; z-index: 1001;">X</div>
    <div class="menu-item" onclick="openLab()">Laboratorio Musical</div>
    <div class="menu-item" onclick="openRadio()">Radio Maximilian 23</div>
    <div class="menu-image">
      <img id="mobileMaxImage" src="https://maximilian23.com/max.png" alt="Maximilian">
    </div>
  </div>
  <div id="overlay"></div>

  <div class="container">
    <div class="left-panel">
      <div id="labButton" onclick="openLab()" title="Ir al Laboratorio Musical">Laboratorio Musical</div>
      <div id="radioButton" onclick="openRadio()" title="Escuchar Radio Maximilian 23">Radio Maximilian 23</div>
      <div class="image-container">
        <img id="maxImage" src="max.png" alt="Maximilian grande">
      </div>
    </div>
    <div class="chat-panel">
      <div id="chat"></div>
      <footer>
        <input type="text" id="message" placeholder="Escribe tu mensaje..."
          onkeydown="if(event.key==='Enter'&&!this.disabled){sendMessage()}">
        <button onclick="sendMessage()" id="sendButton">Enviar</button>
        <button id="clearHistory" onclick="clearHistory()" title="Limpiar conversación">Limpiar</button>
      </footer>
    </div>
  </div>

  <div id="policyButton" title="Ver políticas de uso">Políticas de privacidad</div>
  <div id="policyBanner">
    Al continuar, aceptas nuestras
    <a href="https://maximilian23.com/politica.html" target="_blank">políticas de uso</a>.
    <button id="acceptPolicies">Aceptar</button>
  </div>

  <script>
    const API_URL = "https://max23.onrender.com/chat";
    const STORAGE_KEY = 'maximilian23_conversation';
    let conversationHistory = [];

    // --- HISTORIAL ---
    function loadHistory() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        conversationHistory = JSON.parse(saved);
        const chat = document.getElementById("chat");
        chat.innerHTML = "";
        conversationHistory.forEach(msg => {
          const div = document.createElement("div");
          div.className = msg.role === 'user' ? 'user' : 'bot';
          div.innerHTML = msg.role === 'user' ? msg.content : linkify(msg.content);
          chat.appendChild(div);
        });
        scrollBottom();
      }
    }

    function saveHistory() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(conversationHistory));
    }

    function clearHistory() {
      if (confirm('¿Limpiar toda la conversación?')) {
        conversationHistory = [];
        localStorage.removeItem(STORAGE_KEY);
        document.getElementById("chat").innerHTML = "";
        scrollBottom();
        showWelcomeMessage();
      }
    }

    // --- MENÚ MÓVIL ---
    function openLab() { window.open('https://maximilian23.com/lab23/', '_blank'); closeMobileMenu(); }
    function openRadio() { window.open('https://maximilian23.com/radio/', '_blank'); closeMobileMenu(); }

    const menuIcon = document.getElementById('menuIcon');
    const mobileMenu = document.getElementById('mobileMenu');
    const overlay = document.getElementById('overlay');
    const closeMenu = document.getElementById('closeMenu');

    function toggleMobileMenu() {
      mobileMenu.classList.toggle('open');
      overlay.classList.toggle('show');
      document.body.style.overflow = mobileMenu.classList.contains('open') ? 'hidden' : '';
    }
    function closeMobileMenu() {
      mobileMenu.classList.remove('open');
      overlay.classList.remove('show');
      document.body.style.overflow = '';
    }

    menuIcon?.addEventListener('click', toggleMobileMenu);
    overlay?.addEventListener('click', closeMobileMenu);
    closeMenu?.addEventListener('click', closeMobileMenu);

    // --- CHAT UTILS ---
    function scrollBottom() {
      const chat = document.getElementById("chat");
      chat.scrollTop = chat.scrollHeight;
    }

    function linkify(text) {
      if (!text || text.includes('<a ')) return text;
      return text.replace(/\b((?:https?:\/\/|www\.)[^\s<>"']+[^\s<>"'.,!?;:]*)/gi, match => {
        let url = match.trim().replace(/[.,!?;:]+$/, '');
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        const clean = url.replace(/[<>]/g, '');
        return `<a href="${clean}" target="_blank" rel="noopener noreferrer">${clean}</a>`;
      });
    }

    function typeWriterEffect(el, text, delay = 30, done = null) {
      let i = 0;
      el.innerHTML = "";
      const chat = document.getElementById("chat");
      function step() {
        if (i < text.length) {
          el.innerHTML = text.substring(0, ++i);
          if (i % 3 === 0) chat.scrollTop = chat.scrollHeight;
          setTimeout(step, delay);
        } else {
          chat.scrollTop = chat.scrollHeight;
          if (done) done();
        }
      }
      step();
    }

    // --- ENVÍO DE MENSAJE ---
    async function sendMessage() {
      const input = document.getElementById("message");
      const sendBtn = document.getElementById("sendButton");
      const chat = document.getElementById("chat");
      const msg = input.value.trim();
      if (!msg) return;

      input.disabled = sendBtn.disabled = true;

      // Añadir mensaje usuario
      conversationHistory.push({ role: 'user', content: msg });
      const userDiv = document.createElement("div");
      userDiv.className = "user";
      userDiv.textContent = msg;
      chat.appendChild(userDiv);

      // Indicador de escritura
      const botDiv = document.createElement("div");
      botDiv.className = "bot";
      botDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      chat.appendChild(botDiv);
      scrollBottom();
      input.value = "";

      try {
        const recent = conversationHistory.slice(-10).map(m => `${m.role}: ${m.content}`).join('\n');
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg, history: recent })
        });

        if (!res.ok) throw new Error("API error");

        const data = await res.json();
        const reply = data.reply || "No pude procesar tu mensaje.";

        conversationHistory.push({ role: 'assistant', content: reply });
        saveHistory();

        botDiv.innerHTML = "";
        typeWriterEffect(botDiv, linkify(reply), 30, () => {
          input.disabled = sendBtn.disabled = false;
          input.focus();
        });

      } catch (err) {
        const fallback = conversationHistory.length > 1
          ? `⚠️ Sin conexión. Recuerdo que hablabas de "${conversationHistory[conversationHistory.length-2].content.substring(0,40)}..."`
          : "⚠️ Sin conexión. ¡Empecemos de nuevo!";
        
        conversationHistory.push({ role: 'assistant', content: fallback });
        saveHistory();

        botDiv.innerHTML = "";
        typeWriterEffect(botDiv, fallback, 30, () => {
          input.disabled = sendBtn.disabled = false;
          input.focus();
        });
      }
      scrollBottom();
    }

    // --- MENSAJE DE BIENVENIDA ---
    function showWelcomeMessage() {
      const chat = document.getElementById("chat");
      const botDiv = document.createElement("div");
      botDiv.className = "bot";
      chat.appendChild(botDiv);
      const welcome = "¡Hola! Soy Maximilian 23, el asistente del CEIP Juan XXIII de Zafra. ¿En qué puedo ayudarte hoy? 😊";
      conversationHistory.push({ role: 'assistant', content: welcome });
      saveHistory();
      typeWriterEffect(botDiv, welcome);
      scrollBottom();
    }

    // --- INICIO ---
    window.addEventListener("DOMContentLoaded", () => {
      loadHistory();

      if (conversationHistory.length === 0) {
        showWelcomeMessage();
      }

      // Políticas
      if (!localStorage.getItem("policiesAccepted")) {
        document.getElementById("policyBanner").classList.add("show");
      }

      // Imagen interactiva
      const maxImage = document.getElementById("maxImage");
      maxImage.addEventListener("click", () => {
        maxImage.src = "https://raw.githubusercontent.com/ProLur/maximilian23/refs/heads/main/2.gif";
        maxImage.addEventListener("load", () => setTimeout(() => maxImage.src = "max.png", 3000), { once: true });
      });

      const mobileMaxImage = document.getElementById("mobileMaxImage");
      if (mobileMaxImage) {
        mobileMaxImage.addEventListener("click", () => {
          mobileMaxImage.src = "https://raw.githubusercontent.com/ProLur/maximilian23/refs/heads/main/2.gif";
          mobileMaxImage.addEventListener("load", () => setTimeout(() => mobileMaxImage.src = "https://maximilian23.com/max.png", 3000), { once: true });
        });
      }

      document.getElementById("acceptPolicies").addEventListener("click", () => {
        localStorage.setItem("policiesAccepted", "true");
        document.getElementById("policyBanner").classList.remove("show");
      });

      [document.getElementById("policyButton"), document.getElementById("policyIcon")].forEach(el => {
        el?.addEventListener("click", () => window.open("https://maximilian23.com/politica.html", "_blank"));
      });
    });
  </script>
</body>
</html>
