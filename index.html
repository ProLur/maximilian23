<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maximilian 23</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <meta name="description" content="Maximilian 23 es el asistente de inteligencia artificial del CEIP Juan XXIII de Zafra.">
  <meta name="theme-color" content="#00ffcc">
  <style>
    /* ... (mantén todo el CSS anterior que ya te funcionaba bien con botones arriba, imagen abajo, etc.) ... */

    /* Icono de políticas en header SOLO en móvil */
    #policyIcon {
      display: none;                   /* oculto por defecto (PC) */
      position: absolute;
      right: 16px;
      font-size: 24px;
      color: var(--accent);
      cursor: pointer;
      transition: transform 0.3s;
    }
    #policyIcon:hover { transform: rotate(30deg); }

    /* Mostrar SOLO en móvil */
    @media (max-width: 767px) {
      #policyIcon {
        display: block;
      }
    }

    /* Botón fijo de políticas abajo-izquierda SOLO en PC */
    #policyButton {
      position: fixed;
      bottom: 16px;
      left: 16px;
      background: rgba(0,255,204,0.12);
      border: 1px solid rgba(0,255,204,0.5);
      color: var(--accent);
      padding: 8px 18px;
      border-radius: 8px;
      font-family: "Courier New", monospace;
      font-size: 14px;
      transition: all 0.3s;
      backdrop-filter: blur(6px);
      z-index: 900;
      cursor: pointer;
      white-space: nowrap;
      min-width: 160px;
      text-align: center;
      display: none;  /* oculto por defecto */
    }

    @media (min-width: 768px) {
      #policyButton {
        display: block;  /* visible solo en PC */
      }
    }

    #policyButton:hover {
      background: rgba(0,255,204,0.25);
      box-shadow: 0 0 12px rgba(0,255,204,0.6);
    }

    /* ... resto del CSS igual ... */
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Maximilian">
    Maximilian 23
    <div id="policyIcon" title="Ver políticas de uso">🛡️</div>  <!-- escudo solo en móvil -->
  </header>

  <!-- ... resto del HTML igual: container con left-panel (botones arriba + imagen abajo), chat-panel, policyButton fijo, policyBanner ... -->

  <script>
    // ... script igual ...

    // Abrir políticas desde el icono del header (móvil)
    document.getElementById("policyIcon")?.addEventListener("click", () => {
      window.open("https://maximilian23.com/politica.html", "_blank");
    });

    // ... resto del script sin cambios ...
  </script>
</body>
</html>
