```html
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maximilian 23</title>

<link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">

<meta name="description" content="Maximilian 23 es el asistente de inteligencia artificial del CEIP Juan XXIII de Zafra.">

<meta name="theme-color" content="#00ffcc">

<style>

body{
font-family:Arial,sans-serif;
background:#0d1117;
color:#e6edf3;
margin:0;
height:100dvh;
display:flex;
flex-direction:column;
}

/* HEADER */

header{
background:rgba(22,27,34,0.95);
padding:8px 12px;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
font-size:22px;
font-weight:bold;
color:#00ffcc;
font-family:"Courier New",monospace;
position:relative;
}

header img{
height:40px;
}

/* MENU ICON */

#menuIcon{
display:none;
position:absolute;
left:12px;
font-size:28px;
color:#00ffcc;
cursor:pointer;
}

/* MENU MOVIL */

#mobileMenu{
position:fixed;
top:0;
left:-280px;
width:280px;
height:100vh;
background:#0d1117;
padding:70px 20px 20px;
transition:left .4s;
z-index:999;
}

#mobileMenu.open{
left:0;
border-right:2px solid #00ffcc;
}

.menu-item{
background:rgba(0,255,204,0.08);
color:#00ffcc;
font-family:"Courier New",monospace;
font-size:16px;
border:1px solid #00ffcc88;
border-radius:12px;
padding:12px;
margin-bottom:12px;
text-align:center;
cursor:pointer;
}

.menu-item:hover{
background:rgba(0,255,204,0.2);
}

/* OVERLAY */

#overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.7);
opacity:0;
visibility:hidden;
transition:all .4s;
z-index:998;
}

#overlay.show{
opacity:1;
visibility:visible;
}

/* LAYOUT */

.container{
flex:1;
display:flex;
overflow:hidden;
}

/* PANEL IZQUIERDO */

.left-panel{
display:none;
flex:1;
align-items:center;
justify-content:center;
background:#0d1117;
border-right:2px solid #00ffcc;
position:relative;
flex-direction:column;
}

.image-container{
margin-top:100px;
text-align:center;
}

.left-panel img{
max-width:220px;
border-radius:10px;
border:2px solid #00ffcc;
box-shadow:0 0 15px #00ffcc88;
cursor:pointer;
}

/* BOTONES */

#labButton,
#radioButton,
#plasticaButton,
#meteoButton{

position:absolute;
left:50%;
transform:translateX(-50%);

background:rgba(0,255,204,0.08);
color:#00ffcc;

font-family:"Courier New",monospace;
font-size:14px;

border:1px solid #00ffcc88;
border-radius:20px;

padding:6px 14px;

cursor:pointer;
}

#labButton{top:15px;}
#radioButton{top:65px;}
#plasticaButton{top:115px;}
#meteoButton{top:165px;}

/* CHAT */

.chat-panel{
flex:2;
display:flex;
flex-direction:column;
background:#0d1117;
}

#chat{
flex:1;
overflow-y:auto;
padding:15px;
}

.user,.bot{
padding:12px;
margin:10px 12px;
border-radius:10px;
max-width:80%;
font-family:"Courier New",monospace;
font-size:17px;
line-height:1.5;
}

.user{
background:#243b4a;
color:#00ffcc;
margin-left:auto;
border:1px solid #00ffcc;
}

.bot{
background:#1e2d3d;
color:#00ffcc;
border:1px solid #00ffcc;
}

/* INPUT */

footer{
display:flex;
padding:8px;
background:#161b22;
border-top:2px solid #00ffcc;
}

input{
flex:1;
padding:10px;
border:none;
border-radius:5px;
font-size:16px;
}

button{
background:#00ffcc;
border:none;
padding:10px 14px;
margin-left:8px;
border-radius:5px;
cursor:pointer;
font-weight:bold;
}

@media(max-width:600px){
#menuIcon{display:block;}
.left-panel{display:none !important;}
}

@media(min-width:768px){
.left-panel{display:flex;}
}

</style>

</head>

<body>

<header>
<div id="menuIcon">☰</div>
<img src="https://maximilian23.com/Cabeza.png">
Maximilian 23
</header>

<div id="mobileMenu">

<div class="menu-item" onclick="openLab()">Laboratorio Musical</div>
<div class="menu-item" onclick="openRadio()">Radio Maximilian 23</div>
<div class="menu-item" onclick="openArte()">Plástica</div>
<div class="menu-item" onclick="openMeteo()">Meteored 23</div>

</div>

<div id="overlay"></div>

<div class="container">

<div class="left-panel">

<div id="labButton" onclick="openLab()">Laboratorio Musical</div>
<div id="radioButton" onclick="openRadio()">Radio Maximilian 23</div>
<div id="plasticaButton" onclick="openArte()">Plástica</div>
<div id="meteoButton" onclick="openMeteo()">Meteored 23</div>

<div class="image-container">
<img src="https://maximilian23.com/max.png">
</div>

</div>

<div class="chat-panel">

<div id="chat"></div>

<footer>

<input type="text" id="message" placeholder="Escribe tu mensaje...">

<button onclick="sendMessage()">Enviar</button>

</footer>

</div>

</div>

<script>

function openLab(){
window.open('https://maximilian23.com/lab23/','_blank');
}

function openRadio(){
window.open('https://maximilian23.com/radio/','_blank');
}

function openArte(){
window.open('https://maximilian23.com/arte','_blank');
}

function openMeteo(){
window.open('http://maximilian23.com/meteored/','_blank');
}

const menuIcon=document.getElementById('menuIcon');
const mobileMenu=document.getElementById('mobileMenu');
const overlay=document.getElementById('overlay');

menuIcon.onclick=()=>{
mobileMenu.classList.toggle('open');
overlay.classList.toggle('show');
};

overlay.onclick=()=>{
mobileMenu.classList.remove('open');
overlay.classList.remove('show');
};

</script>

</body>
</html>
