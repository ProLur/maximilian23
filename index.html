<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maximilian 23</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <meta name="description" content="Maximilian 23 es el asistente de inteligencia artificial del CEIP Juan XXIII de Zafra.">
  <meta name="theme-color" content="#00ffcc">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }
    header {
      background: rgba(22,27,34,0.95);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
      color: #00ffcc;
      font-family: "Courier New", monospace;
      position: relative;
    }
    header img { height: 40px; width: auto; }

    /* ICONO HAMBURGUESA - SOLO MÓVIL */
    #menuIcon {
      display: none;
      position: absolute;
      left: 12px;
      font-size: 28px;
      color: #00ffcc;
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.3s ease;
    }
    #menuIcon:hover { transform: scale(1.1); }

    /* MENÚ LATERAL */
    #mobileMenu {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: rgba(13,17,23,0.98);
      border-right: 2px solid #00ffcc;
      padding: 70px 20px 20px;
      transition: left 0.4s ease;
      z-index: 999;
      backdrop-filter: blur(8px);
    }
    #mobileMenu.open {
      left: 0;
    }
    #mobileMenu .menu-item {
      display: block;
      width: 100%;
      background: rgba(0,255,204,0.08);
      color: #00ffcc;
      font-family: "Courier New", monospace;
      font-size: 16px;
      border: 1px solid #00ffcc88;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 0 6px #00ffcc;
      box-shadow: 0 0 10px #00ffcc55;
    }
    #mobileMenu .menu-item:hover {
      background: rgba(0,255,204,0.2);
      box-shadow: 0 0 15px #00ffcc;
      transform: translateY(-2px);
    }

    /* OSCURECER FONDO CUANDO MENÚ ABIERTO */
    #overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.7);
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
      z-index: 998;
    }
    #overlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* ÍCONO DE CONFIGURACIÓN (RUEDA DENTADA) - SOLO EN MÓVIL */
    #policyIcon {
      display: none;
      position: absolute;
      right: 12px;
      font-size: 24px;
      color: #00ffcc;
      cursor: pointer;
      transition: transform .3s ease;
    }
    #policyIcon:hover { transform: rotate(90deg); }
    #policyIcon:active { transform: rotate(90deg) scale(0.9); }

    @media (max-width: 600px) {
      #menuIcon, #policyIcon { display: block; }
      .left-panel { display: none !important; } /* Ocultar panel izquierdo en móvil */
    }

    /* ... resto de tu CSS original ... */
    /* (mantén todo lo demás igual, solo añade lo nuevo arriba) */
  </style>
</head>
<body>
  <header>
    <div id="menuIcon">☰</div>
    <img src="Cabeza.png" alt="Maximilian">
    Maximilian 23
    <div id="policyIcon" title="Políticas de uso">⚙️</div>
  </header>

  <!-- MENÚ LATERAL MÓVIL -->
  <div id="mobileMenu">
    <div class="menu-item" onclick="window.open('https://maximilian23.com/lab23/', '_blank')">
      Laboratorio Musical
    </div>
    <div class="menu-item" onclick="window.open('https://maximilian23.com/radio/', '_blank')">
      Radio Maximilian 23
    </div>
  </div>
  <div id="overlay"></div>

  <div class="container">
    <div class="left-panel">
      <!-- BOTONES FLOTANTES (solo en escritorio) -->
      <div id="labButton" onclick="window.open('https://maximilian23.com/lab23/', '_blank')" title="Ir al Laboratorio Musical">
        Laboratorio Musical
      </div>
      <div id="radioButton" onclick="window.open('https://maximilian23.com/radio/', '_blank')" title="Escuchar Radio Maximilian 23">
        Radio Maximilian 23
      </div>
      <div class="image-container">
        <img id="maxImage" src="max.png" alt="Maximilian grande">
      </div>
    </div>
    <div class="chat-panel">
      <div id="chat"></div>
      <footer>
        <input type="text" id="message" placeholder="Escribe tu mensaje..."
          onkeydown="if(event.key==='Enter'&&!this.disabled){sendMessage()}">
        <button onclick="sendMessage()" id="sendButton">Enviar</button>
      </footer>
    </div>
  </div>

  <!-- Botón fijo solo en escritorio -->
  <div id="policyButton" title="Ver políticas de uso">Políticas de privacidad</div>
  <div id="policyBanner">
    Al continuar, aceptas nuestras
    <a href="https://maximilian23.com/politica.html" target="_blank">políticas de uso</a>.
    <button id="acceptPolicies">Aceptar</button>
  </div>

  <script>
    const API_URL = "https://max23.onrender.com/chat";

    // === MENÚ HAMBURGUESA ===
    const menuIcon = document.getElementById('menuIcon');
    const mobileMenu = document.getElementById('mobileMenu');
    const overlay = document.getElementById('overlay');

    menuIcon.addEventListener('click', () => {
      mobileMenu.classList.toggle('open');
      overlay.classList.toggle('show');
    });

    overlay.addEventListener('click', () => {
      mobileMenu.classList.remove('open');
      overlay.classList.remove('show');
    });

    // Cerrar menú al hacer clic en un ítem
    document.querySelectorAll('#mobileMenu .menu-item').forEach(item => {
      item.addEventListener('click', () => {
        mobileMenu.classList.remove('open');
        overlay.classList.remove('show');
      });
    });

    // ... resto de tu JavaScript original (sin cambios) ...
    function scrollBottom() {
      const chat = document.getElementById("chat");
      chat.scrollTop = chat.scrollHeight;
    }
    function linkify(text) {
      if (!text) return "";
      if (text.includes("<a ")) return text;
      const urlRegex = /\b((?:https?:\/\/|www\.)[^\s<>"']+)/gi;
      return text.replace(urlRegex, (match) => {
        let clean = match.trim().replace(/[.,!?;:]+$/, "");
        if (!/^https?:\/\//i.test(clean)) clean = "https://" + clean;
        return `<a href="${clean}" target="_blank" rel="noopener noreferrer">${clean}</a>`;
      });
    }
    function typeWriterEffect(el, text, delay = 30, done = null) {
      let i = 0;
      el.innerHTML = "";
      const chat = document.getElementById("chat");
      function step() {
        if (i < text.length) {
          el.innerHTML = text.substring(0, ++i);
          if (i % 3 === 0) chat.scrollTop = chat.scrollHeight;
          setTimeout(step, delay);
        } else {
          chat.scrollTop = chat.scrollHeight;
          if (done) done();
        }
      }
      step();
    }
    async function sendMessage() {
      const i = document.getElementById("message");
      const b = document.getElementById("sendButton");
      const chat = document.getElementById("chat");
      const msg = i.value.trim();
      if (!msg) return;
      i.disabled = b.disabled = true;
      const user = document.createElement("div");
      user.className = "user";
      user.textContent = msg;
      chat.appendChild(user);
      const bot = document.createElement("div");
      bot.className = "bot";
      bot.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      chat.appendChild(bot);
      scrollBottom();
      i.value = "";
      try {
        const r = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: msg })
        });
        const data = await r.json();
        const reply = linkify(data.reply);
        bot.innerHTML = "";
        typeWriterEffect(bot, reply, 30, () => {
          i.disabled = b.disabled = false;
          i.focus();
        });
      } catch {
        bot.textContent = "Error de conexión.";
        i.disabled = b.disabled = false;
        scrollBottom();
      }
    }
    window.addEventListener("DOMContentLoaded", () => {
      const chat = document.getElementById("chat");
      const b = document.createElement("div");
      b.className = "bot";
      chat.appendChild(b);
      typeWriterEffect(b, "Hola, soy Maximilian 23. Estoy aquí para ayudarte con la información del colegio. ¿Qué quieres saber?");
      scrollBottom();
      const accepted = localStorage.getItem("policiesAccepted");
      if (!accepted) {
        document.getElementById("policyBanner").classList.add("show");
      }
    });
    const opens = [document.getElementById("policyButton"), document.getElementById("policyIcon")];
    opens.forEach(o => {
      if (o) o.addEventListener("click", () => {
        window.open("https://maximilian23.com/politica.html", "_blank");
      });
    });
    const maxImage = document.getElementById("maxImage");
    maxImage.addEventListener("click", () => {
      maxImage.src = "https://raw.githubusercontent.com/ProLur/maximilian23/refs/heads/main/2.gif";
      maxImage.addEventListener("load", () => setTimeout(() => maxImage.src = "max.png", 3000), { once: true });
    });
    document.getElementById("acceptPolicies").addEventListener("click", () => {
      localStorage.setItem("policiesAccepted", "true");
      document.getElementById("policyBanner").classList.remove("show");
    });
  </script>
</body>
</html>
