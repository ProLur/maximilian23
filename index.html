<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maximilian 23</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <meta name="description" content="Maximilian 23 es el asistente de inteligencia artificial del CEIP Juan XXIII de Zafra.">
  <meta name="theme-color" content="#00ffcc">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
      padding: 0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      background: rgba(22,27,34,0.95);
      padding: 8px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 22px;
      font-weight: bold;
      color: #00ffcc;
      font-family: "Courier New", monospace;
      position: relative;
      min-height: 56px;
      z-index: 1001;
    }
    header img { height: 40px; width: auto; }

    #menuIcon {
      display: none;
      position: absolute;
      left: 12px;
      font-size: 28px;
      color: #00ffcc;
      cursor: pointer;
      z-index: 1000;
      transition: transform 0.3s ease;
      user-select: none;
      line-height: 1;
    }
    #policyIcon {
      display: none;
      position: absolute;
      right: 12px;
      font-size: 24px;
      color: #00ffcc;
      cursor: pointer;
      transition: transform .3s ease;
      line-height: 1;
    }
    #menuIcon:hover { transform: scale(1.1); }
    #policyIcon:hover { transform: rotate(90deg); }

    @media (max-width: 600px) {
      #menuIcon, #policyIcon { display: block; }
      .left-panel { display: none !important; }
    }

    #mobileMenu {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100vh;
      background: rgba(13,17,23,0.98);
      padding: 70px 20px 20px;
      transition: left 0.4s ease;
      z-index: 999;
      border-radius: 0 16px 16px 0;
      overflow-y: auto;
      backdrop-filter: blur(10px);
    }
    #mobileMenu.open {
      left: 0;
      border-right: 2px solid #00ffcc;
    }

    #mobileMenu .menu-item {
      display: block;
      width: calc(100% - 16px);
      margin: 8px;
      background: rgba(0,255,204,0.08);
      color: #00ffcc;
      font-family: "Courier New", monospace;
      font-size: 16px;
      border: 1px solid #00ffcc88;
      border-radius: 12px;
      padding: 12px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      text-shadow: 0 0 6px #00ffcc;
      backdrop-filter: blur(4px);
      box-shadow: 0 0 10px #00ffcc55;
    }
    #mobileMenu .menu-item:hover {
      background: rgba(0,255,204,0.2);
      transform: translateY(-2px);
      box-shadow: 0 0 15px #00ffccaa;
    }

    #mobileMenu .menu-image {
      text-align: center;
      margin: 20px 0;
    }
    #mobileMenu .menu-image img {
      width: 140px;
      height: auto;
      border-radius: 10px;
      border: 2px solid #00ffcc;
      box-shadow: 0 0 15px #00ffcc88;
      animation: floatMobile 3s ease-in-out infinite;
    }

    @keyframes floatMobile {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    #overlay {
      position: fixed;
      top:0; left:0;
      width:100%; height:100%;
      background: rgba(0,0,0,0.7);
      opacity:0; visibility:hidden;
      transition: all 0.4s ease;
      z-index: 998;
    }
    #overlay.show { opacity:1; visibility:visible; }

    .container { 
      flex:1; 
      display:flex; 
      overflow:hidden; 
    }

    .left-panel {
      display:none;
      flex:1;
      background: rgba(13,17,23,0.9);
      border-right: 2px solid #00ffcc;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding: 20px;
    }

    @media (min-width:768px) { 
      .left-panel { display:flex; } 
    }

    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    #chat {
      flex:1;
      overflow-y:auto;
      padding:15px;
      scroll-behavior:smooth;
    }

    .user, .bot {
      padding:12px 16px;
      margin:10px 12px;
      border-radius:12px;
      max-width:80%;
      font-family:"Courier New", monospace;
      white-space:pre-wrap;
      font-size:17px;
      line-height:1.5;
      word-break:break-word;
      box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }

    .user {
      background:#243b4a;
      color:#00ffcc;
      margin-left:auto;
      border:1px solid #00ffcc;
    }
    .bot {
      background:#1e2d3d;
      color:#00ffcc;
      border:1px solid #00ffcc;
    }

    .typing {
      display: flex;
      gap: 6px;
      padding: 8px 0;
    }
    .typing span {
      width: 8px;
      height: 8px;
      background: #00ffcc;
      border-radius: 50%;
      display: inline-block;
      animation: typing 1.4s infinite;
    }
    .typing span:nth-child(1) { animation-delay: 0s; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typing {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    footer {
      display:flex;
      padding:8px;
      background:rgba(22,27,34,0.95);
      border-top:2px solid #00ffcc;
      gap: 8px;
    }
    input {
      flex:1;
      padding:12px;
      border:none;
      border-radius:8px;
      font-size:16px;
      background:#fff;
      color:#000;
      outline: none;
    }
    button {
      background:#00ffcc;
      padding:10px 16px;
      border:none;
      border-radius:8px;
      font-weight:bold;
      font-size:14px;
      cursor:pointer;
      transition: 0.3s;
    }
    button:hover {
      background: #00ccaa;
      transform: scale(1.05);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <div id="menuIcon">☰</div>
    <img src="https://maximilian23.com/Cabeza.png" alt="Maximilian">
    Maximilian 23
    <div id="policyIcon">🛡️</div>
  </header>

  <!-- Menú Móvil -->
  <div id="mobileMenu">
    <div id="closeMenu" style="position: absolute; top: 12px; right: 12px; font-size: 28px; color: #00ffcc; cursor: pointer; z-index: 10;">
      ✕
    </div>

    <div class="menu-item" onclick="openLab()">Laboratorio Musical</div>
    <div class="menu-item" onclick="openRadio()">Radio Maximilian 23</div>

    <div class="menu-image">
      <img id="mobileMaxImage" src="https://maximilian23.com/max.png" alt="Maximilian">
    </div>
  </div>

  <div id="overlay"></div>

  <div class="container">
    <div class="left-panel">
      <img id="maxImage" src="https://maximilian23.com/max.png" style="max-width:200px; border-radius: 12px; box-shadow: 0 0 20px #00ffcc88;">
    </div>

    <div class="chat-panel">
      <div id="chat"></div>

      <footer>
        <input type="text" id="message" placeholder="Escribe tu mensaje..." 
               onkeydown="if(event.key==='Enter' && !this.disabled){sendMessage()}">
        <button onclick="sendMessage()" id="sendButton">Enviar</button>
      </footer>
    </div>
  </div>

  <script>
    const API_URL = "https://max23.onrender.com/chat";

    // --------- MENÚ MÓVIL ---------
    function openLab() { window.open('https://maximilian23.com/lab23/', '_blank'); }
    function openRadio() { window.open('https://maximilian23.com/radio/', '_blank'); }

    const menuIcon = document.getElementById('menuIcon');
    const mobileMenu = document.getElementById('mobileMenu');
    const overlay = document.getElementById('overlay');
    const closeMenu = document.getElementById('closeMenu');

    menuIcon.addEventListener('click', () => {
      mobileMenu.classList.toggle('open');
      overlay.classList.toggle('show');
    });

    closeMenu.addEventListener('click', () => {
      mobileMenu.classList.remove('open');
      overlay.classList.remove('show');
    });

    overlay.addEventListener('click', () => {
      mobileMenu.classList.remove('open');
      overlay.classList.remove('show');
    });

    // --------- CHAT FUNCTIONS ---------
    function scrollBottom() {
      const chat = document.getElementById("chat");
      chat.scrollTop = chat.scrollHeight;
    }

    function linkify(text) {
      if (!text || text.includes('<a ')) return text;
      return text.replace(/\b((?:https?:\/\/|www\.)[^\s<>"']+)/gi, match => {
        let url = match.trim().replace(/[.,!?;:]+$/, '');
        if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
        return `<a href="${url}" target="_blank" rel="noopener noreferrer" style="color:#00ffcc; text-decoration:underline;">${url}</a>`;
      });
    }

    function typeWriterEffect(el, text, delay = 30, callback = null) {
      let i = 0;
      el.innerHTML = '';
      const chat = document.getElementById("chat");

      function type() {
        if (i < text.length) {
          el.innerHTML = text.substring(0, ++i);
          if (i % 3 === 0) chat.scrollTop = chat.scrollHeight;
          setTimeout(type, delay);
        } else if (callback) {
          callback();
        }
      }
      type();
    }

    async function sendMessage() {
      const input = document.getElementById("message");
      const sendButton = document.getElementById("sendButton");
      const chat = document.getElementById("chat");

      const message = input.value.trim();
      if (!message) return;

      input.disabled = true;
      sendButton.disabled = true;

      // Mensaje del usuario
      const userDiv = document.createElement("div");
      userDiv.className = "user";
      userDiv.textContent = message;
      chat.appendChild(userDiv);

      // Indicador de escritura
      const botDiv = document.createElement("div");
      botDiv.className = "bot";
      botDiv.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
      chat.appendChild(botDiv);
      scrollBottom();

      input.value = "";

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ message })
        });

        const data = await response.json();
        const reply = linkify(data.reply || "Lo siento, no pude procesar tu mensaje.");

        botDiv.innerHTML = "";
        typeWriterEffect(botDiv, reply, 30, () => {
          input.disabled = false;
          sendButton.disabled = false;
          input.focus();
        });

      } catch (err) {
        botDiv.textContent = "⚠️ Error de conexión. Inténtalo más tarde.";
        input.disabled = false;
        sendButton.disabled = false;
      }

      scrollBottom();
    }

    // --------- INICIO ---------
    window.addEventListener("DOMContentLoaded", () => {
      const chat = document.getElementById("chat");
      const botDiv = document.createElement("div");
      botDiv.className = "bot";
      chat.appendChild(botDiv);

      typeWriterEffect(botDiv, "¡Hola! Soy Maximilian 23, el asistente del CEIP Juan XXIII de Zafra. ¿En qué puedo ayudarte hoy?");
      scrollBottom();
    });
  </script>
</body>
</html>
