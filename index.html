<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maximilian 23</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <meta name="description" content="Maximilian 23 es el asistente de inteligencia artificial del CEIP Juan XXIII de Zafra.">
  <meta name="theme-color" content="#00ffcc">
  <style>
    /* ... mantén todo el CSS anterior que ya tenías (header, chat, políticas, etc.) ... */

    .left-panel {
      display: none;
      width: clamp(280px, 30vw, 360px);
      background: var(--bg-panel);
      border-right: 2px solid var(--accent);
      position: relative;
      overflow-y: auto;
      padding: 20px 0 100px 0;  /* espacio abajo para la imagen */
    }

    /* Botones muy juntos arriba */
    .buttons-top {
      position: sticky;
      top: 20px;
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;           /* separación entre botones: antes 16px, ahora solo 10px */
      padding: 0 10px 15px;  /* menos padding abajo */
    }

    .floating-btn {
      width: 88%;           /* un poco más anchos para que quepan bien */
      max-width: 220px;     /* límite para no desbordar */
      background: rgba(0,255,204,0.1);
      color: var(--accent);
      font-family: "Courier New", monospace;
      font-size: 13.5px;    /* fuente un poco más pequeña para compactar */
      border: 1px solid rgba(0,255,204,0.6);
      border-radius: 20px;
      padding: 9px 16px;    /* padding interno reducido */
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 10px rgba(0,255,204,0.5);
      backdrop-filter: blur(4px);
      text-align: center;
      animation: float 4s ease-in-out infinite;
    }

    .floating-btn:hover {
      background: rgba(0,255,204,0.25);
      box-shadow: 0 0 18px var(--accent);
      transform: scale(1.04);
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-5px); }  /* menos movimiento para que no invada tanto */
    }

    /* Imagen MÁS PEQUEÑA y DEBAJO de los botones */
    .image-container {
      margin: 30px auto 40px;   /* menos margen arriba (antes 40px) */
      text-align: center;
      width: 70%;               /* más estrecha */
      max-width: 180px;         /* tamaño reducido (antes 240px) */
    }

    .left-panel img {
      width: 100%;
      border-radius: 12px;
      border: 2px solid var(--accent);
      box-shadow: 0 0 16px rgba(0,255,204,0.35);
      transition: transform 0.25s;
      cursor: pointer;
    }

    .left-panel img:hover { transform: scale(1.04); }

    /* ... resto del CSS igual (chat, footer, policyButton, etc.) ... */
  </style>
</head>
<body>
  <!-- ... header igual ... -->

  <div class="container">
    <div class="left-panel">
      <div class="buttons-top">
        <div class="floating-btn" onclick="window.open('https://maximilian23.com/lab23/', '_blank')">Laboratorio Musical</div>
        <div class="floating-btn" onclick="window.open('https://maximilian23.com/radio/', '_blank')">Radio Maximilian 23</div>
        <div class="floating-btn" onclick="window.open('https://maximilian23.com/arte', '_blank')">Plástica</div>
        <div class="floating-btn" onclick="window.open('http://maximilian23.com/meteored/', '_blank')">Meteored</div>
      </div>

      <div class="image-container">
        <img id="maxImage" src="https://maximilian23.com/max.png" alt="Maximilian grande">
      </div>
    </div>

    <div class="chat-panel">
      <div id="chat"></div>
      <footer>
        <input type="text" id="message" placeholder="Escribe tu mensaje..." 
               onkeydown="if(event.key==='Enter'&&!this.disabled){sendMessage(); event.preventDefault()}">
        <button onclick="sendMessage()" id="sendButton">Enviar</button>
      </footer>
    </div>
  </div>

  <!-- ... policyButton y policyBanner igual ... -->

  <script>
    // ... el script completo igual al anterior (sin cambios) ...
  </script>
</body>
</html>
