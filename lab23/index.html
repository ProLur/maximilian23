<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio Musical de Maximilian 23</title>
  <script src="https://unpkg.com/vexflow@4.2.3/build/cjs/vexflow.js"></script>
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      background: linear-gradient(180deg, #aee1f9 0%, #c7b5ff 100%);
      font-family: "Comic Sans MS", "Comic Neue", cursive;
      color: #222;
      overflow: hidden;
    }
    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 15px;
    }
    header {
      background: linear-gradient(90deg, #4ae2f2, #6f9cff);
      text-align: center;
      padding: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      border-radius: 15px;
      margin-bottom: 15px;
    }
    header img {
      height: 70px;
      vertical-align: middle;
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.8));
    }
    header h1 {
      display: inline-block;
      margin: 0 0 5px 10px;
      font-size: 2.2em;
      color: #fff;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
      vertical-align: middle;
    }
    header p {
      margin: 0;
      color: #e9f8ff;
      font-size: 1em;
    }
    #titulo-partitura {
      text-align: center;
      margin: 10px 0;
      font-size: 1.8em;
      font-weight: bold;
      color: #333;
    }
    #titulo-partitura input {
      font: inherit;
      border: 2px solid #4ae2f2;
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
      width: 80%;
      max-width: 600px;
    }
    #barra-opciones {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin: 15px 0;
      flex-wrap: wrap;
    }
    #barra-opciones label {
      font-weight: bold;
      color: #333;
    }
    select {
      border-radius: 10px;
      border: 2px solid #4ae2f2;
      padding: 8px 12px;
      font-size: 1em;
      background: #fff;
      color: #333;
      transition: 0.3s;
    }
    select:hover {
      background: #eafcff;
      transform: scale(1.05);
    }
    #pentagrama-container {
      flex-grow: 1;
      background: #fff;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      border: 3px solid #4ae2f2;
      overflow: hidden;
      position: relative;
      margin-bottom: 15px;
    }
    #pentagrama {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
    }
    #pentagrama svg {
      pointer-events: none;
    }
    #figuras {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 15px 0;
      flex-wrap: wrap;
    }
    .figura {
      font-size: 2.4em;
      width: 60px;
      height: 60px;
      line-height: 60px;
      text-align: center;
      border: 3px solid #4ae2f2;
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .figura:hover, .figura.activa {
      background: #4ae2f2;
      color: #fff;
      transform: scale(1.15);
      box-shadow: 0 0 12px #4ae2f2;
    }
    #controles {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin: 15px 0;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 18px;
      font-size: 1em;
      background: linear-gradient(90deg, #4ae2f2, #6f9cff);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }
    button:disabled {
      background: #b8ddee;
      cursor: not-allowed;
    }
    button.activa {
      background: #ff80b5 !important;
      box-shadow: 0 0 12px #ffaad4;
    }
    .nota {
      position: absolute;
      cursor: move;
      z-index: 100;
      pointer-events: auto;
      background: rgba(255,255,255,0.1);
      border: 2px solid #4ae2f2;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .nota.delete-mode {
      background: rgba(255,0,0,0.15);
      border-color: #ff6666;
    }
    .nota .plus, .nota .minus {
      opacity: 0;
      transition: opacity 0.2s;
      width: 24px; height: 24px;
      border-radius: 50%;
      text-align: center;
      line-height: 24px;
      font-size: 1em;
      background: #4ae2f2;
      color: #fff;
      border: 1px solid #fff;
      position: absolute;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,0,0,0.2);
    }
    .nota.show-controls .plus, .nota.show-controls .minus { opacity: 1; }
    .nota .plus { top: -30px; left: 50%; transform: translateX(-50%); }
    .nota .minus { bottom: -30px; left: 50%; transform: translateX(-50%); }
    .note-label {
      position: absolute;
      background: rgba(255,255,255,0.9);
      border: 1px solid #4ae2f2;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.9em;
      color: #333;
      text-align: center;
      z-index: 150;
      pointer-events: none;
    }
    @media (max-width: 600px) {
      header img { height: 50px; }
      header h1 { font-size: 1.6em; }
      #titulo-partitura input { font-size: 1.2em; }
      .figura { width: 50px; height: 50px; font-size: 2em; }
      button { padding: 8px 14px; font-size: 0.9em; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="https://mmfrutos.com/max23/Cabeza.png" alt="Maximilian 23">
      <h1>Laboratorio Musical de Maximilian 23</h1>
      <p>Compón, juega y aprende con el robot más melódico del cole!</p>
    </header>

    <div id="titulo-partitura">
      <input type="text" id="titulo-editable" value="Mi Partitura" placeholder="Escribe el título...">
    </div>

    <div id="barra-opciones">
      <label for="clave">Clave:</label>
      <select id="clave">
        <option value="treble" selected>Sol</option>
        <option value="bass">Fa</option>
      </select>

      <label for="compas">Compás:</label>
      <select id="compas">
        <option value="" selected>---</option>
        <option value="2/4">2/4</option>
        <option value="3/4">3/4</option>
        <option value="4/4">4/4</option>
      </select>

      <label for="velocidad">Velocidad:</label>
      <select id="velocidad">
        <option value="" selected>---</option>
        <option value="60">Lento (60 BPM)</option>
        <option value="90">Moderado (90 BPM)</option>
        <option value="120">Allegro (120 BPM)</option>
        <option value="150">Presto (150 BPM)</option>
      </select>
    </div>

    <div id="pentagrama-container">
      <div id="pentagrama"></div>
    </div>

    <div id="figuras">
      <div class="figura" data-tipo="nota" data-duracion="w" style="color:#ff80b5;">w</div>
      <div class="figura" data-tipo="nota" data-duracion="h" style="color:#ffd966;">h</div>
      <div class="figura" data-tipo="nota" data-duracion="q" style="color:#7bdeff;">q</div>
      <div class="figura" data-tipo="nota" data-duracion="8" style="color:#9cffb0;">8</div>
      <div class="figura" data-tipo="silencio" data-duracion="w" style="color:#ff80b5;">w</div>
      <div class="figura" data-tipo="silencio" data-duracion="h" style="color:#ffd966;">h</div>
      <div class="figura" data-tipo="silencio" data-duracion="q" style="color:#7bdeff;">q</div>
      <div class="figura" data-tipo="silencio" data-duracion="8" style="color:#9cffb0;">8</div>
    </div>

    <div id="controles">
      <button id="guardar">Guardar</button>
      <button id="abrir">Abrir</button>
      <input type="file" id="file-input" accept=".json" style="display:none;">
      <button id="cerrar-compas" disabled>Cerrar Compás</button>
      <button id="borrar-ultimo">Borrar Último</button>
      <button id="limpiar">Limpiar</button>
      <button id="papelera">Papelera</button>
      <button id="notas">Notas</button>
      <button id="play-stop" disabled>Play</button>
      <button id="metronomo">Metrónomo</button>
    </div>
  </main>

  <script>
    const VF = Vex.Flow;
    const div = document.getElementById("pentagrama");
    const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
    const container = document.getElementById("pentagrama-container");
    let width = 800;
    const minStaveWidth = 250;
    const lineHeight = 150;
    renderer.resize(width, 600);
    const context = renderer.getContext();

    let clave = "treble";
    let compas = "";
    let compases = [];
    let figuraActiva = null;
    let deleteMode = false;
    let showNoteLabels = false;
    let isPlaying = false;
    let metronomeOn = false;
    let metronomeLoop = null;
    let currentLine = 0;
    let lines = [[]];

    const noteMap = {
      treble: ["g/3", "a/3", "b/3", "c/4", "d/4", "e/4", "f/4", "g/4", "a/4", "b/4", "c/5", "d/5", "e/5", "f/5", "g/5", "a/5", "b/5"],
      bass: ["b/1", "c/2", "d/2", "e/2", "f/2", "g/2", "a/2", "b/2", "c/3", "d/3", "e/3", "f/3", "g/3", "a/3", "b/3", "c/4", "d/4"]
    };
    const noteNameMap = { c: "Do", d: "Re", e: "Mi", f: "Fa", g: "Sol", a: "La", b: "Si" };
    const duracionBeats = { w: 4, h: 2, q: 1, '8': 0.5 };
    const duracionTiempo = { w: "1n", h: "2n", q: "4n", '8': "8n" };

    function init() {
      window.addEventListener('resize', adjustLayout);
      adjustLayout();
    }

    function adjustLayout() {
      const height = container.clientHeight;
      renderer.resize(div.clientWidth, height);
      redibujarPentagrama();
    }

    document.getElementById("clave").addEventListener("change", e => {
      clave = e.target.value;
      resetPartitura();
    });

    document.getElementById("compas").addEventListener("change", e => {
      compas = e.target.value;
      resetPartitura();
    });

    function resetPartitura() {
      lines = [[]];
      currentLine = 0;
      compases = lines[currentLine];
      resetControles();
      redibujarPentagrama();
    }

    function resetControles() {
      document.getElementById("cerrar-compas").disabled = true;
      document.getElementById("papelera").classList.remove("activa");
      document.getElementById("notas").classList.remove("activa");
      document.getElementById("play-stop").textContent = "Play";
      document.getElementById("play-stop").disabled = !document.getElementById("velocidad").value;
      document.getElementById("metronomo").classList.remove("activa");
      deleteMode = false;
      showNoteLabels = false;
      isPlaying = false;
      metronomeOn = false;
      if (metronomeLoop) metronomeLoop.stop();
      Tone.Transport.cancel();
      Tone.Transport.stop();
    }

    function redibujarPentagrama() {
      context.clear();
      document.querySelectorAll(".note-label").forEach(l => l.remove());
      if (!compas) return;

      let y = 80;
      lines.forEach((line, lineIndex) => {
        let x = 40;
        line.forEach((compasData, i) => {
          const voice = new VF.Voice({ num_beats: parseInt(compas.split("/")[0]), beat_value: 4 });
          voice.setStrict(false);
          if (compasData.notas.length > 0) voice.addTickables(compasData.notas.map(n => n.vf));

          const formatter = new VF.Formatter();
          if (compasData.notas.length > 0) formatter.joinVoices([voice]);

          const extraWidth = compasData.notas.filter(n => n.duracion === '8').length * 30 + (compasData.notas.length - compasData.notas.filter(n => n.duracion === '8').length) * 15;
          const staveWidth = Math.max(minStaveWidth, compasData.notas.length > 0 ? formatter.preCalculateMinTotalWidth([voice]) + 80 + extraWidth : minStaveWidth);
          compasData.staveWidth = staveWidth;

          const stave = new VF.Stave(x, y, staveWidth, { spacing_between_lines_px: 18 });
          if (lineIndex === 0 && i === 0) stave.addClef(clave).addTimeSignature(compas);
          if (compasData.closed) stave.addModifier(new VF.Barline(VF.Barline.type.SINGLE));
          stave.setContext(context).draw();
          compasData.stave = stave;

          if (compasData.notas.length > 0) {
            try {
              formatter.format([voice], staveWidth - 80);
              voice.draw(context, stave);
            } catch (e) { console.error(e); }
          }
          x += staveWidth;
        });
        y += lineHeight;
      });

      width = Math.max(div.clientWidth, lines.reduce((max, line) => Math.max(max, line.reduce((s, c) => s + c.staveWidth, 0) + 80), 0));
      renderer.resize(width, y + 50);
      updateDraggableNotes();

      const currentCompas = lines[currentLine][lines[currentLine].length - 1];
      document.getElementById("cerrar-compas").disabled = !currentCompas || currentCompas.closed || currentCompas.beats !== parseInt(compas.split("/")[0]);

      // Centrar vista en compás actual
      const lastStave = currentCompas?.stave;
      if (lastStave) {
        const bbox = lastStave.getBoundingBox();
        setTimeout(() => {
          div.scrollTop = bbox.y - div.clientHeight / 3;
        }, 50);
      }
    }

    // Figuras
    document.querySelectorAll(".figura").forEach(f => {
      f.addEventListener("click", () => {
        document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
        document.getElementById("papelera").classList.remove("activa");
        document.getElementById("notas").classList.remove("activa");
        deleteMode = false;
        showNoteLabels = false;
        f.classList.add("activa");
        figuraActiva = { tipo: f.dataset.tipo, duracion: f.dataset.duracion };
      });
    });

    document.getElementById("papelera").addEventListener("click", () => {
      toggleMode("papelera", () => { deleteMode = !deleteMode; });
    });

    document.getElementById("notas").addEventListener("click", () => {
      toggleMode("notas", () => { showNoteLabels = !showNoteLabels; });
    });

    document.getElementById("metronomo").addEventListener("click", () => {
      toggleMode("metronomo", () => { metronomeOn = !metronomeOn; });
    });

    function toggleMode(btnId, toggleFn) {
      document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
      document.getElementById("papelera").classList.remove("activa");
      document.getElementById("notas").classList.remove("activa");
      document.getElementById("metronomo").classList.remove("activa");
      figuraActiva = null;
      deleteMode = false;
      showNoteLabels = false;
      toggleFn();
      document.getElementById(btnId).classList.toggle("activa", eval(btnId === "papelera" ? "deleteMode" : btnId === "notas" ? "showNoteLabels" : "metronomeOn"));
      updateDraggableNotes();
    }

    // Play/Stop
    document.getElementById("play-stop").addEventListener("click", async () => {
      await Tone.start();
      if (isPlaying) { stopPlayback(); return; }

      const bpm = document.getElementById("velocidad").value;
      if (!bpm || !compas) { alert("Faltan configuraciones."); return; }

      Tone.Transport.bpm.value = parseInt(bpm);
      const synth = new Tone.Synth().toDestination();
      let time = 0, events = [], globalIndex = 0;

      lines.forEach(line => line.forEach(c => c.notas.forEach(n => {
        if (n.tipo === "nota") events.push({ time, note: n.noteName, duration: duracionTiempo[n.duracion], globalIndex });
        time += Tone.Time(duracionTiempo[n.duracion]).toSeconds();
        globalIndex++;
      })));

      if (events.length === 0 && !metronomeOn) { alert("Sin notas."); return; }

      Tone.Transport.cancel();
      let metronomeOffset = 0;
      if (metronomeOn) {
        const beat = Tone.Time("4n").toSeconds();
        const beats = parseInt(compas.split("/")[0]);
        for (let i = 0; i < beats; i++) {
          Tone.Transport.schedule(t => new Tone.MembraneSynth().toDestination().triggerAttackRelease("C2", "8n", t), i * beat);
        }
        metronomeOffset = beats * beat;
        metronomeLoop = new Tone.Loop(t => new Tone.MembraneSynth().toDestination().triggerAttackRelease("C2", "8n", t), "4n").start(metronomeOffset);
      }

      const noteGs = Array.from(context.svg.querySelectorAll('g.vf-stavenote'));
      events.forEach(e => {
        const start = e.time + metronomeOffset;
        const end = start + Tone.Time(e.duration).toSeconds();
        Tone.Transport.schedule(t => synth.triggerAttackRelease(e.note.split("/")[0].toUpperCase() + e.note.split("/")[1], e.duration, t), start);

        Tone.Transport.schedule(t => {
          const g = noteGs[e.globalIndex];
          if (g) {
            g.querySelectorAll('path, line, circle, ellipse, rect').forEach(el => {
              el.setAttribute('stroke', 'red');
              if (el.getAttribute('fill') !== 'none') el.setAttribute('fill', 'red');
            });
            const bbox = g.getBBox();
            div.scrollTop = bbox.y - div.clientHeight / 3;
          }
        }, start);

        Tone.Transport.schedule(t => {
          const g = noteGs[e.globalIndex];
          if (g) g.querySelectorAll('path, line, circle, ellipse, rect').forEach(el => {
            el.setAttribute('stroke', 'black');
            if (el.getAttribute('fill') !== 'none') el.setAttribute('fill', 'black');
          });
        }, end);

        if (showNoteLabels && noteGs[e.globalIndex]) {
          const bbox = noteGs[e.globalIndex].getBBox();
          Tone.Transport.schedule(t => {
            document.querySelectorAll(".note-label").forEach(l => l.remove());
            const lbl = document.createElement("div");
            lbl.className = "note-label";
            lbl.textContent = noteNameMap[e.note.split("/")[0]] + e.note.split("/")[1];
            lbl.style.left = `${bbox.x + bbox.width / 2 - 20}px`;
            lbl.style.top = `${bbox.y + bbox.height + 10}px`;
            div.appendChild(lbl);
          }, start);
          Tone.Transport.schedule(t => document.querySelectorAll(".note-label").forEach(l => l.remove()), end);
        }
      });

      Tone.Transport.schedule(() => stopPlayback(), time + metronomeOffset);
      Tone.Transport.start();
      document.getElementById("play-stop").textContent = "Stop";
      isPlaying = true;
    });

    function stopPlayback() {
      Tone.Transport.cancel();
      Tone.Transport.stop();
      if (metronomeLoop) metronomeLoop.stop();
      document.querySelectorAll(".note-label").forEach(l => l.remove());
      context.svg.querySelectorAll('g.vf-stavenote').forEach(g => {
        g.querySelectorAll('path, line, circle, ellipse, rect').forEach(el => {
          el.setAttribute('stroke', 'black');
          if (el.getAttribute('fill') !== 'none') el.setAttribute('fill', 'black');
        });
      });
      document.getElementById("play-stop").textContent = "Play";
      isPlaying = false;
    }

    // Click en pentagrama
    div.addEventListener("click", async e => {
      if (!figuraActiva || !compas || deleteMode) return;
      const currentCompas = lines[currentLine][lines[currentLine].length - 1];
      if (currentCompas.closed) return;

      const rect = div.getBoundingClientRect();
      const y = e.clientY - rect.top + div.scrollTop;
      const noteName = getNoteFromY(y);
      await addElemento(figuraActiva.tipo, figuraActiva.duracion, noteName);
    });

    function getNoteFromY(y) {
      const lineY = Math.floor((y - 80) / lineHeight) * lineHeight + 80;
      const relativeY = y - lineY;
      const top = 0, bottom = 72;
      const step = (bottom - top) / 8;
      const idx = Math.round((bottom - relativeY) / step);
      return noteMap[clave][Math.max(0, Math.min(noteMap[clave].length - 1, idx))];
    }

    async function addElemento(tipo, duracion, noteName) {
      const numBeats = parseInt(compas.split("/")[0]);
      let currentLineCompases = lines[currentLine];
      let currentCompas = currentLineCompases[currentLineCompases.length - 1];
      const newBeats = duracionBeats[duracion];

      if (currentCompas.beats + newBeats > numBeats) {
        alert("Compás lleno.");
        return;
      }

      let elemento;
      if (tipo === "nota") {
        const noteList = noteMap[clave];
        const bIndex = clave === "treble" ? noteList.indexOf("b/4") : noteList.indexOf("b/2");
        const currentIndex = noteList.indexOf(noteName);
        const stemDirection = currentIndex >= bIndex ? VF.Stem.DOWN : VF.Stem.UP;
        elemento = new VF.StaveNote({ clef: clave, keys: [noteName], duration: duracion, stem_direction: stemDirection });
      } else {
        const restKey = clave === "treble" ? "b/4" : "d/3";
        elemento = new VF.StaveNote({ clef: clave, keys: [restKey], duration: duracion + "r" });
      }

      currentCompas.notas.push({ tipo, duracion, noteName: tipo === "nota" ? noteName : null, vf: elemento });
      currentCompas.beats += newBeats;
      redibujarPentagrama();
      if (tipo === "nota") await play(noteName);
    }

    async function play(noteName) {
      await Tone.start();
      new Tone.Synth().toDestination().triggerAttackRelease(noteName.split("/")[0].toUpperCase() + noteName.split("/")[1], "8n");
    }

    function updateDraggableNotes() {
      document.querySelectorAll(".nota").forEach(n => n.remove());
      let globalIndex = 0;
      lines.forEach(line => line.forEach(compasData => {
        const noteGs = Array.from(context.svg.querySelectorAll('g.vf-stavenote'));
        compasData.notas.forEach((nota, i) => {
          if (nota.tipo === "silencio") { globalIndex++; return; }
          if (globalIndex >= noteGs.length) return;
          const g = noteGs[globalIndex];
          const bbox = g.getBBox();
          const noteDiv = document.createElement("div");
          noteDiv.className = `nota ${deleteMode ? 'delete-mode' : ''}`;
          noteDiv.style.left = `${bbox.x}px`;
          noteDiv.style.top = `${bbox.y}px`;
          noteDiv.style.width = `${bbox.width}px`;
          noteDiv.style.height = `${bbox.height}px`;
          noteDiv.dataset.line = lines.indexOf(line);
          noteDiv.dataset.compas = line.indexOf(compasData);
          noteDiv.dataset.nota = i;

          if (!deleteMode) {
            const plus = document.createElement("div"); plus.textContent = "+"; plus.className = "plus";
            const minus = document.createElement("div"); minus.textContent = "-"; minus.className = "minus";
            let timeout;
            function show() {
              clearTimeout(timeout);
              noteDiv.classList.add("show-controls");
              timeout = setTimeout(() => noteDiv.classList.remove("show-controls"), 2000);
            }
            plus.onclick = e => { e.stopPropagation(); show(); changePitch(noteDiv, 1); };
            minus.onclick = e => { e.stopPropagation(); show(); changePitch(noteDiv, -1); };
            noteDiv.onmouseover = show;
            noteDiv.onclick = e => { if (!deleteMode) { e.stopPropagation(); show(); } };
            noteDiv.appendChild(plus);
            noteDiv.appendChild(minus);
          }

          div.appendChild(noteDiv);

          if (deleteMode) {
            noteDiv.onclick = () => {
              const line = lines[parseInt(noteDiv.dataset.line)];
              const compas = line[parseInt(noteDiv.dataset.compas)];
              compas.beats -= duracionBeats[compas.notas[i].duracion];
              compas.notas.splice(i, 1);
              redibujarPentagrama();
            };
          } else {
            interact(noteDiv).draggable({
              listeners: {
                start() { noteDiv.setAttribute("data-y", 0); },
                move(e) {
                  const y = parseFloat(noteDiv.getAttribute("data-y") || 0) + e.dy;
                  noteDiv.style.transform = `translateY(${y}px)`;
                  noteDiv.setAttribute("data-y", y);
                },
                end(e) {
                  const y = e.clientY - div.getBoundingClientRect().top + div.scrollTop;
                  const newName = getNoteFromY(y);
                  const lineIdx = parseInt(noteDiv.dataset.line);
                  const compasIdx = parseInt(noteDiv.dataset.compas);
                  const notaIdx = parseInt(noteDiv.dataset.nota);
                  const nota = lines[lineIdx][compasIdx].notas[notaIdx];
                  nota.noteName = newName;
                  const noteList = noteMap[clave];
                  const bIndex = clave === "treble" ? noteList.indexOf("b/4") : noteList.indexOf("b/2");
                  const newIndex = noteList.indexOf(newName);
                  nota.vf = new VF.StaveNote({
                    clef: clave,
                    keys: [newName],
                    duration: nota.duracion,
                    stem_direction: newIndex >= bIndex ? VF.Stem.DOWN : VF.Stem.UP
                  });
                  noteDiv.remove();
                  redibujarPentagrama();
                  play(newName);
                }
              }
            });
          }
          globalIndex++;
        });
      }));
    }

    async function changePitch(div, dir) {
      const lineIdx = parseInt(div.dataset.line);
      const compasIdx = parseInt(div.dataset.compas);
      const notaIdx = parseInt(div.dataset.nota);
      const nota = lines[lineIdx][compasIdx].notas[notaIdx];
      const list = noteMap[clave];
      const idx = list.indexOf(nota.noteName);
      const newIdx = idx + dir;
      if (newIdx < 0 || newIdx >= list.length) return;
      nota.noteName = list[newIdx];
      const bIndex = clave === "treble" ? list.indexOf("b/4") : list.indexOf("b/2");
      nota.vf = new VF.StaveNote({
        clef: clave,
        keys: [nota.noteName],
        duration: nota.duracion,
        stem_direction: newIdx >= bIndex ? VF.Stem.DOWN : VF.Stem.UP
      });
      redibujarPentagrama();
      await play(nota.noteName);
    }

    document.getElementById("cerrar-compas").addEventListener("click", () => {
      const currentCompas = lines[currentLine][lines[currentLine].length - 1];
      if (currentCompas.beats !== parseInt(compas.split("/")[0]) || currentCompas.closed) return;
      currentCompas.closed = true;

      // Crear nuevo compás
      const newCompas = { notas: [], beats: 0, closed: false, staveWidth: minStaveWidth };
      lines[currentLine].push(newCompas);

      // Salto de línea si excede ancho
      const totalWidth = lines[currentLine].reduce((s, c) => s + c.staveWidth, 0) + 80;
      if (totalWidth > div.clientWidth) {
        lines[currentLine].pop();
        lines.push([newCompas]);
        currentLine++;
      }

      redibujarPentagrama();
    });

    document.getElementById("borrar-ultimo").addEventListener("click", () => {
      for (let i = lines.length - 1; i >= 0; i--) {
        for (let j = lines[i].length - 1; j >= 0; j--) {
          const c = lines[i][j];
          if (c.notas.length > 0) {
            c.beats -= duracionBeats[c.notas[c.notas.length - 1].duracion];
            c.notas.pop();
            c.closed = false;
            if (c.notas.length === 0 && lines[i].length > 1) lines[i].splice(j, 1);
            redibujarPentagrama();
            return;
          }
        }
      }
    });

    document.getElementById("limpiar").addEventListener("click", resetPartitura);

    // Guardar / Abrir
    document.getElementById("guardar").addEventListener("click", () => {
      const data = {
        titulo: document.getElementById("titulo-editable").value,
        clave, compas,
        lines: lines.map(line => line.map(c => ({
          notas: c.notas.map(n => ({ tipo: n.tipo, duracion: n.duracion, noteName: n.noteName })),
          beats: c.beats,
          closed: c.closed
        })))
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${data.titulo || "partitura"}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("abrir").addEventListener("click", () => {
      document.getElementById("file-input").click();
    });

    document.getElementById("file-input").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const data = JSON.parse(ev.target.result);
          document.getElementById("titulo-editable").value = data.titulo || "Mi Partitura";
          document.getElementById("clave").value = data.clave;
          document.getElementById("compas").value = data.compas;
          clave = data.clave;
          compas = data.compas;
          lines = data.lines.map(line => line.map(c => ({
            notas: c.notas.map(n => {
              let vf;
              if (n.tipo === "nota") {
                const list = noteMap[clave];
                const bIndex = clave === "treble" ? list.indexOf("b/4") : list.indexOf("b/2");
                const idx = list.indexOf(n.noteName);
                vf = new VF.StaveNote({
                  clef: clave,
                  keys: [n.noteName],
                  duration: n.duracion,
                  stem_direction: idx >= bIndex ? VF.Stem.DOWN : VF.Stem.UP
                });
              } else {
                const restKey = clave === "treble" ? "b/4" : "d/3";
                vf = new VF.StaveNote({ clef: clave, keys: [restKey], duration: n.duracion + "r" });
              }
              return { tipo: n.tipo, duracion: n.duracion, noteName: n.noteName, vf };
            }),
            beats: c.beats,
            closed: c.closed,
            staveWidth: minStaveWidth
          })));
          currentLine = lines.length - 1;
          redibujarPentagrama();
        } catch (err) {
          alert("Archivo inválido.");
        }
      };
      reader.readAsText(file);
    });

    init();
  </script>
</body>
</html>
