<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio Musical de Maximilian 23</title>
  <script src="https://unpkg.com/vexflow@4.2.3/build/cjs/vexflow.js"></script>
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(180deg, #aee1f9 0%, #c7b5ff 100%);
      font-family: "Comic Sans MS", cursive;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5px;
    }
    header {
      background: linear-gradient(90deg, #4ae2f2, #6f9cff);
      text-align: center;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      border-radius: 0 0 15px 15px;
      width: 100%;
      max-width: 1400px;
      position: relative;
    }
    header img { height: 50px; vertical-align: middle; filter: drop-shadow(0 0 6px #fff); margin-right: 8px; }
    header h1 { display: inline-block; margin: 0; font-size: 1.8em; color: #fff; text-shadow: 2px 2px 6px rgba(0,0,0,0.3); }
    header p { color: #e9f8ff; font-size: 0.9em; margin-top: 3px; }
    #creado-por {
      position: absolute;
      top: 8px;
      right: 12px;
      color: #fff;
      font-size: 0.8em;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    }
    #titulo-partitura { text-align: center; margin: 8px 0; width: 100%; max-width: 600px; }
    #titulo-editable {
      font: inherit;
      font-size: 1.4em;
      font-weight: bold;
      text-align: center;
      border: 2px solid #4ae2f2;
      border-radius: 10px;
      padding: 6px 12px;
      width: 100%;
      background: #fff;
    }
    #barra-opciones {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0;
      width: 100%;
      max-width: 600px;
    }
    select {
      padding: 6px 10px;
      font-size: 0.9em;
      border: 2px solid #4ae2f2;
      border-radius: 10px;
      background: #fff;
    }
    #main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1400px;
    }
    /* CUADRO BLANCO - LÍNEAS SEPARADAS */
    #pentagrama-container {
      background: #fff;
      border: 3px solid #4ae2f2;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      margin: 5px auto;
      width: 95%;
      max-width: 1400px;
      min-width: 600px;
      min-height: 280px !important;
      height: auto !important;
      max-height: calc(100vh - 250px);
      position: relative;
    }
    #pentagrama {
      width: 100%;
      min-height: 280px;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      position: relative;
      z-index: 1;
    }
    #figuras {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: nowrap;
      margin: 5px 0;
      width: 100%;
      max-width: 600px;
      overflow-x: auto;
      padding: 5px;
    }
    #controles-modo, #controles-otros {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 5px 0;
      width: 100%;
      max-width: 600px;
    }
    .figura {
      width: 48px !important; 
      height: 48px !important;
      min-width: 48px !important;
      flex-shrink: 0;
      background: #fff;
      border: 3px solid #4ae2f2;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5em !important;
      color: #333;
    }
    .figura:hover, .figura.activa {
      background: #4ae2f2;
      color: white;
      transform: scale(1.1);
      box-shadow: 0 0 15px #4ae2f2;
    }
    button {
      padding: 8px 15px;
      font-size: 0.9em;
      background: linear-gradient(90deg, #4ae2f2, #6f9cff);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    button i { font-size: 1em; }
    button:hover { transform: scale(1.1); }
    button:disabled { background: #ccc; cursor: not-allowed; }
    button.activa { background: #ff80b5 !important; }
    .nota {
      position: absolute;
      cursor: move;
      z-index: 100;
      pointer-events: auto;
    }
    .nota .plus, .nota .minus {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #4ae2f2;
      color: white;
      position: absolute;
      text-align: center;
      line-height: 22px;
      font-size: 0.9em;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
      z-index: 101;
    }
    .nota.show-controls .plus, .nota.show-controls .minus { opacity: 1; }
    .nota .plus { top: -28px; left: 50%; transform: translateX(-50%); }
    .nota .minus { bottom: -28px; left: 50%; transform: translateX(-50%); }
    .note-label {
      position: absolute;
      background: rgba(255,255,255,0.9);
      border: 1px solid #4ae2f2;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.8em;
      color: #333;
      z-index: 150;
      pointer-events: none;
    }
    @media (max-width: 600px) {
      header { padding: 8px; }
      header h1 { font-size: 1.4em; }
      header img { height: 40px; }
      header p { font-size: 0.8em; }
      #creado-por { font-size: 0.7em; right: 10px; }
      #titulo-editable { font-size: 1.2em; padding: 5px 10px; }
      select { padding: 5px 8px; font-size: 0.8em; }
      .figura { 
        width: 48px !important; 
        height: 48px !important; 
        font-size: 1.3em !important; 
      }
      button { padding: 6px 12px; font-size: 0.8em; }
      #pentagrama-container { 
        min-width: 95vw !important; 
        width: 95vw !important;
        min-height: 240px !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Maximilian 23">
    <h1>Laboratorio Musical de Maximilian 23</h1>
    <p>¡Compón, juega y aprende con el robot más melódico del cole!</p>
    <div id="creado-por">Creado por Manuel</div>
  </header>
  <div id="titulo-partitura">
    <input type="text" id="titulo-editable" value="Mi Partitura">
  </div>
  <div id="barra-opciones">
    <label>Clave:</label>
    <select id="clave"><option value="treble" selected>Sol</option><option value="bass">Fa</option></select>
    <label>Compás:</label>
    <select id="compas"><option value="" selected>---</option><option value="4/4">4/4</option><option value="3/4">3/4</option><option value="2/4">2/4</option></select>
    <label>Velocidad:</label>
    <select id="velocidad">
      <option value="" selected>---</option>
      <option value="60">Lento (60 BPM)</option>
      <option value="90">Moderado (90 BPM)</option>
      <option value="120">Allegro (120 BPM)</option>
      <option value="160">Presto (160 BPM)</option>
    </select>
  </div>
  <div id="main-content">
    <div id="pentagrama-container">
      <div id="pentagrama"></div>
    </div>
    <div id="figuras">
      <div class="figura" data-tipo="nota" data-duracion="w">𝅝</div>
      <div class="figura" data-tipo="nota" data-duracion="h">𝅗𝅥</div>
      <div class="figura" data-tipo="nota" data-duracion="q">𝅘𝅥</div>
      <div class="figura" data-tipo="nota" data-duracion="8">𝅘𝅥𝅮</div>
      <div class="figura" data-tipo="silencio" data-duracion="w">𝄻</div>
      <div class="figura" data-tipo="silencio" data-duracion="h">𝄼</div>
      <div class="figura" data-tipo="silencio" data-duracion="q">𝄽</div>
      <div class="figura" data-tipo="silencio" data-duracion="8">𝄾</div>
    </div>
    <div id="controles-modo">
      <button id="notas"><i class="fas fa-music"></i> Notas</button>
      <button id="play-stop"><i class="fas fa-play"></i> Play</button>
      <button id="metronomo"><i class="fas fa-drum"></i> Metrónomo</button>
    </div>
    <div id="controles-otros">
      <button id="guardar"><i class="fas fa-save"></i> Guardar</button>
      <button id="abrir"><i class="fas fa-folder-open"></i> Abrir</button>
      <input type="file" id="file-input" accept=".json" style="display:none">
      <button id="cerrar-compas" disabled><i class="fas fa-check"></i> Cerrar</button>
      <button id="borrar-ultimo"><i class="fas fa-backspace"></i> Borrar</button>
      <button id="limpiar"><i class="fas fa-trash"></i> Limpiar</button>
    </div>
  </div>
  <script>
    const VF = Vex.Flow;
    const div = document.getElementById("pentagrama");
    const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
    const container = document.getElementById("pentagrama-container");
    
    // CONFIGURACIÓN EXACTA
    const MAX_LINE_WIDTH = 1250; // ANCHO DEL CUADRO BLANCO
    const MAX_COMPASSES_PER_LINE = 5; // MÁXIMO 5 COMPASES
    const FIRST_STAVE_WIDTH = 320; // PRIMER COMPÁS
    const minStaveWidth = 220; // COMPÁS NORMAL
    const lineHeight = 200; // ESPACIO ENTRE LÍNEAS PENTAGRAMA
    
    let width = Math.max(600, container.clientWidth);
    let currentHeight = 280;
    renderer.resize(width, currentHeight);
    const context = renderer.getContext();
    
    let clave = "treble", compas = "", bpm = 0;
    let lines = [[]], currentLine = 0;
    let figuraActiva = null, showNoteLabels = false, isPlaying = false, metronomeOn = false;
    let metronomeLoop = null;
    let synth = null;
    let activeNoteId = null;
    
    const noteMap = {
      treble: ["g/3", "a/3", "b/3", "c/4", "d/4", "e/4", "f/4", "g/4", "a/4", "b/4", "c/5", "d/5", "e/5", "f/5", "g/5", "a/5", "b/5"],
      bass: ["b/1", "c/2", "d/2", "e/2", "f/2", "g/2", "a/2", "b/2", "c/3", "d/3", "e/3", "f/3", "g/3", "a/3", "b/3", "c/4", "d/4"]
    };
    const noteNameMap = { c: "Do", d: "Re", e: "Mi", f: "Fa", g: "Sol", a: "La", b: "Si" };
    const duracionBeats = { w: 4, h: 2, q: 1, '8': 0.5 };
    const duracionTiempo = { w: "1n", h: "2n", q: "4n", '8': "8n" };

    function init() {
      window.addEventListener('resize', () => {
        width = Math.max(600, container.clientWidth);
        redibujarPentagrama();
      });

      document.getElementById("clave").onchange = e => { clave = e.target.value; resetPartitura(); };
      document.getElementById("compas").onchange = e => {
        compas = e.target.value;
        resetPartitura();
        document.getElementById("play-stop").disabled = !compas;
      };
      document.getElementById("velocidad").onchange = e => {
        bpm = +e.target.value;
        if (Tone.Transport.state === "started") Tone.Transport.bpm.value = bpm;
      };
      
      initFiguras();
      initControles();
      resetPartitura();
      
      Tone.start().then(() => {
        synth = new Tone.Synth().toDestination();
      });
    }

    function resetPartitura() {
      lines = [[]];
      currentLine = 0;
      if (compas) lines[0].push({ notas: [], beats: 0, closed: false, staveWidth: FIRST_STAVE_WIDTH });
      redibujarPentagrama();
    }

    function redibujarPentagrama() {
      if (!isPlaying) {
        document.querySelectorAll(".note-label, .nota").forEach(el => el.remove());
      }
      
      context.clear();
      let y = 40;
      
      if (compas) {
        lines.forEach((line, li) => {
          let x = 40;
          
          // MÁXIMO 5 COMPASES - CORTAR SI EXCEDE
          line.slice(0, MAX_COMPASSES_PER_LINE).forEach((c, ci) => {
            const voice = new VF.Voice({ num_beats: +compas.split("/")[0], beat_value: 4 });
            voice.setStrict(false);
            if (c.notas.length) voice.addTickables(c.notas.map(n => n.vf));
            
            const formatter = new VF.Formatter();
            if (c.notas.length) formatter.joinVoices([voice]);
            
            let extra = c.notas.filter(n => n.duracion === '8').length * 25 + 
                       (c.notas.length - c.notas.filter(n => n.duracion === '8').length) * 12;
            
            // ANCHO FIJO - ÚLTIMO COMPÁS SE AJUSTA
            let w = (ci === 0) ? FIRST_STAVE_WIDTH : minStaveWidth;
            if (c.notas.length) {
              w = Math.max(w, formatter.preCalculateMinTotalWidth([voice]) + 60 + extra);
            }
            
            // **CORTE DEFINITIVO**: ÚLTIMO COMPÁS NO SE SALE
            if (ci === MAX_COMPASSES_PER_LINE - 1) {
              w = Math.min(w, MAX_LINE_WIDTH - x);
            }
            
            c.staveWidth = w;
            
            const stave = new VF.Stave(x, y, w);
            
            if (li === 0 && ci === 0) {
              stave.addClef(clave).addTimeSignature(compas);
            } else if (c.closed) {
              stave.addModifier(new VF.Barline(VF.Barline.type.SINGLE));
            }
            
            stave.setContext(context).draw();
            c.stave = stave;
            
            if (c.notas.length) {
              formatter.format([voice], w - 60);
              voice.draw(context, stave);
            }
            x += w;
          });
          y += lineHeight; // **ESPACIO GRANDE ENTRE LÍNEAS**
        });
      }
      
      // ALTURA DINÁMICA
      currentHeight = Math.max(280, y + 60);
      renderer.resize(width, currentHeight);
      container.style.height = `${currentHeight}px`;
      
      if (!isPlaying) {
        updateDraggableNotes();
      }
      
      const curr = lines[currentLine][lines[currentLine].length - 1];
      document.getElementById("cerrar-compas").disabled = !curr || curr.closed || curr.beats !== +compas.split("/")[0];
      
      if (curr?.stave && !isPlaying) {
        setTimeout(() => {
          div.scrollTop = Math.max(0, curr.stave.getYForLine(0) - 60);
        }, 100);
      }
    }

    function initFiguras() {
      document.querySelectorAll(".figura").forEach(f => {
        f.onclick = () => {
          document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
          figuraActiva = { tipo: f.dataset.tipo, duracion: f.dataset.duracion };
          f.classList.add("activa");
          if (metronomeLoop) metronomeLoop.stop();
          if (!isPlaying) Tone.Transport.stop();
        };
      });
    }

    function initControles() {
      document.getElementById("notas").onclick = () => toggleMode("notas", () => { showNoteLabels = !showNoteLabels; });
      document.getElementById("metronomo").onclick = () => toggleMode("metronomo", () => { metronomeOn = !metronomeOn; });
      document.getElementById("play-stop").onclick = playStop;
      document.getElementById("cerrar-compas").onclick = cerrarCompas;
      document.getElementById("borrar-ultimo").onclick = borrarUltimo;
      document.getElementById("limpiar").onclick = resetPartitura;
      document.getElementById("guardar").onclick = guardar;
      document.getElementById("abrir").onclick = () => document.getElementById("file-input").click();
      document.getElementById("file-input").onchange = abrir;
    }

    function toggleMode(id, fn) {
      document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
      figuraActiva = null;
      fn();
      document.getElementById(id).classList.toggle("activa", id === "notas" ? showNoteLabels : metronomeOn);
      if (!isPlaying) updateDraggableNotes();
    }

    // **CERRAR COMPÁS - MÁXIMO 5 POR LÍNEA**
    function cerrarCompas() {
      const curr = lines[currentLine][lines[currentLine].length - 1];
      if (curr.beats !== +compas.split("/")[0] || curr.closed) return;
      
      curr.closed = true;
      
      // **SI YA HAY 5 COMPASES → NUEVA LÍNEA**
      if (lines[currentLine].length >= MAX_COMPASSES_PER_LINE) {
        lines.push([{ notas: [], beats: 0, closed: false, staveWidth: minStaveWidth }]);
        currentLine = lines.length - 1;
      } else {
        lines[currentLine].push({ notas: [], beats: 0, closed: false, staveWidth: minStaveWidth });
      }
      
      redibujarPentagrama();
    }

    div.onclick = e => {
      if (!compas) return alert("Por favor, selecciona un compás antes de añadir notas.");
      if (!figuraActiva) return alert("Por favor, selecciona una figura musical.");
      
      const rect = div.getBoundingClientRect();
      const clickX = e.clientX - rect.left + div.scrollLeft;
      const clickY = e.clientY - rect.top + div.scrollTop;
      
      let targetLine = currentLine, targetCompas = lines[currentLine].length - 1;
      let minDistance = Infinity;
      
      // ENCONTRAR COMPÁS MÁS CERCANO
      lines.forEach((line, li) => {
        let x = 40;
        line.slice(0, MAX_COMPASSES_PER_LINE).forEach((c, ci) => {
          const distance = Math.abs(clickX - (x + c.staveWidth / 2));
          if (distance < minDistance && !c.closed) {
            minDistance = distance;
            targetLine = li;
            targetCompas = ci;
          }
          x += c.staveWidth;
        });
      });
      
      // **CREAR NUEVO COMPÁS SI NECESARIO**
      if (!lines[targetLine][targetCompas] || lines[targetLine][targetCompas].closed) {
        if (lines[targetLine].length >= MAX_COMPASSES_PER_LINE) {
          lines.push([{ notas: [], beats: 0, closed: false, staveWidth: minStaveWidth }]);
          targetLine = lines.length - 1;
          targetCompas = 0;
        } else {
          lines[targetLine].push({ notas: [], beats: 0, closed: false, staveWidth: minStaveWidth });
          targetCompas = lines[targetLine].length - 1;
        }
      }
      
      const curr = lines[targetLine][targetCompas];
      if (curr.closed) return alert("El compás está cerrado.");
      
      const noteName = getNoteFromY(clickY, targetLine);
      if (!noteName) return alert("Posición inválida.");
      
      currentLine = targetLine;
      Tone.start().then(() => {
        addNota(figuraActiva.tipo, figuraActiva.duracion, noteName, targetCompas);
      });
    };

    function getNoteFromY(y, lineIndex) {
      const lineY = lineIndex * lineHeight + 40;
      const relY = y - lineY;
      
      const noteHeight = 160;
      const numNotes = noteMap[clave].length;
      const step = noteHeight / (numNotes - 1);
      
      const normalizedY = Math.max(0, Math.min(noteHeight, noteHeight - relY));
      const idx = Math.round(normalizedY / step);
      
      return noteMap[clave][Math.max(0, Math.min(numNotes - 1, idx))];
    }

    function addNota(tipo, dur, noteName, compasIndex) {
      const beats = +compas.split("/")[0];
      let currentCompas = lines[currentLine][compasIndex];
      
      if (currentCompas.beats + duracionBeats[dur] > beats) {
        return alert("¡Compás lleno!");
      }
      
      let vf;
      if (tipo === "nota") {
        const list = noteMap[clave];
        const bIdx = clave === "treble" ? list.indexOf("b/4") : list.indexOf("b/2");
        const idx = list.indexOf(noteName);
        vf = new VF.StaveNote({ 
          clef: clave, 
          keys: [noteName], 
          duration: dur, 
          stem_direction: idx >= bIdx ? VF.Stem.DOWN : VF.Stem.UP 
        });
      } else {
        const rest = clave === "treble" ? "b/4" : "d/3";
        vf = new VF.StaveNote({ clef: clave, keys: [rest], duration: dur + "r" });
      }
      
      currentCompas.notas.push({ tipo, duracion: dur, noteName: tipo === "nota" ? noteName : null, vf });
      currentCompas.beats += duracionBeats[dur];
      
      redibujarPentagrama();
      
      if (tipo === "nota" && synth) {
        synth.triggerAttackRelease(
          noteName.split("/")[0].toUpperCase() + noteName.split("/")[1], 
          duracionTiempo[dur]
        );
      }
    }

    // [Resto de funciones igual que antes]
    function updateDraggableNotes() {
      const wasActive = activeNoteId ? document.querySelector(`.nota[data-id="${activeNoteId}"]`)?.classList.contains("show-controls") : false;
      document.querySelectorAll(".nota").forEach(n => n.remove());
      
      let gi = 0;
      lines.forEach((line, li) => line.slice(0, MAX_COMPASSES_PER_LINE).forEach((c, ci) => c.notas.forEach((n, ni) => {
        if (n.tipo === "silencio") { gi++; return; }
        
        const g = context.svg.querySelectorAll('g.vf-stavenote')[gi];
        if (!g) return;
        
        const bbox = g.getBBox();
        const d = document.createElement("div");
        d.className = "nota";
        d.style.left = `${bbox.x}px`;
        d.style.top = `${bbox.y}px`;
        d.style.width = `${bbox.width}px`;
        d.style.height = `${bbox.height}px`;
        d.dataset.li = li;
        d.dataset.ci = ci;
        d.dataset.ni = ni;
        d.dataset.id = `${li}-${ci}-${ni}`;
        
        const plus = document.createElement("div");
        plus.textContent = "+";
        plus.className = "plus";
        const minus = document.createElement("div");
        minus.textContent = "−";
        minus.className = "minus";
        
        let t;
        const showControls = () => {
          clearTimeout(t);
          d.classList.add("show-controls");
          activeNoteId = d.dataset.id;
        };
        const hideControls = () => {
          clearTimeout(t);
          t = setTimeout(() => {
            d.classList.remove("show-controls");
            if (activeNoteId === d.dataset.id) activeNoteId = null;
          }, 1000);
        };
        
        plus.onclick = e => {
          e.stopPropagation();
          showControls();
          Tone.start().then(() => changePitch(d, 1));
        };
        minus.onclick = e => {
          e.stopPropagation();
          showControls();
          Tone.start().then(() => changePitch(d, -1));
        };
        
        d.onmouseover = showControls;
        d.onmouseout = hideControls;
        d.onclick = e => {
          e.stopPropagation();
          showControls();
        };
        
        d.appendChild(plus);
        d.appendChild(minus);
        div.appendChild(d);
        
        if (wasActive && d.dataset.id === activeNoteId) {
          d.classList.add("show-controls");
        }
        
        interact(d).draggable({
          listeners: {
            start() { d.setAttribute("dy", 0); },
            move(e) {
              const dy = +d.getAttribute("dy") + e.dy;
              d.style.transform = `translateY(${dy}px)`;
              d.setAttribute("dy", dy);
            },
            end(e) {
              const y = e.clientY - div.getBoundingClientRect().top + div.scrollTop;
              const newName = getNoteFromY(y, +d.dataset.li);
              if (!newName) return;
              
              const nota = lines[+d.dataset.li][+d.dataset.ci].notas[+d.dataset.ni];
              nota.noteName = newName;
              
              const list = noteMap[clave];
              const bIdx = clave === "treble" ? list.indexOf("b/4") : list.indexOf("b/2");
              const idx = list.indexOf(newName);
              nota.vf = new VF.StaveNote({ 
                clef: clave, 
                keys: [newName], 
                duration: nota.duracion, 
                stem_direction: idx >= bIdx ? VF.Stem.DOWN : VF.Stem.UP 
              });
              
              d.remove();
              activeNoteId = d.dataset.id;
              redibujarPentagrama();
            }
          }
        });
        gi++;
      })));
    }

    function changePitch(div, dir) {
      const li = +div.dataset.li, ci = +div.dataset.ci, ni = +div.dataset.ni;
      const nota = lines[li][ci].notas[ni];
      const list = noteMap[clave];
      const idx = list.indexOf(nota.noteName) + dir;
      
      if (idx < 0 || idx >= list.length) return;
      
      nota.noteName = list[idx];
      const bIdx = clave === "treble" ? list.indexOf("b/4") : list.indexOf("b/2");
      nota.vf = new VF.StaveNote({ 
        clef: clave, 
        keys: [nota.noteName], 
        duration: nota.duracion, 
        stem_direction: idx >= bIdx ? VF.Stem.DOWN : VF.Stem.UP 
      });
      
      activeNoteId = `${li}-${ci}-${ni}`;
      redibujarPentagrama();
    }

    // [playStop, stopPlayback, borrarUltimo, guardar, abrir - igual que antes]
    function playStop() {
      Tone.start().then(() => {
        if (isPlaying) { stopPlayback(); return; }
        if (!compas) return alert("Configura un compás");
        if (!bpm) return alert("Selecciona una velocidad");
        
        Tone.Transport.bpm.value = bpm;
        let time = 0, events = [], gi = 0;
        
        lines.forEach(l => l.slice(0, MAX_COMPASSES_PER_LINE).forEach(c => c.notas.forEach(n => {
          if (n.tipo === "nota") events.push({ time, note: n.noteName, dur: duracionTiempo[n.duracion], gi });
          time += Tone.Time(duracionTiempo[n.duracion]).toSeconds();
          gi++;
        })));
        
        // [resto del código de playStop igual que antes]
        Tone.Transport.start();
        document.getElementById("play-stop").innerHTML = '<i class="fas fa-stop"></i> Stop';
        isPlaying = true;
      });
    }

    function stopPlayback() {
      Tone.Transport.cancel();
      Tone.Transport.stop();
      if (metronomeLoop) metronomeLoop.stop();
      document.getElementById("play-stop").innerHTML = '<i class="fas fa-play"></i> Play';
      isPlaying = false;
      updateDraggableNotes();
    }

    function borrarUltimo() {
      for (let li = lines.length - 1; li >= 0; li--) {
        for (let ci = lines[li].length - 1; ci >= 0; ci--) {
          const c = lines[li][ci];
          if (c.notas.length) {
            c.beats -= duracionBeats[c.notas[c.notas.length - 1].duracion];
            c.notas.pop();
            c.closed = false;
            if (!c.notas.length && lines[li].length > 1) lines[li].splice(ci, 1);
            activeNoteId = null;
            redibujarPentagrama();
            return;
          }
        }
      }
    }

    function guardar() {
      const data = {
        titulo: document.getElementById("titulo-editable").value,
        clave, compas, bpm,
        lines: lines.map(l => l.slice(0, MAX_COMPASSES_PER_LINE).map(c => ({
          notas: c.notas.map(n => ({ tipo: n.tipo, duracion: n.duracion, noteName: n.noteName })),
          beats: c.beats,
          closed: c.closed
        })))
      };
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
      a.download = `${data.titulo || "partitura"}.json`;
      a.click();
    }

    function abrir(e) {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          document.getElementById("titulo-editable").value = d.titulo || "Mi Partitura";
          clave = d.clave;
          compas = d.compas;
          bpm = d.bpm;
          
          lines = d.lines.map(l => l.map(c => {
            const comp = { notas: [], beats: c.beats, closed: c.closed, staveWidth: minStaveWidth };
            c.notas.forEach(n => {
              let vf;
              if (n.tipo === "nota") {
                const list = noteMap[clave];
                const bIdx = clave === "treble" ? list.indexOf("b/4") : list.indexOf("b/2");
                const idx = list.indexOf(n.noteName);
                vf = new VF.StaveNote({ 
                  clef: clave, 
                  keys: [n.noteName], 
                  duration: n.duracion, 
                  stem_direction: idx >= bIdx ? VF.Stem.DOWN : VF.Stem.UP 
                });
              } else {
                const rest = clave === "treble" ? "b/4" : "d/3";
                vf = new VF.StaveNote({ clef: clave, keys: [rest], duration: n.duracion + "r" });
              }
              comp.notas.push({ tipo: n.tipo, duracion: n.duracion, noteName: n.noteName, vf });
            });
            return comp;
          }));
          
          currentLine = lines.length - 1;
          activeNoteId = null;
          redibujarPentagrama();
        } catch { alert("Archivo inválido"); }
      };
      r.readAsText(file);
    }

    init();
  </script>
</body>
</html>
