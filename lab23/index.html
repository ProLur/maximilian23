<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio Musical de Maximilian 23</title>
  <script src="https://unpkg.com/vexflow@4.2.3/build/cjs/vexflow.js"></script>
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(180deg, #aee1f9 0%, #c7b5ff 100%);
      font-family: "Comic Sans MS", "Comic Neue", cursive;
      color: #222;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }
    header {
      background: linear-gradient(90deg, #4ae2f2, #6f9cff);
      text-align: center;
      padding: 20px 0 10px 0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      position: relative;
    }
    header img {
      height: 90px;
      vertical-align: middle;
      filter: drop-shadow(0 0 6px rgba(255,255,255,0.8));
    }
    header h1 {
      display: inline-block;
      margin: 0 0 10px 15px;
      font-size: 2.5em;
      color: #fff;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.3);
      vertical-align: middle;
      animation: brillo 3s infinite alternate;
    }
    header p {
      margin: 0;
      color: #e9f8ff;
      font-size: 1.1em;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
    }
    #titulo {
      margin: 10px auto;
      width: 80%;
      max-width: 600px;
      padding: 8px 12px;
      font-size: 1.2em;
      border-radius: 10px;
      border: 2px solid #4ae2f2;
      background: #fff;
      color: #333;
      text-align: center;
      font-family: "Comic Sans MS", "Comic Neue", cursive;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      transition: transform 0.2s;
    }
    #titulo:focus {
      outline: none;
      transform: scale(1.05);
      background: #eafcff;
    }
    @keyframes brillo {
      from { text-shadow: 0 0 4px #fff, 0 0 8px #4ae2f2; }
      to { text-shadow: 0 0 8px #fff, 0 0 14px #6f9cff; }
    }
    #barra-opciones {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin: 15px 0;
      flex-wrap: wrap;
    }
    #barra-opciones label {
      font-weight: bold;
      color: #333;
    }
    select {
      border-radius: 10px;
      border: 2px solid #4ae2f2;
      padding: 8px 12px;
      font-size: 1.1em;
      background: #fff;
      color: #333;
      transition: 0.3s;
    }
    select:hover {
      background: #eafcff;
      transform: scale(1.05);
    }
    #pentagrama {
      margin: 0 auto;
      width: 95%;
      height: 50vh;
      background: #ffffff;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      position: relative;
      overflow-x: auto;
      overflow-y: auto;
      border: 3px solid #4ae2f2;
      min-height: 200px;
      pointer-events: auto; /* Asegura que los eventos de clic se capturen */
    }
    #pentagrama svg {
      pointer-events: none; /* Evita que el SVG bloquee los clics */
    }
    #figuras {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin: 15px 0;
      flex-wrap: wrap;
    }
    .figura {
      font-size: 2.6em;
      width: 70px;
      height: 70px;
      line-height: 70px;
      text-align: center;
      border: 3px solid #4ae2f2;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    .figura:hover, .figura.activa {
      background: #4ae2f2;
      color: #fff;
      transform: scale(1.15);
      border-color: #ffffff;
      box-shadow: 0 0 12px #4ae2f2;
    }
    #controles {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin: 15px 0;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 22px;
      font-size: 1.1em;
      background: linear-gradient(90deg, #4ae2f2, #6f9cff);
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    }
    button:disabled {
      background: #b8ddee;
      cursor: not-allowed;
    }
    button.activa {
      background: #ff80b5 !important;
      box-shadow: 0 0 12px #ffaad4;
    }
    .nota {
      position: absolute;
      cursor: move;
      z-index: 100;
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid #4ae2f2;
      border-radius: 6px;
      transition: background 0.2s;
    }
    .nota.delete-mode {
      background: rgba(255, 0, 0, 0.15);
      border-color: #ff6666;
    }
    .nota .plus, .nota .minus {
      opacity: 0;
      transition: opacity 0.2s;
    }
    .nota.show-controls .plus, .nota.show-controls .minus {
      opacity: 1;
    }
    .nota .plus, .nota .minus {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      text-align: center;
      line-height: 26px;
      font-size: 1.1em;
      background: #4ae2f2;
      color: #fff;
      border: 1px solid #ffffff;
      position: absolute;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(0,0,0,0.2);
    }
    .nota .plus {
      top: -32px;
      left: 50%;
      transform: translateX(-50%);
    }
    .nota .minus {
      bottom: -32px;
      left: 50%;
      transform: translateX(-50%);
    }
    .note-label {
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid #4ae2f2;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 0.9em;
      color: #333;
      text-align: center;
      z-index: 150;
    }
    #abrir-input {
      display: none;
    }
    @media (max-width: 600px) {
      header img { height: 60px; }
      header h1 { font-size: 1.8em; }
      header p { font-size: 0.9em; }
      #titulo { font-size: 1em; padding: 6px 10px; }
      #barra-opciones { gap: 10px; margin: 10px 0; }
      select { padding: 6px 10px; font-size: 1em; }
      #pentagrama { min-height: 150px; height: 40vh; }
      .figura { width: 50px; height: 50px; line-height: 50px; font-size: 2em; }
      button { padding: 8px 16px; font-size: 1em; }
      #controles { gap: 10px; margin: 10px 0; }
      .note-label { font-size: 0.8em; padding: 1px 4px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="https://maximilian23.com/Cabeza.png" alt="Maximilian 23">
      <h1>Laboratorio Musical de Maximilian 23</h1>
      <p>🎵 ¡Compón, juega y aprende con el robot más melódico del cole! 🎶</p>
      <input type="text" id="titulo" value="Mi Partitura" placeholder="Título de la partitura">
    </header>
    <div id="barra-opciones">
      <label for="clave">Clave:</label>
      <select id="clave">
        <option value="" selected>---</option>
        <option value="treble">Sol</option>
        <option value="bass">Fa</option>
      </select>
      <label for="compas">Compás:</label>
      <select id="compas">
        <option value="" selected>---</option>
        <option value="2/4">2/4</option>
        <option value="3/4">3/4</option>
        <option value="4/4">4/4</option>
      </select>
      <label for="velocidad">Velocidad:</label>
      <select id="velocidad">
        <option value="" selected>---</option>
        <option value="60">Lento (60 BPM)</option>
        <option value="90">Moderado (90 BPM)</option>
        <option value="120">Allegro (120 BPM)</option>
        <option value="150">Presto (150 BPM)</option>
      </select>
    </div>
    <div id="pentagrama"></div>
    <div id="figuras">
      <div class="figura" data-tipo="nota" data-duracion="w" style="color:#ff80b5;">𝅝</div>
      <div class="figura" data-tipo="nota" data-duracion="h" style="color:#ffd966;">𝅗𝅥</div>
      <div class="figura" data-tipo="nota" data-duracion="q" style="color:#7bdeff;">♩</div>
      <div class="figura" data-tipo="nota" data-duracion="8" style="color:#9cffb0;">♪</div>
      <div class="figura" data-tipo="silencio" data-duracion="w" style="color:#ff80b5;">𝄻</div>
      <div class="figura" data-tipo="silencio" data-duracion="h" style="color:#ffd966;">𝄼</div>
      <div class="figura" data-tipo="silencio" data-duracion="q" style="color:#7bdeff;">𝄽</div>
      <div class="figura" data-tipo="silencio" data-duracion="8" style="color:#9cffb0;">𝄾</div>
    </div>
    <div id="controles">
      <button id="cerrar-compas" disabled>➕ Cerrar Compás</button>
      <button id="borrar-ultimo">⏪ Borrar Último</button>
      <button id="limpiar">🧹 Limpiar</button>
      <button id="papelera">🗑️ Papelera</button>
      <button id="notas">🎵 Notas</button>
      <button id="play-stop" disabled>▶️ Play</button>
      <button id="metronomo">⏱️ Metrónomo</button>
      <button id="guardar">💾 Guardar</button>
      <button id="abrir">📂 Abrir</button>
      <input type="file" id="abrir-input" accept=".json">
    </div>
  </main>
  <script>
    const VF = Vex.Flow;
    const div = document.getElementById("pentagrama");
    const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
    let width = 800;
    const minStaveWidth = 250;
    const staveHeight = 100;
    const lineSpacing = 120;
    renderer.resize(width, div.clientHeight);
    const context = renderer.getContext();
    let clave = "";
    let compas = "";
    let velocidad = "";
    let titulo = "Mi Partitura";
    let compases = [];
    let figuraActiva = null;
    let deleteMode = false;
    let showNoteLabels = false;
    let isPlaying = false;
    let metronomeOn = false;
    let metronomeLoop = null;

    const noteMap = {
      treble: ["g/3", "a/3", "b/3", "c/4", "d/4", "e/4", "f/4", "g/4", "a/4", "b/4", "c/5", "d/5", "e/5", "f/5", "g/5", "a/5", "b/5"],
      bass: ["b/1", "c/2", "d/2", "e/2", "f/2", "g/2", "a/2", "b/2", "c/3", "d/3", "e/3", "f/3", "g/3", "a/3", "b/3", "c/4", "d/4"]
    };
    const noteNameMap = { c: "Do", d: "Re", e: "Mi", f: "Fa", g: "Sol", a: "La", b: "Si" };
    const duracionBeats = { w: 4, h: 2, q: 1, '8': 0.5 };
    const duracionTiempo = { w: "1n", h: "2n", q: "4n", '8': "8n" };

    function init() {
      window.addEventListener('resize', () => {
        if (compases.length > 0 && clave && compas) {
          redibujarPentagrama();
        }
      });
      document.getElementById("titulo").addEventListener("input", e => {
        titulo = e.target.value || "Mi Partitura";
        redibujarPentagrama();
      });
    }

    document.getElementById("clave").addEventListener("change", e => {
      clave = e.target.value;
      if (clave && compas) {
        compases = [{ notas: [], beats: 0, closed: false, staveWidth: minStaveWidth }];
        redibujarPentagrama();
      } else {
        compases = [];
        context.clear();
        renderer.resize(width, div.clientHeight);
      }
      resetControles();
    });

    document.getElementById("compas").addEventListener("change", e => {
      compas = e.target.value;
      if (clave && compas) {
        compases = [{ notas: [], beats: 0, closed: false, staveWidth: minStaveWidth }];
        redibujarPentagrama();
      } else {
        compases = [];
        context.clear();
        renderer.resize(width, div.clientHeight);
      }
      resetControles();
    });

    document.getElementById("velocidad").addEventListener("change", e => {
      velocidad = e.target.value;
      document.getElementById("play-stop").disabled = !velocidad || !clave || !compas;
    });

    function resetControles() {
      document.getElementById("cerrar-compas").disabled = true;
      document.getElementById("papelera").classList.remove("activa");
      document.getElementById("notas").classList.remove("activa");
      document.getElementById("play-stop").textContent = "▶️ Play";
      document.getElementById("play-stop").disabled = !velocidad || !clave || !compas;
      document.getElementById("metronomo").classList.remove("activa");
      deleteMode = false;
      showNoteLabels = false;
      isPlaying = false;
      metronomeOn = false;
      if (metronomeLoop) metronomeLoop.stop();
      Tone.Transport.cancel();
      Tone.Transport.stop();
      figuraActiva = null;
      document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
    }

    function redibujarPentagrama() {
      context.clear();
      document.querySelectorAll(".nota").forEach(n => n.remove()); // Limpia notas interactivas
      document.querySelectorAll(".note-label").forEach(label => label.remove());
      if (!clave || !compas) {
        compases = [];
        renderer.resize(width, div.clientHeight);
        return;
      }

      // Calcular el número de compases por línea
      const maxWidthPerLine = div.clientWidth || 800;
      let currentLineWidth = 40;
      let currentLine = 0;
      let lines = [[]];
      compases.forEach((_, index) => {
        const compasData = compases[index];
        const voice = new VF.Voice({ num_beats: parseInt(compas.split("/")[0]), beat_value: parseInt(compas.split("/")[1]) });
        voice.setStrict(false);
        if (compasData.notas.length > 0) {
          voice.addTickables(compasData.notas.map(e => e.vf));
        }
        const formatter = new VF.Formatter();
        if (compasData.notas.length > 0) {
          formatter.joinVoices([voice]);
        }
        const noteCount = compasData.notas.length;
        const eighthNoteCount = compasData.notas.filter(n => n.duracion === '8').length;
        const otherNoteCount = noteCount - eighthNoteCount;
        const extraWidth = eighthNoteCount * 30 + otherNoteCount * 15;
        const staveWidth = Math.max(minStaveWidth, (compasData.notas.length > 0 ? formatter.preCalculateMinTotalWidth([voice]) + 80 + extraWidth : minStaveWidth));
        compasData.staveWidth = staveWidth;

        if (currentLineWidth + staveWidth > maxWidthPerLine) {
          currentLine++;
          lines.push([]);
          currentLineWidth = 40;
        }
        lines[currentLine].push(index);
        currentLineWidth += staveWidth;
      });

      // Calcular el alto total necesario
      const totalLines = lines.length;
      const totalHeight = Math.max(div.clientHeight, totalLines * lineSpacing + 60);
      renderer.resize(width, totalHeight);

      // Añadir título
      if (titulo) {
        const textNote = new VF.TextNote({
          text: titulo,
          font: { family: "Comic Sans MS", size: 16, weight: "bold" },
          justification: VF.TextNote.Justification.CENTER,
          line: -1
        }).setContext(context);
        textNote.setXShift(maxWidthPerLine / 2 - 40).setLine(-2).draw(); // Ajustado para no interferir
      }

      // Calcular yOffset
      let yOffset = totalLines === 1 ? (div.clientHeight - staveHeight) / 2 : 40;

      // Dibujar los pentagramas
      lines.forEach((line, lineIndex) => {
        let xOffset = 40;
        line.forEach((compasIndex, staveIndex) => {
          const compasData = compases[compasIndex];
          const stave = new VF.Stave(xOffset, yOffset + lineIndex * lineSpacing, compasData.staveWidth, { spacing_between_lines_px: 14 });
          if (staveIndex === 0) {
            stave.addClef(clave);
          }
          if (lineIndex === 0 && compasIndex === 0) {
            stave.addTimeSignature(compas);
          }
          if (compasData.closed) {
            stave.addModifier(new VF.Barline().setType(VF.Barline.type.SINGLE));
          }
          stave.setContext(context).draw();
          compasData.stave = stave;

          if (compasData.notas.length > 0) {
            const voice = new VF.Voice({ num_beats: parseInt(compas.split("/")[0]), beat_value: parseInt(compas.split("/")[1]) });
            voice.setStrict(false);
            voice.addTickables(compasData.notas.map(e => e.vf));
            const formatter = new VF.Formatter();
            formatter.joinVoices([voice]).format([voice], compasData.staveWidth - 80);
            voice.draw(context, stave);
          }
          xOffset += compasData.staveWidth;
        });
      });

      width = Math.max(div.clientWidth || 800, Math.max(...lines.map(line => line.reduce((sum, idx) => sum + compases[idx].staveWidth, 40))));
      renderer.resize(width, totalHeight);

      // Centrar la pantalla en la última línea
      if (totalLines > 1) {
        const lastLineY = yOffset + (totalLines - 1) * lineSpacing;
        div.scrollTop = lastLineY - (div.clientHeight - staveHeight) / 2;
      } else {
        div.scrollTop = 0;
      }

      updateDraggableNotes();
      const currentCompas = compases[compases.length - 1];
      document.getElementById("cerrar-compas").disabled = !compas || currentCompas.closed || currentCompas.beats !== parseInt(compas.split("/")[0]);
    }

    document.getElementById("guardar").addEventListener("click", () => {
      if (!clave || !compas) {
        alert("Selecciona una clave y un compás antes de guardar.");
        return;
      }
      const partitura = {
        titulo,
        clave,
        compas,
        velocidad,
        compases: compases.map(compas => ({
          notas: compas.notas.map(nota => ({
            tipo: nota.tipo,
            duracion: nota.duracion,
            noteName: nota.noteName
          })),
          beats: compas.beats,
          closed: compas.closed
        }))
      };
      const json = JSON.stringify(partitura, null, 2);
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `${titulo || "partitura"}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("abrir").addEventListener("click", () => {
      document.getElementById("abrir-input").click();
    });

    document.getElementById("abrir-input").addEventListener("change", e => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = event => {
        try {
          const partitura = JSON.parse(event.target.result);
          if (!partitura.clave || !partitura.compas || !partitura.compases) {
            throw new Error("Archivo JSON inválido: falta clave, compás o compases.");
          }
          titulo = partitura.titulo || "Mi Partitura";
          document.getElementById("titulo").value = titulo;
          clave = partitura.clave;
          document.getElementById("clave").value = clave;
          compas = partitura.compas;
          document.getElementById("compas").value = compas;
          velocidad = partitura.velocidad || "";
          document.getElementById("velocidad").value = velocidad;
          compases = partitura.compases.map(compas => {
            const notas = compas.notas.map(nota => {
              if (!nota.tipo || !nota.duracion) {
                throw new Error("Nota inválida en el archivo JSON.");
              }
              let vf;
              if (nota.tipo === "nota") {
                if (!nota.noteName || !noteMap[clave].includes(nota.noteName)) {
                  throw new Error(`Nombre de nota inválido: ${nota.noteName}`);
                }
                vf = new VF.StaveNote({ clef: clave, keys: [nota.noteName], duration: nota.duracion });
                const noteList = noteMap[clave];
                const noteIndex = noteList.indexOf(nota.noteName);
                const bIndex = noteList.indexOf(clave === "treble" ? "b/4" : "b/3");
                if (noteIndex >= bIndex) {
                  vf.setStemDirection(VF.Stem.DOWN);
                }
              } else {
                const restKey = clave === "treble" ? "b/4" : "d/3";
                vf = new VF.StaveNote({ clef: clave, keys: [restKey], duration: nota.duracion + "r" });
              }
              return { tipo: nota.tipo, duracion: nota.duracion, noteName: nota.noteName, vf };
            });
            return {
              notas,
              beats: compas.beats || 0,
              closed: !!compas.closed,
              staveWidth: minStaveWidth
            };
          });
          redibujarPentagrama();
          resetControles();
          document.getElementById("play-stop").disabled = !velocidad || !clave || !compas;
        } catch (err) {
          alert("Error al cargar el archivo JSON: " + err.message);
        }
      };
      reader.readAsText(file);
      e.target.value = "";
    });

    document.querySelectorAll(".figura").forEach(f => {
      f.addEventListener("click", () => {
        document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
        document.getElementById("papelera").classList.remove("activa");
        document.getElementById("notas").classList.remove("activa");
        deleteMode = false;
        showNoteLabels = false;
        f.classList.add("activa");
        figuraActiva = { tipo: f.dataset.tipo, duracion: f.dataset.duracion };
        document.getElementById("play-stop").disabled = !velocidad || !clave || !compas;
      });
    });

    document.getElementById("papelera").addEventListener("click", () => {
      document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
      document.getElementById("notas").classList.remove("activa");
      figuraActiva = null;
      showNoteLabels = false;
      deleteMode = !deleteMode;
      document.getElementById("papelera").classList.toggle("activa", deleteMode);
      updateDraggableNotes();
      document.getElementById("play-stop").disabled = !velocidad || !clave || !compas;
    });

    document.getElementById("notas").addEventListener("click", () => {
      document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
      document.getElementById("papelera").classList.remove("activa");
      figuraActiva = null;
      deleteMode = false;
      showNoteLabels = !showNoteLabels;
      document.getElementById("notas").classList.toggle("activa", showNoteLabels);
      updateDraggableNotes();
      document.getElementById("play-stop").disabled = !velocidad || !clave || !compas;
    });

    document.getElementById("metronomo").addEventListener("click", () => {
      document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
      document.getElementById("papelera").classList.remove("activa");
      document.getElementById("notas").classList.remove("activa");
      figuraActiva = null;
      deleteMode = false;
      showNoteLabels = false;
      metronomeOn = !metronomeOn;
      document.getElementById("metronomo").classList.toggle("activa", metronomeOn);
      updateDraggableNotes();
      document.getElementById("play-stop").disabled = !velocidad || !clave || !compas;
    });

    document.getElementById("play-stop").addEventListener("click", async () => {
      await Tone.start();
      if (isPlaying) {
        Tone.Transport.cancel();
        Tone.Transport.stop();
        if (metronomeLoop) metronomeLoop.stop();
        document.querySelectorAll(".note-label").forEach(label => label.remove());
        document.getElementById("play-stop").textContent = "▶️ Play";
        document.getElementById("metronomo").classList.remove("activa");
        metronomeOn = false;
        isPlaying = false;
      } else {
        if (!velocidad) {
          alert("Selecciona una velocidad.");
          return;
        }
        if (!clave || !compas) {
          alert("Selecciona una clave y un compás.");
          return;
        }
        Tone.Transport.bpm.value = parseInt(velocidad);
        const synth = new Tone.Synth().toDestination();
        let time = 0;
        let globalIndex = 0;
        const events = [];
        compases.forEach(compasData => {
          compasData.notas.forEach(nota => {
            if (nota.tipo === "nota") {
              events.push({ time, note: nota.noteName, duration: duracionTiempo[nota.duracion], globalIndex });
            }
            time += Tone.Time(duracionTiempo[nota.duracion]).toSeconds();
            globalIndex += nota.tipo === "nota" ? 1 : 1;
          });
        });
        if (events.length > 0 || metronomeOn) {
          Tone.Transport.cancel();
          let metronomeOffset = 0;
          if (metronomeOn) {
            const metronomeSynth = new Tone.MembraneSynth().toDestination();
            const numBeats = parseInt(compas.split("/")[0]);
            const beatDuration = Tone.Time("4n").toSeconds();
            for (let i = 0; i < numBeats; i++) {
              Tone.Transport.schedule(time => {
                metronomeSynth.triggerAttackRelease("C2", "8n", time);
              }, i * beatDuration);
            }
            metronomeOffset = numBeats * beatDuration;
            metronomeLoop = new Tone.Loop(time => {
              metronomeSynth.triggerAttackRelease("C2", "8n", time);
            }, "4n").start(metronomeOffset);
          }
          if (showNoteLabels) {
            const noteGs = Array.from(context.svg.querySelectorAll('g.vf-stavenote'));
            events.forEach(event => {
              if (noteGs[event.globalIndex]) {
                const bbox = noteGs[event.globalIndex].getBBox();
                Tone.Transport.schedule(time => {
                  document.querySelectorAll(".note-label").forEach(label => label.remove());
                  const label = document.createElement("div");
                  label.className = "note-label";
                  const noteName = noteNameMap[event.note.split("/")[0]] + event.note.split("/")[1];
                  label.textContent = noteName;
                  label.style.left = `${bbox.x + bbox.width / 2 - 20}px`;
                  label.style.top = `${bbox.y + bbox.height + 10}px`;
                  div.appendChild(label);
                }, event.time + metronomeOffset);
                Tone.Transport.schedule(time => {
                  document.querySelectorAll(".note-label").forEach(label => label.remove());
                }, event.time + Tone.Time(event.duration).toSeconds() + metronomeOffset);
              }
            });
          }
          events.forEach(event => {
            Tone.Transport.schedule(time => {
              synth.triggerAttackRelease(
                event.note.split("/")[0].toUpperCase() + event.note.split("/")[1],
                event.duration,
                time
              );
            }, event.time + metronomeOffset);
          });
          Tone.Transport.schedule(time => {
            document.querySelectorAll(".note-label").forEach(label => label.remove());
            document.getElementById("play-stop").textContent = "▶️ Play";
            document.getElementById("metronomo").classList.remove("activa");
            metronomeOn = false;
            isPlaying = false;
            if (metronomeLoop) metronomeLoop.stop();
            Tone.Transport.stop();
          }, time + metronomeOffset);
          Tone.Transport.start();
          document.getElementById("play-stop").textContent = "⏹️ Stop";
          isPlaying = true;
        }
      }
    });

    div.addEventListener("click", async e => {
      if (!figuraActiva || !clave || !compas || compases[compases.length - 1].closed || deleteMode) {
        if (!clave || !compas) alert("Selecciona una clave y un compás.");
        else if (compases[compases.length - 1].closed) alert("Compás cerrado. Cierra el compás actual o limpia.");
        return;
      }
      const rect = div.getBoundingClientRect();
      const y = e.clientY - rect.top;
      const noteName = getNoteFromY(y);
      await addElemento(figuraActiva.tipo, figuraActiva.duracion, noteName);
    });

    function getNoteFromY(y) {
      const stave = compases[compases.length - 1]?.stave;
      if (!stave) return noteMap[clave][0]; // Fallback si no hay stave
      const lineTop = stave.getYForLine(0);
      const lineBottom = stave.getYForLine(4);
      const numSteps = noteMap[clave].length - 1;
      const step = (lineBottom - lineTop) / numSteps;
      const idx = Math.round((lineBottom - y) / step);
      return noteMap[clave][Math.max(0, Math.min(numSteps, idx))];
    }

    async function addElemento(tipo, duracion, noteName) {
      const numBeats = parseInt(compas.split("/")[0]);
      const currentCompas = compases[compases.length - 1];
      const currentBeats = currentCompas.beats;
      const newBeats = duracionBeats[duracion];

      if (currentBeats + newBeats > numBeats) {
        alert("Compás lleno.");
        return;
      }

      let elemento;
      if (tipo === "nota") {
        elemento = new VF.StaveNote({ clef: clave, keys: [noteName], duration: duracion });
        const noteList = noteMap[clave];
        const noteIndex = noteList.indexOf(noteName);
        const bIndex = noteList.indexOf(clave === "treble" ? "b/4" : "b/3");
        if (noteIndex >= bIndex) {
          elemento.setStemDirection(VF.Stem.DOWN);
        }
      } else {
        const restKey = clave === "treble" ? "b/4" : "d/3";
        elemento = new VF.StaveNote({ clef: clave, keys: [restKey], duration: duracion + "r" });
      }

      currentCompas.notas.push({ tipo, duracion, noteName: tipo === "nota" ? noteName : null, vf: elemento });
      currentCompas.beats += newBeats;
      redibujarPentagrama();
      if (tipo === "nota") await play(noteName);
    }

    async function play(noteName) {
      await Tone.start();
      const synth = new Tone.Synth().toDestination();
      const toneNote = noteName.split("/")[0].toUpperCase() + noteName.split("/")[1];
      synth.triggerAttackRelease(toneNote, "8n");
    }

    async function changeNotePitch(compasIndex, notaIndex, direction) {
      const nota = compases[compasIndex].notas[notaIndex];
      const currentNote = nota.noteName;
      const noteList = noteMap[clave];
      const currentIndex = noteList.indexOf(currentNote);
      const newIndex = direction === "up" ? currentIndex + 1 : currentIndex - 1;

      if (newIndex >= 0 && newIndex < noteList.length) {
        nota.noteName = noteList[newIndex];
        nota.vf = new VF.StaveNote({ clef: clave, keys: [nota.noteName], duration: nota.duracion });
        const bIndex = noteList.indexOf(clave === "treble" ? "b/4" : "b/3");
        if (newIndex >= bIndex) {
          nota.vf.setStemDirection(VF.Stem.DOWN);
        }
        redibujarPentagrama();
        await play(nota.noteName);
      }
    }

    function updateDraggableNotes() {

      let globalIndex = 0;
      compases.forEach((compasData, compasIndex) => {
        const noteGs = Array.from(context.svg.querySelectorAll('g.vf-stavenote'));
