<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio Musical • Maximilian 23</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <script src="https://unpkg.com/vexflow@4.2.3/build/cjs/vexflow.js"></script>
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Courier New", Courier, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image:
        radial-gradient(circle at 20% 10%, rgba(0,255,204,0.07) 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(0,255,204,0.05) 0%, transparent 50%);
      background-attachment: fixed;
    }

    header {
      background: rgba(22,27,34,0.92);
      backdrop-filter: blur(8px);
      width: 100%;
      padding: 0.9rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header img {
      height: 48px;
      border-radius: 50%;
      border: 2px solid #00ffcc88;
      box-shadow: 0 0 12px #00ffcc55;
    }

    header h1 {
      font-size: 1.8rem;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffccaa;
    }

    #creado-por {
      position: absolute;
      top: 0.9rem;
      right: 1.2rem;
      font-size: 0.85rem;
      color: #00ffcc88;
    }

    .top-controls {
      width: 100%;
      max-width: 1400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    #titulo-partitura {
      flex: 1;
      min-width: 250px;
      max-width: 500px;
    }

    #titulo-editable {
      width: 100%;
      padding: 0.6rem 1rem;
      font-size: 1.45rem;
      background: rgba(30,45,61,0.4);
      border: 1px solid #00ffcc55;
      border-radius: 10px;
      color: #e6edf3;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    .acciones-dropdown {
      position: relative;
    }

    #acciones-btn {
      padding: 0.6rem 1.3rem;
      background: rgba(0,255,204,0.12);
      border: 1px solid #00ffcc66;
      border-radius: 8px;
      color: #00ffcc;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    #acciones-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: rgba(22,27,34,0.98);
      border: 1px solid #00ffcc66;
      border-radius: 8px;
      min-width: 180px;
      z-index: 50;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
    }

    #acciones-menu.show {
      display: block;
    }

    #acciones-menu button {
      width: 100%;
      text-align: left;
      padding: 0.75rem 1.3rem;
      background: none;
      border: none;
      color: #e6edf3;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.7rem;
    }

    #acciones-menu button:hover {
      background: rgba(0,255,204,0.18);
    }

    #barra-opciones {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      margin: 0.8rem 0 1.2rem;
      padding: 0 1rem;
      max-width: 100%;
      overflow-x: auto;
    }

    #barra-opciones label {
      color: #00ffcc;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    select {
      padding: 0.6rem 1rem;
      background: rgba(30,45,61,0.5);
      border: 1px solid #00ffcc66;
      border-radius: 8px;
      color: #e6edf3;
      min-width: 130px;
      font-size: 0.95rem;
    }

    #main-content {
      width: 100%;
      max-width: 1400px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1rem;
    }

    #pentagrama-container {
      width: 100%;
      background: white;
      border: 2px solid #00ffcc55;
      border-radius: 12px;
      overflow-x: hidden;
      overflow-y: hidden;
      margin: 0.8rem 0 1.5rem;
      min-height: 260px;
      max-height: 70vh;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      position: relative;
      transition: overflow-y 0.3s;
    }

    #pentagrama-container.multi-line {
      overflow-y: auto;
    }

    #pentagrama {
      min-height: 260px;
      width: 100%;
    }

    .tempo-text {
      position: absolute;
      top: 1rem;
      left: 3rem;
      background: rgba(255,255,255,0.9);
      color: #006644;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      border: 1px solid #00cc99;
      font-weight: bold;
      z-index: 10;
    }

    #figuras {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin: 1.2rem 0;
      max-width: 800px;
    }

    .figura {
      width: 62px;
      height: 62px;
      background: rgba(30,45,61,0.4);
      border: 2px solid #00ffcc66;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3rem;
      color: #e6edf3;
      cursor: pointer;
      transition: all 0.3s;
    }

    .figura:hover, .figura.activa {
      background: rgba(0,255,204,0.18);
      border-color: #00ffcc;
      transform: scale(1.12);
      box-shadow: 0 0 16px #00ffcc66;
    }

    #controles-modo, #controles-otros {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin: 1rem 0;
      max-width: 800px;
    }

    button {
      padding: 0.7rem 1.4rem;
      background: rgba(0,255,204,0.12);
      border: 1px solid #00ffcc66;
      border-radius: 8px;
      color: #00ffcc;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    button:hover {
      background: rgba(0,255,204,0.25);
      border-color: #00ffcc;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,255,204,0.2);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.activa,
    #play-stop.play-active {
      background: rgba(0,255,204,0.35) !important;
    }

    #play-stop.stop-active {
      background: rgba(255,80,80,0.35) !important;
      color: #ff8080;
    }

    @media (max-width: 1100px) {
      #barra-opciones {
        gap: 1rem;
        padding: 0 0.5rem;
      }
      select {
        min-width: 120px;
      }
    }

    @media (max-width: 768px) {
      .top-controls {
        flex-direction: column;
        align-items: stretch;
      }
      #barra-opciones {
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.8rem;
      }
      select {
        width: 45%;
      }
      #acciones-dropdown {
        width: 100%;
        text-align: center;
      }
      #figuras {
        gap: 0.8rem;
      }
      .figura {
        width: 56px;
        height: 56px;
        font-size: 2rem;
      }
    }

    @media (max-width: 480px) {
      select {
        width: 100%;
      }
      #barra-opciones {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>

  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Maximilian">
    <h1>Laboratorio Musical</h1>
    <div id="creado-por">Creado por Manuel</div>
  </header>

  <div class="top-controls">
    <div id="titulo-partitura">
      <input type="text" id="titulo-editable" value="Mi Partitura">
    </div>

    <div class="acciones-dropdown">
      <button id="acciones-btn"><i class="fas fa-ellipsis-v"></i> Acciones</button>
      <div id="acciones-menu">
        <button id="abrir"><i class="fas fa-folder-open"></i> Abrir</button>
        <button id="guardar"><i class="fas fa-save"></i> Guardar</button>
        <button id="limpiar"><i class="fas fa-trash"></i> Limpiar</button>
      </div>
      <input type="file" id="file-input" accept=".json" style="display:none">
    </div>
  </div>

  <div id="barra-opciones">
    <label>Clave:</label>
    <select id="clave">
      <option value="treble" selected>Sol</option>
      <option value="bass">Fa</option>
    </select>

    <label>Compás:</label>
    <select id="compas">
      <option value="" selected>---</option>
      <option value="4/4">4/4</option>
      <option value="3/4">3/4</option>
      <option value="2/4">2/4</option>
    </select>

    <label>Velocidad:</label>
    <select id="velocidad">
      <option value="" selected>---</option>
      <option value="80">Andante (80 BPM)</option>
      <option value="90">Moderado (90 BPM)</option>
      <option value="120">Allegro (120 BPM)</option>
      <option value="160">Presto (160 BPM)</option>
    </select>
  </div>

  <div id="main-content">
    <div id="pentagrama-container">
      <div id="tempo-display" class="tempo-text" style="display:none;"></div>
      <div id="pentagrama"></div>
    </div>

    <div id="figuras">
      <div class="figura" data-tipo="nota" data-duracion="w">𝅝</div>
      <div class="figura" data-tipo="nota" data-duracion="h">𝅗𝅥</div>
      <div class="figura" data-tipo="nota" data-duracion="q">𝅘𝅥</div>
      <div class="figura" data-tipo="nota" data-duracion="8">𝅘𝅥𝅮</div>
      <div class="figura" data-tipo="silencio" data-duracion="w">𝄻</div>
      <div class="figura" data-tipo="silencio" data-duracion="h">𝄼</div>
      <div class="figura" data-tipo="silencio" data-duracion="q">𝄽</div>
      <div class="figura" data-tipo="silencio" data-duracion="8">𝄾</div>
    </div>

    <div id="controles-modo">
      <button id="notas"><i class="fas fa-music"></i> Notas</button>
      <button id="play-stop" class="play-active"><i class="fas fa-play"></i> Play</button>
      <button id="metronomo"><i class="fas fa-drum"></i> Metrónomo</button>
    </div>

    <div id="controles-otros">
      <button id="cerrar-compas" disabled><i class="fas fa-check"></i> Cerrar compás</button>
      <button id="borrar-ultimo"><i class="fas fa-backspace"></i> Borrar último</button>
    </div>
  </div>

  <script>
    // =====================================================================
    // SCRIPT COMPLETO (con ajustes para scroll y menú desplegable)
    // =====================================================================

    const VF = Vex.Flow;
    const div = document.getElementById("pentagrama");
    const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
    const container = document.getElementById("pentagrama-container");
    const tempoDisplay = document.getElementById("tempo-display");
    let MAX_LINE_WIDTH = Math.max(280, container.clientWidth - 60);
    const FIRST_STAVE_WIDTH = 350;
    const minStaveWidth = 100;
    const lineHeight = 100;
    const noteWidthFactors = { w: 50, h: 50, q: 55, '8': 80 };
    let width = Math.max(280, container.clientWidth);
    let currentHeight = 280;
    renderer.resize(width, currentHeight);
    const context = renderer.getContext();
    let clave = "treble", compas = "", bpm = 0;
    let lines = [[]], currentLine = 0;
    let figuraActiva = null, showNoteLabels = false, isPlaying = false, metronomeOn = false;
    let metronomeLoop = null;
    let synth = null;

    const noteMap = {
      treble: ["g/3", "a/3", "b/3", "c/4", "d/4", "e/4", "f/4", "g/4", "a/4", "b/4", "c/5", "d/5", "e/5", "f/5", "g/5", "a/5", "b/5"],
      bass: ["b/1", "c/2", "d/2", "e/2", "f/2", "g/2", "a/2", "b/2", "c/3", "d/3", "e/3", "f/3", "g/3", "a/3", "b/3", "c/4", "d/4"]
    };
    const noteNameMap = { c: "Do", d: "Re", e: "Mi", f: "Fa", g: "Sol", a: "La", b: "Si" };
    const duracionBeats = { w: 4, h: 2, q: 1, '8': 0.5 };
    const duracionTiempo = { w: "1n", h: "2n", q: "4n", '8': "8n" };
    const tempoNames = {
      80: "Andante (80 BPM)",
      90: "Moderado (90 BPM)",
      120: "Allegro (120 BPM)",
      160: "Presto (160 BPM)"
    };

    function getNoteName(note) {
      const [letter, octave] = note.split("/");
      return `${noteNameMap[letter]} ${octave}`;
    }

    function initSynth() {
      if (!synth) synth = new Tone.Synth().toDestination();
    }

    function init() {
      const claveSelect = document.getElementById("clave");
      const compasSelect = document.getElementById("compas");
      const velocidadSelect = document.getElementById("velocidad");
      compasSelect.value = "";
      velocidadSelect.value = "";
      clave = claveSelect.value || "treble";
      compas = compasSelect.value || "";
      bpm = +velocidadSelect.value || 0;
      if (bpm) {
        tempoDisplay.textContent = tempoNames[bpm];
        tempoDisplay.style.display = "block";
      }
      window.addEventListener('resize', () => {
        width = Math.max(280, container.clientWidth);
        MAX_LINE_WIDTH = width - 60;
        renderer.resize(width, currentHeight);
        reflowLines();
        redibujarPentagrama();
      });
      claveSelect.onchange = e => { clave = e.target.value; resetPartitura(); };
      compasSelect.onchange = e => {
        compas = e.target.value;
        resetPartitura();
        document.getElementById("play-stop").disabled = !compas;
      };
      velocidadSelect.onchange = e => {
        bpm = +e.target.value;
        if (bpm) {
          tempoDisplay.textContent = tempoNames[bpm];
          tempoDisplay.style.display = "block";
        } else {
          tempoDisplay.style.display = "none";
        }
        if (Tone.Transport.state === "started") Tone.Transport.bpm.value = bpm;
        redibujarPentagrama();
      };
      initFiguras();
      initControles();
      resetPartitura();

      // Menú desplegable
      const accionesBtn = document.getElementById('acciones-btn');
      const accionesMenu = document.getElementById('acciones-menu');
      accionesBtn.onclick = () => accionesMenu.classList.toggle('show');
      document.addEventListener('click', e => {
        if (!accionesBtn.contains(e.target) && !accionesMenu.contains(e.target)) {
          accionesMenu.classList.remove('show');
        }
      });
    }

    function resetPartitura() {
      lines = [[]];
      currentLine = 0;
      if (compas) lines[0].push({ notas: [], beats: 0, closed: false, staveWidth: FIRST_STAVE_WIDTH });
      redibujarPentagrama();
    }

    function reflowLines() {
      let i = 0;
      while (i < lines.length) {
        let sum = lines[i].reduce((s, c) => s + (c.staveWidth || minStaveWidth), 0);
        if (sum > MAX_LINE_WIDTH && lines[i].length > 1) {
          const last = lines[i].pop();
          if (i + 1 < lines.length) lines[i + 1].unshift(last);
          else lines.push([last]);
        } else i++;
      }
      for (let li = lines.length - 1; li >= 0; li--) {
        if (lines[li].some(c => !c.closed)) {
          currentLine = li;
          break;
        }
      }
    }

    function calculateStaveWidth(c, li, ci) {
      const voice = new VF.Voice({ num_beats: +compas.split("/")[0], beat_value: 4 });
      voice.setStrict(false);
      if (c.notas.length) voice.addTickables(c.notas.map(n => n.vf));
      const formatter = new VF.Formatter();
      if (c.notas.length) formatter.joinVoices([voice]);
      let w = c.staveWidth || minStaveWidth;
      if (c.notas.length) {
        let noteWidth = c.notas.reduce((sum, n) => sum + (noteWidthFactors[n.duracion] || 50), 0);
        w = Math.max(w, formatter.preCalculateMinTotalWidth([voice]) + noteWidth + 50);
      }
      if (li === 0 && ci === 0) w = Math.max(w, FIRST_STAVE_WIDTH);
      return w;
    }

    function redibujarPentagrama() {
      if (!isPlaying) document.querySelectorAll(".nota, .note-label").forEach(el => el.remove());
      context.clear();
      let y = 40;
      lines = lines.filter(line => line.length > 0);
      if (lines.length === 0) {
        lines = [[{ notas: [], beats: 0, closed: false, staveWidth: FIRST_STAVE_WIDTH }]];
        currentLine = 0;
      }

      if (compas) {
        lines.forEach((line, li) => {
          let x = 10;
          line.forEach((c, ci) => {
            if (c.notas.length === 0 && ci !== line.length - 1 && !c.closed) return;
            const voice = new VF.Voice({ num_beats: +compas.split("/")[0], beat_value: 4 });
            voice.setStrict(false);
            if (c.notas.length) voice.addTickables(c.notas.map(n => n.vf));
            const formatter = new VF.Formatter();
            if (c.notas.length) formatter.joinVoices([voice]);
            let staveWidth = calculateStaveWidth(c, li, ci);
            c.staveWidth = staveWidth;
            const stave = new VF.Stave(x, y, staveWidth);
            if (li === 0 && ci === 0) stave.addClef(clave).addTimeSignature(compas);
            else if (c.closed) stave.addModifier(new VF.Barline(VF.Barline.type.SINGLE));
            stave.setContext(context).draw();
            c.stave = stave;
            if (c.notas.length) {
              formatter.format([voice], staveWidth - 30);
              voice.draw(context, stave);
            }
            x += staveWidth;
          });
          y += lineHeight;
        });
      }

      currentHeight = Math.max(260, y + 60);
      renderer.resize(width, currentHeight);
      container.style.height = `${currentHeight}px`;

      // Control dinámico de scroll vertical
      if (lines.length > 1) {
        container.classList.add('multi-line');
      } else {
        container.classList.remove('multi-line');
      }

      if (!isPlaying) updateDraggableNotes();

      const curr = lines[currentLine]?.[lines[currentLine].length - 1];
      document.getElementById("cerrar-compas").disabled = !curr || curr.closed || curr.beats !== +compas.split("/")[0];
      if (curr?.stave && !isPlaying) {
        setTimeout(() => {
          div.scrollTop = Math.max(0, curr.stave.getYForLine(0) - 60);
        }, 100);
      }
    }

    // Resto de funciones (initFiguras, initControles, playStop, stopPlayback, etc.)
    // Mantienen la misma lógica que tenías originalmente
    // Solo copio las partes modificadas o nuevas para no alargar demasiado

    function initFiguras() {
      document.querySelectorAll(".figura").forEach(f => {
        f.onclick = () => {
          document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
          figuraActiva = { tipo: f.dataset.tipo, duracion: f.dataset.duracion };
          f.classList.add("activa");
          initSynth();
        };
      });
    }

    function initControles() {
      document.getElementById("notas").onclick = () => {
        showNoteLabels = !showNoteLabels;
        document.getElementById("notas").classList.toggle("activa", showNoteLabels);
      };
      document.getElementById("metronomo").onclick = () => {
        metronomeOn = !metronomeOn;
        document.getElementById("metronomo").classList.toggle("activa", metronomeOn);
      };
      document.getElementById("play-stop").onclick = playStop;
      document.getElementById("cerrar-compas").onclick = cerrarCompas;
      document.getElementById("borrar-ultimo").onclick = borrarUltimo;
      document.getElementById("limpiar").onclick = () => {
        if (confirm("¿Limpiar toda la partitura?")) resetPartitura();
      };
      document.getElementById("guardar").onclick = guardar;
      document.getElementById("abrir").onclick = () => document.getElementById("file-input").click();
      document.getElementById("file-input").onchange = abrir;
    }

    // ... (pega aquí el resto de tus funciones originales: playStop, stopPlayback, updateDraggableNotes, changePitch, cerrarCompas, getNoteFromY, addNota, borrarUltimo, guardar, abrir)

    init();
  </script>
</body>
</html>
