<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio Musical • Maximilian 23 • Versión BETA</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <script src="https://unpkg.com/vexflow@4.2.3/build/cjs/vexflow.js"></script>
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Courier New", Courier, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image:
        radial-gradient(circle at 20% 10%, rgba(0,255,204,0.07) 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(0,255,204,0.05) 0%, transparent 50%);
      background-attachment: fixed;
    }
    header {
      background: rgba(22,27,34,0.92);
      backdrop-filter: blur(8px);
      width: 100%;
      padding: 0.9rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header img {
      height: 48px;
      border-radius: 50%;
      border: 2px solid #00ffcc88;
      box-shadow: 0 0 12px #00ffcc55;
    }
    header h1 {
      font-size: 1.8rem;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffccaa;
    }
    #creado-por {
      position: absolute;
      top: 0.9rem;
      right: 1.2rem;
      font-size: 0.85rem;
      color: #00ffcc88;
    }
    .titulo-container {
      width: 100%;
      max-width: 900px;
      margin: 1.2rem 0 0.8rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 1.5rem;
    }
    #titulo-partitura { flex: 1; min-width: 300px; max-width: 500px; }
    #titulo-editable {
      width: 100%;
      padding: 0.7rem 1rem;
      font-size: 1.5rem;
      background: rgba(30,45,61,0.4);
      border: 1px solid #00ffcc55;
      border-radius: 10px;
      color: #e6edf3;
      text-align: center;
      backdrop-filter: blur(4px);
    }
    #autor-container { flex: 1; min-width: 250px; max-width: 350px; display: flex; align-items: center; gap: 0.6rem; }
    #autor-label { color: #00ffcc; font-weight: bold; white-space: nowrap; font-size: 1.1rem; }
    #autor-input {
      flex: 1;
      padding: 0.7rem 1rem;
      font-size: 1.2rem;
      background: rgba(30,45,61,0.4);
      border: 1px solid #00ffcc55;
      border-radius: 10px;
      color: #e6edf3;
      text-align: left;
      backdrop-filter: blur(4px);
    }
    .acciones-dropdown { position: relative; z-index: 200; }
    #acciones-btn {
      padding: 0.6rem 1.3rem;
      background: rgba(0,255,204,0.18);
      border: 1px solid #00ffcc88;
      border-radius: 8px;
      color: #00ffcc;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    #acciones-btn:hover { background: rgba(0,255,204,0.28); box-shadow: 0 0 12px rgba(0,255,204,0.4); }
    #acciones-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: rgba(13,17,23,0.98);
      border: 2px solid #00ffcc88;
      border-radius: 8px;
      min-width: 220px;
      z-index: 9999 !important;
      box-shadow: 0 10px 30px rgba(0,255,204,0.4);
      backdrop-filter: blur(8px);
    }
    #acciones-menu.show { display: block; }
    #acciones-menu button {
      width: 100%;
      text-align: left;
      padding: 0.8rem 1.4rem;
      background: none;
      border: none;
      color: #e6edf3;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    #acciones-menu button:hover { background: rgba(0,255,204,0.25); }
    #barra-opciones {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      margin: 0.8rem 0 1.2rem;
      padding: 0 1rem;
      flex-wrap: nowrap;
      max-width: 900px;
      overflow: visible !important;
    }
    #barra-opciones label { color: #00ffcc; white-space: nowrap; font-size: 0.95rem; }
    select {
      padding: 0.6rem 1rem;
      background: rgba(30,45,61,0.5);
      border: 1px solid #00ffcc66;
      border-radius: 8px;
      color: #e6edf3;
      min-width: 130px;
      font-size: 0.95rem;
    }
    .main-layout {
      width: 100%;
      max-width: 1200px; /* más ancho para centrar mejor */
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      padding: 0 2rem 2rem;
      align-items: flex-start;
      position: relative;
    }
    .sidebar-left, .sidebar-right {
      width: 140px;
      flex-shrink: 0;
      position: sticky;
      top: 120px;
      align-self: flex-start;
    }
    .sidebar-left {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      padding: 1rem 0.6rem;
      background: rgba(30,45,61,0.3);
      border-radius: 12px;
      border: 1px solid #00ffcc33;
      backdrop-filter: blur(6px);
    }
    .figura {
      width: 58px;
      height: 58px;
      background: rgba(30,45,61,0.4);
      border: 2px solid #00ffcc66;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.9rem;
      color: #e6edf3;
      cursor: pointer;
      transition: all 0.3s;
    }
    .figura:hover, .figura.activa {
      background: rgba(0,255,204,0.18);
      border-color: #00ffcc;
      transform: scale(1.12);
      box-shadow: 0 0 16px #00ffcc66;
    }
    .figura[data-tipo="puntillo"], .figura[data-tipo="ligadura"] { font-size: 1.6rem; }
    .pentagrama-wrapper {
      flex: 1;
      background: white;
      border: 2px solid #00ffcc55;
      border-radius: 12px;
      overflow: hidden;
      min-height: 340px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      position: relative;
      padding: 40px 60px; /* más espacio a izquierda y derecha para centrar y dar aire */
      max-width: 900px;
      margin-left: auto;
      margin-right: auto;
    }
    #pentagrama-container {
      width: 100%;
      min-height: 300px;
    }
    #pentagrama { width: 100%; }
    .sidebar-right {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      padding: 1rem 0.6rem;
      background: rgba(30,45,61,0.3);
      border-radius: 12px;
      border: 1px solid #00ffcc33;
      backdrop-filter: blur(6px);
    }
    .sidebar-right button {
      padding: 0.8rem 0.6rem;
      background: rgba(0,255,204,0.12);
      border: 1px solid #00ffcc66;
      border-radius: 8px;
      color: #00ffcc;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      font-size: 0.95rem;
    }
    .sidebar-right button.activa {
      background: rgba(0,255,204,0.35) !important;
      border-color: #00ffcc;
      box-shadow: 0 0 12px rgba(0,255,204,0.4);
    }
    .sidebar-right button:hover:not(:disabled) {
      background: rgba(0,255,204,0.25);
      border-color: #00ffcc;
      transform: translateY(-1px);
    }
    .sidebar-right button:disabled { opacity: 0.4; cursor: not-allowed; }
    .tempo-text {
      position: absolute;
      top: 1rem;
      left: 3rem;
      background: rgba(255,255,255,0.9);
      color: #006644;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      border: 1px solid #00cc99;
      font-weight: bold;
      z-index: 10;
      font-size: 0.9rem;
    }
    .note-label {
      position: absolute;
      color: #00ffcc;
      background: rgba(13,17,23,0.8);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid #00ffcc66;
      font-size: 0.9rem;
      pointer-events: none;
      z-index: 50;
      white-space: nowrap;
    }
    .nota { position: absolute; cursor: move; z-index: 100; font-size: 0.9rem; }
    .nota:hover .plus, .nota:hover .minus { opacity: 1; }
    .nota .plus, .nota .minus {
      width: 20px; height: 20px; border-radius: 50%;
      background: #00ffcc; color: #0d1117;
      position: absolute; text-align: center; line-height: 20px;
      font-size: 0.8rem; font-weight: bold; cursor: pointer;
      opacity: 0; transition: all 0.25s; z-index: 101;
      border: 2px solid #0d1117; left: 50%; transform: translateX(-50%);
    }
    .nota .plus:hover, .nota .minus:hover { background: #00cc9e; transform: translateX(-50%) scale(1.2); }
    .nota .plus { top: -25px; }
    .nota .minus { bottom: -25px; }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Maximilian">
    <h1>Laboratorio Musical</h1>
    <div id="creado-por">Creado por Manuel</div>
  </header>

  <div class="titulo-container">
    <div id="titulo-partitura">
      <input type="text" id="titulo-editable" value="Mi Partitura">
    </div>
    <div id="autor-container">
      <label id="autor-label">Autor:</label>
      <input type="text" id="autor-input" placeholder="Tu nombre" value="">
    </div>
  </div>

  <div id="barra-opciones">
    <div class="acciones-dropdown">
      <button id="acciones-btn"><i class="fas fa-file"></i> Archivo</button>
      <div id="acciones-menu">
        <button id="abrir"><i class="fas fa-folder-open"></i> Abrir</button>
        <button id="guardar"><i class="fas fa-save"></i> Guardar</button>
        <button id="export-pdf"><i class="fas fa-file-pdf"></i> Exportar a PDF</button>
        <button id="limpiar"><i class="fas fa-trash"></i> Limpiar</button>
      </div>
      <input type="file" id="file-input" accept=".json" style="display:none">
    </div>
    <label>Clave:</label>
    <select id="clave">
      <option value="treble" selected>Sol</option>
      <option value="bass">Fa</option>
    </select>
    <label>Compás:</label>
    <select id="compas">
      <option value="" selected>---</option>
      <option value="4/4">4/4</option>
      <option value="3/4">3/4</option>
      <option value="2/4">2/4</option>
    </select>
    <label>Velocidad:</label>
    <select id="velocidad">
      <option value="" selected>---</option>
      <option value="80">Andante (80 BPM)</option>
      <option value="90">Moderado (90 BPM)</option>
      <option value="120">Allegro (120 BPM)</option>
      <option value="160">Presto (160 BPM)</option>
    </select>
  </div>

  <div class="main-layout">
    <div class="sidebar-left" id="figuras">
      <div class="figura" data-tipo="nota" data-duracion="w">𝅝</div>
      <div class="figura" data-tipo="nota" data-duracion="h">𝅗𝅥</div>
      <div class="figura" data-tipo="nota" data-duracion="q">𝅘𝅥</div>
      <div class="figura" data-tipo="nota" data-duracion="8">𝅘𝅥𝅮</div>
      <div class="figura" data-tipo="silencio" data-duracion="q">𝄽</div>
      <div class="figura" data-tipo="puntillo" title="Puntillo">•</div>
      <div class="figura" data-tipo="ligadura" title="Ligadura">↝</div>
    </div>

    <div class="pentagrama-wrapper">
      <div id="pentagrama-container">
        <div id="tempo-display" class="tempo-text" style="display:none;"></div>
        <div id="pentagrama"></div>
      </div>
    </div>

    <div class="sidebar-right">
      <button id="cerrar-compas" disabled><i class="fas fa-check"></i> Cerrar compás</button>
      <button id="notas"><i class="fas fa-music"></i> Notas</button>
      <button id="metronomo"><i class="fas fa-drum"></i> Metrónomo</button>
      <button id="play-stop" class="play-active"><i class="fas fa-play"></i> Play</button>
      <button id="borrar-ultimo"><i class="fas fa-backspace"></i> Borrar último</button>
    </div>
  </div>

  <script>
    const VF = Vex.Flow;
    const div = document.getElementById("pentagrama");
    const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
    const container = document.getElementById("pentagrama-container");
    const tempoDisplay = document.getElementById("tempo-display");

    const PAGE_WIDTH = 820;
    const MAX_LINE_WIDTH = PAGE_WIDTH - 80;
    const FIRST_MEASURE_WIDTH = 280;
    const MIN_MEASURE_WIDTH = 110;
    const LINE_HEIGHT = 120;

    let currentHeight = 380;
    renderer.resize(PAGE_WIDTH, currentHeight);
    const context = renderer.getContext();

    let clef = "treble";
    let timeSig = "";
    let bpm = 0;
    let measures = [];
    let activeFigure = null;
    let showLabels = false;
    let isPlaying = false;
    let metronomeOn = false;
    let metronomeLoop = null;
    let synth = null;
    let tieMode = false;

    const notePositions = {
      treble: ["g/3","a/3","b/3","c/4","d/4","e/4","f/4","g/4","a/4","b/4","c/5","d/5","e/5","f/5","g/5","a/5","b/5"],
      bass: ["b/1","c/2","d/2","e/2","f/2","g/2","a/2","b/2","c/3","d/3","e/3","f/3","g/3","a/3","b/3","c/4","d/4"]
    };
    const noteNames = {c:"Do",d:"Re",e:"Mi",f:"Fa",g:"Sol",a:"La",b:"Si"};
    const beatValues = {w:4, h:2, q:1, '8':0.5};
    const toneDurations = {w:"1n", h:"2n", q:"4n", '8':"8n"};
    const tempoLabels = {80:"Andante (80 BPM)",90:"Moderado (90 BPM)",120:"Allegro (120 BPM)",160:"Presto (160 BPM)"};

    function getDisplayName(note) {
      const [letter, oct] = note.split("/");
      return `${noteNames[letter]} ${oct}`;
    }

    function initSynth() {
      if (!synth) synth = new Tone.Synth().toDestination();
    }

    function init() {
      document.getElementById("compas").onchange = e => { timeSig = e.target.value.trim(); resetScore(); };
      document.getElementById("clave").onchange = e => { clef = e.target.value; resetScore(); };
      document.getElementById("velocidad").onchange = e => {
        bpm = +e.target.value;
        tempoDisplay.textContent = tempoLabels[bpm] || "";
        tempoDisplay.style.display = bpm ? "block" : "none";
      };

      document.querySelectorAll("#figuras .figura").forEach(el => {
        el.onclick = () => {
          document.querySelectorAll("#figuras .figura").forEach(e => e.classList.remove("activa"));
          activeFigure = { type: el.dataset.tipo, dur: el.dataset.duracion || null };
          el.classList.add("activa");
          initSynth();
        };
      });

      document.getElementById("cerrar-compas").onclick = closeMeasure;
      document.getElementById("borrar-ultimo").onclick = deleteLast;
      document.getElementById("limpiar").onclick = () => { if (confirm("¿Limpiar toda la partitura?")) resetScore(); };
      document.getElementById("guardar").onclick = saveJson;
      document.getElementById("abrir").onclick = () => document.getElementById("file-input").click();
      document.getElementById("file-input").onchange = loadJson;
      document.getElementById("export-pdf").onclick = exportPDF;
      document.getElementById("play-stop").onclick = togglePlay;
      document.getElementById("notas").onclick = () => {
        showLabels = !showLabels;
        document.getElementById("notas").classList.toggle("activa", showLabels);
      };
      document.getElementById("metronomo").onclick = () => {
        metronomeOn = !metronomeOn;
        document.getElementById("metronomo").classList.toggle("activa", metronomeOn);
      };

      const accionesBtn = document.getElementById('acciones-btn');
      const accionesMenu = document.getElementById('acciones-menu');
      accionesBtn.addEventListener('click', e => {
        e.preventDefault();
        e.stopPropagation();
        accionesMenu.classList.toggle('show');
      });
      document.addEventListener('click', e => {
        if (!accionesBtn.contains(e.target)) {
          accionesMenu.classList.remove('show');
        }
      });

      resetScore();
    }

    function resetScore() {
      measures = [];
      if (timeSig) addMeasure();
      redibujar();
    }

    function addMeasure() {
      measures.push({ notes: [], beats: 0, closed: false });
    }

    function redibujar() {
      context.clear();
      document.querySelectorAll(".nota, .note-label").forEach(el => el.remove());

      let y = 35;
      let currentLine = [];
      let used = 0;

      measures.forEach((m, idx) => {
        const voice = new VF.Voice({num_beats: +timeSig.split("/")[0], beat_value: 4});
        voice.setStrict(false);
        if (m.notes.length) voice.addTickables(m.notes.map(n => n.vexNote));

        const fmt = new VF.Formatter();
        if (m.notes.length) fmt.joinVoices([voice]);

        let minW = MIN_MEASURE_WIDTH;
        if (m.notes.length) minW = Math.max(minW, fmt.preCalculateMinTotalWidth([voice]) + 70);
        if (idx === 0) minW = Math.max(minW, FIRST_MEASURE_WIDTH);

        if (used + minW > MAX_LINE_WIDTH && currentLine.length) {
          drawLine(currentLine, y);
          y += LINE_HEIGHT;
          used = 0;
          currentLine = [];
        }

        currentLine.push({m, minW, globalIdx: idx});
        used += minW;
      });

      if (currentLine.length) drawLine(currentLine, y);

      currentHeight = Math.max(380, y + 100);
      renderer.resize(PAGE_WIDTH, currentHeight);
      container.style.height = currentHeight + "px";
      container.classList.toggle("multi-line", measures.length > 3);

      updateCloseButton();

      // Scroll automático al último compás abierto
      const lastMeasure = measures[measures.length - 1];
      if (lastMeasure && !lastMeasure.closed) {
        setTimeout(() => {
          const lastY = (measures.length - 1) * LINE_HEIGHT;
          container.scrollTop = lastY - 100;
        }, 100);
      }
    }

    function drawLine(lineItems, yPos) {
      let x = 30;
      let sumMin = lineItems.reduce((s, it) => s + it.minW, 0);
      let extra = MAX_LINE_WIDTH - sumMin;

      lineItems.forEach(item => {
        let w = item.minW + (extra > 0 ? extra * (item.minW / sumMin) : 0);
        w = Math.max(MIN_MEASURE_WIDTH, w);

        const {m, globalIdx} = item;
        const stave = new VF.Stave(x, yPos, w);

        if (globalIdx === 0) stave.addClef(clef).addTimeSignature(timeSig);

        const isLast = globalIdx === measures.length - 1;
        stave.setEndBarType(isLast ? VF.Barline.type.DOUBLE : (m.closed || m.notes.length ? VF.Barline.type.SINGLE : VF.Barline.type.NONE));

        stave.setContext(context).draw();

        if (m.notes.length) {
          const voice = new VF.Voice({num_beats: +timeSig.split("/")[0], beat_value: 4});
          voice.setStrict(false);
          voice.addTickables(m.notes.map(n => n.vexNote));

          const formatter = new VF.Formatter();
          formatter.joinVoices([voice]);
          formatter.format([voice], w - 40, {auto_beam: true, align_rests: true});

          voice.draw(context, stave);

          let prev = null;
          m.notes.forEach(n => {
            if (n.dot) n.vexNote.addDotToAll();
            if (n.tiedToPrev && prev) {
              new VF.StaveTie({first_note: prev.vexNote, last_note: n.vexNote}).setContext(context).draw();
            }
            prev = n;
          });
        }

        x += w;
      });
    }

    function closeMeasure() {
      const cur = measures[measures.length - 1];
      const beatsPer = +timeSig.split("/")[0];
      if (cur && !cur.closed && cur.beats >= beatsPer - 0.01) {
        cur.closed = true;
        addMeasure();
        redibujar();
      }
    }

    function deleteLast() {
      if (measures.length === 0) return;
      const last = measures[measures.length - 1];
      if (last.notes.length > 0) {
        const removed = last.notes.pop();
        last.beats -= beatValues[removed.dur] * (removed.dot ? 1.5 : 1);
        last.closed = false;
      } else if (measures.length > 1) {
        measures.pop();
      }
      tieMode = false;
      redibujar();
    }

    div.onclick = e => {
      if (!timeSig || !activeFigure) return;
      const rect = div.getBoundingClientRect();
      const clickX = e.clientX - rect.left + div.scrollLeft;
      const clickY = e.clientY - rect.top + div.scrollTop;

      const note = getNoteAtY(clickY);
      if (!note) return;

      const curMeasure = measures[measures.length - 1];
      const beatsPer = +timeSig.split("/")[0];
      const durBeat = beatValues[activeFigure.dur] || 0;

      if (activeFigure.type === "puntillo") {
        const lastNote = curMeasure.notes.slice().reverse().find(n => n.type === "nota");
        if (lastNote) {
          const extra = beatValues[lastNote.dur] * 0.5;
          if (curMeasure.beats + extra <= beatsPer + 0.01) {
            lastNote.dot = true;
            redibujar();
          } else {
            alert("¡No cabe el puntillo en el compás!");
          }
        }
        activeFigure = null;
        return;
      }

      if (activeFigure.type === "ligadura") {
        tieMode = true;
        activeFigure = null;
        return;
      }

      if (curMeasure.beats + durBeat > beatsPer + 0.01) {
        const figuraName = activeFigure.dur === "w" ? "redonda" :
                           activeFigure.dur === "h" ? "blanca" :
                           activeFigure.dur === "q" ? "negra" :
                           activeFigure.dur === "8" ? "corchea" : "figura";
        alert(`¡No cabe ${figuraName} en el compás!`);
        return;
      }

      let vexNote;
      if (activeFigure.type === "nota") {
        const pos = notePositions[clef];
        const stemDir = pos.indexOf(note) >= (clef === "treble" ? 8 : 7) ? VF.Stem.DOWN : VF.Stem.UP;
        vexNote = new VF.StaveNote({keys: [note], duration: activeFigure.dur, clef, stem_direction: stemDir});
      } else {
        const restPos = clef === "treble" ? "b/4" : "d/3";
        vexNote = new VF.StaveNote({keys: [restPos], duration: activeFigure.dur + "r"});
      }

      const entry = {
        type: activeFigure.type,
        dur: activeFigure.dur,
        note: activeFigure.type === "nota" ? note : null,
        vexNote,
        dot: false,
        tiedToPrev: false
      };

      if (tieMode && curMeasure.notes.length > 0) {
        const prev = curMeasure.notes[curMeasure.notes.length - 1];
        if (prev.type === "nota" && prev.note === note) {
          entry.tiedToPrev = true;
          tieMode = false;
        } else {
          tieMode = false;
        }
      }

      curMeasure.notes.push(entry);
      curMeasure.beats += durBeat;

      redibujar();

      if (activeFigure.type === "nota") {
        const pitch = note.split("/")[0].toUpperCase() + note.split("/")[1];
        synth.triggerAttackRelease(pitch, toneDurations[activeFigure.dur]);
      }
    };

    function getNoteAtY(y) {
      const rel = (y - 35) % LINE_HEIGHT;
      if (rel < 0 || rel > 160) return null;
      const list = notePositions[clef];
      const step = 80 / (list.length - 1);
      let i = Math.round((80 - rel) / step);
      i = Math.max(0, Math.min(list.length - 1, i));
      return list[i];
    }

    function updateCloseButton() {
      const cur = measures[measures.length - 1];
      const beatsPer = +timeSig.split("/")[0];
      document.getElementById("cerrar-compas").disabled = !cur || cur.closed || cur.beats < beatsPer - 0.1 || cur.notes.length === 0;
    }

    function togglePlay() {
      const playStopButton = document.getElementById("play-stop");
      if (isPlaying) {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        if (metronomeLoop) {
          metronomeLoop.stop();
          metronomeLoop.dispose();
          metronomeLoop = null;
        }
        context.svg.querySelectorAll('g.vf-stavenote path, g.vf-stavenote line, g.vf-stavenote circle').forEach(el => {
          el.style.stroke = 'black';
          el.style.fill = 'black';
        });
        document.querySelectorAll(".note-label").forEach(el => el.remove());
        playStopButton.innerHTML = '<i class="fas fa-play"></i> Play';
        playStopButton.classList.remove("stop-active");
        playStopButton.classList.add("play-active");
        isPlaying = false;
        return;
      }

      if (!timeSig || !bpm) return alert("Selecciona compás y velocidad");

      Tone.start().then(() => {
        initSynth();
        document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
        activeFigure = null;
        Tone.Transport.bpm.value = bpm;
        Tone.Transport.cancel();

        let totalTime = 0;
        let events = [];
        let gi = 0;

        measures.forEach(m => {
          let prevNota = null;
          m.notes.forEach(n => {
            if (n.type === "nota") {
              let dur = toneDurations[n.dur];
              if (n.dot) dur = Tone.Time(dur).add(Tone.Time(dur).div(2)).toNotation();
              if (prevNota && n.tiedToPrev) {
                events[events.length - 1].dur = Tone.Time(events[events.length - 1].dur).add(dur).toNotation();
              } else {
                events.push({
                  time: totalTime,
                  note: n.note.split("/")[0].toUpperCase() + n.note.split("/")[1],
                  dur: dur,
                  gi: gi,
                  noteName: getDisplayName(n.note)
                });
              }
              prevNota = n;
            } else {
              prevNota = null;
            }
            totalTime += Tone.Time(toneDurations[n.dur]).toSeconds() * (n.dot ? 1.5 : 1);
            gi++;
          });
        });

        if (!events.length && !metronomeOn) return alert("¡Añade notas!");

        const numBeats = +timeSig.split("/")[0];
        const beatDuration = Tone.Time("4n").toSeconds();
        const introTime = metronomeOn ? numBeats * beatDuration : 0;

        if (metronomeOn) {
          metronomeLoop = new Tone.Loop((time) => {
            new Tone.MembraneSynth().toDestination().triggerAttackRelease("C3", "8n", time);
          }, "4n").start(0);
        }

        const allNotes = Array.from(context.svg.querySelectorAll('g.vf-stavenote'));

        events.forEach(event => {
          const startTime = event.time + introTime;
          Tone.Transport.schedule(time => {
            synth.triggerAttackRelease(event.note, event.dur, time);
          }, startTime);

          Tone.Transport.schedule(time => {
            const noteElement = allNotes[event.gi];
            if (noteElement) {
              noteElement.querySelectorAll('path, line, circle').forEach(el => {
                el.style.stroke = '#00ffcc';
                el.style.fill = '#00ffcc';
              });
            }
          }, startTime);

          if (showLabels) {
            Tone.Transport.schedule(time => {
              const noteElement = allNotes[event.gi];
              if (noteElement) {
                const bbox = noteElement.getBBox();
                const label = document.createElement("div");
                label.className = "note-label";
                label.textContent = event.noteName;
                label.style.position = 'absolute';
                label.style.left = `${bbox.x + bbox.width / 2}px`;
                label.style.top = `${bbox.y + bbox.height + 12}px`;
                label.style.transform = 'translateX(-50%)';
                label.style.whiteSpace = 'nowrap';
                div.appendChild(label);
                setTimeout(() => {
                  label.style.opacity = '0';
                  setTimeout(() => label.remove(), 400);
                }, Tone.Time(event.dur).toSeconds() * 1000 * 0.8);
              }
            }, startTime);
          }

          Tone.Transport.schedule(time => {
            const noteElement = allNotes[event.gi];
            if (noteElement) {
              noteElement.querySelectorAll('path, line, circle').forEach(el => {
                el.style.stroke = 'black';
                el.style.fill = 'black';
              });
            }
          }, startTime + Tone.Time(event.dur).toSeconds());
        });

        Tone.Transport.schedule(() => stopPlayback(), totalTime + introTime);

        Tone.Transport.start();
        isPlaying = true;
        playStopButton.innerHTML = '<i class="fas fa-stop"></i> Stop';
        playStopButton.classList.remove("play-active");
        playStopButton.classList.add("stop-active");
      }).catch(err => {
        console.error("Error al iniciar Tone.js:", err);
        alert("Error al iniciar la reproducción.");
      });
    }

    function stopPlayback() {
      Tone.Transport.stop();
      Tone.Transport.cancel();
      if (metronomeLoop) {
        metronomeLoop.stop();
        metronomeLoop.dispose();
        metronomeLoop = null;
      }
      context.svg.querySelectorAll('g.vf-stavenote path, g.vf-stavenote line, g.vf-stavenote circle').forEach(el => {
        el.style.stroke = 'black';
        el.style.fill = 'black';
      });
      document.querySelectorAll(".note-label").forEach(el => el.remove());
      const playStopButton = document.getElementById("play-stop");
      playStopButton.innerHTML = '<i class="fas fa-play"></i> Play';
      playStopButton.classList.remove("stop-active");
      playStopButton.classList.add("play-active");
      isPlaying = false;
    }

    function saveJson() {
      const data = {
        title: document.getElementById("titulo-editable").value,
        author: document.getElementById("autor-input").value,
        clef, timeSig, bpm,
        measures: measures.map(m => ({
          notes: m.notes.map(n => ({type:n.type, dur:n.dur, note:n.note, dot:n.dot, tiedToPrev:n.tiedToPrev})),
          beats: m.beats, closed: m.closed
        }))
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = (data.title || "partitura") + ".json";
      a.click();
    }

    function loadJson(e) {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          document.getElementById("titulo-editable").value = d.title || "Mi Partitura";
          document.getElementById("autor-input").value = d.author || "";
          document.getElementById("clave").value = d.clef;
          document.getElementById("compas").value = d.timeSig;
          document.getElementById("velocidad").value = d.bpm;

          clef = d.clef; timeSig = d.timeSig; bpm = d.bpm;

          measures = d.measures.map(m => {
            const measure = {notes: [], beats: m.beats, closed: m.closed};
            m.notes.forEach(n => {
              let vn;
              if (n.type === "nota") {
                const pos = notePositions[clef];
                const stem = pos.indexOf(n.note) >= (clef === "treble" ? 8 : 7) ? VF.Stem.DOWN : VF.Stem.UP;
                vn = new VF.StaveNote({keys:[n.note], duration:n.dur, clef, stem_direction: stem});
                if (n.dot) vn.addDotToAll();
              } else {
                const rp = clef === "treble" ? "b/4" : "d/3";
                vn = new VF.StaveNote({keys:[rp], duration: n.dur + "r"});
              }
              measure.notes.push({type:n.type, dur:n.dur, note:n.note, vexNote:vn, dot:n.dot, tiedToPrev:n.tiedToPrev});
            });
            return measure;
          });
          redibujar();
        } catch(err) { alert("Archivo inválido"); }
      };
      r.readAsText(file);
    }

    function exportPDF() {
      const title = document.getElementById("titulo-editable").value.trim() || "Mi Partitura";
      const author = document.getElementById("autor-input").value.trim() || "";

      const pdfContent = document.createElement("div");
      pdfContent.style.width = "794px";
      pdfContent.style.padding = "40px 50px";
      pdfContent.style.background = "white";
      pdfContent.style.position = "relative";
      pdfContent.style.fontFamily = '"Courier New", Courier, monospace';

      const tDiv = document.createElement("div");
      tDiv.style.textAlign = "center";
      tDiv.style.fontSize = "22px";
      tDiv.style.fontWeight = "bold";
      tDiv.style.marginBottom = "20px";
      tDiv.style.color = "#006644";
      tDiv.textContent = title;
      pdfContent.appendChild(tDiv);

      const aDiv = document.createElement("div");
      aDiv.style.position = "absolute";
      aDiv.style.top = "40px";
      aDiv.style.right = "50px";
      aDiv.style.fontSize = "12px";
      aDiv.style.color = "#006644";
      aDiv.textContent = `Autor: ${author}`;
      pdfContent.appendChild(aDiv);

      const footer = document.createElement("div");
      footer.style.position = "absolute";
      footer.style.bottom = "30px";
      footer.style.left = "0";
      footer.style.right = "0";
      footer.style.textAlign = "center";
      footer.style.fontSize = "10px";
      footer.style.color = "#00664488";
      footer.innerHTML = "Hecho con Laboratorio Musical • www.maximilian23.com";
      pdfContent.appendChild(footer);

      const clone = document.getElementById("pentagrama-container").cloneNode(true);
      clone.style.border = "none";
      clone.style.boxShadow = "none";
      clone.style.margin = "40px auto 0";
      clone.style.width = "100%";
      clone.style.height = "auto";
      clone.style.overflow = "visible";
      clone.style.padding = "0";
      pdfContent.appendChild(clone);

      html2pdf().from(pdfContent).set({
        margin: [20, 20, 20, 20],
        filename: title + ".pdf",
        image: { type: 'jpeg', quality: 0.92 },
        html2canvas: {
          scale: 1.8,
          useCORS: true,
          logging: false,
          height: container.scrollHeight + 120,
          width: 794,
          windowWidth: 794
        },
        jsPDF: { unit: 'px', format: 'a4', orientation: 'portrait' }
      }).save();
    }

    init();
  </script>
