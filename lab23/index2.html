<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio Musical • Maximilian 23</title>
  <link rel="icon" type="image/png" href="https://maximilian23.com/Cabeza.png">
  <script src="https://unpkg.com/vexflow@4.2.3/build/cjs/vexflow.js"></script>
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Courier New", Courier, monospace;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-image:
        radial-gradient(circle at 20% 10%, rgba(0,255,204,0.07) 0%, transparent 50%),
        radial-gradient(circle at 80% 90%, rgba(0,255,204,0.05) 0%, transparent 50%);
      background-attachment: fixed;
    }

    header {
      background: rgba(22,27,34,0.92);
      backdrop-filter: blur(8px);
      width: 100%;
      padding: 0.9rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.9rem;
      border-bottom: 2px solid #00ffcc;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    header img {
      height: 48px;
      border-radius: 50%;
      border: 2px solid #00ffcc88;
      box-shadow: 0 0 12px #00ffcc55;
    }

    header h1 {
      font-size: 1.8rem;
      color: #00ffcc;
      text-shadow: 0 0 8px #00ffccaa;
    }

    #creado-por {
      position: absolute;
      top: 0.9rem;
      right: 1.2rem;
      font-size: 0.85rem;
      color: #00ffcc88;
    }

    #titulo-partitura {
      width: 100%;
      max-width: 700px;
      margin: 1.2rem 0 0.8rem;
      text-align: center;
    }

    #titulo-editable {
      width: 100%;
      padding: 0.7rem 1rem;
      font-size: 1.5rem;
      background: rgba(30,45,61,0.4);
      border: 1px solid #00ffcc55;
      border-radius: 10px;
      color: #e6edf3;
      text-align: center;
      backdrop-filter: blur(4px);
    }

    #barra-opciones {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 1.4rem;
      margin: 0.8rem 0 1.2rem;
      padding: 0 1rem;
      flex-wrap: nowrap;
      max-width: 100%;
      overflow: visible !important; /* ¡Clave para que el menú no genere scroll! */
      position: relative;
      z-index: 50;
    }

    #barra-opciones > div {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    #barra-opciones label {
      color: #00ffcc;
      white-space: nowrap;
      font-size: 0.95rem;
    }

    select {
      padding: 0.6rem 1rem;
      background: rgba(30,45,61,0.5);
      border: 1px solid #00ffcc66;
      border-radius: 8px;
      color: #e6edf3;
      min-width: 130px;
      font-size: 0.95rem;
    }

    .acciones-dropdown {
      position: relative;
      z-index: 200;
    }

    #acciones-btn {
      padding: 0.6rem 1.3rem;
      background: rgba(0,255,204,0.18);
      border: 1px solid #00ffcc88;
      border-radius: 8px;
      color: #00ffcc;
      cursor: pointer;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }

    #acciones-btn:hover {
      background: rgba(0,255,204,0.28);
      box-shadow: 0 0 12px rgba(0,255,204,0.4);
    }

    #acciones-menu {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background: rgba(13,17,23,0.98);
      border: 2px solid #00ffcc88;
      border-radius: 8px;
      min-width: 220px;
      max-width: 280px;
      z-index: 9999 !important;
      box-shadow: 0 10px 30px rgba(0,255,204,0.4);
      backdrop-filter: blur(8px);
      overflow: visible;
    }

    #acciones-menu.show {
      display: block;
    }

    #acciones-menu button {
      width: 100%;
      text-align: left;
      padding: 0.8rem 1.4rem;
      background: none;
      border: none;
      color: #e6edf3;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      transition: background 0.2s;
    }

    #acciones-menu button:hover {
      background: rgba(0,255,204,0.25);
    }

    #main-content {
      width: 100%;
      max-width: 1400px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1rem;
    }

    #pentagrama-container {
      width: 100%;
      background: white;
      border: 2px solid #00ffcc55;
      border-radius: 12px;
      overflow-x: hidden;
      overflow-y: hidden;
      margin: 0.8rem 0 1.5rem;
      min-height: 260px;
      max-height: 70vh;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      position: relative;
      transition: overflow-y 0.3s;
    }

    #pentagrama-container.multi-line {
      overflow-y: auto;
    }

    #pentagrama {
      min-height: 260px;
      width: 100%;
    }

    .tempo-text {
      position: absolute;
      top: 1rem;
      left: 3rem;
      background: rgba(255,255,255,0.9);
      color: #006644;
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      border: 1px solid #00cc99;
      font-weight: bold;
      z-index: 10;
    }

    #figuras {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin: 1.2rem 0;
      max-width: 800px;
    }

    .figura {
      width: 62px;
      height: 62px;
      background: rgba(30,45,61,0.4);
      border: 2px solid #00ffcc66;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.3rem;
      color: #e6edf3;
      cursor: pointer;
      transition: all 0.3s;
    }

    .figura:hover, .figura.activa {
      background: rgba(0,255,204,0.18);
      border-color: #00ffcc;
      transform: scale(1.12);
      box-shadow: 0 0 16px #00ffcc66;
    }

    .controles-linea {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin: 1rem 0;
      max-width: 800px;
    }

    button {
      padding: 0.7rem 1.4rem;
      background: rgba(0,255,204,0.12);
      border: 1px solid #00ffcc66;
      border-radius: 8px;
      color: #00ffcc;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    button:hover {
      background: rgba(0,255,204,0.25);
      border-color: #00ffcc;
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(0,255,204,0.2);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.activa,
    #play-stop.play-active {
      background: rgba(0,255,204,0.35) !important;
    }

    #play-stop.stop-active {
      background: rgba(255,80,80,0.35) !important;
      color: #ff8080;
    }

    .nota {
      position: absolute;
      cursor: move;
      z-index: 100;
    }

    .nota:hover .plus, .nota:hover .minus {
      opacity: 1;
    }

    .nota .plus, .nota .minus {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #00ffcc;
      color: #0d1117;
      position: absolute;
      text-align: center;
      line-height: 24px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      opacity: 0;
      transition: all 0.25s;
      z-index: 101;
      border: 2px solid #0d1117;
      left: 50%;
      transform: translateX(-50%);
    }

    .nota .plus:hover, .nota .minus:hover {
      background: #00cc9e;
      transform: translateX(-50%) scale(1.2);
    }

    .nota .plus { top: -30px; }
    .nota .minus { bottom: -30px; }

    @media (max-width: 1100px) {
      #barra-opciones { gap: 1rem; padding: 0 0.5rem; }
      select { min-width: 120px; }
    }

    @media (max-width: 768px) {
      #barra-opciones { flex-wrap: wrap; gap: 0.8rem; justify-content: center; }
      .controles-linea { gap: 0.8rem; }
      .figura { width: 56px; height: 56px; font-size: 2rem; }
      #acciones-menu {
        left: auto;
        right: 0;
        min-width: 180px;
      }
    }

    @media (max-width: 480px) {
      #barra-opciones { flex-direction: column; align-items: stretch; }
      select { width: 100%; }
    }
  </style>
</head>
<body>

  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Maximilian">
    <h1>Laboratorio Musical</h1>
    <div id="creado-por">Creado por Manuel</div>
  </header>

  <div id="titulo-partitura">
    <input type="text" id="titulo-editable" value="Mi Partitura">
  </div>

  <div id="barra-opciones">
    <div class="acciones-dropdown">
      <button id="acciones-btn"><i class="fas fa-file"></i> Archivo</button>
      <div id="acciones-menu">
        <button id="abrir"><i class="fas fa-folder-open"></i> Abrir</button>
        <button id="guardar"><i class="fas fa-save"></i> Guardar</button>
        <button id="export-pdf"><i class="fas fa-file-pdf"></i> Exportar a PDF</button>
        <button id="limpiar"><i class="fas fa-trash"></i> Limpiar</button>
      </div>
      <input type="file" id="file-input" accept=".json" style="display:none">
    </div>

    <label>Clave:</label>
    <select id="clave">
      <option value="treble" selected>Sol</option>
      <option value="bass">Fa</option>
    </select>

    <label>Compás:</label>
    <select id="compas">
      <option value="" selected>---</option>
      <option value="4/4">4/4</option>
      <option value="3/4">3/4</option>
      <option value="2/4">2/4</option>
    </select>

    <label>Velocidad:</label>
    <select id="velocidad">
      <option value="" selected>---</option>
      <option value="80">Andante (80 BPM)</option>
      <option value="90">Moderado (90 BPM)</option>
      <option value="120">Allegro (120 BPM)</option>
      <option value="160">Presto (160 BPM)</option>
    </select>
  </div>

  <div id="main-content">
    <div id="pentagrama-container">
      <div id="tempo-display" class="tempo-text" style="display:none;"></div>
      <div id="pentagrama"></div>
    </div>

    <div id="figuras">
      <div class="figura" data-tipo="nota" data-duracion="w">𝅝</div>
      <div class="figura" data-tipo="nota" data-duracion="h">𝅗𝅥</div>
      <div class="figura" data-tipo="nota" data-duracion="q">𝅘𝅥</div>
      <div class="figura" data-tipo="nota" data-duracion="8">𝅘𝅥𝅮</div>
      <div class="figura" data-tipo="silencio" data-duracion="w">𝄻</div>
      <div class="figura" data-tipo="silencio" data-duracion="h">𝄼</div>
      <div class="figura" data-tipo="silencio" data-duracion="q">𝄽</div>
      <div class="figura" data-tipo="silencio" data-duracion="8">𝄾</div>
    </div>

    <div class="controles-linea" id="controles-modo">
      <button id="notas"><i class="fas fa-music"></i> Notas</button>
      <button id="borrar-ultimo"><i class="fas fa-backspace"></i> Borrar último</button>
      <button id="play-stop" class="play-active"><i class="fas fa-play"></i> Play</button>
      <button id="metronomo"><i class="fas fa-drum"></i> Metrónomo</button>
      <button id="cerrar-compas" disabled><i class="fas fa-check"></i> Cerrar compás</button>
    </div>
  </div>

  <script>
    const VF = Vex.Flow;
    const div = document.getElementById("pentagrama");
    const renderer = new VF.Renderer(div, VF.Renderer.Backends.SVG);
    const container = document.getElementById("pentagrama-container");
    const tempoDisplay = document.getElementById("tempo-display");
    let MAX_LINE_WIDTH = Math.max(280, container.clientWidth - 60);
    const FIRST_STAVE_WIDTH = 350;
    const minStaveWidth = 100;
    const lineHeight = 100;
    const noteWidthFactors = { w: 50, h: 50, q: 55, '8': 80 };
    let width = Math.max(280, container.clientWidth);
    let currentHeight = 280;
    renderer.resize(width, currentHeight);
    const context = renderer.getContext();
    let clave = "treble", compas = "", bpm = 0;
    let lines = [[]], currentLine = 0;
    let figuraActiva = null, showNoteLabels = false, isPlaying = false, metronomeOn = false;
    let metronomeLoop = null;
    let synth = null;

    const noteMap = {
      treble: ["g/3", "a/3", "b/3", "c/4", "d/4", "e/4", "f/4", "g/4", "a/4", "b/4", "c/5", "d/5", "e/5", "f/5", "g/5", "a/5", "b/5"],
      bass: ["b/1", "c/2", "d/2", "e/2", "f/2", "g/2", "a/2", "b/2", "c/3", "d/3", "e/3", "f/3", "g/3", "a/3", "b/3", "c/4", "d/4"]
    };
    const noteNameMap = {
      c: "Do", d: "Re", e: "Mi", f: "Fa", g: "Sol", a: "La", b: "Si"
    };
    const duracionBeats = { w: 4, h: 2, q: 1, '8': 0.5 };
    const duracionTiempo = { w: "1n", h: "2n", q: "4n", '8': "8n" };
    const tempoNames = {
      80: "Andante (80 BPM)",
      90: "Moderado (90 BPM)",
      120: "Allegro (120 BPM)",
      160: "Presto (160 BPM)"
    };

    function getNoteName(note) {
      const [letter, octave] = note.split("/");
      return `${noteNameMap[letter]} ${octave}`;
    }

    function initSynth() {
      if (!synth) {
        synth = new Tone.Synth().toDestination();
      }
    }

    function init() {
      const claveSelect = document.getElementById("clave");
      const compasSelect = document.getElementById("compas");
      const velocidadSelect = document.getElementById("velocidad");
      compasSelect.value = "";
      velocidadSelect.value = "";
      clave = claveSelect.value || "treble";
      compas = compasSelect.value || "";
      bpm = +velocidadSelect.value || 0;
      if (bpm) {
        tempoDisplay.textContent = tempoNames[bpm];
        tempoDisplay.style.display = "block";
      } else {
        tempoDisplay.style.display = "none";
      }
      window.addEventListener('resize', () => {
        width = Math.max(280, container.clientWidth);
        MAX_LINE_WIDTH = width - 60;
        renderer.resize(width, currentHeight);
        reflowLines();
        redibujarPentagrama();
      });
      claveSelect.onchange = e => {
        clave = e.target.value;
        resetPartitura();
      };
      compasSelect.onchange = e => {
        compas = e.target.value;
        resetPartitura();
        document.getElementById("play-stop").disabled = !compas;
      };
      velocidadSelect.onchange = e => {
        bpm = +e.target.value;
        if (bpm) {
          tempoDisplay.textContent = tempoNames[bpm];
          tempoDisplay.style.display = "block";
        } else {
          tempoDisplay.style.display = "none";
        }
        if (Tone.Transport.state === "started") Tone.Transport.bpm.value = bpm;
        redibujarPentagrama();
      };
      initFiguras();
      initControles();
      resetPartitura();

      // Menú desplegable Archivo - versión arreglada
      const accionesBtn = document.getElementById('acciones-btn');
      const accionesMenu = document.getElementById('acciones-menu');

      accionesBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        accionesMenu.classList.toggle('show');
      });

      document.addEventListener('click', function(e) {
        if (!accionesBtn.contains(e.target) && !accionesMenu.contains(e.target)) {
          accionesMenu.classList.remove('show');
        }
      });

      // Exportar PDF
      document.getElementById('export-pdf').addEventListener('click', function() {
        const element = document.getElementById('pentagrama-container');
        const opt = {
          margin: 0.5,
          filename: (document.getElementById('titulo-editable').value.trim() || 'Mi_Partitura') + '.pdf',
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true, logging: false },
          jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
        accionesMenu.classList.remove('show');
      });
    }

    // =====================================================================
    // Resto del JavaScript original (funciones completas) - sin cambios
    // =====================================================================

    function resetPartitura() {
      lines = [[]];
      currentLine = 0;
      if (compas) {
        lines[0].push({ notas: [], beats: 0, closed: false, staveWidth: FIRST_STAVE_WIDTH });
      }
      redibujarPentagrama();
    }

    function reflowLines() {
      let i = 0;
      while (i < lines.length) {
        let sum = lines[i].reduce((s, c) => s + (c.staveWidth || minStaveWidth), 0);
        if (sum > MAX_LINE_WIDTH && lines[i].length > 1) {
          const last = lines[i].pop();
          if (i + 1 < lines.length) {
            lines[i + 1].unshift(last);
          } else {
            lines.push([last]);
          }
        } else {
          i++;
        }
      }
      for (let li = lines.length - 1; li >= 0; li--) {
        if (lines[li].some(c => !c.closed)) {
          currentLine = li;
          break;
        }
      }
    }

    function calculateStaveWidth(c, li, ci) {
      const voice = new VF.Voice({ num_beats: +compas.split("/")[0], beat_value: 4 });
      voice.setStrict(false);
      if (c.notas.length) voice.addTickables(c.notas.map(n => n.vf));
      const formatter = new VF.Formatter();
      if (c.notas.length) formatter.joinVoices([voice]);
      let w = c.staveWidth || minStaveWidth;
      if (c.notas.length) {
        let noteWidth = c.notas.reduce((sum, n) => sum + (noteWidthFactors[n.duracion] || 50), 0);
        w = Math.max(w, formatter.preCalculateMinTotalWidth([voice]) + noteWidth + 50);
      }
      if (li === 0 && ci === 0) {
        w = Math.max(w, FIRST_STAVE_WIDTH);
      }
      return w;
    }

    function redibujarPentagrama() {
      if (!isPlaying) {
        document.querySelectorAll(".nota, .note-label").forEach(el => el.remove());
      }
      context.clear();
      let y = 40;
      lines = lines.filter(line => line.length > 0);
      if (lines.length === 0) {
        lines = [[{ notas: [], beats: 0, closed: false, staveWidth: FIRST_STAVE_WIDTH }]];
        currentLine = 0;
      }
      if (compas) {
        lines.forEach((line, li) => {
          let x = 10;
          line.forEach((c, ci) => {
            if (c.notas.length === 0 && ci !== line.length - 1 && !c.closed) return;
            const voice = new VF.Voice({ num_beats: +compas.split("/")[0], beat_value: 4 });
            voice.setStrict(false);
            if (c.notas.length) voice.addTickables(c.notas.map(n => n.vf));
            const formatter = new VF.Formatter();
            if (c.notas.length) formatter.joinVoices([voice]);
            let staveWidth = calculateStaveWidth(c, li, ci);
            c.staveWidth = staveWidth;
            const stave = new VF.Stave(x, y, staveWidth);
            if (li === 0 && ci === 0) {
              stave.addClef(clave).addTimeSignature(compas);
            } else if (c.closed) {
              stave.addModifier(new VF.Barline(VF.Barline.type.SINGLE));
            }
            stave.setContext(context).draw();
            c.stave = stave;
            if (c.notas.length) {
              formatter.format([voice], staveWidth - 30);
              voice.draw(context, stave);
            }
            x += staveWidth;
          });
          y += lineHeight;
        });
      }
      currentHeight = Math.max(260, y + 60);
      renderer.resize(width, currentHeight);
      container.style.height = `${currentHeight}px`;

      if (lines.length > 1) {
        container.classList.add('multi-line');
      } else {
        container.classList.remove('multi-line');
      }

      if (!isPlaying) {
        updateDraggableNotes();
      }
      const curr = lines[currentLine]?.[lines[currentLine].length - 1];
      document.getElementById("cerrar-compas").disabled = !curr || curr.closed || curr.beats !== +compas.split("/")[0];
      if (curr?.stave && !isPlaying) {
        setTimeout(() => {
          div.scrollTop = Math.max(0, curr.stave.getYForLine(0) - 60);
        }, 100);
      }
    }

    function initFiguras() {
      document.querySelectorAll(".figura").forEach(f => {
        f.onclick = () => {
          document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
          figuraActiva = { tipo: f.dataset.tipo, duracion: f.dataset.duracion };
          f.classList.add("activa");
          initSynth();
        };
      });
    }

    function initControles() {
      document.getElementById("notas").onclick = () => {
        showNoteLabels = !showNoteLabels;
        document.getElementById("notas").classList.toggle("activa", showNoteLabels);
      };
      document.getElementById("metronomo").onclick = () => {
        metronomeOn = !metronomeOn;
        document.getElementById("metronomo").classList.toggle("activa", metronomeOn);
      };
      document.getElementById("play-stop").onclick = playStop;
      document.getElementById("cerrar-compas").onclick = cerrarCompas;
      document.getElementById("borrar-ultimo").onclick = borrarUltimo;
      document.getElementById("limpiar").onclick = () => {
        if (confirm("¿Estás seguro de que quieres limpiar toda la partitura? Esta acción no se puede deshacer.")) {
          resetPartitura();
        }
      };
      document.getElementById("guardar").onclick = guardar;
      document.getElementById("abrir").onclick = () => document.getElementById("file-input").click();
      document.getElementById("file-input").onchange = abrir;
    }

    function playStop() {
      const playStopButton = document.getElementById("play-stop");
      if (isPlaying) {
        stopPlayback();
        return;
      }
      if (!compas) return alert("¡Selecciona un compás!");
      if (!bpm) return alert("¡Selecciona una velocidad!");
      Tone.start().then(() => {
        initSynth();
        document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
        figuraActiva = null;
        Tone.Transport.bpm.value = bpm;
        Tone.Transport.cancel();
        let totalTime = 0;
        let events = [];
        let gi = 0;
        lines.forEach(line => {
          line.forEach(c => {
            c.notas.forEach(n => {
              if (n.tipo === "nota") {
                events.push({
                  time: totalTime,
                  note: n.noteName,
                  dur: duracionTiempo[n.duracion],
                  gi: gi,
                  noteName: getNoteName(n.noteName)
                });
              }
              totalTime += Tone.Time(duracionTiempo[n.duracion]).toSeconds();
              gi++;
            });
          });
        });
        if (!events.length && !metronomeOn) {
          return alert("¡Añade notas para reproducir!");
        }
        const numBeats = +compas.split("/")[0];
        const beatDuration = Tone.Time("4n").toSeconds();
        const introTime = metronomeOn ? numBeats * beatDuration : 0;
        if (metronomeOn) {
          metronomeLoop = new Tone.Loop((time) => {
            new Tone.MembraneSynth().toDestination().triggerAttackRelease("C3", "8n", time);
          }, "4n").start(0);
        }
        const allNotes = Array.from(context.svg.querySelectorAll('g.vf-stavenote'));
        events.forEach(event => {
          const startTime = event.time + introTime;
          const duration = Tone.Time(event.dur).toSeconds();
          Tone.Transport.schedule((time) => {
            if (synth) {
              synth.triggerAttackRelease(
                event.note.split("/")[0].toUpperCase() + event.note.split("/")[1],
                event.dur,
                time
              );
            }
          }, startTime);
          Tone.Transport.schedule((time) => {
            const noteElement = allNotes[event.gi];
            if (noteElement) {
              noteElement.querySelectorAll('path, line, circle').forEach(el => {
                el.style.stroke = '#00ffcc';
                el.style.fill = '#00ffcc';
              });
            }
          }, startTime);
          if (showNoteLabels) {
            Tone.Transport.schedule((time) => {
              const noteElement = allNotes[event.gi];
              if (noteElement) {
                const bbox = noteElement.getBBox();
                const label = document.createElement("div");
                label.className = "note-label";
                label.textContent = event.noteName;
                label.style.position = 'absolute';
                label.style.left = `${bbox.x + bbox.width / 2}px`;
                label.style.top = `${bbox.y + bbox.height + 10}px`;
                label.style.color = '#00ffcc';
                label.style.background = 'rgba(13,17,23,0.8)';
                label.style.padding = '4px 8px';
                label.style.borderRadius = '6px';
                label.style.border = '1px solid #00ffcc66';
                label.style.transform = 'translateX(-50%)';
                label.style.whiteSpace = 'nowrap';
                div.appendChild(label);
                label.style.opacity = '1';
                setTimeout(() => {
                  label.style.opacity = '0';
                  setTimeout(() => label.remove(), 400);
                }, duration * 1000 * 0.8);
              }
            }, startTime);
          }
          Tone.Transport.schedule((time) => {
            const noteElement = allNotes[event.gi];
            if (noteElement) {
              noteElement.querySelectorAll('path, line, circle').forEach(el => {
                el.style.stroke = 'black';
                el.style.fill = 'black';
              });
            }
          }, startTime + duration);
        });
        Tone.Transport.schedule(() => {
          stopPlayback();
        }, totalTime + introTime);
        Tone.Transport.start();
        playStopButton.innerHTML = '<i class="fas fa-stop"></i> Stop';
        playStopButton.classList.remove("play-active");
        playStopButton.classList.add("stop-active");
        isPlaying = true;
      }).catch(err => {
        console.error("Error al iniciar Tone.js:", err);
        alert("Error al iniciar la reproducción. Asegúrate de interactuar con la página primero.");
      });
    }

    function stopPlayback() {
      Tone.Transport.stop();
      Tone.Transport.cancel();
      if (metronomeLoop) {
        metronomeLoop.stop();
        metronomeLoop.dispose();
        metronomeLoop = null;
      }
      context.svg.querySelectorAll('g.vf-stavenote path, g.vf-stavenote line, g.vf-stavenote circle').forEach(el => {
        el.style.stroke = 'black';
        el.style.fill = 'black';
      });
      document.querySelectorAll(".note-label").forEach(el => el.remove());
      const playStopButton = document.getElementById("play-stop");
      playStopButton.innerHTML = '<i class="fas fa-play"></i> Play';
      playStopButton.classList.remove("stop-active");
      playStopButton.classList.add("play-active");
      isPlaying = false;
      updateDraggableNotes();
    }

    function updateDraggableNotes() {
      document.querySelectorAll(".nota").forEach(n => n.remove());
      let gi = 0;
      lines.forEach((line, li) => {
        line.forEach((c, ci) => {
          c.notas.forEach((n, ni) => {
            if (n.tipo === "silencio") {
              gi++;
              return;
            }
            const g = context.svg.querySelectorAll('g.vf-stavenote')[gi];
            if (!g) return;
            const bbox = g.getBBox();
            const d = document.createElement("div");
            d.className = "nota";
            d.style.left = `${bbox.x}px`;
            d.style.top = `${bbox.y}px`;
            d.style.width = `${bbox.width}px`;
            d.style.height = `${bbox.height}px`;
            d.dataset.li = li;
            d.dataset.ci = ci;
            d.dataset.ni = ni;
            const plus = document.createElement("div");
            plus.textContent = "+";
            plus.className = "plus";
            const minus = document.createElement("div");
            minus.textContent = "−";
            minus.className = "minus";
            plus.onclick = e => {
              e.stopPropagation();
              changePitch(d, 1);
            };
            minus.onclick = e => {
              e.stopPropagation();
              changePitch(d, -1);
            };
            d.appendChild(plus);
            d.appendChild(minus);
            div.appendChild(d);
            gi++;
          });
        });
      });
    }

    function changePitch(div, dir) {
      initSynth();
      const li = +div.dataset.li, ci = +div.dataset.ci, ni = +div.dataset.ni;
      const nota = lines[li][ci].notas[ni];
      const list = noteMap[clave];
      const idx = list.indexOf(nota.noteName) + dir;
      if (idx < 0 || idx >= list.length) return;
      nota.noteName = list[idx];
      const bIdx = clave === "treble" ? list.indexOf("b/4") : list.indexOf("b/2");
      nota.vf = new VF.StaveNote({
        clef: clave,
        keys: [nota.noteName],
        duration: nota.duracion,
        stem_direction: idx >= bIdx ? VF.Stem.DOWN : VF.Stem.UP
      });
      redibujarPentagrama();
      if (synth) {
        Tone.start().then(() => {
          synth.triggerAttackRelease(
            nota.noteName.split("/")[0].toUpperCase() + nota.noteName.split("/")[1],
            duracionTiempo[nota.duracion]
          );
        });
      }
    }

    function cerrarCompas() {
      const curr = lines[currentLine][lines[currentLine].length - 1];
      if (!curr || curr.closed || curr.beats !== +compas.split("/")[0]) return;
      curr.closed = true;
      const newCompas = { notas: [], beats: 0, closed: false, staveWidth: minStaveWidth };
      const lineSum = lines[currentLine].reduce((sum, c) => sum + (c.staveWidth || minStaveWidth), 0) + minStaveWidth;
      if (lineSum > MAX_LINE_WIDTH) {
        lines.push([newCompas]);
        currentLine = lines.length - 1;
      } else {
        lines[currentLine].push(newCompas);
      }
      redibujarPentagrama();
    }

    div.onclick = e => {
      initSynth();
      if (!compas || !figuraActiva) return;
      const rect = div.getBoundingClientRect();
      const clickX = e.clientX - rect.left + div.scrollLeft;
      const clickY = e.clientY - rect.top + div.scrollTop;
      const targetLineIdx = Math.floor((clickY - 40) / lineHeight);
      if (targetLineIdx < 0 || targetLineIdx >= lines.length) return;
      let targetCompasIdx = lines[targetLineIdx].length - 1;
      let targetLine = targetLineIdx;
      let currentCompas = lines[targetLine][targetCompasIdx];
      if (currentCompas.closed) {
        const newCompas = { notas: [], beats: 0, closed: false, staveWidth: minStaveWidth };
        const lineSum = lines[targetLine].reduce((sum, c) => sum + (c.staveWidth || minStaveWidth), 0) + minStaveWidth;
        if (lineSum > MAX_LINE_WIDTH) {
          lines.push([newCompas]);
          targetLine = lines.length - 1;
          targetCompasIdx = 0;
        } else {
          lines[targetLine].push(newCompas);
          targetCompasIdx = lines[targetLine].length - 1;
        }
        currentCompas = lines[targetLine][targetCompasIdx];
      }
      const noteName = getNoteFromY(clickY, targetLine);
      if (!noteName) return;
      currentLine = targetLine;
      addNota(figuraActiva.tipo, figuraActiva.duracion, noteName, targetCompasIdx);
    };

    function getNoteFromY(y, lineIndex) {
      const lineY = lineIndex * lineHeight + 40;
      const relY = y - lineY;
      const noteHeight = 140;
      const numNotes = noteMap[clave].length;
      const step = noteHeight / (numNotes - 1);
      const normalizedY = Math.max(0, Math.min(noteHeight, noteHeight - relY));
      const idx = Math.round(normalizedY / step);
      return noteMap[clave][Math.max(0, Math.min(numNotes - 1, idx))];
    }

    function addNota(tipo, dur, noteName, compasIndex) {
      const beats = +compas.split("/")[0];
      const currentCompas = lines[currentLine][compasIndex];
      if (currentCompas.beats + duracionBeats[dur] > beats) {
        return alert("¡No hay suficiente espacio en el compás!");
      }
      let vf;
      if (tipo === "nota") {
        const list = noteMap[clave];
        const bIdx = clave === "treble" ? list.indexOf("b/4") : list.indexOf("b/2");
        const idx = list.indexOf(noteName);
        vf = new VF.StaveNote({
          clef: clave,
          keys: [noteName],
          duration: dur,
          stem_direction: idx >= bIdx ? VF.Stem.DOWN : VF.Stem.UP
        });
      } else {
        const rest = clave === "treble" ? "b/4" : "d/3";
        vf = new VF.StaveNote({ clef: clave, keys: [rest], duration: dur + "r" });
      }
      currentCompas.notas.push({ tipo, duracion: dur, noteName: tipo === "nota" ? noteName : null, vf });
      currentCompas.beats = +(currentCompas.beats + duracionBeats[dur]).toFixed(2);
      const tempVoice = new VF.Voice({ num_beats: +compas.split("/")[0], beat_value: 4 });
      tempVoice.setStrict(false);
      if (currentCompas.notas.length) tempVoice.addTickables(currentCompas.notas.map(n => n.vf));
      const formatter = new VF.Formatter();
      if (currentCompas.notas.length) formatter.joinVoices([tempVoice]);
      let noteWidth = currentCompas.notas.reduce((sum, n) => sum + (noteWidthFactors[n.duracion] || 50), 0);
      currentCompas.staveWidth = Math.max(minStaveWidth, formatter.preCalculateMinTotalWidth([tempVoice]) + noteWidth + 50);
      const lineSum = lines[currentLine].reduce((sum, c) => sum + (c.staveWidth || minStaveWidth), 0);
      if (lineSum > MAX_LINE_WIDTH && lines[currentLine].length > 1) {
        const lastCompas = lines[currentLine].pop();
        lines.push([lastCompas]);
        currentLine = lines.length - 1;
        compasIndex = 0;
      }
      redibujarPentagrama();
      if (tipo === "nota") {
        initSynth();
        if (synth) {
          Tone.start().then(() => {
            synth.triggerAttackRelease(
              noteName.split("/")[0].toUpperCase() + noteName.split("/")[1],
              duracionTiempo[dur]
            );
          });
        }
      }
    }

    function borrarUltimo() {
      for (let li = lines.length - 1; li >= 0; li--) {
        for (let ci = lines[li].length - 1; ci >= 0; ci--) {
          const c = lines[li][ci];
          if (c.notas.length) {
            c.beats -= duracionBeats[c.notas[c.notas.length - 1].duracion];
            c.notas.pop();
            c.closed = false;
            c.staveWidth = Math.max(minStaveWidth, minStaveWidth + (c.notas.length * 80));
            currentLine = li;
            redibujarPentagrama();
            return;
          }
        }
      }
    }

    function guardar() {
      const data = {
        titulo: document.getElementById("titulo-editable").value,
        clave, compas, bpm,
        lines: lines.map(l => l.map(c => ({
          notas: c.notas.map(n => ({ tipo: n.tipo, duracion: n.duracion, noteName: n.noteName })),
          beats: c.beats,
          closed: c.closed,
          staveWidth: c.staveWidth
        })))
      };
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
      a.download = `${data.titulo || "partitura"}.json`;
      a.click();
    }

    function abrir(e) {
      const file = e.target.files[0];
      if (!file) return;
      const r = new FileReader();
      r.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          document.getElementById("titulo-editable").value = d.titulo || "Mi Partitura";
          document.getElementById("clave").value = d.clave;
          document.getElementById("compas").value = d.compas;
          document.getElementById("velocidad").value = d.bpm;
          clave = d.clave;
          compas = d.compas;
          bpm = d.bpm;
          tempoDisplay.textContent = tempoNames[bpm];
          tempoDisplay.style.display = bpm ? "block" : "none";
          lines = d.lines.map(l => l.map(c => {
            const comp = { notas: [], beats: c.beats, closed: c.closed, staveWidth: c.staveWidth || minStaveWidth };
            c.notas.forEach(n => {
              let vf;
              if (n.tipo === "nota") {
                const list = noteMap[clave];
                const bIdx = clave === "treble" ? list.indexOf("b/4") : list.indexOf("b/2");
                const idx = list.indexOf(n.noteName);
                vf = new VF.StaveNote({
                  clef: clave,
                  keys: [n.noteName],
                  duration: n.duracion,
                  stem_direction: idx >= bIdx ? VF.Stem.DOWN : VF.Stem.UP
                });
              } else {
                const rest = clave === "treble" ? "b/4" : "d/3";
                vf = new VF.StaveNote({ clef: clave, keys: [rest], duration: n.duracion + "r" });
              }
              comp.notas.push({ tipo: n.tipo, duracion: n.duracion, noteName: n.noteName, vf });
            });
            if (l.indexOf(c) === 0 && d.lines.indexOf(l) === 0) {
              comp.staveWidth = Math.max(comp.staveWidth, FIRST_STAVE_WIDTH);
            }
            return comp;
          }));
          currentLine = lines.length - 1;
          reflowLines();
          redibujarPentagrama();
        } catch {
          alert("Archivo inválido");
        }
      };
      r.readAsText(file);
    }

    init();
  </script>
</body>
