<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laboratorio Musical de Maximilian 23</title>
  <script src="https://unpkg.com/vexflow@4.2.3/build/cjs/vexflow.js"></script>
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    :root {
      --accent: #00ffcc;
      --bg-dark: #0d1117;
      --bg-panel: rgba(13,17,23,0.92);
      --bg-card: #1e2d3d;
      --border: rgba(0,255,204,0.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-dark);
      font-family: "Courier New", monospace;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 5px;
    }
    header {
      background: rgba(22,27,34,0.97);
      border-bottom: 2px solid var(--accent);
      text-align: center;
      padding: 10px;
      box-shadow: 0 0 20px rgba(0,255,204,0.2);
      border-radius: 0 0 15px 15px;
      width: 100%;
      max-width: 1400px;
      position: relative;
    }
    header img { height: 50px; vertical-align: middle; filter: drop-shadow(0 0 8px var(--accent)); margin-right: 8px; }
    header h1 { display: inline-block; margin: 0; font-size: 1.8em; color: var(--accent); text-shadow: 0 0 12px rgba(0,255,204,0.5); }
    header p { color: rgba(0,255,204,0.7); font-size: 0.85em; margin-top: 3px; }
    #creado-por {
      position: absolute;
      top: 8px;
      right: 12px;
      color: rgba(0,255,204,0.6);
      font-size: 0.8em;
    }
    #titulo-partitura { text-align: center; margin: 8px 0; width: 100%; max-width: 700px; }
    #titulo-editable {
      font-family: inherit;
      font-size: 1.3em;
      font-weight: bold;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 12px;
      width: 100%;
      background: var(--bg-card);
      color: var(--accent);
      outline: none;
    }
    #titulo-editable:focus { box-shadow: 0 0 10px rgba(0,255,204,0.4); }
    #barra-opciones {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0;
      width: 100%;
      max-width: 700px;
      align-items: center;
    }
    #barra-opciones label { color: rgba(0,255,204,0.8); font-size: 0.85em; }
    select {
      padding: 6px 10px;
      font-size: 0.85em;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg-card);
      color: var(--accent);
      outline: none;
      cursor: pointer;
    }
    #main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 1400px;
    }
    #pentagrama-container {
      background: #fff;
      border: 2px solid var(--accent);
      border-radius: 12px;
      overflow: auto;
      box-shadow: 0 0 20px rgba(0,255,204,0.2);
      margin: 5px auto;
      width: 95%;
      max-width: 1400px;
      min-width: 280px;
      min-height: 240px !important;
      height: auto !important;
      position: relative;
    }
    #pentagrama {
      width: 100%;
      min-height: 240px;
      overflow: auto;
      scroll-behavior: smooth;
    }
    .tempo-text {
      position: absolute;
      top: 8px;
      left: 50px;
      font-size: 13px;
      font-weight: bold;
      color: #333;
      background: rgba(255,255,255,0.95);
      padding: 3px 8px;
      border-radius: 6px;
      z-index: 10;
      font-family: serif;
    }
    .note-label {
      position: absolute;
      font-size: 14px;
      font-weight: bold;
      color: #ff4444;
      background: rgba(255,255,255,0.95);
      padding: 4px 8px;
      border-radius: 8px;
      z-index: 20;
      font-family: serif;
      border: 1px solid #ff4444;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .note-label.show { opacity: 1; animation: pulse 0.5s ease-in-out; }
    @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.1)} 100%{transform:scale(1)} }
    #figuras {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: nowrap;
      margin: 6px 0 2px;
      width: 100%;
      max-width: 700px;
      overflow-x: auto;
      padding: 4px;
    }
    .figura {
      width: 44px !important;
      height: 44px !important;
      min-width: 44px !important;
      flex-shrink: 0;
      background: rgba(0,255,204,0.05);
      border: 1px solid var(--border);
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.25s;
      box-shadow: 0 0 8px rgba(0,255,204,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4em !important;
      color: var(--accent);
    }
    .figura:hover, .figura.activa {
      background: rgba(0,255,204,0.2);
      box-shadow: 0 0 16px var(--accent);
      transform: scale(1.1);
      border-color: var(--accent);
    }
    #modificadores {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
      margin: 4px 0;
      width: 100%;
      max-width: 700px;
    }
    .mod-btn {
      min-width: 44px;
      height: 34px;
      padding: 0 10px;
      background: rgba(0,255,204,0.05);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9em;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .mod-btn:hover, .mod-btn.activo {
      background: rgba(0,255,204,0.2);
      box-shadow: 0 0 10px var(--accent);
    }
    #controles-modo, #controles-otros {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 5px 0;
      width: 100%;
      max-width: 700px;
    }
    button {
      padding: 8px 14px;
      font-size: 0.85em;
      background: rgba(0,255,204,0.1);
      color: var(--accent);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    button:hover { background: rgba(0,255,204,0.22); box-shadow: 0 0 12px rgba(0,255,204,0.4); transform: scale(1.04); }
    button:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
    button.activa { background: rgba(0,255,204,0.28) !important; box-shadow: 0 0 14px var(--accent); }
    #play-stop.play-active { border-color: #00ff88; color: #00ff88; }
    #play-stop.stop-active { border-color: #ff4466; color: #ff4466; background: rgba(255,68,102,0.12); }
    .nota {
      position: absolute;
      cursor: move;
      z-index: 100;
    }
    .nota:hover .plus, .nota:hover .minus { opacity: 1; }
    .nota .plus, .nota .minus {
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--accent);
      color: #000;
      position: absolute;
      text-align: center;
      line-height: 20px;
      font-size: 0.85em;
      cursor: pointer;
      opacity: 0;
      left: 50%;
      transform: translateX(-50%);
    }
    .nota .plus { top: -26px; }
    .nota .minus { bottom: -26px; }
    #menu-archivo { position: relative; display: inline-block; }
    #dropdown-archivo {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      background: rgba(13,17,23,0.98);
      border: 1px solid var(--border);
      border-radius: 10px;
      min-width: 160px;
      z-index: 1000;
      box-shadow: 0 0 20px rgba(0,255,204,0.2);
    }
    #dropdown-archivo.open { display: block; }
    .drop-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      color: var(--accent);
      font-size: 0.85em;
      cursor: pointer;
      background: transparent;
      border: none;
      width: 100%;
      text-align: left;
    }
    .drop-item:hover { background: rgba(0,255,204,0.12); }
    .drop-item.danger { color: #ff4466; }
    .drop-item.danger:hover { background: rgba(255,68,102,0.1); }
    .drop-separator {
      height: 1px;
      background: rgba(0,255,204,0.15);
      margin: 2px 0;
    }
    @media (max-width: 600px) {
      header h1 { font-size: 1.3em; }
      header img { height: 38px; }
      .figura { width: 40px !important; height: 40px !important; font-size: 1.2em !important; }
      #pentagrama-container { width: 95vw !important; }
    }
  </style>
</head>
<body>
  <header>
    <img src="https://maximilian23.com/Cabeza.png" alt="Maximilian 23">
    <h1>Laboratorio Musical de Maximilian 23</h1>
    <p>¡Compón con estilo cyber-melódico!</p>
    <div id="creado-por">Creado por Manuel • 2025-2026</div>
  </header>

  <div id="titulo-partitura">
    <input type="text" id="titulo-editable" value="Mi Partitura Cyber">
  </div>

  <div id="barra-opciones">
    <label>Clave:</label>
    <select id="clave">
      <option value="treble" selected>Sol</option>
      <option value="bass">Fa</option>
    </select>
    <label>Compás:</label>
    <select id="compas">
      <option value="" selected>---</option>
      <option value="4/4">4/4</option>
      <option value="3/4">3/4</option>
      <option value="2/4">2/4</option>
    </select>
    <label>Velocidad:</label>
    <select id="velocidad">
      <option value="" selected>---</option>
      <option value="76">Andante (76)</option>
      <option value="92">Moderato (92)</option>
      <option value="108">Allegretto (108)</option>
      <option value="120" selected>Allegro (120)</option>
      <option value="144">Vivace (144)</option>
      <option value="168">Presto (168)</option>
    </select>

    <div id="menu-archivo">
      <button id="btn-menu-archivo"><i class="fas fa-folder"></i> Archivo ▾</button>
      <div id="dropdown-archivo">
        <button class="drop-item" id="guardar"><i class="fas fa-save"></i> Guardar</button>
        <button class="drop-item" id="abrir"><i class="fas fa-folder-open"></i> Abrir</button>
        <input type="file" id="file-input" accept=".json" style="display:none">
        <button class="drop-item" id="exportar-pdf"><i class="fas fa-file-pdf"></i> Exportar PDF</button>
        <div class="drop-separator"></div>
        <button class="drop-item danger" id="limpiar"><i class="fas fa-trash"></i> Limpiar todo</button>
      </div>
    </div>
  </div>

  <div id="main-content">
    <div id="pentagrama-container">
      <div id="tempo-display" class="tempo-text" style="display:none;"></div>
      <div id="pentagrama"></div>
    </div>

    <div id="figuras">
      <div class="figura" data-tipo="nota" data-duracion="w" title="Redonda">𝅝</div>
      <div class="figura" data-tipo="nota" data-duracion="h" title="Blanca">𝅗𝅥</div>
      <div class="figura" data-tipo="nota" data-duracion="q" title="Negra">𝅘𝅥</div>
      <div class="figura" data-tipo="nota" data-duracion="8" title="Corchea">𝅘𝅥𝅮</div>
      <div class="figura" data-tipo="silencio" data-duracion="w" title="Silencio redonda">𝄻</div>
      <div class="figura" data-tipo="silencio" data-duracion="h" title="Silencio blanca">𝄼</div>
      <div class="figura" data-tipo="silencio" data-duracion="q" title="Silencio negra">𝄽</div>
      <div class="figura" data-tipo="silencio" data-duracion="8" title="Silencio corchea">𝄾</div>
      <button id="cerrar-compas" disabled style="height:44px; border-radius:22px; font-size:0.8em;"><i class="fas fa-check"></i> Cerrar</button>
    </div>

    <div id="modificadores">
      <button class="mod-btn" id="btn-puntillo" title="Puntillo (×1.5)">· Puntillo</button>
      <button class="mod-btn" id="btn-sostenido" title="Sostenido">♯</button>
      <button class="mod-btn" id="btn-bemol" title="Bemol">♭</button>
      <!-- Ligadura desactivada temporalmente porque es compleja de implementar bien -->
      <!-- <button class="mod-btn" id="btn-ligadura" title="Ligadura">⌒</button> -->
    </div>

    <div id="controles-modo">
      <button id="notas"><i class="fas fa-music"></i> Notas</button>
      <button id="play-stop" class="play-active"><i class="fas fa-play"></i> Play</button>
      <button id="metronomo"><i class="fas fa-drum"></i> Metrónomo</button>
      <button id="borrar-ultimo"><i class="fas fa-backspace"></i> Borrar último</button>
    </div>
  </div>

  <script>
    const VF = Vex.Flow;
    const renderer = new VF.Renderer(document.getElementById("pentagrama"), VF.Renderer.Backends.SVG);
    const container = document.getElementById("pentagrama-container");
    let width = Math.max(280, container.clientWidth);
    let currentHeight = 240;
    renderer.resize(width, currentHeight);
    const context = renderer.getContext();

    let clave = "treble";
    let compas = "";
    let bpm = 120;
    let lines = [[]];
    let currentLine = 0;
    let figuraActiva = null;
    let isPlaying = false;
    let metronomeOn = false;
    let metronomeLoop = null;
    let synth = null;

    // Modificadores
    let modPuntillo = false;
    let modSostenido = false;
    let modBemol = false;

    const noteMap = {
      treble: ["g/3","a/3","b/3","c/4","d/4","e/4","f/4","g/4","a/4","b/4","c/5","d/5","e/5","f/5","g/5","a/5","b/5"],
      bass: ["b/1","c/2","d/2","e/2","f/2","g/2","a/2","b/2","c/3","d/3","e/3","f/3","g/3","a/3","b/3","c/4","d/4"]
    };

    const duracionBeatsBase = { w:4, h:2, q:1, '8':0.5 };
    const duracionTiempoBase = { w:"1n", h:"2n", q:"4n", '8':"8n" };

    function getDurBeats(dur) {
      const base = dur.replace('d','');
      const beats = duracionBeatsBase[base] || 1;
      return dur.endsWith('d') ? beats * 1.5 : beats;
    }

    function getDurTiempo(dur) {
      const base = dur.replace('d','');
      return dur.endsWith('d') ? duracionTiempoBase[base] + '.' : duracionTiempoBase[base];
    }

    const tempoNames = {
      76: "Andante (76 BPM)",
      92: "Moderato (92 BPM)",
      108: "Allegretto (108 BPM)",
      120: "Allegro (120 BPM)",
      144: "Vivace (144 BPM)",
      168: "Presto (168 BPM)"
    };

    function initSynth() {
      if (!synth) synth = new Tone.Synth().toDestination();
    }

    function buildVfNote(baseKey, duracion, accidental, stemDir) {
      const baseDur = duracion.replace('d','');
      const isPuntillo = duracion.endsWith('d');

      const vf = new VF.StaveNote({
        clef: clave,
        keys: [baseKey],
        duration: baseDur,
        stem_direction: stemDir
      });

      if (isPuntillo) vf.addDotToAll();

      if (accidental === '#') vf.addAccidental(0, new VF.Accidental('#'));
      if (accidental === 'b') vf.addAccidental(0, new VF.Accidental('b'));

      return vf;
    }

    function init() {
      document.getElementById("compas").value = "4/4";
      document.getElementById("velocidad").value = "120";
      compas = "4/4";
      bpm = 120;
      document.getElementById("tempo-display").textContent = tempoNames[120];
      document.getElementById("tempo-display").style.display = "block";

      document.getElementById("clave").onchange = e => { clave = e.target.value; resetPartitura(); };
      document.getElementById("compas").onchange = e => { compas = e.target.value; resetPartitura(); };
      document.getElementById("velocidad").onchange = e => {
        bpm = +e.target.value;
        document.getElementById("tempo-display").textContent = tempoNames[bpm] || "";
        document.getElementById("tempo-display").style.display = bpm ? "block" : "none";
      };

      // Figuras
      document.querySelectorAll(".figura").forEach(f => {
        f.onclick = () => {
          document.querySelectorAll(".figura").forEach(el => el.classList.remove("activa"));
          figuraActiva = { tipo: f.dataset.tipo, duracion: f.dataset.duracion };
          f.classList.add("activa");
        };
      });

      // Modificadores
      document.getElementById("btn-puntillo").onclick = () => {
        modPuntillo = !modPuntillo;
        document.getElementById("btn-puntillo").classList.toggle("activo", modPuntillo);
      };
      document.getElementById("btn-sostenido").onclick = () => {
        modSostenido = !modSostenido;
        if (modSostenido) modBemol = false;
        document.getElementById("btn-sostenido").classList.toggle("activo", modSostenido);
        document.getElementById("btn-bemol").classList.remove("activo");
      };
      document.getElementById("btn-bemol").onclick = () => {
        modBemol = !modBemol;
        if (modBemol) modSostenido = false;
        document.getElementById("btn-bemol").classList.toggle("activo", modBemol);
        document.getElementById("btn-sostenido").classList.remove("activo");
      };

      // Controles
      document.getElementById("play-stop").onclick = playStop;
      document.getElementById("metronomo").onclick = () => {
        metronomeOn = !metronomeOn;
        document.getElementById("metronomo").classList.toggle("activa", metronomeOn);
      };
      document.getElementById("cerrar-compas").onclick = cerrarCompas;
      document.getElementById("borrar-ultimo").onclick = borrarUltimo;
      document.getElementById("limpiar").onclick = () => {
        if (confirm("¿Limpiar toda la partitura?")) resetPartitura();
      };
      document.getElementById("guardar").onclick = guardar;
      document.getElementById("abrir").onclick = () => document.getElementById("file-input").click();
      document.getElementById("file-input").onchange = abrir;
      document.getElementById("exportar-pdf").onclick = () => window.print();

      // Menú archivo
      const btn = document.getElementById("btn-menu-archivo");
      const dd = document.getElementById("dropdown-archivo");
      btn.onclick = () => dd.classList.toggle("open");
      document.addEventListener("click", e => {
        if (!btn.contains(e.target)) dd.classList.remove("open");
      });

      window.addEventListener('resize', () => {
        width = Math.max(280, container.clientWidth);
        renderer.resize(width, currentHeight);
        redibujar();
      });

      resetPartitura();
    }

    function resetPartitura() {
      lines = [[{notas:[], beats:0, closed:false, staveWidth:350}]];
      currentLine = 0;
      redibujar();
    }

    function redibujar() {
      context.clear();
      let y = 40;
      lines.forEach((line, li) => {
        let x = 10;
        line.forEach((c, ci) => {
          const stave = new VF.Stave(x, y, c.staveWidth || 200);
          if (li === 0 && ci === 0) {
            stave.addClef(clave).addTimeSignature(compas);
          }
          if (c.closed) stave.setEndBarType(VF.Barline.type.SINGLE);
          stave.setContext(context).draw();

          if (c.notas.length) {
            const voice = new VF.Voice({num_beats: 4, beat_value: 4});
            voice.addTickables(c.notas.map(n => n.vf));
            new VF.Formatter().joinVoices([voice]).format([voice], c.staveWidth - 30);
            voice.draw(context, stave);
          }
          x += c.staveWidth || 200;
        });
        y += 100;
      });
      currentHeight = Math.max(240, y + 40);
      renderer.resize(width, currentHeight);
      container.style.height = currentHeight + "px";
    }

    function addNota(tipo, durBase, noteName, compasIdx) {
      const c = lines[currentLine][compasIdx];
      let dur = durBase;
      if (modPuntillo && tipo === "nota") dur += 'd';

      const durBeats = getDurBeats(dur);
      if (c.beats + durBeats > +compas.split('/')[0]) {
        alert("Compás lleno");
        return;
      }

      let accidental = null;
      let key = noteName;
      if (tipo === "nota") {
        if (modSostenido) { key = noteName.replace('/', '#/'); accidental = '#'; }
        else if (modBemol) { key = noteName.replace('/', 'b/'); accidental = 'b'; }
      }

      const baseKey = key.replace(/[#b]/, '');
      const idx = noteMap[clave].indexOf(noteName);
      const stem = idx >= 8 ? VF.Stem.DOWN : VF.Stem.UP; // aproximado

      const vf = buildVfNote(baseKey, dur, accidental, stem);

      c.notas.push({
        tipo, duracion: dur, noteName: key, accidental, vf
      });
      c.beats += durBeats;

      // Actualizar ancho (simple)
      c.staveWidth = 120 + c.notas.length * 45;

      redibujar();
    }

    div.onclick = e => {
      if (!figuraActiva || !compas) return;
      const rect = div.getBoundingClientRect();
      const y = e.clientY - rect.top + div.scrollTop;
      const lineIdx = Math.floor((y - 40) / 100);
      if (lineIdx < 0 || lineIdx >= lines.length) return;

      const noteIdx = Math.round((y - (lineIdx*100 + 40)) / 10);
      const noteName = noteMap[clave][Math.max(0, Math.min(noteMap[clave].length-1, 8 + noteIdx))]; // centrado aprox

      addNota(figuraActiva.tipo, figuraActiva.duracion, noteName, lines[lineIdx].length - 1);
    };

    function playStop() {
      if (isPlaying) {
        Tone.Transport.stop();
        Tone.Transport.cancel();
        if (metronomeLoop) metronomeLoop.dispose();
        isPlaying = false;
        document.getElementById("play-stop").innerHTML = '<i class="fas fa-play"></i> Play';
        return;
      }

      Tone.start().then(() => {
        initSynth();
        Tone.Transport.bpm.value = bpm;
        let time = 0;
        lines.flat().forEach(c => {
          c.notas.forEach(n => {
            if (n.tipo === "nota") {
              const note = n.noteName.split('/')[0].toUpperCase() + n.noteName.split('/')[1];
              Tone.Transport.scheduleOnce(() => {
                synth.triggerAttackRelease(note, getDurTiempo(n.duracion));
              }, time);
            }
            time += Tone.Time(getDurTiempo(n.duracion)).toSeconds();
          });
        });
        Tone.Transport.start();
        isPlaying = true;
        document.getElementById("play-stop").innerHTML = '<i class="fas fa-stop"></i> Stop';
      });
    }

    function cerrarCompas() {
      const c = lines[currentLine][lines[currentLine].length-1];
      if (Math.abs(c.beats - +compas.split('/')[0]) < 0.1) {
        c.closed = true;
        lines[currentLine].push({notas:[], beats:0, closed:false, staveWidth:200});
        redibujar();
      }
    }

    function borrarUltimo() {
      for (let li = lines.length-1; li >=0; li--) {
        const line = lines[li];
        if (line[line.length-1].notas.length) {
          line[line.length-1].notas.pop();
          line[line.length-1].beats -= getDurBeats(line[line.length-1].notas[line[line.length-1].notas.length-1]?.duracion || 'q');
          redibujar();
          return;
        }
      }
    }

    function guardar() {
      const data = {
        titulo: document.getElementById("titulo-editable").value,
        clave, compas, bpm,
        lines: lines.map(l => l.map(c => ({
          notas: c.notas.map(n => ({tipo:n.tipo, duracion:n.duracion, noteName:n.noteName, accidental:n.accidental})),
          beats: c.beats, closed: c.closed, staveWidth: c.staveWidth
        })))
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = (data.titulo || "partitura") + ".json";
      a.click();
    }

    function abrir(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          document.getElementById("titulo-editable").value = d.titulo || "Mi Partitura";
          clave = d.clave; compas = d.compas; bpm = d.bpm;
          lines = d.lines;
          redibujar();
        } catch(err) {
          alert("Archivo inválido");
        }
      };
      reader.readAsText(file);
    }

    init();
  </script>
</body>
</html>
