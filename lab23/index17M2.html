          { type: "nota", dur: "8", note: "e/4", dot: false, tie: false, acc: false },
          { type: "nota", dur: "q", note: "f/4", dot: false, tie: false, acc: false },
          { type: "silencio", dur: "q", note: null, dot: false, tie: false, acc: false }
        ],
        beats: 4,
        closed: true
      }
    ]
  }
};

function getKeySigName(){
  if(!keySigAccidentals.length) return "C";
  const acc   = keySigAccidentals[0].acc;
  const count = keySigAccidentals.length;
  if(acc==="#") return SHARP_KEYS[Math.min(count,7)]||"C";
  if(acc==="b") return FLAT_KEYS [Math.min(count,7)]||"C";
  return "C";
}
function getKeySigAcc(noteLetter){
  for(let i=0;i<keySigAccidentals.length;i++){
    if(keySigAccidentals[i].note===noteLetter) return keySigAccidentals[i].acc;
  }
  return false;
}

// â”€â”€â”€ NOMBRE LEGIBLE DE NOTA â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const dname = n => {
  const parts  = n.split("/");
  const letter = parts[0].charAt(0);
  const acc    = parts[0].length>1 ? parts[0].substring(1) : "";
  const oct    = parts[1];
  return `${NNAMES[letter]}${acc ? (ACCNAMES[acc]||acc) : ""} ${oct}`;
};

// Construye el nombre de nota para Tone.js correctamente
const playNote = (note, dur) => {
  if(!note) return;
  initSynth();
  // note tiene formato "g/4" o "g#/4" o "gb/4"
  const parts  = note.split("/");
  const letter = parts[0].charAt(0);
  let   acc    = parts[0].substring(1); // puede ser "", "#", "b", "##", etc.
  if(!acc){
    const ksAcc = getKeySigAcc(letter);
    if(ksAcc) acc = ksAcc;
  }
  // Tone.js usa "G4", "G#4", "Gb4"
  const p = letter.toUpperCase() + acc + parts[1];
  Tone.start().then(()=>{ try{ synth.triggerAttackRelease(p, dur); }catch(e){} });
};

// â”€â”€â”€ CREAR NOTA VEXFLOW â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
function mkNote(note, dur, dot, isRest, acc, clefArg = clef){
  const vfDur = dot ? dur + "d" : dur;
  const rk    = clefArg==="treble" ? "b/4" : "d/3";
  let vn;
  if(isRest){
    vn = new VF.StaveNote({clef: clefArg, keys:[rk], duration:vfDur+"r"});
  } else {
    // La clave de la nota almacenada es siempre "letra/octava" sin accidental
    // El accidental se pasa aparte como parÃ¡metro `acc`
    const noteKey = acc ? note.split("/")[0] + acc + "/" + note.split("/")[1] : note;
    const idx = NOTES[clefArg].indexOf(note);  // note ya debe ser "g/4" sin acc
    vn = new VF.StaveNote({
      keys:[noteKey],
      duration:vfDur,
      clef: clefArg,
      stem_direction: idx >= CTR_IDX ? VF.Stem.DOWN : VF.Stem.UP
    });
    if(acc) vn.addModifier(new VF.Accidental(acc), 0);
  }
  if(dot) vn.addModifier(new VF.Dot(), 0);
  return vn;
}

const NOTE_W={w:52,h:48,q:44,"8":38,"16":34};
function mWidth(m, isFirst){
  const base = isFirst ? getClefExtra() : 0;
  if(!m.closed){
    const used = m.notes.reduce((s,n)=>s+(NOTE_W[n.dur]||44)+(n.dot?12:0),0);
    return Math.max(OPEN_W, used+60)+base;
  }
  if(!m.notes.length) return Math.max(MIN_W+20, base+70);
  const v = mkVoice(m);
  const f = new VF.Formatter(); f.joinVoices([v]);
  return Math.max(base+100, f.preCalculateMinTotalWidth([v])+base+68);
}
function mkVoice(m){
  const num = +timeSig.split("/")[0];
  const den = +timeSig.split("/")[1];
  const v   = new VF.Voice({num_beats:num, beat_value:den});
  v.setStrict(false);
  if(m.notes.length) v.addTickables(m.notes.map(n=>n.vn));
  return v;
}

function layoutLines(){
  const maxW   = svgW - PAD_L*2;
  const clefEx = getClefExtra();
  let lines=[], row=[], used=0;
  measures.forEach((m,i)=>{
    let w = mWidth(m, i===0);
    if(row.length>0 && i!==0){
      const wWithClef = w + clefEx;
      if(used+wWithClef > maxW){
        lines.push(row); row=[]; used=0; w+=clefEx;
      } else if(used+w > maxW){
        lines.push(row); row=[]; used=0; w+=clefEx;
      }
    } else if(row.length===0 && i!==0){
      w += clefEx;
    }
    row.push({m,w,i}); used+=w;
  });
  if(row.length) lines.push(row);
  return lines;
}

function draw(){
  ctx.clear();
  document.querySelectorAll(".nota-overlay,.note-label,.page-indicator").forEach(e=>e.remove());
  let selectedOv=null;
  if(!timeSig||!measures.length){
    renderer.resize(svgW,160); wrapper.style.height="160px";
    updateCloseBtn(); return;
  }
  const lines = layoutLines();
  let maxLineW = 0;
  lines.forEach(line=>{
    const lineW = line.reduce((s,it)=>s+it.w,0)+PAD_L*2;
    if(lineW>maxLineW) maxLineW=lineW;
  });
  const renderW = Math.max(svgW, maxLineW);
  const totalH  = STAVE_Y0 + lines.length*LINE_H + 55;
  renderer.resize(renderW, totalH);
  wrapper.style.height   = totalH+"px";
  container.style.height = totalH+"px";

  const a4contentW   = 182;
  const pxScale      = a4contentW / svgW;
  const lineHmm      = LINE_H * pxScale;
  const headerHmm    = 20;
  const footerHmm    = 12;
  const a4H          = 297;
  const marginMm     = 14;
  const availFirst   = a4H - marginMm - headerHmm - footerHmm;
  const availNext    = a4H - marginMm*2 - footerHmm;
  const linesFirst   = Math.max(1, Math.floor(availFirst/lineHmm));
  const linesNext    = Math.max(1, Math.floor(availNext/lineHmm));

  const linePages=[];
  let pg=1, countInPage=0;
  for(let li=0;li<lines.length;li++){
    if(pg===1 && countInPage>=linesFirst){ pg++; countInPage=0; }
    else if(pg>1 && countInPage>=linesNext){ pg++; countInPage=0; }
    linePages.push(pg);
    countInPage++;
  }
  const totalPages = pg;

  lines.forEach((line,li)=>{
    const y    = STAVE_Y0 + li*LINE_H;
    const maxW = svgW - PAD_L*2;
    const sumW = line.reduce((s,it)=>s+it.w,0);
    const cItems = line.filter(it=>it.m.closed);
    const cSum   = cItems.reduce((s,it)=>s+it.w,0);
    const xtra   = (cItems.length>=2) ? Math.max(0,maxW-sumW) : 0;
    let x = PAD_L;
    line.forEach(({m,w,i},idx)=>{
      const dw = (m.closed&&cSum>0&&xtra>0) ? w+xtra*(w/cSum) : w;
      const stave = new VF.Stave(x,y,dw);
      const isLineStart = (idx===0);
      const ksName = getKeySigName();
      if(i===0){
        stave.addClef(clef);
        if(ksName!=="C") stave.addKeySignature(ksName);
        stave.addTimeSignature(timeSig);
      } else if(isLineStart){
        stave.addClef(clef);
        if(ksName!=="C") stave.addKeySignature(ksName);
      }
      const isLast = (i===measures.length-1);
      let barType = VF.Barline.type.SINGLE;
      if(finMode && isLast)      barType = VF.Barline.type.END;
      else if(!finMode && isLast) barType = VF.Barline.type.DOUBLE;
      stave.setEndBarType(barType);
      stave.setContext(ctx).draw();
      if(m.notes.length){
        const voice  = mkVoice(m);
        const beams  = []; let grp = [];
        m.notes.forEach(n=>{
          const isBeamable = (n.dur==="8"||n.dur==="16") && n.type==="nota";
          if(isBeamable){
            if(grp.length===0){ grp.push(n); } else {
              const pIdx = NOTES[clef].indexOf(grp[grp.length-1].note);
              const cIdx = NOTES[clef].indexOf(n.note);
              const pDir = pIdx>=CTR_IDX ? VF.Stem.DOWN : VF.Stem.UP;
              const cDir = cIdx>=CTR_IDX ? VF.Stem.DOWN : VF.Stem.UP;
              if(pDir===cDir){
                grp.push(n);
                if(grp.length===2){ try{beams.push(new VF.Beam(grp.map(x=>x.vn)));}catch(e){} grp=[]; }
              } else { grp=[n]; }
            }
          } else { grp=[]; }
        });
        const fmt     = new VF.Formatter();
        fmt.joinVoices([voice]);
        const fmtExtra = (i===0||isLineStart) ? getClefExtra()+18 : 28;
        fmt.format([voice], dw-fmtExtra);
        voice.draw(ctx, stave);
        beams.forEach(b=>{ try{b.setContext(ctx).draw();}catch(e){} });
      }
      x += dw;
    });

    // Indicadores de pÃ¡gina
    if(totalPages>1){
      const curPage = linePages[li];
      const isFirstLineOfPage = (li===0)||(linePages[li-1]!==curPage);
      if(isFirstLineOfPage){
        const pgLabel = document.createElement("div");
        pgLabel.className="page-indicator";
        pgLabel.textContent = curPage+"/"+totalPages;
        pgLabel.style.cssText=`position:absolute;right:8px;top:${y-2}px;
          background:rgba(0,102,68,.12);color:#006644;padding:2px 8px;
          border-radius:4px;font-size:.72rem;font-weight:bold;
          font-family:"Courier New",monospace;pointer-events:none;z-index:10;
          border:1px solid rgba(0,102,68,.25);`;
        container.appendChild(pgLabel);
      }
      const isLastLineOfPage = (li<lines.length-1)&&(linePages[li+1]!==curPage);
      if(isLastLineOfPage){
        const cutY    = y+LINE_H+8;
        const cutLine = document.createElement("div");
        cutLine.className="page-indicator";
        cutLine.style.cssText=`position:absolute;left:0;right:0;top:${cutY}px;
          height:0;border-top:2px dashed rgba(0,102,68,.3);pointer-events:none;z-index:10;`;
        container.appendChild(cutLine);
        const cutLabel = document.createElement("div");
        cutLabel.className="page-indicator";
        cutLabel.textContent="✂ corte de página";
        cutLabel.style.cssText=`position:absolute;left:50%;transform:translateX(-50%);top:${cutY-8}px;
          background:white;color:rgba(0,102,68,.5);padding:0 8px;
          font-size:.65rem;font-family:"Courier New",monospace;pointer-events:none;z-index:11;`;
        container.appendChild(cutLabel);
      }
    }
  });

  // Ligaduras
  measures.forEach((m,mi)=>{
    m.notes.forEach((n,ni)=>{
      if(!n.tie||n.type!=="nota") return;
      const {fromMi,fromNi} = n.tie;
      const srcNote = measures[fromMi]?.notes[fromNi];
      if(!srcNote||srcNote.type!=="nota") return;
      try{
        new VF.StaveTie({
          first_note:srcNote.vn, last_note:n.vn,
          first_indices:[0], last_indices:[0]
        }).setContext(ctx).draw();
      }catch(e){}
    });
  });

  updateCloseBtn();
  if(!playing) requestAnimationFrame(()=>{ buildOverlays(); buildKeySigOverlay(); });
}

function buildKeySigOverlay(){
  document.querySelectorAll(".keysig-overlay").forEach(e=>e.remove());
  if(!timeSig||!measures.length||playing||finMode) return;

  const clefEndX = PAD_L + 45;

  const ksY      = STAVE_Y0;

  const ov = document.createElement("div");
  ov.className = "keysig-overlay";

function handleKeySigClick(){
  if(accMode==="#"){
    if(keySigAccidentals.length>0 && keySigAccidentals[0].acc!==accMode){
      alert("No puedes mezclar sostenidos y bemoles en la armadura. Quita los existentes primero.");
      return;
    }
    const nextIdx = keySigAccidentals.length;
    if(nextIdx>=7){ alert("Ya tienes los 7 sostenidos."); return; }
    keySigAccidentals.push({note:SHARP_ORDER[nextIdx], acc:"#"});
    deactivateAccMode(); draw();
  } else if(accMode==="b"){
    if(keySigAccidentals.length>0 && keySigAccidentals[0].acc!==accMode){
      alert("No puedes mezclar sostenidos y bemoles en la armadura. Quita los existentes primero.");
      return;
    }
    const nextIdx = keySigAccidentals.length;
    if(nextIdx>=7){ alert("Ya tienes los 7 bemoles."); return; }
    keySigAccidentals.push({note:FLAT_ORDER[nextIdx], acc:"b"});
    deactivateAccMode(); draw();
  } else {
    if(keySigAccidentals.length>0){ keySigAccidentals.pop(); draw(); }
  }
}

let selectedOv    = null;

function scheduleHideActive(){
  if(activeHideTimer) clearTimeout(activeHideTimer);

    activeNoteKey   = null;
    activeHideTimer = null;

function buildOverlays(){
  selectedOv = null;
  document.querySelectorAll(".nota-overlay").forEach(e=>e.remove());
  const svgNotes = Array.from(ctx.svg.querySelectorAll("g.vf-stavenote"));
  const svgEl    = ctx.svg;
  let gi = 0;
  measures.forEach((m,mi)=>{
    m.notes.forEach((n,ni)=>{
      if(n.type==="silencio"){ gi++; return; }
      const g = svgNotes[gi]; if(!g){ gi++; return; }
      try{
        const bb  = g.getBBox();
        if(!bb||bb.width===0){ gi++; return; }
        const pt1 = svgEl.createSVGPoint(); pt1.x=bb.x; pt1.y=bb.y;
        const pt2 = svgEl.createSVGPoint(); pt2.x=bb.x+bb.width; pt2.y=bb.y+bb.height;
        const ctm = svgEl.getScreenCTM();
        const c1  = pt1.matrixTransform(ctm);
        const c2  = pt2.matrixTransform(ctm);
        const cR  = container.getBoundingClientRect();
        const rawX = c1.x - cR.left;
        const rawY = c1.y - cR.top + container.scrollTop;
        const rawW = c2.x - c1.x;
        const rawH = c2.y - c1.y;
        const ovW  = Math.max(rawW, 44);
        const ovH  = Math.max(rawH, 70);
        const ovX  = rawX-(ovW-rawW)/2;
        const ovY  = rawY-(ovH-rawH)/2;
        const ov   = document.createElement("div");
        ov.className = "nota-overlay";
        ov.style.cssText=`left:${ovX}px;top:${ovY}px;width:${ovW}px;height:${ovH}px;position:absolute;z-index:300;`;
        ov.dataset.mi = mi; ov.dataset.ni = ni;
        if(tieMode){
          ov.classList.add("liga-sel");
          if(tiePick.some(p=>p[0]===mi&&p[1]===ni)) ov.classList.add("picked");
          ov.addEventListener("pointerdown",e=>{ e.stopPropagation(); e.preventDefault(); selectForTie(mi,ni); });
        } else if(dotMode){
          ov.classList.add("dot-mode");
          ov.addEventListener("pointerdown",e=>{ e.stopPropagation(); e.preventDefault(); toggleDotOn(mi,ni); });
        } else if(accMode){
          ov.classList.add("acc-mode");
          ov.addEventListener("pointerdown",e=>{ e.stopPropagation(); e.preventDefault(); toggleAccOn(mi,ni); });
        } else {
          const noteKey = mi+"-"+ni;
          const mkBtn = (lbl,cls,dir)=>{
            const b = document.createElement("div");
            b.textContent=lbl; b.className="pm-btn "+cls;
            b.addEventListener("pointerdown",e=>{
              e.stopPropagation(); e.preventDefault();
              activeNoteKey = noteKey;
              shiftPitch(mi,ni,dir);
              scheduleHideActive();
            });
            return b;
          };
          ov.appendChild(mkBtn("+","plus",1));
          ov.appendChild(mkBtn("−","minus",-1));
          if(activeNoteKey===noteKey){ ov.classList.add("selected"); selectedOv=ov; }
          ov.addEventListener("mouseenter",()=>{
            if(selectedOv&&selectedOv!==ov) selectedOv.classList.remove("selected");
            ov.classList.add("selected"); selectedOv=ov; activeNoteKey=noteKey;
            if(activeHideTimer){ clearTimeout(activeHideTimer); activeHideTimer=null; }
          });
          ov.addEventListener("mouseleave",()=>{ scheduleHideActive(); });
          ov.addEventListener("pointerdown",e=>{
            if(e.target!==ov) return;
            e.stopPropagation(); e.preventDefault();
            activeNoteKey = noteKey;
            const rect = ov.getBoundingClientRect();
            const y    = e.clientY - rect.top;
            if(y < rect.height/2){ shiftPitch(mi,ni,1); } else { shiftPitch(mi,ni,-1); }
            scheduleHideActive();
          });
        }
        container.appendChild(ov);
      }catch(e){}
      gi++;
    });
  });
}

function selectForTie(mi,ni){
  const idx = tiePick.findIndex(p=>p[0]===mi&&p[1]===ni);
  if(idx>=0){ tiePick.splice(idx,1); draw(); return; }
  tiePick.push([mi,ni]);
  if(tiePick.length===2){
    const globalIdx = ([m,n])=>{ let g=0; for(let i=0;i<m;i++) g+=measures[i].notes.length; return g+n; };
    const sorted = [...tiePick].sort((a,b)=>globalIdx(a)-globalIdx(b));
    const [mi1,ni1]=sorted[0], [mi2,ni2]=sorted[1];
    const dest = measures[mi2].notes[ni2];
    if(dest.tie&&dest.tie.fromMi===mi1&&dest.tie.fromNi===ni1){ dest.tie=false; }
    else { dest.tie={fromMi:mi1,fromNi:ni1}; }
    tiePick=[]; draw();
  } else { draw(); }
}

// â”€â”€â”€ DESPLAZAR ALTURA â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// FIX PRINCIPAL: n.note siempre es "letra/octava" sin accidental embebido.
// shiftPitch trabaja sobre el Ã­ndice en NOTES[clef] sin mezclar accidentales.
function shiftPitch(mi, ni, dir){
  const n    = measures[mi].notes[ni];
  const list = NOTES[clef];
  // n.note siempre debe ser "letra/octava" puro (sin accidental)
  const idx  = list.indexOf(n.note);
  if(idx < 0){
    // Intentar recuperar si se colÃ³ un accidental en n.note
    const clean = n.note.replace(/[#b]/g,"");
    const idx2  = list.indexOf(clean);
    if(idx2>=0) n.note = clean; // reparar
    else return;
  }
  const curIdx  = list.indexOf(n.note);
  const newIdx  = curIdx + dir;
  if(newIdx < 0 || newIdx >= list.length) return;

  const prevNote = n.note;
  const prevAcc  = n.acc;
  const prevVn   = n.vn;
  try{
    n.note = list[newIdx];
    n.acc  = false;  // quitar accidental al mover
    n.vn   = mkNote(n.note, n.dur, n.dot, false, false);
    draw();
    playNote(n.note, TDUR[n.dur]);
  }catch(e){
    n.note = prevNote;
    n.acc  = prevAcc;
    n.vn   = prevVn;
    console.error("Error shiftPitch:", e);
  }
}

// â”€â”€â”€ COLOCAR NOTA AL HACER CLIC EN EL PENTAGRAMA â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// FIX: usar posiciÃ³n real del SVG renderizado via getBoundingClientRect
// y calcular el paso correcto basado en la altura real de VexFlow
divEl.addEventListener("click", e=>{
  if(tieMode||dotMode||finMode||accMode) return;
  if(!timeSig||!activeFig) return;

  // Obtenemos la posiciÃ³n Y relativa al SVG
  const svgRect  = ctx.svg.getBoundingClientRect();
  const clickY   = e.clientY - svgRect.top;

  const note = noteFromY(clickY);
  const cur  = measures[measures.length-1];
  const bPer = beatsPerMeasure();
  const bv   = BEATS[activeFig.dur] * (dotMode ? 1.5 : 1);

  if(cur.beats + bv > bPer + 0.01){
    alert(`¡No cabe ${DNAMES[activeFig.dur]||"figura"} en el compás!`);
    return;
  }
  const isRest = activeFig.type==="silencio";
  try{
    const vn = mkNote(isRest?null:note, activeFig.dur, false, isRest, false);
    cur.notes.push({
      type:activeFig.type, dur:activeFig.dur,
      note:isRest?null:note,
      vn, dot:false, tie:false, acc:false
    });
    cur.beats += BEATS[activeFig.dur];
    draw();
    wrapper.scrollLeft = wrapper.scrollWidth;
    if(!isRest) playNote(note, TDUR[activeFig.dur]);
  }catch(err){
    console.error("Error al añadir nota:", err);
  }
});

function beatsPerMeasure(){
  if(!timeSig) return 0;
  const [num,den] = timeSig.split("/").map(Number);
  return num * (4/den);
}

// â”€â”€â”€ CALCULAR NOTA A PARTIR DE Y â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
// VexFlow dibuja el pentagrama: lÃ­nea 1 (abajo) a lÃ­nea 5 (arriba).
// En clave de Sol: lÃ­nea 3 = B4 (CTR_IDX=9 en nuestro array).
// El stave de VexFlow empieza en STAVE_Y0 y tiene 5 lÃ­neas separadas 10px.
// La lÃ­nea inferior (E4) estÃ¡ ~40px abajo del top del stave.
// Referencia: B4 estÃ¡ en y = STAVE_Y0 + 20px desde el top del stave.
// Cada semitono diatÃ³nico sube NOTE_PX=5px hacia arriba (y decrece).
function noteFromY(y){
  // Determinar en quÃ© lÃ­nea (sistema) estamos
  const lineIdx   = Math.max(0, Math.floor((y - STAVE_Y0) / LINE_H));
  const lineTopY  = STAVE_Y0 + lineIdx * LINE_H;
  const yInStave  = y - lineTopY;

  // En VexFlow, el pentagrama tiene 5 lÃ­neas.
  // La lÃ­nea central (3Âª) es B4 en treble â†’ y â‰ˆ 20px desde el top del stave
  // Cada paso de nota = 5px (semiespacio = 5px en VexFlow con spacing 10)
  // Cuanto mÃ¡s arriba (y menor), mÃ¡s aguda la nota â†’ steps positivos
  const ctrY  = 20;           // pÃ­xeles desde top del stave hasta la lÃ­nea central (B4)
  const steps = Math.round((ctrY - yInStave) / 5);

  const list = NOTES[clef];
  const idx  = Math.max(0, Math.min(list.length-1, CTR_IDX + steps));
  return list[idx];
}

function toggleDotOn(mi, ni){
  const n    = measures[mi].notes[ni];
  if(n.type!=="nota") return;
  const bPer = beatsPerMeasure();
  if(n.dot){
    const extra = BEATS[n.dur]*0.5;
    try{
      const newVn = mkNote(n.note, n.dur, false, false, n.acc||false);
      n.dot   = false; n.vn = newVn;
      measures[mi].beats = +(measures[mi].beats - extra).toFixed(4);
    }catch(e){ console.error("Error quitando puntillo:", e); }
    deactivateDotMode(); draw(); return;
  }
  const extra = BEATS[n.dur]*0.5;
  if(measures[mi].beats+extra > bPer+0.01){ alert("No cabe el puntillo: el compÃ¡s se llenarÃ­a."); return; }
  const prevVn    = n.vn;
  const prevBeats = measures[mi].beats;
  try{
    const newVn = mkNote(n.note, n.dur, true, false, n.acc||false);
    n.dot   = true; n.vn = newVn;
    measures[mi].beats = +(measures[mi].beats + extra).toFixed(4);
  }catch(e){
    n.dot   = false; n.vn = prevVn; measures[mi].beats = prevBeats;
    console.error("Error aplicando puntillo:", e);
    alert("Error al aplicar el puntillo.");
  }
  deactivateDotMode(); draw();
}

function deactivateDotMode(){
  dotMode=false;
  document.getElementById("btn-puntillo").classList.remove("activa");
}
function deactivateAccMode(){
  accMode=false;
  document.getElementById("btn-sostenido").classList.remove("activa");
  document.getElementById("btn-bemol").classList.remove("activa");
}

function toggleAccOn(mi, ni){
  const n    = measures[mi].notes[ni];
  if(n.type!=="nota") return;
  const prevVn  = n.vn;
  const prevAcc = n.acc;
  if(n.acc===accMode){
    try{ n.acc=false; n.vn=mkNote(n.note,n.dur,n.dot,false,false); }
    catch(e){ n.acc=prevAcc; n.vn=prevVn; console.error("Error quitando alteraciÃ³n:",e); }
    deactivateAccMode(); draw(); return;
  }
  try{ n.acc=accMode; n.vn=mkNote(n.note,n.dur,n.dot,false,n.acc); }
  catch(e){ n.acc=prevAcc; n.vn=prevVn; console.error("Error aplicando alteraciÃ³n:",e); }
  deactivateAccMode(); draw();
}

function closeMeasure(){
  if(finMode) return;
  const cur  = measures[measures.length-1];
  const bPer = beatsPerMeasure();
  if(!cur||cur.closed||cur.beats<bPer-0.01) return;
  cur.closed = true;
  measures.push({notes:[],beats:0,closed:false});
  draw();
  wrapper.scrollLeft = 0;
}

function updateCloseBtn(){
  const cur  = measures.length ? measures[measures.length-1] : null;
  const bPer = beatsPerMeasure();
  document.getElementById("cerrar-compas").disabled =
    finMode||!cur||cur.closed||cur.beats<bPer-0.01;
}

function deleteLast(){
  if(finMode||!measures.length) return;
  const last = measures[measures.length-1];
  if(last.notes.length){
    const rm    = last.notes.pop();
    last.beats -= BEATS[rm.dur]*(rm.dot?1.5:1);
    last.closed = false;
  } else if(measures.length>1) measures.pop();
  draw();
}

function reset(){
  measures=[]; tieMode=false; dotMode=false; accMode=false;
  activeFig=null; tiePick=[]; finMode=false; keySigAccidentals=[];
  document.querySelectorAll(".figura,.figura-modo").forEach(el=>el.classList.remove("activa"));

  if(timeSig) measures.push({notes:[],beats:0,closed:false});
  draw();
}

function togglePlay(){
  const btn = document.getElementById("play-stop");
  if(playing){ stopPlay(); return; }
  if(!timeSig) return alert("Selecciona un compÃ¡s");
  if(!bpm)    return alert("Selecciona una velocidad");
  Tone.start().then(()=>{
    initSynth();
    document.querySelectorAll(".nota-overlay").forEach(el=>el.remove());
    Tone.Transport.bpm.value=bpm; Tone.Transport.cancel();

    let t0=0;
    const evs=[];
    let gi=0;
    const spb = 60/bpm;

    measures.forEach((m,mi)=>{
      m.notes.forEach((n,ni)=>{
        const sec = BEATS[n.dur]*(n.dot?1.5:1)*spb;
        if(n.type!=="nota"){ t0+=sec; gi++; return; }

        let isTieDest = false;
        if(n.tie && n.tie.fromMi!==undefined){
          const src = measures[n.tie.fromMi]?.notes[n.tie.fromNi];
          if(src&&src.type==="nota"&&src.note===n.note) isTieDest=true;
        }
        if(isTieDest){
          if(evs.length>0) evs[evs.length-1].sec+=sec;
        } else {
          let effAcc = n.acc||false;
          if(!effAcc){
            const letter = n.note.split("/")[0];
            effAcc = getKeySigAcc(letter);
          }
          const playN = effAcc
            ? n.note.split("/")[0]+effAcc+"/"+n.note.split("/")[1]
            : n.note;
          evs.push({ t:t0, note:playN, sec, gi, lbl:dname(playN) });
        }
        t0+=sec; gi++;
      });
    });

    if(!evs.length&&!metroOn) return alert("¡Añade notas!");

    const nBeats = +timeSig.split("/")[0];
    const intro  = metroOn ? nBeats*spb : 0;

    if(metroOn){
      initMetroSynth();
      metroLoop = new Tone.Loop(t=>{ metroSynth.triggerAttackRelease("C3","8n",t); },"4n").start(0);
    }

    const svgNotes = Array.from(ctx.svg.querySelectorAll("g.vf-stavenote"));

    evs.forEach(ev=>{
      const st = ev.t+intro;
      Tone.Transport.schedule(t=>{
        try{
          const parts  = ev.note.split("/");
          const letter = parts[0].charAt(0).toUpperCase();
          const acc    = parts[0].substring(1);
          const oct    = parts[1];
          const p      = letter+acc+oct;
          const playDur = Math.max(0.05, ev.sec*0.92);
          synth.triggerAttackRelease(p, playDur+"s", t);
        }catch(e){}
      }, st);

      Tone.Transport.schedule(()=>{
        svgNotes[ev.gi]?.querySelectorAll("path,line,circle").forEach(el=>{
          el.style.stroke="#00ffcc"; el.style.fill="#00ffcc";
        });
      }, st);

      if(showLbls){
        Tone.Transport.schedule(()=>{
          const g = svgNotes[ev.gi]; if(!g) return;
          try{
            const bb = g.getBBox();
            const sr = ctx.svg.getBoundingClientRect(), cr=container.getBoundingClientRect();
            const lb = document.createElement("div"); lb.className="note-label"; lb.textContent=ev.lbl;
            lb.style.left=(sr.left-cr.left+bb.x+bb.width/2)+"px";
            lb.style.top =(sr.top-cr.top+bb.y+bb.height+8)+"px";
            lb.style.transform="translateX(-50%)";
            container.appendChild(lb);
            setTimeout(()=>{ lb.style.opacity="0"; setTimeout(()=>lb.remove(),400); }, ev.sec*800);
          }catch(e){}
        }, st);
      }

      Tone.Transport.schedule(()=>{
        svgNotes[ev.gi]?.querySelectorAll("path,line,circle").forEach(el=>{
          el.style.stroke="black"; el.style.fill="black";
        });
      }, st+ev.sec);
    });

    Tone.Transport.schedule(()=>stopPlay(), t0+intro+0.1);
    Tone.Transport.start();
    playing=true;
    btn.innerHTML='<i class="fas fa-stop"></i> Stop'; btn.classList.add("stop-active");
  }).catch(err=>{ console.error(err); alert("Error al iniciar la reproducciÃ³n."); });
}

function stopPlay(){
  Tone.Transport.stop(); Tone.Transport.cancel();
  if(metroLoop){ metroLoop.stop(); metroLoop.dispose(); metroLoop=null; }
  ctx.svg.querySelectorAll("g.vf-stavenote path,g.vf-stavenote line,g.vf-stavenote circle")
    .forEach(el=>{ el.style.stroke="black"; el.style.fill="black"; });
  document.querySelectorAll(".note-label").forEach(el=>el.remove());
  const btn = document.getElementById("play-stop");
  btn.innerHTML='<i class="fas fa-play"></i> Play'; btn.classList.remove("stop-active");
  playing=false; buildOverlays();
}

function exportPDF(){
  const title  = document.getElementById("titulo-editable").value.trim()||"Mi Partitura";
  const author = document.getElementById("autor-input").value.trim()||"Anónimo";
  document.getElementById("acciones-menu").classList.remove("show");

  ctx.svg.querySelectorAll("*").forEach(el=>{
    if(el.style){ el.style.removeProperty("stroke"); el.style.removeProperty("fill"); }
  });

  const svgW2    = +ctx.svg.getAttribute("width")||svgW;
  const svgH2    = +ctx.svg.getAttribute("height")||200;
  const lines    = layoutLines();
  const totalLines = lines.length;

  const jsPDFCtor = (window.jspdf&&window.jspdf.jsPDF)||window.jsPDF;
  if(!jsPDFCtor){
    const clone = ctx.svg.cloneNode(true);
    clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
    const bgRect = document.createElementNS("http://www.w3.org/2000/svg","rect");
    bgRect.setAttribute("width","100%"); bgRect.setAttribute("height","100%");
    bgRect.setAttribute("fill","white"); bgRect.setAttribute("stroke","none");
    clone.insertBefore(bgRect,clone.firstChild);
    const svgStr  = new XMLSerializer().serializeToString(clone);
    const svgB64  = "data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(svgStr)));
    const win     = window.open();
    win.document.write(`<html><body style="margin:0;background:#fff"><div style="font-family:serif;padding:30px 40px">
      <h2 style="text-align:center;color:#006644">${title}</h2>
      ${author?`<p style="text-align:right;color:#006644;margin-top:-10px">Autor: ${author}</p>`:""}
      <img src="${svgB64}" style="width:100%;display:block;margin-top:10px">
      <p style="text-align:center;font-size:10px;color:#aaa;margin-top:16px">Hecho con Laboratorio Musical Maximilian 23 · www.maximilian23.com</p>
      </div></body></html>`);
    win.document.close();
    setTimeout(()=>win.print(),800);
    return;
  }

  const doc      = new jsPDFCtor({unit:"mm",format:"a4",orientation:"portrait"});
  const pageW    = doc.internal.pageSize.getWidth();
  const pageH    = doc.internal.pageSize.getHeight();
  const margin   = 14;
  const contentW = pageW - margin*2;
  const footerH  = 18;
  const headerH  = 20;
  const svgScale = contentW/svgW2;
  const lineHmm  = LINE_H*svgScale;

  const availFirstPage = pageH-margin-headerH-footerH;
  const availNextPage  = pageH-margin*2-footerH;
  const linesFirstPage = Math.max(1, Math.floor(availFirstPage/lineHmm));
  const linesPerPage   = Math.max(1, Math.floor(availNextPage/lineHmm));

  const pages=[];
  let remaining = [...Array(totalLines).keys()];
  pages.push(remaining.splice(0,linesFirstPage));
  while(remaining.length>0) pages.push(remaining.splice(0,linesPerPage));
  const totalPages = pages.length;

  function renderLines(lineIndices){
    return new Promise((resolve,reject)=>{
      if(!lineIndices.length){ resolve(null); return; }
      const firstLine = lineIndices[0];
      const cropY     = STAVE_Y0 + firstLine*LINE_H - 10;
      const cropH     = lineIndices.length*LINE_H + 20;
      const clone     = ctx.svg.cloneNode(true);
      clone.setAttribute("xmlns","http://www.w3.org/2000/svg");
      clone.setAttribute("width",svgW2);
      clone.setAttribute("height",cropH);
      clone.setAttribute("viewBox",`0 ${cropY} ${svgW2} ${cropH}`);
      const bgRect = document.createElementNS("http://www.w3.org/2000/svg","rect");
      bgRect.setAttribute("x","0"); bgRect.setAttribute("y",String(cropY));
      bgRect.setAttribute("width",String(svgW2)); bgRect.setAttribute("height",String(cropH));
      bgRect.setAttribute("fill","white"); bgRect.setAttribute("stroke","none");
      clone.insertBefore(bgRect,clone.firstChild);
      clone.querySelectorAll("rect").forEach(r=>{
        const rw=+r.getAttribute("width"), rh=+r.getAttribute("height");
        const rx=+r.getAttribute("x")||0,  ry=+r.getAttribute("y")||0;
        if(rx<=2&&ry<=2&&rw>=svgW2-10&&rh>=svgH2-10&&r!==bgRect) r.remove();
      });
      const svgStr  = new XMLSerializer().serializeToString(clone);
      const svgBlob = new Blob([svgStr],{type:"image/svg+xml;charset=utf-8"});
      const url     = URL.createObjectURL(svgBlob);
      const img     = new Image();
      img.onload = function(){
        const scale = 2;
        const cv    = document.createElement("canvas");
        cv.width    = svgW2*scale; cv.height=cropH*scale;
        const c2d   = cv.getContext("2d");
        c2d.fillStyle="#ffffff"; c2d.fillRect(0,0,cv.width,cv.height);
        c2d.scale(scale,scale); c2d.drawImage(img,0,0,svgW2,cropH);
        URL.revokeObjectURL(url);
        resolve({png:cv.toDataURL("image/png"),w:svgW2,h:cropH});
      };
      img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("Error rendering SVG")); };
      img.src = url;
    });
  }

  Promise.all(pages.map(p=>renderLines(p))).then(results=>{
    results.forEach((r,pi)=>{
      if(!r) return;
      if(pi>0) doc.addPage();
      const pgNum = pi+1;
      let curY    = margin;
      if(pi===0){
        doc.setFont("helvetica","bold"); doc.setFontSize(18); doc.setTextColor(0,102,68);
        doc.text(title,pageW/2,curY+8,{align:"center"});
        doc.setFont("helvetica","normal"); doc.setFontSize(11); doc.setTextColor(0,102,68);
        doc.text(author,pageW-margin,curY+8,{align:"right"});
        curY+=headerH;
      }
      const imgRatio = r.h/r.w;
      const imgH     = contentW*imgRatio;
      doc.addImage(r.png,"PNG",margin,curY,contentW,imgH);
      doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(0,102,68);
      if(totalPages>1) doc.text(`${pgNum} / ${totalPages}`,pageW/2,pageH-footerH+6,{align:"center"});
      doc.text("Hecho con Laboratorio Musical Maximilian 23 · www.maximilian23.com",pageW/2,pageH-8,{align:"center"});
    });
    doc.save(title+".pdf");
  }).catch(err=>{ console.error("Error exportando PDF:",err); alert("Error al generar el PDF."); });
}

// FIX: compatibilidad con formato antiguo (titulo/autor/clave/compas/lines/notas/noteName)
//      y formato nuevo (title/author/clef/timeSig/measures/notes/note)
function loadJson(e){
  const file = e.target.files[0]; if(!file) return;
  const r    = new FileReader();
  r.onload   = ev=>{
    try{
      applyLoadedData(JSON.parse(ev.target.result));
    }catch(err){
      console.error("Error cargando JSON:", err);
      alert("Archivo inválido o no se pudo cargar: "+err.message);
    }
  };
  r.readAsText(file);
  e.target.value="";
  document.getElementById("acciones-menu").classList.remove("show");
}

function applyLoadedData(d){
  // â”€â”€ Detectar y normalizar formato antiguo â”€â”€
  const isLegacy = (d.titulo !== undefined || d.clave !== undefined || d.compas !== undefined || d.lines !== undefined);

  let loadedTitle, loadedAuthor, loadedClef, loadedTimeSig, loadedBpm,
      loadedKeySig, loadedMeasures;

  finMode = false;
  document.getElementById("btn-fin").innerHTML = '<i class="fas fa-flag-checkered"></i> Fin';
  document.getElementById("btn-fin").classList.remove("activa");

  if(isLegacy){
    loadedTitle   = d.titulo  || d.title  || "Mi Partitura";
    loadedAuthor  = d.autor   || d.author || "";
    loadedClef    = d.clave   || d.clef   || "treble";
    loadedTimeSig = d.compas  || d.timeSig || "";
    loadedBpm     = +(d.bpm)  || 0;
    loadedKeySig  = d.keySigAccidentals || [];

    loadedMeasures = [];
    const rawMeasures = [];

    if(Array.isArray(d.lines)){
      d.lines.forEach(line=>{
        if(Array.isArray(line)) line.forEach(m=>rawMeasures.push(m));
        else rawMeasures.push(line);
      });
    } else if(Array.isArray(d.measures)){
      d.measures.forEach(m=>rawMeasures.push(m));
    }

    rawMeasures.forEach(m=>{
      const rawNotes = m.notas || m.notes || [];
      const ms = {notes:[], beats:+(m.beats)||0, closed:!!(m.closed)};

      rawNotes.forEach(n=>{
        const type = n.tipo     || n.type || "nota";
        const dur  = n.duracion || n.dur  || "q";
        let note   = n.noteName || n.note || null;
        const dot  = !!(n.dot);
        const tie  = n.tie || false;
        const acc  = n.acc || false;

        if(note) note = note.replace(/[#b]/g,"").replace(/\/\//,"/");

        const isRest = (type==="silencio");
        let vn;
        try{
          vn = mkNote(note, dur, dot, isRest, acc||false, loadedClef);
        }catch(err){
          console.warn("Error creando nota al cargar:", note, dur, err);
          return;
        }
        ms.notes.push({type, dur, note:isRest?null:note, vn, dot, tie, acc});
      });

      ms.beats = ms.notes.reduce((s,n)=>s+BEATS[n.dur]*(n.dot?1.5:1),0);
      loadedMeasures.push(ms);
    });

  } else {
    loadedTitle   = d.title   || "Mi Partitura";
    loadedAuthor  = d.author  || "";
    loadedClef    = d.clef    || "treble";
    loadedTimeSig = d.timeSig || "";
    loadedBpm     = +(d.bpm)  || 0;
    loadedKeySig  = d.keySigAccidentals || [];

    loadedMeasures = (d.measures||[]).map(m=>{
      const ms = {notes:[], beats:m.beats, closed:m.closed};
      (m.notes||[]).forEach(n=>{
        let note = n.note;
        if(note) note = note.replace(/[#b]/g,"").replace(/\/\//,"/");
        const isRest = (n.type==="silencio");
        try{
          ms.notes.push({
            type:n.type, dur:n.dur, note:isRest?null:note,
            vn:mkNote(note, n.dur, n.dot, isRest, n.acc||false, loadedClef),
            dot:n.dot, tie:n.tie, acc:n.acc||false
          });
        }catch(err){ console.warn("Error recreando nota:", n, err); }
      });
      return ms;
    });
  }

  document.getElementById("titulo-editable").value = loadedTitle;
  document.getElementById("autor-input").value     = loadedAuthor;
  document.getElementById("clave").value           = loadedClef;
  document.getElementById("compas").value          = loadedTimeSig;
  document.getElementById("velocidad").value       = loadedBpm||"";

  clef    = loadedClef;
  timeSig = loadedTimeSig;
  bpm     = loadedBpm;
  keySigAccidentals = loadedKeySig;

  tempoDisp.textContent  = TLBLS[bpm]||d.tempoLabel||"";
  tempoDisp.style.display= bpm ? "block" : "none";

  measures = loadedMeasures;
  if(!measures.length && timeSig) {
    measures.push({notes:[],beats:0,closed:false});
  } else {
    const lastM = measures[measures.length-1];
    if(lastM && lastM.closed){
      finMode = true;
      document.getElementById("btn-fin").innerHTML = '<i class="fas fa-edit"></i> Abrir';
      document.getElementById("btn-fin").classList.add("activa");
    }
  }

  draw();
}

async function loadLessonFromFile(fileName){
  try{
    if(window.location && window.location.protocol === "file:" && LESSONS[fileName]){
      applyLoadedData(LESSONS[fileName]);
      return;
    }
    const res = await fetch(fileName, { cache:"no-store" });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    applyLoadedData(await res.json());
  }catch(err){
    if(LESSONS[fileName]){
      applyLoadedData(LESSONS[fileName]);
      return;
    }
    console.error("Error cargando lección:", err);
    alert(`No se pudo cargar la lección ${fileName}: ${err.message}`);
  }finally{
    document.getElementById("acciones-menu").classList.remove("show");
    document.getElementById("lecciones-menu").classList.remove("show");
  }
}

function toggleFin(){
  const btn = document.getElementById("btn-fin");
  if(finMode){
    finMode=false;
    btn.innerHTML='<i class="fas fa-flag-checkered"></i> Fin'; btn.classList.remove("activa");
    if(!measures.length||measures[measures.length-1].notes.length>0){
      measures.push({notes:[],beats:0,closed:false});
    }
    if(measures.length&&measures[measures.length-1].closed){
      measures.push({notes:[],beats:0,closed:false});
    }
    draw(); return;
  }
  if(!measures.length||!timeSig){ alert("No hay nada que finalizar."); return; }
  const bPer = beatsPerMeasure();
  const last  = measures[measures.length-1];
  if(last.notes.length===0){
    if(measures.length>1){ measures.pop(); }
    else { alert("No hay notas en la partitura."); return; }
  }
  const finalM = measures[measures.length-1];
  if(finalM.beats < bPer-0.01){ alert("El último compás no está completo. Faltan tiempos."); return; }
  finalM.closed=true; finMode=true;
  btn.innerHTML='<i class="fas fa-edit"></i> Abrir'; btn.classList.add("activa");
  draw();
}

function init(){
  document.getElementById("clave").value     = "treble";
  document.getElementById("compas").value    = "";
  document.getElementById("velocidad").value = "";
  document.getElementById("titulo-editable").value = "Mi Partitura";
  document.getElementById("autor-input").value     = "";
  tempoDisp.style.display = "none";

  document.getElementById("clave").onchange    = e=>{ clef=e.target.value; reset(); };
  document.getElementById("compas").onchange   = e=>{ timeSig=e.target.value; reset(); };
  document.getElementById("velocidad").onchange= e=>{
    bpm = +e.target.value;
    tempoDisp.textContent   = TLBLS[bpm]||"";
    tempoDisp.style.display = bpm?"block":"none";
  };

  document.querySelectorAll(".figura").forEach(el=>{
    el.addEventListener("click",()=>{
      if(finMode) return;
      document.querySelectorAll(".figura").forEach(f=>f.classList.remove("activa"));
      activeFig = {type:el.dataset.tipo, dur:el.dataset.duracion};
      el.classList.add("activa"); initSynth();
    });
  });

  document.getElementById("btn-puntillo").addEventListener("click",()=>{
    if(finMode) return;
    dotMode = !dotMode;
    document.getElementById("btn-puntillo").classList.toggle("activa",dotMode);
    if(dotMode){ tieMode=false; tiePick=[]; accMode=false;
      document.getElementById("btn-ligadura").classList.remove("activa");
      document.body.classList.remove("tie-active"); deactivateAccMode(); }
    draw();
  });

  document.getElementById("btn-ligadura").addEventListener("click",()=>{
    if(finMode) return;
    tieMode=!tieMode; tiePick=[];
    if(tieMode){ dotMode=false; accMode=false;
      document.getElementById("btn-puntillo").classList.remove("activa"); deactivateAccMode(); }
    document.getElementById("btn-ligadura").classList.toggle("activa",tieMode);
    document.body.classList.toggle("tie-active",tieMode);
    draw();
  });

  document.getElementById("btn-sostenido").addEventListener("click",()=>{
    if(finMode) return;
    accMode = (accMode==="#") ? false : "#";
    document.getElementById("btn-sostenido").classList.toggle("activa",accMode==="#");
    document.getElementById("btn-bemol").classList.remove("activa");
    if(accMode){ dotMode=false; tieMode=false; tiePick=[];
      document.getElementById("btn-puntillo").classList.remove("activa");
      document.getElementById("btn-ligadura").classList.remove("activa");
      document.body.classList.remove("tie-active"); }
    draw();
  });

  document.getElementById("btn-bemol").addEventListener("click",()=>{
    if(finMode) return;
    accMode = (accMode==="b") ? false : "b";
    document.getElementById("btn-bemol").classList.toggle("activa",accMode==="b");
    document.getElementById("btn-sostenido").classList.remove("activa");
    if(accMode){ dotMode=false; tieMode=false; tiePick=[];
      document.getElementById("btn-puntillo").classList.remove("activa");
      document.getElementById("btn-ligadura").classList.remove("activa");
      document.body.classList.remove("tie-active"); }
    draw();
  });

  document.getElementById("cerrar-compas").onclick  = closeMeasure;
  document.getElementById("borrar-ultimo").onclick  = deleteLast;
  document.getElementById("btn-fin").onclick        = toggleFin;
  document.getElementById("play-stop").onclick      = togglePlay;
  document.getElementById("notas").onclick          = ()=>{ showLbls=!showLbls; document.getElementById("notas").classList.toggle("activa",showLbls); };
  document.getElementById("metronomo").onclick      = ()=>{ metroOn=!metroOn; document.getElementById("metronomo").classList.toggle("activa",metroOn); };
  document.getElementById("limpiar").onclick        = ()=>{ if(confirm("¿Limpiar toda la partitura?")) reset(); };
  document.getElementById("guardar").onclick        = saveJson;
  document.getElementById("abrir").onclick          = ()=>document.getElementById("file-input").click();
  document.getElementById("file-input").onchange   = loadJson;
  document.getElementById("export-pdf").onclick    = exportPDF;

  const ab = document.getElementById("acciones-btn");
  const am = document.getElementById("acciones-menu");
  const lb = document.getElementById("lecciones-btn");
  const lm = document.getElementById("lecciones-menu");

  ab.addEventListener("click",e=>{
    e.stopPropagation();
    lm.classList.remove("show");
    am.classList.toggle("show");
  });

  lb.addEventListener("click",e=>{
    e.stopPropagation();
    am.classList.remove("show");
    lm.classList.toggle("show");
  });

  lm.querySelectorAll("[data-lesson-file]").forEach(btn=>{
    btn.addEventListener("click",e=>{
      e.stopPropagation();
      loadLessonFromFile(btn.dataset.lessonFile);
    });
  });

  document.addEventListener("click",e=>{
    if(!ab.contains(e.target) && !am.contains(e.target)) am.classList.remove("show");
    if(!lb.contains(e.target) && !lm.contains(e.target)) lm.classList.remove("show");
  });

  window.addEventListener("resize",()=>{ svgW=Math.max(300,wrapper.clientWidth-4); draw(); });
  svgW = Math.max(300, wrapper.clientWidth-4);
  reset();
}
init();
})();
</script>
</body>
</html>
